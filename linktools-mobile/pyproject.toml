[build-system]
requires = ["linktools-setup @ git+https://github.com/linktools-toolkit/linktools-setup.git@938d393e060754366853cb679dd8871d49e0e5cf"]
build-backend = "linktools_setup.build_meta"

[project]
name = "linktools-mobile"
description = "linktools toolkit"
requires-python = ">=3.6"
authors = [{name = "Hu Ji", email = "669898595@qq.com"}]
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "Apache-2.0"}
dynamic = ["version", "dependencies", "optional-dependencies", "scripts", "entry-points"]

[project.urls]
Homepage = "https://github.com/ice-black-tea/linktools"
Repository = "https://github.com/ice-black-tea/linktools.git"

[tool.setuptools.packages.find]
where = ["src"]
include = ["linktools*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
linktools = ["assets/**"]

[tool.setuptools.exclude-package-data]
linktools = ["assets/develop/**"]
