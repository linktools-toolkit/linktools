name: common
version: "0.9.1"

dependencies: []

dev-dependencies:
  - linktools[cli]
  - "pytest<7; python_version < '3.7'"
  - "pytest; python_version >= '3.7'"

release-dependencies:
  - linktools[cli]>=0.9.0

optional-dependencies:
  lief:
    - lief>0.10.1
    - python-magic; platform_system=="Linux"
    - python-magic; platform_system=="Darwin"
    - python-magic-bin; platform_system=="Windows"

scripts:
  capability: linktools.capabilities.common:__cap_common__
  console:
    path: src/linktools/commands
    module: linktools.commands

convert:
  - type: jinja2
    source: capability.jinja2
    dest: src/linktools/capabilities/common.py
  - type: yml2json
    source: src/linktools/assets/develop/tools/linktools-common.yml
    dest: src/linktools/assets/tools/linktools-common.json

checks:
  ruff:
    select:
      - E9
      - F63
      - F7
      - F82
    paths:
      - src
  pytest:
    paths:
      - ../tests/common
