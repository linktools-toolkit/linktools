[build-system]
requires = ["linktools-setup @ git+https://github.com/linktools-toolkit/linktools-setup.git@df77626a1eb6386867a0284f2a94cc94ff37f7ca"]
build-backend = "linktools_setup.build_meta"

[project]
name = "linktools-common"
description = "linktools toolkit"
requires-python = ">=3.6"
authors = [{name = "Hu Ji", email = "669898595@qq.com"}]
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "Apache-2.0"}
dynamic = ["version", "dependencies", "optional-dependencies", "scripts", "entry-points"]

[project.urls]
Homepage = "https://github.com/linktools-toolkit/linktools"
Repository = "https://github.com/linktools-toolkit/linktools.git"

[tool.setuptools.packages.find]
where = ["src"]
include = ["linktools*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
linktools = ["assets/**"]

[tool.setuptools.exclude-package-data]
linktools = ["assets/develop/**"]
