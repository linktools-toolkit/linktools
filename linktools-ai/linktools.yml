name: ai
version: "0.10.0"

dependencies:
  - filelock>=3.4.0
  - jsonschema>=4.23.0,<5.0.0
  - pydantic-ai-slim[mcp,openai,retries]>=2.33.0,<3.0.0
  - pydantic-ai-harness[dynamic-workflow]>=0.26.0
  - PyYAML>=6.0,<7.0

dev-dependencies:
  - linktools
  - pytest
  - pytest-asyncio
  - sqlalchemy[asyncio]==2.0.51
  - aiosqlite==0.22.1

release-dependencies:
  - linktools>=0.10.0

optional-dependencies:
  sqlalchemy:
    - sqlalchemy[asyncio]>=2.0.51,<3.0.0
  sqlite:
    - sqlalchemy[asyncio]>=2.0.51,<3.0.0
    - aiosqlite>=0.22.1,<0.23.0
  evaluation:
    - pydantic-evals>=0.1.0

scripts:
  capability: linktools.capabilities.ai:__cap_ai__
  console:
    path: src/linktools/commands
    module: linktools.commands

convert:
  - type: jinja2
    source: capability.jinja2
    dest: src/linktools/capabilities/ai.py

checks:
  gate:
    modules:
      - scripts.check.ai
  ruff:
    select:
      - E9
      - F63
      - F7
      - F82
    paths:
      - src
  pytest:
    paths:
      - ../tests/ai
