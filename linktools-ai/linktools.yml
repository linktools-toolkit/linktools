name: ai
version: "0.10.0"

dependencies:
  - typing-extensions>=4.12.0
  - filelock>=3.4.0
  - jsonschema>=4.23.0,<5.0.0
  - httpx2>=2.12
  - pydantic-ai-slim[mcp,openai]>=2.53.0,<3.0.0
  - pydantic-ai-harness>=0.29.0

dev-dependencies:
  - linktools
  - linktools-ai[web,magic]
  - pytest
  - pytest-asyncio
  - httpx>=0.28.0,<1.0.0
  - sqlalchemy[asyncio]==2.0.51
  - aiosqlite==0.22.1
  - asyncpg
  - asyncmy

release-dependencies:
  - linktools>=0.10.0

optional-dependencies:
  magic:
    - python-magic>=0.4.27,<1.0.0
  web:
    - starlette>=1.0.0,<2.0.0
    - uvicorn>=0.30.0,<1.0.0
  sqlalchemy:
    - sqlalchemy[asyncio]>=2.0.51,<3.0.0
  sqlite:
    - sqlalchemy[asyncio]>=2.0.51,<3.0.0
    - aiosqlite>=0.22.1,<0.23.0
  evaluation:
    - pydantic-evals>=0.1.0

scripts:
  capability: linktools.capabilities.ai:__cap_ai__
  console:
    path: src/linktools/commands
    module: linktools.commands

convert:
  - type: jinja2
    source: capability.jinja2
    dest: src/linktools/capabilities/ai.py

checks:
  setup:
    - |
      if ! command -v file >/dev/null; then
        sudo apt-get update -qq
        sudo apt-get install -y file
      fi
      if [[ -n "${GITHUB_ENV:-}" ]]; then
        echo 'LINKTOOLS_REQUIRE_LIBMAGIC=1' >> "$GITHUB_ENV"
      fi
      python -c 'import magic; assert magic.from_buffer(b"%PDF-1.7\n", mime=True) == "application/pdf"'
  gate:
    modules:
      - scripts.check.ai
  ruff:
    select:
      - E9
      - F63
      - F7
      - F82
    paths:
      - src
  pytest:
    paths:
      - ../tests/ai
    groups:
      evaluation-recovery:
        - test_evaluation*
        - test_captured*
        - test_graph_capture*
        - test_runtime_recovery_ownership.py
        - test_runtime_process_recovery.py
        - test_keyed_execution_recovery.py
      runtime: []
