version: "0.10.0"

dependencies:
  - importlib-metadata; python_version < '3.8'
  - filelock>=3.4.0
  - psutil

dev-dependencies:
  - pyyaml
  - "pytest<7; python_version < '3.7'"
  - "pytest; python_version >= '3.7'"

release-dependencies: []

optional-dependencies:
  cli:
    - rich
    - argcomplete>=2.0.0
    - 'requests[socks]'
  common:
    - linktools-common[all]
  mobile:
    - linktools-mobile[all]
  cntr:
    - linktools-cntr
  ssh:
    - paramiko
    - scp
  git:
    - "dulwich>=0.25.1; python_version >= '3.10'"
    - "dulwich; python_version < '3.10'"

scripts:
  capability: linktools.core:Capability
  console:
    name: lt
    module: linktools.__main__
  commands:
    path: src/linktools/commands
    module: linktools.commands

convert:
  - type: jinja2
    source: metadata.jinja2
    dest: src/linktools/metadata.py
  - type: yml2json
    source: src/linktools/assets/develop/tools/linktools.yml
    dest: src/linktools/assets/tools/linktools.json

checks:
  ruff:
    select:
      - E9
      - F63
      - F7
      - F82
    paths:
      - src
  pytest:
    paths:
      - ../tests/core
      - ../tests/cli
