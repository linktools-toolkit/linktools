services:
  flare:
    image: 'soulteary/flare:{{ FLARE_TAG }}'
    user: '{{ DOCKER_UID }}:{{ DOCKER_GID }}'
#   {% if FLARE_PORT > 0 %}
    ports:
      - '{{ FLARE_PORT }}:5005'
#   {% endif %}
    command: flare
    environment:
#   {% if FLARE_LOGIN_ENABLE %}
      - 'FLARE_DISABLE_LOGIN=0'
      - 'FLARE_VISIBILITY=PRIVATE'
      - 'FLARE_USER={{ FLARE_USER }}'
      - 'FLARE_PASS={{ FLARE_PASSWORD }}'
#   {% else %}
      - 'FLARE_DISABLE_LOGIN=1'
#   {% endif %}
      - 'FLARE_GUIDE=1'
    volumes:
      - '{{ APP_PATH/"runtime-app" }}:/app'
      - '{{ APP_PATH/"generated/current/apps.yml" }}:/app/apps.yml:ro'
      - '{{ APP_PATH/"generated/current/bookmarks.yml" }}:/app/bookmarks.yml:ro'
    networks:
      - nginx

networks:
  nginx:
