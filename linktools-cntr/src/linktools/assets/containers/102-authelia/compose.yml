services:
  authelia:
    image: 'authelia/authelia:{{ AUTHELIA_TAG }}'
    command:
      - 'authelia'
      - '--config=/generated/configuration.yml'
      - '--config=/generated/configuration.acl.yml'
      - '--config=/generated/configuration.2fa.yml'
      - '--config=/generated/configuration.oidc.yml'
    environment:
      - AUTHELIA_LOG_LEVEL=debug
      - AUTHELIA_SESSION_SECRET_FILE=/secrets/session_secret
      - AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE=/secrets/storage_encryption_key
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE=/secrets/jwt_secret
      - AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE=/secrets/oidc_hmac_secret
      - AUTHELIA_AUTHENTICATION_BACKEND_LDAP_ADDRESS={{ AUTHELIA_LDAP_ADDRESS }}
      - AUTHELIA_AUTHENTICATION_BACKEND_LDAP_BASE_DN={{ AUTHELIA_LDAP_BASE_DN }}
      - AUTHELIA_AUTHENTICATION_BACKEND_LDAP_USER=uid={{ AUTHELIA_LDAP_USER }},ou=people,{{ AUTHELIA_LDAP_BASE_DN }}
      - AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE=/generated/authentication_backend_ldap_password
      - X_AUTHELIA_CONFIG_FILTERS=template
    volumes:
      - '{{ (APP_PATH/"config") | mkdir | chown }}:/config'
      - '{{ (APP_PATH/"secrets") | mkdir | chown }}:/secrets:ro'
      - '{{ APP_PATH/"generated/current/configuration.yml" }}:/generated/configuration.yml:ro'
      - '{{ APP_PATH/"generated/current/configuration.acl.yml" }}:/generated/configuration.acl.yml:ro'
      - '{{ APP_PATH/"generated/current/configuration.2fa.yml" }}:/generated/configuration.2fa.yml:ro'
      - '{{ APP_PATH/"generated/current/configuration.oidc.yml" }}:/generated/configuration.oidc.yml:ro'
      - '{{ APP_PATH/"generated/current/authentication_backend_ldap_password" }}:/generated/authentication_backend_ldap_password:ro'
    networks:
      authelia:
      nginx:
      lldap:
    depends_on:
      authelia-redis:
        condition: service_started
      lldap:
        condition: service_healthy

  authelia-redis:
    image: redis:alpine
    volumes:
      - '{{ (APP_PATH/"redis"/"data") | mkdir | chown }}:/data'
    networks:
      authelia:

  authelia-admin:
    image: 'ghcr.io/asalimonov/authelia-admin:latest'
    user: root
    volumes:
      - '{{ (APP_PATH/"config") | mkdir | chown }}:/config'
      - '{{ (APP_PATH/"secrets") | mkdir | chown }}:/secrets:ro'
      - '{{ APP_PATH/"generated/current/configuration.yml" }}:/generated/configuration.yml:ro'
    environment:
      - AAD_LOGLEVEL=DEBUG
      - AAD_AUTHELIA_CONFIG_PATH=/generated/configuration.yml
      - AAD_AUTHELIA_DOMAIN={{ container.public_authority }}
      - AAD_AUTHELIA_COOKIE_NAME={{ manager.project_name }}-auth-session
      - AAD_AUTHELIA_MIN_AUTH_LEVEL=1
      - AAD_DIRECTORY_TYPE=lldap-graphql
      - AAD_DIRECTORY_LLDAP_GRAPHQL_ENDPOINT={{ AUTHELIA_LDAP_WEB_ADDRESS }}/api/graphql
      - AAD_DIRECTORY_LLDAP_GRAPHQL_USER={{ AUTHELIA_LDAP_USER }}
      - AAD_DIRECTORY_LLDAP_GRAPHQL_PASSWORD={{ AUTHELIA_LDAP_PASSWORD }}
      - AAD_DIRECTORY_LLDAP_GRAPHQL_LDAP_HOST={{ AUTHELIA_LDAP_HOST }}
      - AAD_DIRECTORY_LLDAP_GRAPHQL_LDAP_PORT={{ AUTHELIA_LDAP_PORT }}
      - AAD_DIRECTORY_LLDAP_GRAPHQL_LDAP_BASE_DN={{ AUTHELIA_LDAP_BASE_DN }}
      - TRUSTED_ORIGINS={{ container.public_origin }}
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    networks:
      authelia:
      nginx:
      lldap:
    depends_on:
      authelia:
        condition: service_healthy

networks:
  authelia:
  nginx:
  lldap:
