{% from 'nginx/headers.j2' import proxy_headers with context %}
location / {
    auth_request off;
    {{ proxy_headers() }}
    set $target_url "http://authelia:9091";
    proxy_pass $target_url;
}

location /auth-admin {
    {{ proxy_headers() }}
    set $target_url "http://authelia-admin:9093";
    proxy_pass $target_url;
}
