    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;

    client_body_buffer_size 1m;
    client_max_body_size 10240m;
    fastcgi_max_temp_file_size 10240m;

    proxy_connect_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 36000s;
