{% from 'nginx/headers.j2' import proxy_headers, route_authorization with context %}
location / {
    {{ route_authorization() | indent(4) }}
    {{ proxy_headers() | indent(4) }}
    proxy_http_version 1.1;
    set $proxy_target {{ nginx.complex_value(site.proxy) }};
    proxy_pass $proxy_target;
    {% include 'nginx/params.conf' %}
}
