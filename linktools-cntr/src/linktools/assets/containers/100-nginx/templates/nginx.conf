worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    variables_hash_max_size 4096;
    variables_hash_bucket_size 128;
    map $http_upgrade $connection_upgrade { default upgrade; "" close; }
    geo $cntr_dollar { default "$"; }
    map $realip_remote_addr $cntr_actual_socket { "" $remote_addr; default $realip_remote_addr; }
    {% for name, expression, header in [('scheme', '$scheme', 'scheme'), ('host', '$http_host', 'host'), ('uri', '$request_uri', 'uri'), ('method', '$request_method', 'method'), ('client_ip', '$cntr_actual_socket', 'client_ip')] %}
    map $server_port $cntr_{{ name }} {
        default {{ expression }};
        {% if vars.waf %}
        {{ config.get('NGINX_WAF_PORT') }} $http_x_cntr_{{ header }};
        {% endif %}
    }
    {% endfor %}
    map $cntr_scheme $cntr_default_port { default 80; https 443; }
    map $cntr_host $cntr_port {
        default $cntr_default_port;
        "~:(?<cntr_explicit_port>[0-9]+)$" $cntr_explicit_port;
    }
    {% if vars.waf %}
    map $http_x_cntr_scheme $cntr_origin_scheme_valid { default 0; http 1; https 1; }
    {% for header, actual in [('host', '$http_host'), ('uri', '$request_uri'), ('method', '$request_method'), ('client_ip', '$remote_addr')] %}
    map "$http_x_cntr_{{ header }}|{{ actual }}" $cntr_origin_{{ header }}_valid {
        default 0;
        "~^(?<cntr_compare_{{ header }}>.+)\|\k<cntr_compare_{{ header }}>$" 1;
    }
    {% endfor %}
    map "$cntr_origin_scheme_valid$cntr_origin_host_valid$cntr_origin_uri_valid$cntr_origin_method_valid$cntr_origin_client_ip_valid" $cntr_origin_valid { default 0; 11111 1; }
    {% endif %}
    server {
        listen unix:/run/nginx-cntr-health.sock;
        location = /__cntr/health { default_type text/plain; return 200 {{ nginx.quote(vars.generation_id) }}; }
        location / { return 404; }
    }
    {% for filename in vars.site_files %}
    include {{ filename }};
    {% endfor %}
}
