worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    variables_hash_max_size 4096;
    variables_hash_bucket_size 128;
    map $http_upgrade $connection_upgrade { default upgrade; "" close; }
    geo $literal_dollar { default "$"; }
    map $realip_remote_addr $peer_address { "" $remote_addr; default $realip_remote_addr; }
    {% for name, expression, header in [('scheme', '$scheme', 'scheme'), ('host', '$http_host', 'host'), ('uri', '$request_uri', 'uri'), ('method', '$request_method', 'method'), ('client_ip', '$peer_address', 'client_ip')] %}
    map $server_port $original_{{ name }} {
        default {{ expression }};
        {% if vars.waf %}
        {{ config.get('NGINX_WAF_PORT') }} $http_x_proxy_original_{{ header }};
        {% endif %}
    }
    {% endfor %}
    map $original_scheme $original_default_port { default 80; https 443; }
    map $original_host $original_port {
        default $original_default_port;
        "~:(?<original_explicit_port>[0-9]+)$" $original_explicit_port;
    }
    {% if vars.waf %}
    map $http_x_proxy_original_scheme $waf_origin_scheme_valid { default 0; http 1; https 1; }
    {% for header, actual in [('host', '$http_host'), ('uri', '$request_uri'), ('method', '$request_method'), ('client_ip', '$remote_addr')] %}
    map "$http_x_proxy_original_{{ header }}|{{ actual }}" $waf_origin_{{ header }}_valid {
        default 0;
        "~^(?<waf_compare_{{ header }}>.+)\|\k<waf_compare_{{ header }}>$" 1;
    }
    {% endfor %}
    map "$waf_origin_scheme_valid$waf_origin_host_valid$waf_origin_uri_valid$waf_origin_method_valid$waf_origin_client_ip_valid" $waf_origin_valid { default 0; 11111 1; }
    {% endif %}
    server {
        listen unix:/run/nginx-health.sock;
        location = /health { default_type text/plain; return 200 {{ nginx.quote(vars.generation_id) }}; }
        location / { return 404; }
    }
    {% for filename in vars.site_files %}
    include {{ filename }};
    {% endfor %}
}
