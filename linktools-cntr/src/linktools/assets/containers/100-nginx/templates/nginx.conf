worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    variables_hash_max_size 4096;
    variables_hash_bucket_size 128;
    map $http_upgrade $connection_upgrade { default upgrade; "" close; }
    # Evaluate only for auth_request_set in the authentication subrequest.
    map $upstream_status $auth_response_success {
        volatile;
        default 0;
        ~^2[0-9][0-9]$ 1;
    }
    geo $literal_dollar { default "$"; }
    map $realip_remote_addr $peer_address { "" $remote_addr; default $realip_remote_addr; }
    {% for name, expression, origin in nginx.original_fields %}
    map $server_port $original_{{ name }} {
        default {{ expression }};
        {% if template_vars.waf and origin %}
        {{ config.get('NGINX_WAF_PORT') }} {{ origin }};
        {% endif %}
    }
    {% endfor %}
    map $original_scheme $original_default_port { default 80; https 443; }
    map $original_host $original_port {
        default $original_default_port;
        "~:(?<original_explicit_port>[0-9]+)$" $original_explicit_port;
    }
    {% if template_vars.waf %}
    map $remote_addr $waf_client_ip {
        default $remote_addr;
        {% for address in waf_addresses.values() %}
        {{ address }} "";
        {% endfor %}
    }
    {% endif %}
    server {
        listen unix:/run/nginx-health.sock;
        location = /health { default_type text/plain; return 200 "ready"; }
        location / { return 404; }
    }
    {% for filename in template_vars.site_files %}
    include /etc/nginx/managed/{{ filename }};
    {% endfor %}
}
