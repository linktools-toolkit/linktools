{% for capability in ['waf', 'auth'] if site[capability] %}
map $uri ${{ capability }}_skip_{{ site.var_name }} {
    default 0;
    {% for regex in site[capability + '_bypass'] %}
    {{ nginx.complex_value('~*' + regex) }} 1;
    {% endfor %}
}
{% endfor %}
{% if site.auth %}
{# Exact keys preserve business regex captures when evaluated at proxy time. #}
map "$auth_status_{{ site.var_name }}:$auth_skip_{{ site.var_name }}:$auth_proof_{{ site.var_name }}" $auth_verified_{{ site.var_name }} {
    volatile;
    default 0;
    {% for status in range(200, 300) %}
    "{{ status }}:0:1" 1;
    {% endfor %}
}
{% for name in ['user', 'groups', 'name', 'email'] %}
map $auth_verified_{{ site.var_name }} $identity_{{ site.var_name }}_{{ name }} {
    volatile;
    default "";
    1 $auth_{{ name }}_{{ site.var_name }};
}
{% endfor %}
{% for key, value in nginx.validated_auth_headers(site.auth_headers).items() %}
map $auth_verified_{{ site.var_name }} $credential_{{ site.var_name }}_{{ loop.index0 }} {
    volatile;
    {# Only conventional header names have a usable nginx $http_* variable. #}
    default {{ '${http_' + key.lower().replace('-', '_') + '}' if key is http_header else '""' }};
    1 {{ nginx.quote(value) }};
}
{% endfor %}
{% endif %}
