    {% set auth_site = auth_site | default(site) %}
    location = /_internal/auth{% if route_auth | default(false) %}/{{ auth_site.var_name }}{% endif %} {
        internal;
        auth_request off;
        if ($auth_skip_{{ auth_site.var_name }} = 1) { return 204; }
        set $auth_endpoint_{{ site.var_name }} 1;
        proxy_intercept_errors off;
        recursive_error_pages off;
        proxy_next_upstream off;
        resolver 127.0.0.11 valid=5s;
        set $auth_target http://authelia:9091/api/authz/auth-request;
        proxy_pass $auth_target;
        {% for name, value in nginx.header_items(auth_site, authentication=True) %}
        proxy_set_header {{ nginx.complex_value(name) }} {{ value }};
        {% endfor %}
        proxy_pass_request_body off;
        proxy_http_version 1.1;
        proxy_cache off;
        proxy_connect_timeout 240;
        proxy_read_timeout 240;
        proxy_send_timeout 240;
    }
