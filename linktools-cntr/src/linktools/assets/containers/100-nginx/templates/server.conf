{% set group = sites | default([site]) %}
{% for member in group %}
{{ nginx.security_maps(member) }}
{% endfor %}
{% macro routes(origin=False) %}
    resolver 127.0.0.11 valid=5s;
    {% if origin %}
    set_real_ip_from {{ config.get('SAFELINE_SUBNET_PREFIX') }}.254;
    real_ip_header X-Proxy-Original-Client-IP;
    if ($peer_address != "{{ config.get('SAFELINE_SUBNET_PREFIX') }}.254") { return 403; }
    if ($waf_origin_valid = 0) { return 400; }
    {% endif %}
    # Force non-volatile maps before any business rewrite or location captures.
    set $original_snapshot "$original_scheme|$original_host|$original_uri|$original_method|$original_client_ip|$original_port{% for member in group if member.auth %}|$auth_skip_{{ member.var_name }}{% endfor %}{% if site.waf %}|$waf_skip_{{ site.var_name }}{% endif %}";
    if ($original_host = "") { return 400; }
    {% if route_auth | default(false) %}
    auth_request /_internal/auth-deny;
    location = /_internal/auth-deny { internal; auth_request off; return 403; }
    {% for member in group if member.auth %}
    {% set auth_site = member %}
    {% include 'nginx/auth_location.conf' %}
    {% endfor %}
    {% elif site.auth %}
    set $auth_endpoint_{{ site.var_name }} 0;
    auth_request /_internal/auth;
    {% for member in group %}
    set $auth_proof_{{ member.var_name }} 0;
    auth_request_set $auth_proof_{{ member.var_name }} $auth_endpoint_{{ site.var_name }};
    auth_request_set $auth_status_{{ member.var_name }} $upstream_status;
    {% for name in ['user', 'groups', 'name', 'email'] %}
    auth_request_set $auth_{{ name }}_{{ member.var_name }} $upstream_http_remote_{{ name }};
    {% endfor %}
    auth_request_set $auth_redirect_{{ member.var_name }} $upstream_http_location;
    {% endfor %}
    error_page 401 =302 $auth_redirect_{{ site.var_name }};
    {% include 'nginx/auth_location.conf' %}
    {% endif %}
    {% if site.waf and not origin %}
    if ($waf_skip_{{ site.var_name }} = 0) { return 418; }
    error_page 418 = @waf;
    location @waf {
        internal;
        auth_request off;
        proxy_intercept_errors off;
        proxy_next_upstream off;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $original_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        {% for name, value in [('Scheme', 'scheme'), ('Host', 'host'), ('URI', 'uri'), ('Method', 'method'), ('Client-IP', 'client_ip')] %}
        proxy_set_header X-Proxy-Original-{{ name }} $original_{{ value }};
        {% endfor %}
        set $waf_target "http://{{ config.get('SAFELINE_SUBNET_PREFIX') }}.254:{{ config.get('NGINX_WAF_PORT') }}";
        proxy_pass $waf_target;
    }
    {% endif %}
    {{ business | default('') }}
{% endmacro %}
server {
    listen {{ config.get('NGINX_HTTP_PORT') }} {{ 'default_server' if site.default else '' }};
    server_name {{ site.server_name }};
    {% if site.https %}
    if ($http_host = "") { return 400; }
    return 301 https://$host:{{ config.get('NGINX_HTTPS_PORT') }}$request_uri;
    {% else %}
    {{ routes() }}
    {% endif %}
}
{% if site.https %}
server {
    listen {{ config.get('NGINX_HTTPS_PORT') }} ssl {{ 'default_server' if site.default else '' }};
    server_name {{ site.server_name }};
    ssl_certificate /etc/certs/{{ nginx.cert_image_revision }}/live/{{ config.get('NGINX_ROOT_DOMAIN') }}_fullchain.pem;
    ssl_certificate_key /etc/certs/{{ nginx.cert_image_revision }}/live/{{ config.get('NGINX_ROOT_DOMAIN') }}_key.pem;
    error_page 497 =301 https://$http_host$request_uri;
    {{ routes() }}
}
{% endif %}
{% if site.waf %}
server {
    listen {{ config.get('NGINX_WAF_PORT') }} {{ 'default_server' if site.default else '' }};
    server_name {{ site.server_name }};
    {{ routes(True) }}
}
{% endif %}
