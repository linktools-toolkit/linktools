{% if WAF_ENABLE %}
map $uri $cntr_waf_skip_{{ SITE_VAR }} {
    default 0;
    {% for regex in WAF_BYPASS %}
    ~*{{ regex }} 1;
    {% endfor %}
}
{% endif %}

{% macro routes() %}
    resolver 127.0.0.11 valid=5s;
    {% if WAF_ENABLE %}
    if ($cntr_waf_skip_{{ SITE_VAR }} = 0) {
        return 418;
    }
    error_page 418 = @cntr_waf;
    location @cntr_waf {
        internal;
        auth_request off;
        proxy_intercept_errors off;
        proxy_next_upstream off;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Cntr-Scheme $scheme;
        proxy_set_header X-Cntr-Host $http_host;
        proxy_set_header X-Cntr-URI $request_uri;
        proxy_set_header X-Cntr-Method $request_method;
        proxy_set_header X-Cntr-Client-IP $remote_addr;
        set $cntr_waf_target "http://{{ SAFELINE_SUBNET_PREFIX }}.254:{{ NGINX_WAF_PORT }}";
        proxy_pass $cntr_waf_target;
    }
    {% endif %}
    include /etc/nginx/conf.d/{{ DOMAIN_NAME }}_confs/*.conf;
{% endmacro %}

server {
    listen {{ NGINX_HTTP_PORT }} {{ 'default_server' if DOMAIN == "_" else '' }};
    server_name {{ DOMAIN }};

    {% if HTTPS_ENABLE %}
    return 301 https://$host:{{ NGINX_HTTPS_PORT }}$request_uri;
    {% else %}
    {{ routes() }}
    {% endif %}
}

{% if HTTPS_ENABLE %}
server {
    listen {{ NGINX_HTTPS_PORT }} ssl {{ 'default_server' if DOMAIN == "_" else '' }};
    server_name {{ DOMAIN }};
    ssl_certificate /etc/certs/{{ NGINX_ROOT_DOMAIN }}_fullchain.pem;
    ssl_certificate_key /etc/certs/{{ NGINX_ROOT_DOMAIN }}_key.pem;
    error_page 497 =301 https://$http_host$request_uri;
    {{ routes() }}
}
{% endif %}

{% if WAF_ENABLE %}
server {
    listen {{ NGINX_WAF_PORT }};
    server_name {{ DOMAIN }};
    if ($remote_addr != "{{ SAFELINE_SUBNET_PREFIX }}.254") {
        return 403;
    }
    resolver 127.0.0.11 valid=5s;
    include /etc/nginx/conf.d/{{ DOMAIN_NAME }}_confs/*.conf;
}
{% endif %}
