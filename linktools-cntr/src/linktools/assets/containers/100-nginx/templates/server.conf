{{ nginx.security_maps(site) }}
{% macro routes(origin=False) %}
    resolver 127.0.0.11 valid=5s;
    {% if origin %}
    set_real_ip_from {{ config.get('SAFELINE_SUBNET_PREFIX') }}.254;
    real_ip_header X-Cntr-Client-IP;
    if ($cntr_actual_socket != "{{ config.get('SAFELINE_SUBNET_PREFIX') }}.254") { return 403; }
    if ($cntr_origin_valid = 0) { return 400; }
    {% endif %}
    # Force non-volatile maps before any business rewrite or location captures.
    set $cntr_frozen "$cntr_scheme|$cntr_host|$cntr_uri|$cntr_method|$cntr_client_ip|$cntr_port{% if site.auth %}|$cntr_auth_skip_{{ site.var_name }}{% endif %}{% if site.waf %}|$cntr_waf_skip_{{ site.var_name }}{% endif %}";
    if ($cntr_host = "") { return 400; }
    {% if site.auth %}
    set $cntr_auth_endpoint_{{ site.var_name }} 0;
    set $cntr_auth_proof_{{ site.var_name }} 0;
    auth_request /__cntr/auth;
    auth_request_set $cntr_auth_proof_{{ site.var_name }} $cntr_auth_endpoint_{{ site.var_name }};
    auth_request_set $cntr_auth_status_{{ site.var_name }} $upstream_status;
    {% for name in ['user', 'groups', 'name', 'email'] %}
    auth_request_set $cntr_auth_{{ name }}_{{ site.var_name }} $upstream_http_remote_{{ name }};
    {% endfor %}
    auth_request_set $cntr_redirect_{{ site.var_name }} $upstream_http_location;
    error_page 401 =302 $cntr_redirect_{{ site.var_name }};
    include sites/{{ site.file_id }}/auth.conf;
    {% endif %}
    {% if site.waf and not origin %}
    if ($cntr_waf_skip_{{ site.var_name }} = 0) { return 418; }
    error_page 418 = @cntr_waf;
    location @cntr_waf {
        internal;
        auth_request off;
        proxy_intercept_errors off;
        proxy_next_upstream off;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $cntr_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        {% for name, value in [('Scheme', 'scheme'), ('Host', 'host'), ('URI', 'uri'), ('Method', 'method'), ('Client-IP', 'client_ip')] %}
        proxy_set_header X-Cntr-{{ name }} $cntr_{{ value }};
        {% endfor %}
        set $cntr_waf_target "http://{{ config.get('SAFELINE_SUBNET_PREFIX') }}.254:{{ config.get('NGINX_WAF_PORT') }}";
        proxy_pass $cntr_waf_target;
    }
    {% endif %}
    include sites/{{ site.file_id }}/business.conf;
{% endmacro %}
server {
    listen {{ config.get('NGINX_HTTP_PORT') }} {{ 'default_server' if site.default else '' }};
    server_name {{ site.server_name }};
    {% if site.https %}
    if ($http_host = "") { return 400; }
    return 301 https://$host:{{ config.get('NGINX_HTTPS_PORT') }}$request_uri;
    {% else %}
    {{ routes() }}
    {% endif %}
}
{% if site.https %}
server {
    listen {{ config.get('NGINX_HTTPS_PORT') }} ssl {{ 'default_server' if site.default else '' }};
    server_name {{ site.server_name }};
    ssl_certificate /etc/certs/{{ config.get('NGINX_ROOT_DOMAIN') }}_fullchain.pem;
    ssl_certificate_key /etc/certs/{{ config.get('NGINX_ROOT_DOMAIN') }}_key.pem;
    error_page 497 =301 https://$http_host$request_uri;
    {{ routes() }}
}
{% endif %}
{% if site.waf %}
server {
    listen {{ config.get('NGINX_WAF_PORT') }} {{ 'default_server' if site.default else '' }};
    server_name {{ site.server_name }};
    {{ routes(True) }}
}
{% endif %}
