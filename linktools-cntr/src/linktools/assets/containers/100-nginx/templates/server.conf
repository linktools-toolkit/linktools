{% if site.waf %}
map $uri $cntr_waf_skip_{{ site.var_name }} {
    default 0;
    {% for regex in site.waf_bypass %}
    ~*{{ regex }} 1;
    {% endfor %}
}
{% endif %}

{% macro routes() %}
    resolver 127.0.0.11 valid=5s;
    set $cntr_scheme $scheme;
    set $cntr_host $http_host;
    set $cntr_uri $request_uri;
    set $cntr_method $request_method;
    set $cntr_client_ip $remote_addr;
    if ($cntr_host = "") {
        return 400;
    }
    {% if site.waf %}
    if ($cntr_waf_skip_{{ site.var_name }} = 0) {
        return 418;
    }
    error_page 418 = @cntr_waf;
    location @cntr_waf {
        internal;
        auth_request off;
        proxy_intercept_errors off;
        proxy_next_upstream off;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Cntr-Scheme $cntr_scheme;
        proxy_set_header X-Cntr-Host $cntr_host;
        proxy_set_header X-Cntr-URI $cntr_uri;
        proxy_set_header X-Cntr-Method $cntr_method;
        proxy_set_header X-Cntr-Client-IP $cntr_client_ip;
        set $cntr_waf_target "http://{{ config.get("SAFELINE_SUBNET_PREFIX") }}.254:{{ config.get("NGINX_WAF_PORT") }}";
        proxy_pass $cntr_waf_target;
    }
    {% endif %}
    include /etc/nginx/conf.d/{{ site.file_id }}_confs/*.conf;
{% endmacro %}

server {
    listen {{ config.get("NGINX_HTTP_PORT") }} {{ 'default_server' if site.server_name == "_" else '' }};
    server_name {{ site.server_name }};

    {% if site.auth %}
    auth_request /internal/authelia/authz;
    auth_request_set $redirection_url $upstream_http_location;
    error_page 401 =302 $redirection_url;
    {% endif %}
    {% if site.https %}
    return 301 https://$host:{{ config.get("NGINX_HTTPS_PORT") }}$request_uri;
    {% else %}
    {{ routes() }}
    {% endif %}
}

{% if site.https %}
server {
    listen {{ config.get("NGINX_HTTPS_PORT") }} ssl {{ 'default_server' if site.server_name == "_" else '' }};
    server_name {{ site.server_name }};
    ssl_certificate /etc/certs/{{ config.get("NGINX_ROOT_site.server_name") }}_fullchain.pem;
    ssl_certificate_key /etc/certs/{{ config.get("NGINX_ROOT_site.server_name") }}_key.pem;
    error_page 497 =301 https://$http_host$request_uri;
    {% if site.auth %}
    auth_request /internal/authelia/authz;
    auth_request_set $redirection_url $upstream_http_location;
    error_page 401 =302 $redirection_url;
    {% endif %}
    {{ routes() }}
}
{% endif %}

{% if site.waf %}
server {
    listen {{ config.get("NGINX_WAF_PORT") }};
    server_name {{ site.server_name }};
    set_real_ip_from {{ config.get("SAFELINE_SUBNET_PREFIX") }}.254;
    real_ip_header X-Cntr-Client-IP;
    if ($cntr_actual_socket != "{{ config.get("SAFELINE_SUBNET_PREFIX") }}.254") {
        return 403;
    }
    if ($http_x_cntr_client_ip != $remote_addr) {
        return 400;
    }
    if ($http_x_cntr_scheme !~* ^https?$) {
        return 400;
    }
    if ($http_x_cntr_host = "") {
        return 400;
    }
    if ($http_x_cntr_host != $http_host) {
        return 400;
    }
    if ($http_x_cntr_uri != $request_uri) {
        return 400;
    }
    if ($http_x_cntr_method != $request_method) {
        return 400;
    }
    set $cntr_scheme $http_x_cntr_scheme;
    set $cntr_host $http_x_cntr_host;
    set $cntr_uri $http_x_cntr_uri;
    set $cntr_method $http_x_cntr_method;
    set $cntr_client_ip $remote_addr;
    resolver 127.0.0.11 valid=5s;
    {% if site.auth %}
    auth_request /internal/authelia/authz;
    auth_request_set $redirection_url $upstream_http_location;
    error_page 401 =302 $redirection_url;
    {% endif %}
    include /etc/nginx/conf.d/{{ site.file_id }}_confs/*.conf;
}
{% endif %}
