{% if WAF_ENABLE %}
map $uri $cntr_waf_skip_{{ SITE_VAR }} {
    default 0;
    {% for regex in WAF_BYPASS %}
    ~*{{ regex }} 1;
    {% endfor %}
}
{% endif %}

{% macro routes() %}
    resolver 127.0.0.11 valid=5s;
    set $cntr_scheme $scheme;
    set $cntr_host $http_host;
    set $cntr_uri $request_uri;
    set $cntr_method $request_method;
    set $cntr_client_ip $remote_addr;
    if ($cntr_host = "") {
        return 400;
    }
    {% if WAF_ENABLE %}
    if ($cntr_waf_skip_{{ SITE_VAR }} = 0) {
        return 418;
    }
    error_page 418 = @cntr_waf;
    location @cntr_waf {
        internal;
        auth_request off;
        proxy_intercept_errors off;
        proxy_next_upstream off;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Cntr-Scheme $cntr_scheme;
        proxy_set_header X-Cntr-Host $cntr_host;
        proxy_set_header X-Cntr-URI $cntr_uri;
        proxy_set_header X-Cntr-Method $cntr_method;
        proxy_set_header X-Cntr-Client-IP $cntr_client_ip;
        set $cntr_waf_target "http://{{ SAFELINE_SUBNET_PREFIX }}.254:{{ NGINX_WAF_PORT }}";
        proxy_pass $cntr_waf_target;
    }
    {% endif %}
    include /etc/nginx/conf.d/{{ DOMAIN_NAME }}_confs/*.conf;
{% endmacro %}

server {
    listen {{ NGINX_HTTP_PORT }} {{ 'default_server' if DOMAIN == "_" else '' }};
    server_name {{ DOMAIN }};

    {% if HTTPS_ENABLE %}
    return 301 https://$host:{{ NGINX_HTTPS_PORT }}$request_uri;
    {% else %}
    {{ routes() }}
    {% endif %}
}

{% if HTTPS_ENABLE %}
server {
    listen {{ NGINX_HTTPS_PORT }} ssl {{ 'default_server' if DOMAIN == "_" else '' }};
    server_name {{ DOMAIN }};
    ssl_certificate /etc/certs/{{ NGINX_ROOT_DOMAIN }}_fullchain.pem;
    ssl_certificate_key /etc/certs/{{ NGINX_ROOT_DOMAIN }}_key.pem;
    error_page 497 =301 https://$http_host$request_uri;
    {{ routes() }}
}
{% endif %}

{% if WAF_ENABLE %}
server {
    listen {{ NGINX_WAF_PORT }};
    server_name {{ DOMAIN }};
    set_real_ip_from {{ SAFELINE_SUBNET_PREFIX }}.254;
    real_ip_header X-Cntr-Client-IP;
    if ($cntr_actual_socket != "{{ SAFELINE_SUBNET_PREFIX }}.254") {
        return 403;
    }
    if ($http_x_cntr_client_ip != $remote_addr) {
        return 400;
    }
    if ($http_x_cntr_scheme !~* ^https?$) {
        return 400;
    }
    if ($http_x_cntr_host = "") {
        return 400;
    }
    if ($http_x_cntr_host != $http_host) {
        return 400;
    }
    if ($http_x_cntr_uri != $request_uri) {
        return 400;
    }
    if ($http_x_cntr_method != $request_method) {
        return 400;
    }
    set $cntr_scheme $http_x_cntr_scheme;
    set $cntr_host $http_x_cntr_host;
    set $cntr_uri $http_x_cntr_uri;
    set $cntr_method $http_x_cntr_method;
    set $cntr_client_ip $remote_addr;
    resolver 127.0.0.11 valid=5s;
    include /etc/nginx/conf.d/{{ DOMAIN_NAME }}_confs/*.conf;
}
{% endif %}
