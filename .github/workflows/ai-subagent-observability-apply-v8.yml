name: Apply subagent observability implementation v8

on:
  push:
    branches:
      - feat/ai-subagent-observability
    paths:
      - .github/workflows/ai-subagent-observability-apply-v8.yml

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ai-subagent-observability
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Apply implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path(".github/workflows/ai-subagent-observability-apply-v7.yml").read_text()
          block = source.split("          python - <<'PY'\n", 1)[1].split("\n          PY\n", 1)[0]
          exec(compile(textwrap.dedent(block), "subagent-observability-apply-v7", "exec"))

          path = Path("tests/ai/test_subagent_repository_instructions.py")
          value = path.read_text()
          old = '            root_execution_id="parent",\n        )'
          new = (
              '            root_execution_id="parent",\n'
              '            parent_invocation_id="delegate-call",\n'
              '        )'
          )
          if value.count(old) != 5:
              raise RuntimeError(f"expected five direct subagent starts, got {value.count(old)}")
          path.write_text(value.replace(old, new))

          path = Path("tests/ai/test_error_propagation_boundaries.py")
          value = path.read_text()
          name = "async def test_recovery_start_unknown_uses_execution_error_domain() -> None:"
          start = value.index(name)
          end = value.index("\n\n@pytest.mark.asyncio", start + len(name))
          segment = value[start:end]
          old = '            root_execution_id=execution_id,\n'
          if segment.count(old) != 1:
              raise RuntimeError("expected one execution fake root lineage")
          segment = segment.replace(
              old,
              old + '            parent_invocation_id=None,\n',
              1,
          )
          old = '        root_execution_id="execution",\n'
          if segment.count(old) != 1:
              raise RuntimeError("expected one recovery fake root lineage")
          segment = segment.replace(
              old,
              old + '        parent_invocation_id=None,\n',
              1,
          )
          path.write_text(value[:start] + segment + value[end:])

          path = Path("tests/ai/test_user_content_durable_boundaries.py")
          value = path.read_text()
          name = "def _execution_request_digest(request: ExecutionRequest) -> str:"
          start = value.index(name)
          end = value.index("\n\n", start + len(name))
          segment = value[start:end]
          old = "        root_execution_id=None,\n"
          if segment.count(old) != 1:
              raise RuntimeError("expected one request digest root lineage")
          segment = segment.replace(
              old,
              old + "        parent_invocation_id=None,\n",
              1,
          )
          path.write_text(value[:start] + segment + value[end:])
          PY
      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Run targeted tests
        run: |
          python -m pytest -q \
            tests/ai/test_subagent_execution_tree.py \
            tests/ai/test_skill_subagent_final_refactor.py \
            tests/ai/test_subagent_repository_instructions.py \
            tests/ai/test_error_propagation_boundaries.py \
            tests/ai/test_user_content_durable_boundaries.py \
            tests/ai/test_execution_context_durability.py \
            tests/ai/test_local_execution_recovery.py \
            tests/ai/test_runtime_metrics.py
      - name: Run linktools-ai gate
        run: python manage.py check linktools-ai
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/ai-subagent-observability-apply.yml
          rm .github/workflows/ai-subagent-observability-apply-v2.yml
          rm .github/workflows/ai-subagent-observability-apply-v3.yml
          rm .github/workflows/ai-subagent-observability-apply-v4.yml
          rm .github/workflows/ai-subagent-observability-apply-v5.yml
          rm .github/workflows/ai-subagent-observability-apply-v6.yml
          rm .github/workflows/ai-subagent-observability-apply-v7.yml
          rm .github/workflows/ai-subagent-observability-apply-v8.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ai): track subagent execution lineage"
          git push origin HEAD:feat/ai-subagent-observability
