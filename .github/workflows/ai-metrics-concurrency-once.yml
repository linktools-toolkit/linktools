name: AI metrics concurrency one-shot

on:
  push:
    branches:
      - feat/ai-metrics-observability

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ai-metrics-observability
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Remove shared mutable trace metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(value: str, old: str, new: str, label: str) -> str:
              count = value.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, got {count}")
              return value.replace(old, new, 1)

          path = Path('linktools-ai/src/linktools/ai/runtime/_capabilities.py')
          value = path.read_text()
          value = once(
              value,
              '''        error: str | None = None,\n    ) -> None:\n        event_index = self._event_sequence\n''',
              '''        error: str | None = None,\n        tool_call_id: str | None = None,\n        tool_name: str | None = None,\n    ) -> None:\n        event_index = self._event_sequence\n''',
              'runtime event tool fields signature',
          )
          value = once(
              value,
              '''            agent_name=self.agent_name,\n            error=error,\n            metadata=dict(metadata),\n''',
              '''            agent_name=self.agent_name,\n            tool_call_id=tool_call_id,\n            tool_name=tool_name,\n            error=error,\n            metadata=dict(metadata),\n''',
              'runtime event tool fields append',
          )
          value = once(
              value,
              '''            active = self._model_started.pop(ctx.run_step, None)\n            if active is None:\n                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n            attempt_index, started = active\n            metadata[_DURATION_NS_METADATA_KEY] = str(monotonic_ns() - started)\n''',
              '''            active = self._model_started.pop(ctx.run_step, None)\n            if active is None:\n                _logger.warning(\n                    "model metric trace timing unavailable: run=%s step=%s",\n                    self.run_id or ctx.run_id,\n                    ctx.run_step,\n                )\n                return metadata\n            attempt_index, started = active\n            metadata[_DURATION_NS_METADATA_KEY] = str(monotonic_ns() - started)\n''',
              'model trace fail-open timing',
          )
          old = '''    async def _with_tool_metric_metadata(\n        self,\n        call: ToolCallPart,\n        state: _ToolCallState,\n        operation: Callable[[], Any],\n    ) -> Any:\n        previous = self.metadata\n        self.metadata = self._tool_metric_metadata(call, state)\n        try:\n            return await operation()\n        finally:\n            self.metadata = previous\n\n'''
          new = '''    async def _persist_tool_completed(\n        self,\n        ctx: "RunContext[None]",\n        *,\n        call: ToolCallPart,\n        tool_def: ToolDefinition,\n        result: Any,\n        state: _ToolCallState,\n    ) -> Any:\n        run_id = self._effective_run_id(ctx)\n        await self._finish_tool_effect(\n            run_id,\n            call.tool_call_id,\n            tool_def.name,\n            "completed",\n        )\n        await self._record_runtime_event(\n            ctx,\n            kind="tool_call_completed",\n            metadata=self._tool_metric_metadata(call, state),\n            tool_call_id=call.tool_call_id,\n            tool_name=tool_def.name,\n        )\n        return result\n\n    async def _persist_tool_failed(\n        self,\n        ctx: "RunContext[None]",\n        *,\n        call: ToolCallPart,\n        tool_def: ToolDefinition,\n        error: BaseException,\n        state: _ToolCallState,\n    ) -> Any:\n        run_id = self._effective_run_id(ctx)\n        await self._finish_tool_effect(\n            run_id,\n            call.tool_call_id,\n            tool_def.name,\n            "failed",\n            repr(error),\n        )\n        await self._record_runtime_event(\n            ctx,\n            kind="tool_call_failed",\n            metadata=self._tool_metric_metadata(call, state),\n            tool_call_id=call.tool_call_id,\n            tool_name=tool_def.name,\n            error=repr(error),\n        )\n        raise error\n\n'''
          value = once(value, old, new, 'replace mutable metadata helper')

          old = '''        async def persist() -> Any:\n            return await super(_RuntimeStepPersistence, self).after_tool_execute(\n                ctx,\n                call=call,\n                tool_def=tool_def,\n                args=args,\n                result=result,\n            )\n\n        try:\n            return await self._with_tool_metric_metadata(call, state, persist)\n        finally:\n'''
          new = '''        try:\n            return await self._persist_tool_completed(\n                ctx,\n                call=call,\n                tool_def=tool_def,\n                result=result,\n                state=state,\n            )\n        finally:\n'''
          value = once(value, old, new, 'after tool immutable metadata')

          old = '''        async def persist() -> Any:\n            return await super(_RuntimeStepPersistence, self).on_tool_execute_error(\n                ctx,\n                call=call,\n                tool_def=tool_def,\n                args=args,\n                error=error,\n            )\n\n        try:\n            result = await self._with_tool_metric_metadata(call, state, persist)\n        except BaseException as raised:\n'''
          new = '''        try:\n            result = await self._persist_tool_failed(\n                ctx,\n                call=call,\n                tool_def=tool_def,\n                error=error,\n                state=state,\n            )\n        except BaseException as raised:\n'''
          value = once(value, old, new, 'failed tool immutable metadata')

          old = '''        async def persist() -> Any:\n            return await super(_RuntimeStepPersistence, self).after_tool_execute(\n                ctx,\n                call=call,\n                tool_def=tool_def,\n                args=args,\n                result=result,\n            )\n\n        try:\n            value = await self._with_tool_metric_metadata(call, state, persist)\n        except BaseException:\n'''
          new = '''        try:\n            value = await self._persist_tool_completed(\n                ctx,\n                call=call,\n                tool_def=tool_def,\n                result=result,\n                state=state,\n            )\n        except BaseException:\n'''
          value = once(value, old, new, 'skip tool immutable metadata')
          path.write_text(value)

          # Public flush validation is invariant whether Metrics is enabled or disabled.
          path = Path('linktools-ai/src/linktools/ai/runtime/_runtime_service.py')
          value = path.read_text()
          value = once(
              value,
              '''    ) -> RuntimeMetricFlushResult:\n        self._ensure_open()\n        control = self._metric_control\n''',
              '''    ) -> RuntimeMetricFlushResult:\n        self._ensure_open()\n        if (\n            isinstance(timeout_seconds, bool)\n            or not isinstance(timeout_seconds, (int, float))\n            or timeout_seconds < 0\n        ):\n            raise AIError(ErrorCode.REQUEST_FIELD_INVALID)\n        control = self._metric_control\n''',
              'runtime flush validation',
          )
          path.write_text(value)
          PY

          python -m compileall -q linktools-ai/src/linktools/ai tests/ai
          git diff --check
          rm .github/workflows/ai-metrics-concurrency-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ai): isolate concurrent metric trace metadata'
          git push origin HEAD:feat/ai-metrics-observability
