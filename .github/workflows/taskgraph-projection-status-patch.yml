name: TaskGraph projection status patch

on:
  push:
    branches:
      - feat/ai-taskgraph-reliable-mixed-nodes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-taskgraph-reliable-mixed-nodes
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch projection-aware aggregate status
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_function(path: str, name: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              start = text.index(f"def {name}(")
              end = text.index("\n\ndef ", start + 1)
              file.write_text(text[:start] + replacement.rstrip() + text[end:])

          replacement_graph = '''def _aggregate_graph_status(nodes: "tuple[TaskNodeView, ...]") -> TaskStatus:
              statuses = {node.status for node in nodes}
              by_id = {node.node_id: node for node in nodes}
              failure_states = {
                  TaskStatus.FAILED,
                  TaskStatus.BLOCKED,
                  TaskStatus.CANCELLED,
              }
              projection_pending = any(
                  node.status in {TaskStatus.PENDING, TaskStatus.READY, TaskStatus.RUNNING}
                  and any(
                      by_id[dependency].status in failure_states
                      for dependency in node.dependencies
                  )
                  for node in nodes
              )
              if projection_pending:
                  return TaskStatus.RUNNING if TaskStatus.RUNNING in statuses else TaskStatus.PENDING
              if not statuses or statuses <= {TaskStatus.SUCCEEDED}:
                  return TaskStatus.SUCCEEDED
              if TaskStatus.FAILED in statuses:
                  return TaskStatus.FAILED
              if TaskStatus.BLOCKED in statuses:
                  return TaskStatus.BLOCKED
              if statuses <= {TaskStatus.CANCELLED, TaskStatus.SUCCEEDED}:
                  return TaskStatus.CANCELLED
              if TaskStatus.RUNNING in statuses:
                  return TaskStatus.RUNNING
              return TaskStatus.PENDING
          '''
          replacement_repo = '''def _graph_status(nodes: "tuple[TaskNodeView, ...]") -> TaskStatus:
              statuses = {node.status for node in nodes}
              by_id = {node.node_id: node for node in nodes}
              failure_states = {
                  TaskStatus.FAILED,
                  TaskStatus.BLOCKED,
                  TaskStatus.CANCELLED,
              }
              projection_pending = any(
                  node.status in {TaskStatus.PENDING, TaskStatus.READY, TaskStatus.RUNNING}
                  and any(
                      by_id[dependency].status in failure_states
                      for dependency in node.dependencies
                  )
                  for node in nodes
              )
              if projection_pending:
                  return TaskStatus.RUNNING if TaskStatus.RUNNING in statuses else TaskStatus.PENDING
              if not statuses or statuses <= {TaskStatus.SUCCEEDED}:
                  return TaskStatus.SUCCEEDED
              if TaskStatus.FAILED in statuses:
                  return TaskStatus.FAILED
              if TaskStatus.BLOCKED in statuses:
                  return TaskStatus.BLOCKED
              if statuses <= {TaskStatus.CANCELLED, TaskStatus.SUCCEEDED}:
                  return TaskStatus.CANCELLED
              if TaskStatus.RUNNING in statuses:
                  return TaskStatus.RUNNING
              return TaskStatus.PENDING
          '''
          replace_function(
              "linktools-ai/src/linktools/ai/task/_graph.py",
              "_aggregate_graph_status",
              replacement_graph,
          )
          replace_function(
              "linktools-ai/src/linktools/ai/runtime/state/_repositories.py",
              "_graph_status",
              replacement_repo,
          )
          PY
      - name: Commit fix and remove patch workflow
        run: |
          rm .github/workflows/taskgraph-projection-status-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add linktools-ai/src/linktools/ai/task/_graph.py linktools-ai/src/linktools/ai/runtime/state/_repositories.py .github/workflows/taskgraph-projection-status-patch.yml
          git commit -m 'fix(ai-task): wait for failure dependency projection'
          git push origin HEAD:feat/ai-taskgraph-reliable-mixed-nodes
