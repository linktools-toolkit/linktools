name: ai-durable-contract-patch

on:
  push:
    branches:
      - refactor/ai-durable-contract-convergence

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(ai): apply storage topology patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ai-durable-contract-convergence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply exact durable-contract patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 occurrence, got {count}')
              return text.replace(old, new, 1)

          codec_path = Path('linktools-ai/src/linktools/ai/runtime/state/_codec.py')
          codec = codec_path.read_text(encoding='utf-8')
          codec = replace_once(codec, '    RuntimeStorageContract,\n', '', 'codec RuntimeStorageContract import')
          codec = replace_once(codec, '    RuntimeStorageResource,\n', '', 'codec RuntimeStorageResource import')
          codec = replace_once(codec, '    ("runtime_storage_contract", RuntimeStorageContract),\n', '', 'codec storage contract wire')
          codec = replace_once(codec, '    ("runtime_storage_resource", RuntimeStorageResource),\n', '', 'codec storage resource wire')
          if 'RuntimeStorageContract' in codec or 'RuntimeStorageResource' in codec:
              raise RuntimeError('codec still references removed storage topology types')
          codec_path.write_text(codec, encoding='utf-8')

          local_path = Path('linktools-ai/src/linktools/ai/runtime/_local.py')
          local = local_path.read_text(encoding='utf-8')
          local = replace_once(
              local,
              'from collections.abc import AsyncIterator, Awaitable, Callable, Collection, Mapping, Sequence\n',
              'from collections.abc import AsyncIterator, Awaitable, Callable, Mapping, Sequence\n',
              'local Collection import',
          )
          local = replace_once(local, '    RuntimeStorageContract,\n', '', 'local RuntimeStorageContract import')
          local = replace_once(
              local,
              '        storage_contract: RuntimeStorageContract | None = None,\n'
              '        storage_contract_factory: (\n'
              '            "Callable[[Collection[RuntimeDomain]], RuntimeStorageContract] | None"\n'
              '        ) = None,\n',
              '',
              'local constructor storage contract parameters',
          )
          local = replace_once(
              local,
              '        self._storage_contract = storage_contract\n'
              '        self._storage_contract_factory = storage_contract_factory\n',
              '',
              'local storage contract assignments',
          )
          for name in ('_require_storage_contract', '_validate_recovery_identity'):
              pattern = rf'^    def {name}\(.*?(?=^    (?:async )?def |^    @|^class |\Z)'
              local, count = re.subn(pattern, '', local, count=1, flags=re.MULTILINE | re.DOTALL)
              if count != 1:
                  raise RuntimeError(f'local {name}: expected 1 method, got {count}')
          local, call_count = re.subn(
              r'^\s*self\._port\._validate_recovery_identity\(execution\)\n',
              '',
              local,
              flags=re.MULTILINE,
          )
          local, own_call_count = re.subn(
              r'^\s*self\._validate_recovery_identity\(execution\)\n',
              '',
              local,
              flags=re.MULTILINE,
          )
          if call_count + own_call_count < 1:
              raise RuntimeError('local recovery identity calls were not found')
          if 'storage_contract' in local or 'RuntimeStorageContract' in local or '_validate_recovery_identity' in local:
              raise RuntimeError('local still references removed storage topology contract')
          local_path.write_text(local, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add linktools-ai/src/linktools/ai/runtime/state/_codec.py linktools-ai/src/linktools/ai/runtime/_local.py
          git diff --cached --check
          git commit -m 'refactor(ai): remove storage topology residue'
          git push origin HEAD:refactor/ai-durable-contract-convergence
