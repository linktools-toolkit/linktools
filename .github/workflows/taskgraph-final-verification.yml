name: TaskGraph final verification

on:
  push:
    branches:
      - feat/ai-taskgraph-reliable-mixed-nodes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U -r requirements.txt
      - name: Install editable
        run: python manage.py install --editable
      - name: Check linktools-ai
        run: python manage.py check linktools-ai
      - name: Build linktools-ai
        run: python manage.py build linktools-ai
      - name: Verify linktools-ai
        run: python manage.py verify linktools-ai
