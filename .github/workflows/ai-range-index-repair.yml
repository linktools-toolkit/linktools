name: AI generic range index repair

on:
  push:
    branches:
      - refactor/ai-harness-capabilities

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/ai-harness-capabilities
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Apply generic range index repair
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          def replace_between(path: Path, start: str, end: str, replacement: str) -> None:
              text = path.read_text(encoding='utf-8')
              first = text.find(start)
              if first < 0:
                  raise SystemExit(f'{path}: start marker missing: {start!r}')
              second = text.find(end, first)
              if second < 0:
                  raise SystemExit(f'{path}: end marker missing: {end!r}')
              path.write_text(text[:first] + replacement + text[second:], encoding='utf-8')

          fs_path = Path('linktools-ai/src/linktools/ai/runtime/state/_filesystem.py')
          fs = fs_path.read_text(encoding='utf-8')
          fs = fs.replace('import hashlib\nimport heapq\n', 'import hashlib\n', 1)
          old_node = '''@dataclass(frozen=True, slots=True)\nclass _RecordIndexNode:\n    token: str\n    children: tuple[str, ...]\n    key_digest: bytes | None = None\n'''
          new_node = '''@dataclass(frozen=True, slots=True)\nclass _RecordIndexNode:\n    token: str\n    key_digests: tuple[bytes, ...]\n    children: tuple[str, ...]\n'''
          if old_node not in fs:
              raise SystemExit('record index node block missing')
          fs = fs.replace(old_node, new_node, 1)
          fs_path.write_text(fs, encoding='utf-8')

          indexed_method = '''    def _list_indexed_records(\n        self,\n        query: RecordQuery,\n    ) -> tuple[StoredRecord, ...] | None:\n        if not self._record_index_complete or not _record_query_indexable(query):\n            return None\n        if query.kind is None or query.limit is None:\n            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n        selected = _record_index_select(self._root, query)\n        values: list[StoredRecord] = []\n        for sort_key, key in selected:\n            value = self._indexed_record(query.kind, key)\n            if value.sort_key != sort_key or not _matches_record(value, query):\n                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n            values.append(value)\n        return tuple(values)\n\n    def _indexed_record(self, kind: str, key: bytes) -> StoredRecord:\n        if key in self._records:\n            self._cache_hits += 1\n            value = self._records[key]\n            if not isinstance(value, StoredRecord) or value.kind != kind:\n                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n            return value\n        self._cache_misses += 1\n        key_hex = key.hex()\n        path = self._root / "records" / kind / key_hex[:2] / f"{key_hex}.json"\n        if not path.is_file():\n            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n        value = decode_record(_read_json(path))\n        if value.key_digest != key or value.kind != kind:\n            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n        self._business_files_read += 1\n        self._records[key] = value\n        return value\n\n'''
          replace_between(
              fs_path,
              '    def _list_indexed_records(\n',
              '    def get_alias(',
              indexed_method,
          )

          sync_index = '''    def _sync_record_index(\n        self,\n        previous: StoredRecord | None,\n        current: StoredRecord | None,\n    ) -> None:\n        if (\n            not self._cache.record_index_complete\n            or _RECORD_INDEX_MARKER in self.deletes\n        ):\n            return\n        previous_identity = _record_index_identity(previous)\n        current_identity = _record_index_identity(current)\n        if previous_identity == current_identity:\n            return\n        if previous_identity is not None:\n            self._remove_record_index_entry(previous_identity)\n        if current_identity is not None:\n            self._add_record_index_entry(current_identity)\n\n    def _record_index_node(\n        self,\n        kind: str,\n        scope_digest: bytes,\n        token: str,\n    ) -> _RecordIndexNode | None:\n        relative = _record_index_node_path(kind, scope_digest, token)\n        if relative in self.deletes:\n            return None\n        pending = self.writes.get(relative)\n        if pending is not None:\n            return _decode_record_index_node_bytes(pending, expected_token=token)\n        return _read_record_index_node(self._root, kind, scope_digest, token)\n\n    def _store_record_index_node(\n        self,\n        kind: str,\n        scope_digest: bytes,\n        node: _RecordIndexNode,\n    ) -> None:\n        self._write(\n            _record_index_node_path(kind, scope_digest, node.token),\n            _record_index_node_payload(node),\n        )\n\n    def _add_record_index_entry(\n        self,\n        identity: tuple[str, bytes, str, bytes],\n    ) -> None:\n        kind, scope_digest, token, key_digest = identity\n        current = self._record_index_node(kind, scope_digest, "")\n        if current is None:\n            current = _RecordIndexNode("", (), ())\n        while True:\n            if token == current.token:\n                if key_digest in current.key_digests:\n                    raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n                updated = _RecordIndexNode(\n                    current.token,\n                    tuple(sorted((*current.key_digests, key_digest))),\n                    current.children,\n                )\n                self._store_record_index_node(kind, scope_digest, updated)\n                return\n            if not token.startswith(current.token):\n                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n            child_token = _record_index_child(current, token)\n            if child_token is None:\n                leaf = _RecordIndexNode(token, (key_digest,), ())\n                self._store_record_index_node(kind, scope_digest, leaf)\n                updated = _RecordIndexNode(\n                    current.token,\n                    current.key_digests,\n                    tuple(sorted((*current.children, token))),\n                )\n                self._store_record_index_node(kind, scope_digest, updated)\n                return\n            child = self._record_index_node(kind, scope_digest, child_token)\n            if child is None:\n                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n            common = _record_index_common_prefix((token, child_token))\n            if common == child_token:\n                current = child\n                continue\n            if len(common) <= len(current.token):\n                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n            if common == token:\n                inserted = _RecordIndexNode(token, (key_digest,), (child_token,))\n                self._store_record_index_node(kind, scope_digest, inserted)\n                updated = _record_index_replace_child(current, child_token, token)\n                self._store_record_index_node(kind, scope_digest, updated)\n                return\n            leaf = _RecordIndexNode(token, (key_digest,), ())\n            branch = _RecordIndexNode(\n                common,\n                (),\n                tuple(sorted((child_token, token))),\n            )\n            self._store_record_index_node(kind, scope_digest, leaf)\n            self._store_record_index_node(kind, scope_digest, branch)\n            updated = _record_index_replace_child(current, child_token, common)\n            self._store_record_index_node(kind, scope_digest, updated)\n            return\n\n    def _remove_record_index_entry(\n        self,\n        identity: tuple[str, bytes, str, bytes],\n    ) -> None:\n        kind, scope_digest, token, key_digest = identity\n        root = self._record_index_node(kind, scope_digest, "")\n        if root is None:\n            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n        path = [root]\n        current = root\n        while current.token != token:\n            if not token.startswith(current.token):\n                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n            child_token = _record_index_child(current, token)\n            if child_token is None or not token.startswith(child_token):\n                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n            child = self._record_index_node(kind, scope_digest, child_token)\n            if child is None:\n                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n            path.append(child)\n            current = child\n        if key_digest not in current.key_digests:\n            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n        updated = _RecordIndexNode(\n            current.token,\n            tuple(key for key in current.key_digests if key != key_digest),\n            current.children,\n        )\n        if current.token == "":\n            if updated.key_digests or updated.children:\n                self._store_record_index_node(kind, scope_digest, updated)\n            else:\n                self._delete(_record_index_node_path(kind, scope_digest, ""))\n            return\n        if updated.key_digests or len(updated.children) >= 2:\n            self._store_record_index_node(kind, scope_digest, updated)\n            return\n        removed_token = current.token\n        replacement = updated.children[0] if updated.children else None\n        self._delete(_record_index_node_path(kind, scope_digest, removed_token))\n        for parent in reversed(path[:-1]):\n            children = [child for child in parent.children if child != removed_token]\n            if len(children) == len(parent.children):\n                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n            if replacement is not None:\n                children.append(replacement)\n            next_parent = _RecordIndexNode(\n                parent.token,\n                parent.key_digests,\n                tuple(sorted(children)),\n            )\n            if parent.token == "":\n                if next_parent.key_digests or next_parent.children:\n                    self._store_record_index_node(kind, scope_digest, next_parent)\n                else:\n                    self._delete(_record_index_node_path(kind, scope_digest, ""))\n                return\n            if next_parent.key_digests or len(next_parent.children) >= 2:\n                self._store_record_index_node(kind, scope_digest, next_parent)\n                return\n            removed_token = parent.token\n            replacement = (\n                next_parent.children[0] if next_parent.children else None\n            )\n            self._delete(_record_index_node_path(kind, scope_digest, removed_token))\n\n'''
          replace_between(
              fs_path,
              '    def _sync_record_index(\n',
              '    def _write(self, relative: str | Path, value: Mapping[str, object] | bytes) -> None:\n',
              sync_index,
          )

          helper_block = '''_RECORD_INDEX_MARKER = "record-index/complete"\n_RECORD_INDEX_VERSION = "3"\n_RECORD_INDEX_NODE_VERSION = 2\n\n\ndef _record_index_marker_valid(root: Path) -> bool:\n    marker = root / _RECORD_INDEX_MARKER\n    if not marker.exists():\n        return False\n    try:\n        value = marker.read_text(encoding="utf-8")\n    except OSError as error:\n        raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR) from error\n    if value == _RECORD_INDEX_VERSION:\n        return True\n    if value in {"1", "2"}:\n        return False\n    raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n\n\ndef _record_query_indexable(query: RecordQuery) -> bool:\n    return (\n        query.kind is not None\n        and query.scope_digest is not None\n        and query.partition_digest is None\n        and query.parent_digest is None\n        and query.states is None\n        and query.limit is not None\n    )\n\n\ndef _record_index_identity(\n    record: StoredRecord | None,\n) -> tuple[str, bytes, str, bytes] | None:\n    if record is None or record.scope_digest is None:\n        return None\n    validate_record_identity(record)\n    return record.kind, record.scope_digest, record.sort_key, record.key_digest\n\n\ndef _record_index_node_path(\n    kind: str,\n    scope_digest: bytes,\n    token: str,\n) -> str:\n    digest = hashlib.sha256(token.encode("ascii")).hexdigest()\n    return (\n        f"record-index/{kind}/{scope_digest.hex()}/nodes/"\n        f"{digest[:2]}/{digest}.json"\n    )\n\n\ndef _record_index_node_payload(node: _RecordIndexNode) -> Mapping[str, object]:\n    return {\n        "version": _RECORD_INDEX_NODE_VERSION,\n        "token": node.token,\n        "keys": [key.hex() for key in node.key_digests],\n        "children": list(node.children),\n    }\n\n\ndef _decode_record_index_node(\n    raw: Mapping[str, object],\n    *,\n    expected_token: str,\n) -> _RecordIndexNode:\n    _require_layout_keys(raw, frozenset({"version", "token", "keys", "children"}))\n    token = raw["token"]\n    keys = raw["keys"]\n    children = raw["children"]\n    if (\n        raw["version"] != _RECORD_INDEX_NODE_VERSION\n        or token != expected_token\n        or not isinstance(token, str)\n        or len(token) > 128\n        or not token.isascii()\n        or not isinstance(keys, list)\n        or not isinstance(children, list)\n        or any(not isinstance(child, str) for child in children)\n        or children != sorted(set(children))\n    ):\n        raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n    key_digests = tuple(_layout_digest(key) for key in keys)\n    if key_digests != tuple(sorted(set(key_digests))):\n        raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n    next_characters: set[str] = set()\n    for child in children:\n        if (\n            len(child) <= len(token)\n            or len(child) > 128\n            or not child.isascii()\n            or not child.startswith(token)\n        ):\n            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n        next_character = child[len(token)]\n        if next_character in next_characters:\n            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n        next_characters.add(next_character)\n    if token and not key_digests and len(children) < 2:\n        raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n    if not token and not key_digests and not children:\n        raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n    return _RecordIndexNode(token, key_digests, tuple(children))\n\n\ndef _decode_record_index_node_bytes(\n    value: bytes,\n    *,\n    expected_token: str,\n) -> _RecordIndexNode:\n    try:\n        raw = json.loads(value.decode("utf-8"))\n    except (UnicodeDecodeError, json.JSONDecodeError) as error:\n        raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR) from error\n    if not isinstance(raw, Mapping):\n        raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n    return _decode_record_index_node(raw, expected_token=expected_token)\n\n\ndef _read_record_index_node_path(\n    path: Path,\n    *,\n    expected_token: str,\n) -> _RecordIndexNode:\n    try:\n        raw = _read_json(path)\n    except (OSError, TypeError, ValueError) as error:\n        raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR) from error\n    return _decode_record_index_node(raw, expected_token=expected_token)\n\n\ndef _read_record_index_node(\n    root: Path,\n    kind: str,\n    scope_digest: bytes,\n    token: str,\n) -> _RecordIndexNode | None:\n    path = root / _record_index_node_path(kind, scope_digest, token)\n    if not path.exists():\n        return None\n    return _read_record_index_node_path(path, expected_token=token)\n\n\ndef _record_index_child(node: _RecordIndexNode, token: str) -> str | None:\n    if len(token) <= len(node.token):\n        return None\n    target = token[len(node.token)]\n    matches = [\n        child\n        for child in node.children\n        if child[len(node.token)] == target\n    ]\n    if len(matches) > 1:\n        raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n    return None if not matches else matches[0]\n\n\ndef _record_index_replace_child(\n    node: _RecordIndexNode,\n    previous: str,\n    current: str,\n) -> _RecordIndexNode:\n    children = [child for child in node.children if child != previous]\n    if len(children) == len(node.children):\n        raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n    children.append(current)\n    return _RecordIndexNode(\n        node.token,\n        node.key_digests,\n        tuple(sorted(children)),\n    )\n\n\ndef _record_index_common_prefix(values: Sequence[str]) -> str:\n    if not values:\n        raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n    first = min(values)\n    last = max(values)\n    limit = min(len(first), len(last))\n    index = 0\n    while index < limit and first[index] == last[index]:\n        index += 1\n    return first[:index]\n\n\ndef _record_index_select(\n    root: Path,\n    query: RecordQuery,\n) -> tuple[tuple[str, bytes], ...]:\n    if query.kind is None or query.scope_digest is None or query.limit is None:\n        raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n    prefix = "" if query.sort_key_prefix is None else query.sort_key_prefix\n    node = _read_record_index_node(root, query.kind, query.scope_digest, "")\n    if node is None:\n        return ()\n    while not node.token.startswith(prefix):\n        if not prefix.startswith(node.token):\n            return ()\n        child_token = _record_index_child(node, prefix)\n        if child_token is None or not (\n            prefix.startswith(child_token) or child_token.startswith(prefix)\n        ):\n            return ()\n        child = _read_record_index_node(\n            root, query.kind, query.scope_digest, child_token\n        )\n        if child is None:\n            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n        node = child\n\n    selected: list[tuple[str, bytes]] = []\n    after_sort_key = query.after_sort_key\n    after_key_digest = query.after_key_digest\n\n    def visit(current: _RecordIndexNode) -> None:\n        if len(selected) >= query.limit:\n            return\n        for key_digest in current.key_digests:\n            if after_sort_key is None or (\n                current.token,\n                key_digest,\n            ) > (after_sort_key, after_key_digest):\n                selected.append((current.token, key_digest))\n                if len(selected) >= query.limit:\n                    return\n        for child_token in current.children:\n            if (\n                after_sort_key is not None\n                and child_token < after_sort_key\n                and not after_sort_key.startswith(child_token)\n            ):\n                continue\n            child = _read_record_index_node(\n                root, query.kind, query.scope_digest, child_token\n            )\n            if child is None:\n                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n            visit(child)\n            if len(selected) >= query.limit:\n                return\n\n    visit(node)\n    return tuple(selected)\n\n\ndef _build_record_index_nodes(\n    records: Sequence[StoredRecord],\n) -> dict[str, _RecordIndexNode]:\n    groups: dict[tuple[str, bytes], dict[str, set[bytes]]] = {}\n    for record in records:\n        identity = _record_index_identity(record)\n        if identity is None:\n            continue\n        kind, scope_digest, token, key_digest = identity\n        by_token = groups.setdefault((kind, scope_digest), {})\n        by_token.setdefault(token, set()).add(key_digest)\n\n    result: dict[str, _RecordIndexNode] = {}\n    for (kind, scope_digest), by_token in groups.items():\n        entries = tuple(\n            (token, tuple(sorted(keys)))\n            for token, keys in sorted(by_token.items())\n        )\n\n        def build(\n            prefix: str,\n            values: Sequence[tuple[str, tuple[bytes, ...]]],\n        ) -> str:\n            exact = next((keys for token, keys in values if token == prefix), ())\n            descendants: dict[str, list[tuple[str, tuple[bytes, ...]]]] = {}\n            for token, keys in values:\n                if token == prefix:\n                    continue\n                if not token.startswith(prefix) or len(token) <= len(prefix):\n                    raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n                descendants.setdefault(token[len(prefix)], []).append((token, keys))\n            children: list[str] = []\n            for child_values in descendants.values():\n                child_prefix = _record_index_common_prefix(\n                    tuple(token for token, _keys in child_values)\n                )\n                build(child_prefix, tuple(child_values))\n                children.append(child_prefix)\n            node = _RecordIndexNode(prefix, tuple(exact), tuple(sorted(children)))\n            relative = _record_index_node_path(kind, scope_digest, prefix)\n            if relative in result and result[relative] != node:\n                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n            result[relative] = node\n            return prefix\n\n        build("", entries)\n    return result\n\n\ndef _sync_record_index_tree(root: Path) -> None:\n    if not root.exists():\n        return\n    for directory, _children, _files in os.walk(root, topdown=False):\n        sync_directory(Path(directory))\n\n\n'''
          replace_between(
              fs_path,
              '_RECORD_INDEX_MARKER = "record-index/complete"\n',
              'def _record_path(record: StoredRecord) -> str:\n',
              helper_block,
          )

          # The existing rebuild and integrity paths already consume the generic builder.
          fs = fs_path.read_text(encoding='utf-8')
          if 'query.kind == "memory"' in fs or '_record_index_node("memory"' in fs:
              raise SystemExit('filesystem range index still contains Memory-specific ownership')
          fs_path.write_text(fs, encoding='utf-8')

          sql_path = Path('linktools-ai/src/linktools/ai/runtime/state/_sql.py')
          sql = sql_path.read_text(encoding='utf-8')
          old_prefix = '''        if query.sort_key_prefix is not None:\n            conditions.append(\n                table.c.sort_key.startswith(query.sort_key_prefix, autoescape=True)\n            )\n'''
          new_prefix = '''        if query.sort_key_prefix is not None:\n            conditions.append(table.c.sort_key >= query.sort_key_prefix)\n            prefix_end = _sort_key_prefix_upper_bound(query.sort_key_prefix)\n            if prefix_end is not None:\n                conditions.append(table.c.sort_key < prefix_end)\n'''
          if old_prefix not in sql:
              raise SystemExit('SQL sort-key prefix block missing')
          sql = sql.replace(old_prefix, new_prefix, 1)
          helper_marker = '\ndef _hex(value: bytes) -> str:\n'
          if helper_marker not in sql:
              raise SystemExit('SQL helper insertion marker missing')
          sql = sql.replace(
              helper_marker,
              '''\ndef _sort_key_prefix_upper_bound(prefix: str) -> str | None:\n    for index in range(len(prefix) - 1, -1, -1):\n        value = ord(prefix[index])\n        if value < 127:\n            return prefix[:index] + chr(value + 1)\n    return None\n\n\ndef _hex(value: bytes) -> str:\n''',
              1,
          )
          sql_path.write_text(sql, encoding='utf-8')

          dialect_path = Path('linktools-ai/src/linktools/ai/storage/_dialects.py')
          dialect = dialect_path.read_text(encoding='utf-8')
          start = dialect.index('def sql_sort_key() -> "String":\n')
          end = dialect.index('\ndef sql_blob()', start)
          replacement = '''def sql_sort_key() -> "String":\n    from sqlalchemy import String\n    from sqlalchemy.dialects import mysql\n\n    return (\n        String(128)\n        .with_variant(String(128, collation="BINARY"), "sqlite")\n        .with_variant(String(128, collation="C"), "postgresql")\n        .with_variant(\n            mysql.VARCHAR(128, charset="utf8mb4", collation="utf8mb4_bin"),\n            "mysql",\n        )\n    )\n\n'''
          dialect = dialect[:start] + replacement + dialect[end + 1:]
          dialect_path.write_text(dialect, encoding='utf-8')

          test_path = Path('tests/ai/test_state_range_index.py')
          test_path.write_text('''#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\n"""Backend-neutral bounded range-index contracts."""\n\nimport hashlib\nfrom pathlib import Path\n\nimport pytest\nfrom sqlalchemy.dialects import mysql, postgresql, sqlite\nfrom sqlalchemy.ext.asyncio import create_async_engine\nfrom sqlalchemy.schema import CreateTable\n\nfrom linktools.ai.migrate import provision_database\nfrom linktools.ai.runtime.state._filesystem import FilesystemStateStore\nfrom linktools.ai.runtime.state._plan import RuntimeDomain\nfrom linktools.ai.runtime.state._schema import build_runtime_sql_metadata\nfrom linktools.ai.runtime.state._sql import SqlStateStore\nfrom linktools.ai.runtime.state._store import RecordQuery, StoredRecord\n\npytestmark = pytest.mark.asyncio\n_SCOPE = b"s" * 32\n_PARTITION = b"p" * 32\n\n\ndef _record(sort_key: str) -> StoredRecord:\n    return StoredRecord(\n        hashlib.sha256(sort_key.encode("ascii")).digest(),\n        _PARTITION,\n        _SCOPE,\n        None,\n        "probe",\n        sort_key,\n        None,\n        0,\n        None,\n        0,\n        None,\n        {},\n    )\n\n\nasync def _seed(store, values: tuple[StoredRecord, ...]) -> None:\n    await store.mutate(lambda transaction: transaction.insert_records(values))\n\n\nasync def _list_prefix(store, prefix: str | None, *, limit: int = 10):\n    return await store.read(\n        lambda transaction: transaction.list_records(\n            RecordQuery(\n                scope_digest=_SCOPE,\n                kind="probe",\n                sort_key_prefix=prefix,\n                limit=limit,\n            )\n        )\n    )\n\n\nasync def test_filesystem_range_index_is_generic_and_does_not_enumerate_index(\n    tmp_path: Path,\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    root = tmp_path / "generic-range"\n    store = FilesystemStateStore(\n        root,\n        namespace="generic-range",\n        tenant_id="tenant",\n        runtime_domain=RuntimeDomain.EXECUTION.value,\n    )\n    await store.initialize()\n    await _seed(\n        store,\n        tuple(_record(value) for value in ("-first", "A-001", "A-002", "a-001")),\n    )\n    await store.close()\n\n    reopened = FilesystemStateStore(\n        root,\n        namespace="generic-range",\n        tenant_id="tenant",\n        runtime_domain=RuntimeDomain.EXECUTION.value,\n    )\n    await reopened.initialize()\n    original_iterdir = Path.iterdir\n\n    def guarded_iterdir(path: Path):\n        if "record-index" in path.parts:\n            raise AssertionError("bounded range queries must not enumerate the index")\n        return original_iterdir(path)\n\n    monkeypatch.setattr(Path, "iterdir", guarded_iterdir)\n    values = await _list_prefix(reopened, "A")\n    assert [value.sort_key for value in values] == ["A-001", "A-002"]\n    first = await _list_prefix(reopened, None, limit=1)\n    assert [value.sort_key for value in first] == ["-first"]\n    await reopened.close()\n\n\nasync def test_filesystem_range_index_does_not_write_one_node_per_character(\n    tmp_path: Path,\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    store = FilesystemStateStore(\n        tmp_path / "compressed-range",\n        namespace="compressed-range",\n        tenant_id="tenant",\n        runtime_domain=RuntimeDomain.EXECUTION.value,\n    )\n    await store.initialize()\n    commits: list[tuple[tuple[str, ...], tuple[str, ...]]] = []\n    original_commit = store._commit_sync\n\n    def capture_commit(writes, deletes, base, target):\n        commits.append((tuple(writes), tuple(deletes)))\n        return original_commit(writes, deletes, base, target)\n\n    monkeypatch.setattr(store, "_commit_sync", capture_commit)\n    await _seed(store, (_record("x" * 128),))\n    assert len(commits) == 1\n    index_writes = [\n        path for path in commits[0][0] if path.startswith("record-index/")\n    ]\n    assert len(index_writes) == 2\n    await store.close()\n\n\nasync def test_sql_prefix_is_case_sensitive_and_matches_filesystem(\n    tmp_path: Path,\n) -> None:\n    path = tmp_path / "range.db"\n    engine = create_async_engine(f"sqlite+aiosqlite:///{path}")\n    await provision_database(engine)\n    store = SqlStateStore(engine)\n    await store.initialize()\n    try:\n        await _seed(\n            store,\n            tuple(_record(value) for value in ("A-one", "A-two", "a-one")),\n        )\n        values = await _list_prefix(store, "A")\n        assert [value.sort_key for value in values] == ["A-one", "A-two"]\n    finally:\n        await store.close()\n        await engine.dispose()\n\n\nasync def test_sql_sort_key_collation_is_explicit_for_supported_backends() -> None:\n    metadata = build_runtime_sql_metadata(frozenset({RuntimeDomain.EXECUTION}))\n    table = metadata.tables["ai_state_records"]\n    postgres_ddl = str(CreateTable(table).compile(dialect=postgresql.dialect()))\n    sqlite_ddl = str(CreateTable(table).compile(dialect=sqlite.dialect()))\n    mysql_ddl = str(CreateTable(table).compile(dialect=mysql.dialect()))\n    assert 'sort_key VARCHAR(128) COLLATE "C"' in postgres_ddl\n    assert 'sort_key VARCHAR(128) COLLATE "BINARY"' in sqlite_ddl\n    assert "sort_key VARCHAR(128) COLLATE utf8mb4_bin" in mysql_ddl\n''', encoding='utf-8')

          for path in (fs_path, sql_path, dialect_path, test_path):
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY
      - name: Install project
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Format changed Python
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACM -- '*.py')
          if ((${#files[@]})); then
            python -m ruff format "${files[@]}"
          fi
      - name: Run focused range regressions
        shell: bash
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/ai/test_state_range_index.py \
            tests/ai/test_memory_bounded_listing.py \
            tests/ai/test_runtime_storage_contracts.py \
            tests/ai/test_persistence_compatibility.py
      - name: Run package gate
        shell: bash
        run: |
          python manage.py check linktools-ai
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ai-range-index-repair.yml
          git add -A
          git commit -m 'fix(ai): generalize bounded state range index'
          git push origin HEAD:refactor/ai-harness-capabilities
