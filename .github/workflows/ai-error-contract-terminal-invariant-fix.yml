name: Apply AI terminal invariant closure

on:
  push:
    branches:
      - fix/ai-error-contract-closure

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-error-contract-closure

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact terminal invariant repair
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              target.write_text(text.replace(old, new))

          replace_once(
              "linktools-ai/src/linktools/ai/runtime/_execution.py",
              '''    if execution.status is ExecutionStatus.CANCELLED:\n        if execution.error_code not in {None, ErrorCode.EXECUTION_CANCELLED.value}:\n            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n        return ErrorCode.EXECUTION_CANCELLED.value, details\n''',
              '''    if execution.status is ExecutionStatus.CANCELLED:\n        if execution.error_code != ErrorCode.EXECUTION_CANCELLED.value:\n            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n        return execution.error_code, details\n''',
          )

          replace_once(
              "linktools-ai/src/linktools/ai/runtime/service_api.py",
              '''        if self.status is ExecutionStatus.CANCELLED:\n            if self.error_code != ErrorCode.EXECUTION_CANCELLED.value:\n                raise ValueError("cancelled execution result requires EXECUTION_CANCELLED")\n            return\n        if self.status is ExecutionStatus.FAILED:\n            if self.error_code is None:\n                raise ValueError("failed execution result requires an error code")\n            try:\n                code = ErrorCode(self.error_code)\n            except ValueError as error:\n                raise ValueError("failed execution result contains an unknown error code") from error\n            if code is ErrorCode.EXECUTION_CANCELLED:\n                raise ValueError("failed execution result cannot carry EXECUTION_CANCELLED")\n            return\n''',
              '''        if self.status is ExecutionStatus.CANCELLED:\n            if self.error_code != ErrorCode.EXECUTION_CANCELLED.value:\n                raise ValueError("cancelled execution result requires EXECUTION_CANCELLED")\n            if _has_output_contract(self):\n                raise ValueError("cancelled execution result cannot carry output")\n            return\n        if self.status is ExecutionStatus.FAILED:\n            if self.error_code is None:\n                raise ValueError("failed execution result requires an error code")\n            try:\n                code = ErrorCode(self.error_code)\n            except ValueError as error:\n                raise ValueError("failed execution result contains an unknown error code") from error\n            if code is ErrorCode.EXECUTION_CANCELLED:\n                raise ValueError("failed execution result cannot carry EXECUTION_CANCELLED")\n            if _has_output_contract(self):\n                raise ValueError("failed execution result cannot carry output")\n            return\n''',
          )
          replace_once(
              "linktools-ai/src/linktools/ai/runtime/service_api.py",
              '''\n\n@dataclass(frozen=True, slots=True)\nclass ExecutionTraceItem:\n''',
              '''\n\ndef _has_output_contract(result: ExecutionResult) -> bool:\n    return (\n        result.output is not None\n        or result.output_schema_id is not None\n        or result.output_schema_revision is not None\n        or result.output_schema_fingerprint is not None\n    )\n\n\n@dataclass(frozen=True, slots=True)\nclass ExecutionTraceItem:\n''',
          )

          replace_once(
              "tests/ai/test_error_contract.py",
              '''from linktools.ai.runtime import ExecutionResult\nfrom linktools.ai.runtime._evaluation import _stable_error\n''',
              '''from linktools.ai.runtime import ExecutionResult\nfrom linktools.ai.runtime._evaluation import _stable_error\nfrom linktools.ai.runtime._execution import _terminal_error\n''',
          )
          replace_once(
              "tests/ai/test_error_contract.py",
              '''    with pytest.raises(ValueError):\n        ExecutionResult(\n            "unknown",\n            ExecutionStatus.FAILED,\n            None,\n            None,\n            None,\n            None,\n            usage,\n            "NOT_A_REAL_ERROR",\n        )\n\n\ndef test_ai_error_rejects_non_json_safe_details() -> None:\n''',
              '''    with pytest.raises(ValueError):\n        ExecutionResult(\n            "unknown",\n            ExecutionStatus.FAILED,\n            None,\n            None,\n            None,\n            None,\n            usage,\n            "NOT_A_REAL_ERROR",\n        )\n    with pytest.raises(ValueError):\n        ExecutionResult(\n            "failed-with-output",\n            ExecutionStatus.FAILED,\n            {"unexpected": True},\n            None,\n            None,\n            None,\n            usage,\n            ErrorCode.INTERNAL_ERROR.value,\n        )\n    with pytest.raises(ValueError):\n        ExecutionResult(\n            "cancelled-with-schema",\n            ExecutionStatus.CANCELLED,\n            None,\n            "unexpected-schema",\n            None,\n            None,\n            usage,\n            ErrorCode.EXECUTION_CANCELLED.value,\n        )\n\n\ndef test_persisted_cancelled_execution_requires_explicit_cancel_code() -> None:\n    class PersistedExecution:\n        status = ExecutionStatus.CANCELLED\n        error_code = None\n        safe_error_details: dict[str, object] = {}\n\n    with pytest.raises(AIError) as error:\n        _terminal_error(PersistedExecution())  # type: ignore[arg-type]\n    assert error.value.code is ErrorCode.STORAGE_INTEGRITY_ERROR\n\n\ndef test_ai_error_rejects_non_json_safe_details() -> None:\n''',
          )
          PY

      - name: Install focused verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            filelock 'pydantic-ai-slim[mcp,openai,temporal]>=2.27.0,<3.0.0' \
            'pydantic-ai-harness[skills,dynamic-workflow]>=0.13.0' \
            'PyYAML>=6,<7' pytest pytest-asyncio 'sqlalchemy[asyncio]==2.0.51' \
            'aiosqlite==0.22.1' rich requests packaging

      - name: Verify terminal invariant regression
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: |
          python -m compileall -q linktools-ai/src/linktools/ai
          python -m pytest -q tests/ai/test_error_contract.py

      - name: Commit repair and remove one-shot workflow
        run: |
          rm .github/workflows/ai-error-contract-terminal-invariant-fix.yml
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add -A -- \
            linktools-ai/src/linktools/ai/runtime/_execution.py \
            linktools-ai/src/linktools/ai/runtime/service_api.py \
            tests/ai/test_error_contract.py \
            .github/workflows/ai-error-contract-terminal-invariant-fix.yml
          git diff --cached --check
          git commit -m 'fix(ai): enforce terminal error invariants'
          git push origin HEAD:fix/ai-error-contract-closure
