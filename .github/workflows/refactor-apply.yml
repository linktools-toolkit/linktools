name: Apply state refactor batch

on:
  push:
    branches:
      - refactor/ai-split-large-modules

permissions:
  contents: write

concurrency:
  group: state-refactor-apply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/ai-split-large-modules
      - name: Apply verified state refactor
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/refactor_state_batch.patch.gz.b64 > /tmp/refactor_state_apply.py.gz
          gzip -dc /tmp/refactor_state_apply.py.gz > /tmp/refactor_state_apply.py
          python /tmp/refactor_state_apply.py
          python -m compileall -q linktools-ai/src/linktools/ai/runtime/state tests/ai
          git diff --check
          git rm .github/refactor_state_batch.patch.gz.b64
          git rm .github/workflows/refactor-apply.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(ai): split state storage owners"
          git push origin HEAD:refactor/ai-split-large-modules
