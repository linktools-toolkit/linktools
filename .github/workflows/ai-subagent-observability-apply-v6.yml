name: Apply subagent observability implementation v6

on:
  push:
    branches:
      - feat/ai-subagent-observability
    paths:
      - .github/workflows/ai-subagent-observability-apply-v6.yml

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ai-subagent-observability
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Apply implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path(".github/workflows/ai-subagent-observability-apply-v4.yml").read_text()
          block = source.split("          python - <<'PY'\n", 1)[1].split("\n          PY\n", 1)[0]
          exec(compile(textwrap.dedent(block), "subagent-observability-apply-v4", "exec"))

          execution_path = Path("linktools-ai/src/linktools/ai/runtime/_execution.py")
          execution = execution_path.read_text()
          old = "            view = ExecutionView(execution.execution_id, execution.status)\n"
          if execution.count(old) != 1:
              raise RuntimeError(f"expected one legacy wait ExecutionView projection, got {execution.count(old)}")
          execution_path.write_text(execution.replace(old, "            view = _execution_view(execution)\n", 1))

          api_path = Path("linktools-ai/src/linktools/ai/runtime/service_api.py")
          api = api_path.read_text()
          old_tree = textwrap.dedent('''\
          @dataclass(frozen=True, slots=True)
          class ExecutionTreeEvent:
              execution: ExecutionView
              depth: int
              event: ExecutionStreamEvent

              def __post_init__(self) -> None:
                  if not isinstance(self.execution, ExecutionView):
                      raise TypeError("execution tree event requires an execution view")
                  if isinstance(self.depth, bool) or not isinstance(self.depth, int) or self.depth < 0:
                      raise ValueError("execution tree event depth must be non-negative")
                  if not isinstance(self.event, ExecutionStreamEvent):
                      raise TypeError("execution tree event requires an execution event")
                  if self.execution.execution_id != self.event.execution_id:
                      raise ValueError("execution tree event identity does not match execution")
          ''').strip("\n")
          new_tree = textwrap.dedent('''\
          @dataclass(frozen=True, slots=True)
          class ExecutionTreeEvent:
              execution_id: str
              agent_id: str
              lineage_kind: ExecutionLineageKind
              parent_execution_id: str | None
              root_execution_id: str
              parent_invocation_id: str | None
              depth: int
              event: ExecutionStreamEvent

              def __post_init__(self) -> None:
                  if not all(
                      isinstance(value, str) and value
                      for value in (self.execution_id, self.agent_id, self.root_execution_id)
                  ):
                      raise ValueError("execution tree event identity is invalid")
                  if not isinstance(self.lineage_kind, ExecutionLineageKind):
                      raise TypeError("execution tree event lineage kind is invalid")
                  if isinstance(self.depth, bool) or not isinstance(self.depth, int) or self.depth < 0:
                      raise ValueError("execution tree event depth must be non-negative")
                  if not isinstance(self.event, ExecutionStreamEvent):
                      raise TypeError("execution tree event requires an execution event")
                  if self.execution_id != self.event.execution_id:
                      raise ValueError("execution tree event identity does not match execution")
                  if self.depth == 0:
                      if (
                          self.parent_execution_id is not None
                          or self.parent_invocation_id is not None
                          or self.root_execution_id != self.execution_id
                      ):
                          raise ValueError("root execution tree event lineage is invalid")
                  elif (
                      self.lineage_kind is not ExecutionLineageKind.SUBAGENT
                      or not self.parent_execution_id
                      or not self.parent_invocation_id
                  ):
                      raise ValueError("child execution tree event lineage is invalid")
          ''').strip("\n")
          if api.count(old_tree) != 1:
              raise RuntimeError(f"expected one ExecutionTreeEvent contract, got {api.count(old_tree)}")
          api_path.write_text(api.replace(old_tree, new_tree, 1))

          tree_path = Path("linktools-ai/src/linktools/ai/runtime/_execution_tree.py")
          tree_path.write_text(textwrap.dedent('''\
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          """Derived live event projection over one durable execution tree."""

          import asyncio
          from collections.abc import AsyncIterator, Mapping
          from dataclasses import dataclass
          from typing import Protocol

          from ..core import ExecutionLineageKind, Principal
          from ..errors import AIError, ErrorCode
          from .service_api import ExecutionStreamEvent, ExecutionTreeEvent, ExecutionView

          _MAX_TREE_DEPTH = 8


          class _ExecutionTreeReader(Protocol):
              async def inspect(
                  self,
                  execution_id: str,
                  *,
                  principal: Principal,
              ) -> ExecutionView: ...

              async def list_children(
                  self,
                  execution_id: str,
                  *,
                  principal: Principal,
              ) -> tuple[ExecutionView, ...]: ...


          class _ExecutionEventStreamer(Protocol):
              def stream(
                  self,
                  execution_id: str,
                  *,
                  principal: Principal,
                  after_sequence: int = 0,
              ) -> AsyncIterator[ExecutionStreamEvent]: ...


          class _ExecutionTreeSubscription:
              def __init__(
                  self,
                  owner: "ExecutionTreeBroker",
                  root_execution_id: str,
              ) -> None:
                  self._owner = owner
                  self._root_execution_id = root_execution_id
                  self._pending: set[str] = set()
                  self._event = asyncio.Event()
                  self._closed = False

              def publish(self, child_execution_id: str) -> None:
                  if self._closed:
                      return
                  self._pending.add(child_execution_id)
                  self._event.set()

              def drain(self) -> tuple[str, ...]:
                  values = tuple(sorted(self._pending))
                  self._pending.clear()
                  self._event.clear()
                  if self._pending:
                      self._event.set()
                  return values

              async def wait(self) -> tuple[str, ...]:
                  while not self._pending:
                      if self._closed:
                          return ()
                      self._event.clear()
                      if self._pending:
                          break
                      await self._event.wait()
                  return self.drain()

              async def close(self) -> None:
                  if self._closed:
                      return
                  self._closed = True
                  self._owner._remove(self._root_execution_id, self)
                  self._event.set()


          class ExecutionTreeBroker:
              """Notify active tree readers about newly established children."""

              def __init__(self) -> None:
                  self._subscriptions: dict[str, set[_ExecutionTreeSubscription]] = {}

              def subscribe(self, root_execution_id: str) -> _ExecutionTreeSubscription:
                  subscription = _ExecutionTreeSubscription(self, root_execution_id)
                  self._subscriptions.setdefault(root_execution_id, set()).add(subscription)
                  return subscription

              def publish(self, root_execution_id: str, child_execution_id: str) -> None:
                  for subscription in tuple(
                      self._subscriptions.get(root_execution_id, ())
                  ):
                      subscription.publish(child_execution_id)

              def _remove(
                  self,
                  root_execution_id: str,
                  subscription: _ExecutionTreeSubscription,
              ) -> None:
                  values = self._subscriptions.get(root_execution_id)
                  if values is None:
                      return
                  values.discard(subscription)
                  if not values:
                      self._subscriptions.pop(root_execution_id, None)


          @dataclass(frozen=True, slots=True)
          class _EventItem:
              view: ExecutionView
              event: ExecutionStreamEvent


          @dataclass(frozen=True, slots=True)
          class _DoneItem:
              execution_id: str


          @dataclass(frozen=True, slots=True)
          class _ErrorItem:
              error: BaseException


          @dataclass(frozen=True, slots=True)
          class _ChildItem:
              execution_id: str


          _TreeItem = _EventItem | _DoneItem | _ErrorItem | _ChildItem


          class ExecutionTreeStreamer:
              """Merge per-execution streams without creating a durable tree log."""

              def __init__(
                  self,
                  executions: _ExecutionTreeReader,
                  events: _ExecutionEventStreamer,
                  broker: ExecutionTreeBroker,
              ) -> None:
                  self._executions = executions
                  self._events = events
                  self._broker = broker

              def stream(
                  self,
                  execution_id: str,
                  *,
                  principal: Principal,
                  after_sequences: Mapping[str, int] | None = None,
              ) -> AsyncIterator[ExecutionTreeEvent]:
                  return self._stream(
                      execution_id,
                      principal=principal,
                      after_sequences=_normalize_after_sequences(after_sequences),
                  )

              async def _stream(
                  self,
                  execution_id: str,
                  *,
                  principal: Principal,
                  after_sequences: Mapping[str, int],
              ) -> AsyncIterator[ExecutionTreeEvent]:
                  subscription = self._broker.subscribe(execution_id)
                  queue: asyncio.Queue[_TreeItem] = asyncio.Queue()
                  views: dict[str, ExecutionView] = {}
                  depths: dict[str, int] = {}
                  pumps: dict[str, asyncio.Task[None]] = {}
                  completed: set[str] = set()

                  async def pump(view: ExecutionView) -> None:
                      try:
                          async for event in self._events.stream(
                              view.execution_id,
                              principal=principal,
                              after_sequence=after_sequences.get(view.execution_id, 0),
                          ):
                              await queue.put(_EventItem(view, event))
                      except asyncio.CancelledError:
                          raise
                      except BaseException as error:  # noqa: BLE001
                          await queue.put(_ErrorItem(error))
                      finally:
                          await queue.put(_DoneItem(view.execution_id))

                  async def pump_children() -> None:
                      while True:
                          child_ids = await subscription.wait()
                          if not child_ids:
                              return
                          for child_id in child_ids:
                              await queue.put(_ChildItem(child_id))

                  def start(view: ExecutionView, depth: int) -> bool:
                      current = views.get(view.execution_id)
                      if current is not None:
                          if (
                              not _same_lineage(current, view)
                              or depths[view.execution_id] != depth
                          ):
                              raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)
                          return False
                      views[view.execution_id] = view
                      depths[view.execution_id] = depth
                      pumps[view.execution_id] = asyncio.create_task(
                          pump(view),
                          name=f"execution-tree-stream-{view.execution_id}",
                      )
                      return True

                  async def discover(
                      view: ExecutionView,
                      depth: int,
                      path: frozenset[str],
                  ) -> bool:
                      if depth > _MAX_TREE_DEPTH or view.execution_id in path:
                          raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)
                      if depth == 0:
                          if (
                              view.execution_id != execution_id
                              or view.parent_execution_id is not None
                              or view.parent_invocation_id is not None
                              or view.root_execution_id != execution_id
                              or view.lineage_kind is ExecutionLineageKind.SUBAGENT
                          ):
                              raise AIError(ErrorCode.REQUEST_FIELD_INVALID)
                      elif (
                          view.lineage_kind is not ExecutionLineageKind.SUBAGENT
                          or view.root_execution_id != execution_id
                          or not view.parent_execution_id
                          or not view.parent_invocation_id
                      ):
                          raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)
                      added = start(view, depth)
                      next_path = path | {view.execution_id}
                      children = await self._executions.list_children(
                          view.execution_id,
                          principal=principal,
                      )
                      for child in children:
                          if child.parent_execution_id != view.execution_id:
                              raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)
                          added = await discover(
                              child,
                              depth + 1,
                              next_path,
                          ) or added
                      return added

                  async def discover_child(child_id: str) -> bool:
                      child = await self._executions.inspect(
                          child_id,
                          principal=principal,
                      )
                      parent_id = child.parent_execution_id
                      parent = views.get(parent_id) if parent_id is not None else None
                      if parent is None:
                          fresh_root = await self._executions.inspect(
                              execution_id,
                              principal=principal,
                          )
                          await discover(fresh_root, 0, frozenset())
                          parent = views.get(parent_id) if parent_id is not None else None
                      if parent is None:
                          raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)
                      return await discover(
                          child,
                          depths[parent.execution_id] + 1,
                          frozenset(),
                      )

                  child_pump: asyncio.Task[None] | None = None
                  try:
                      root = await self._executions.inspect(
                          execution_id,
                          principal=principal,
                      )
                      await discover(root, 0, frozenset())
                      if set(after_sequences) - set(views):
                          raise AIError(ErrorCode.REQUEST_FIELD_INVALID)
                      child_pump = asyncio.create_task(
                          pump_children(),
                          name=f"execution-tree-children-{execution_id}",
                      )

                      while True:
                          item = await queue.get()
                          try:
                              if isinstance(item, _EventItem):
                                  view = item.view
                                  yield ExecutionTreeEvent(
                                      view.execution_id,
                                      view.agent_id,
                                      view.lineage_kind,
                                      view.parent_execution_id,
                                      view.root_execution_id,
                                      view.parent_invocation_id,
                                      depths[view.execution_id],
                                      item.event,
                                  )
                              elif isinstance(item, _DoneItem):
                                  completed.add(item.execution_id)
                              elif isinstance(item, _ErrorItem):
                                  raise item.error
                              else:
                                  await discover_child(item.execution_id)
                          finally:
                              queue.task_done()

                          if (
                              execution_id in completed
                              and all(task.done() for task in pumps.values())
                              and queue.empty()
                          ):
                              added = False
                              fresh_root = await self._executions.inspect(
                                  execution_id,
                                  principal=principal,
                              )
                              added = await discover(
                                  fresh_root,
                                  0,
                                  frozenset(),
                              ) or added
                              for child_id in subscription.drain():
                                  added = await discover_child(child_id) or added
                              if not added and queue.empty():
                                  return
                  finally:
                      if child_pump is not None and not child_pump.done():
                          child_pump.cancel()
                      for task in pumps.values():
                          if not task.done():
                              task.cancel()
                      await asyncio.gather(
                          *(
                              task
                              for task in (child_pump, *pumps.values())
                              if task is not None
                          ),
                          return_exceptions=True,
                      )
                      await subscription.close()


          def _same_lineage(left: ExecutionView, right: ExecutionView) -> bool:
              return (
                  left.execution_id == right.execution_id
                  and left.agent_id == right.agent_id
                  and left.lineage_kind is right.lineage_kind
                  and left.parent_execution_id == right.parent_execution_id
                  and left.root_execution_id == right.root_execution_id
                  and left.parent_invocation_id == right.parent_invocation_id
              )


          def _normalize_after_sequences(
              value: Mapping[str, int] | None,
          ) -> Mapping[str, int]:
              if value is None:
                  return {}
              if not isinstance(value, Mapping):
                  raise AIError(ErrorCode.REQUEST_FIELD_INVALID)
              result: dict[str, int] = {}
              for execution_id, sequence in value.items():
                  if (
                      not isinstance(execution_id, str)
                      or not execution_id
                      or isinstance(sequence, bool)
                      or not isinstance(sequence, int)
                      or sequence < 0
                  ):
                      raise AIError(ErrorCode.REQUEST_FIELD_INVALID)
                  result[execution_id] = sequence
              return result


          __all__ = ["ExecutionTreeBroker", "ExecutionTreeStreamer"]
          '''))

          test_path = Path("tests/ai/test_subagent_execution_tree.py")
          test = test_path.read_text()
          test = test.replace(
              "(item.execution.execution_id, item.depth)",
              "(item.execution_id, item.depth)",
          ).replace(
              'item for item in values if item.execution.execution_id == "child"',
              'item for item in values if item.execution_id == "child"',
          ).replace(
              "child.execution.parent_invocation_id",
              "child.parent_invocation_id",
          )
          test_path.write_text(test)
          PY
      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Run targeted tests
        run: |
          python -m pytest -q \
            tests/ai/test_subagent_execution_tree.py \
            tests/ai/test_skill_subagent_final_refactor.py \
            tests/ai/test_execution_context_durability.py \
            tests/ai/test_local_execution_recovery.py \
            tests/ai/test_runtime_metrics.py
      - name: Run linktools-ai gate
        run: python manage.py check linktools-ai
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/ai-subagent-observability-apply.yml
          rm .github/workflows/ai-subagent-observability-apply-v2.yml
          rm .github/workflows/ai-subagent-observability-apply-v3.yml
          rm .github/workflows/ai-subagent-observability-apply-v4.yml
          rm .github/workflows/ai-subagent-observability-apply-v5.yml
          rm .github/workflows/ai-subagent-observability-apply-v6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ai): track subagent execution lineage"
          git push origin HEAD:feat/ai-subagent-observability
