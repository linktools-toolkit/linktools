name: Session Timeline Memory Owner Fix

on:
  push:
    branches:
      - feat/ai-session-timeline
    paths:
      - .github/session_timeline_memory_owner_fix.py
      - .github/workflows/session-timeline-memory-owner-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-session-timeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Apply focused fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/session_timeline_memory_owner_fix.py')
          text = path.read_text(encoding='utf-8')
          old = '''        assert len(messages) == 1
          assert messages[0] == latest_snapshot_message = ModelResponse(
              parts=[TextPart(content="new")]
          )
          assert latest_snapshot_message.parts[0].content == "new"
          '''
          new = '''        assert len(messages) == 1
          assert isinstance(messages[0], ModelResponse)
          assert len(messages[0].parts) == 1
          assert isinstance(messages[0].parts[0], TextPart)
          assert messages[0].parts[0].content == "new"
          '''
          if text.count(old) != 1:
              raise SystemExit('temporary patch assertion block did not match exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python .github/session_timeline_memory_owner_fix.py
      - name: Install test environment
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt
          python manage.py install --editable --quiet
      - name: Verify focused behavior
        run: |
          python -m compileall -q linktools-ai/src/linktools/ai/runtime/state/_steps.py tests/ai/test_session_timeline_storage.py
          python -m pytest -q tests/ai/test_session_timeline_storage.py tests/ai/test_session_timeline_runtime.py tests/ai/test_session_timeline_recovery.py tests/ai/test_session_timeline.py
          git diff --check
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add linktools-ai/src/linktools/ai/runtime/state/_steps.py tests/ai/test_session_timeline_storage.py
          git rm .github/session_timeline_memory_owner_fix.py .github/workflows/session-timeline-memory-owner-fix.yml
          git diff --cached --check
          git commit -m "fix(ai): track in-memory session history owner"
          git push origin HEAD:feat/ai-session-timeline
