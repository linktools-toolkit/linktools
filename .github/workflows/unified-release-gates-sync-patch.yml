name: Temporary unified release gates sync patch

on:
  push:
    branches:
      - sync/unified-release-gates-master-2487dc

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[sync-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Apply compatibility patch
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import re
          from pathlib import Path

          roots = (Path("linktools-ai/src"), Path("tests/ai"))

          def patch_enum(path: Path) -> bool:
              text = path.read_text(encoding="utf-8")
              if "StrEnum" not in text:
                  return False
              class_names = set(
                  re.findall(r"(?m)^\s*class\s+([A-Za-z_]\w*)\(StrEnum\):\s*$", text)
              )
              if not class_names and "from enum import" not in text:
                  return False

              def replace_import(match: re.Match[str]) -> str:
                  names = [item.strip() for item in match.group(1).split(",")]
                  if "StrEnum" not in names:
                      return match.group(0)
                  result = [item for item in names if item != "StrEnum"]
                  if "Enum" not in result:
                      result.append("Enum")
                  return "from enum import " + ", ".join(result)

              patched = re.sub(r"from enum import ([^\n]+)", replace_import, text)
              patched = re.sub(
                  r"(?m)^(\s*)class\s+([A-Za-z_]\w*)\(StrEnum\):\s*$",
                  r"\1class \2(str, Enum):",
                  patched,
              )
              if not class_names:
                  if patched != text:
                      path.write_text(patched, encoding="utf-8")
                      return True
                  return False

              tree = ast.parse(patched, filename=str(path))
              lines = patched.splitlines(keepends=True)
              inserts = []
              for node in ast.walk(tree):
                  if not isinstance(node, ast.ClassDef) or node.name not in class_names:
                      continue
                  insert_after = node.lineno
                  if node.body and isinstance(node.body[0], ast.Expr):
                      value = node.body[0].value
                      if isinstance(value, ast.Str) or (
                          isinstance(value, ast.Constant) and isinstance(value.value, str)
                      ):
                          insert_after = node.body[0].end_lineno or node.body[0].lineno
                  indent = " " * (node.col_offset + 4)
                  block = (
                      f"{indent}__str__ = str.__str__\n"
                      f"{indent}__format__ = str.__format__\n"
                  )
                  inserts.append((insert_after, block))
              for line_number, block in sorted(inserts, reverse=True):
                  lines.insert(line_number, block)
              final = "".join(lines)
              if final != text:
                  path.write_text(final, encoding="utf-8")
                  return True
              return False

          changed = []
          for root in roots:
              for path in sorted(root.rglob("*.py")):
                  if patch_enum(path):
                      changed.append(str(path))

          old_module = "scripts." + "build"
          old_package = "linktools-ai/" + "scripts/" + "build"
          old_matrix = "scripts/" + "build/matrix"
          for path in sorted(Path("tests/ai").rglob("*")):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = (
                  text.replace(old_package, "scripts/check/ai")
                  .replace(old_matrix, "scripts/check/ai/matrix")
                  .replace(old_module, "scripts.check.ai")
              )
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          print("patched files:")
          for path in sorted(set(changed)):
              print(path)
          PY

          if git diff --quiet -- linktools-ai/src tests/ai; then
            echo "No compatibility changes required"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linktools-ai/src tests/ai
          git commit -m "chore: reapply master sync compatibility [sync-applied]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
