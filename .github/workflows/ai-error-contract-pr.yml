name: Verify AI error contract closure

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'fix/ai-error-contract-closure' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact patches
        run: |
          python linktools-ai/scripts/build/_error_contract_closure.py
          python - <<'PY'
          from pathlib import Path
          path = Path("linktools-ai/src/linktools/ai/runtime/_local.py")
          text = path.read_text()
          old = '''                        if persisted is not None and persisted.status in {
                              ExecutionStatus.SUCCEEDED,
                              ExecutionStatus.FAILED,
                              ExecutionStatus.CANCELLED,
                          }:
                              operation_result = _execution_operation_result(persisted.status)
                              _logger.error(
          '''
          new = '''                        if persisted is not None and persisted.status in {
                              ExecutionStatus.SUCCEEDED,
                              ExecutionStatus.FAILED,
                              ExecutionStatus.CANCELLED,
                          }:
                              _logger.error(
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one terminal fallback cleanup, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            filelock 'pydantic-ai-slim[mcp,openai,temporal]>=2.27.0,<3.0.0' \
            'pydantic-ai-harness[skills,dynamic-workflow]>=0.13.0' \
            'PyYAML>=6,<7' pytest pytest-asyncio 'sqlalchemy[asyncio]==2.0.51' \
            'aiosqlite==0.22.1' ruff rich requests packaging

      - name: Compile
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m compileall -q linktools-ai/src/linktools/ai linktools-ai/src/linktools/commands/ai

      - name: Ruff
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m ruff check linktools-ai/scripts/build linktools-ai/src/linktools/ai linktools-ai/src/linktools/commands/ai tests/ai

      - name: AI tests
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m pytest -q tests/ai

      - name: Commit verified patches
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add linktools-ai/src/linktools/ai/agent/_executor.py \
                  linktools-ai/src/linktools/ai/asset/_repository.py \
                  linktools-ai/src/linktools/ai/runtime/_evaluation.py \
                  linktools-ai/src/linktools/ai/runtime/_local.py \
                  linktools-ai/src/linktools/ai/runtime/_tool.py \
                  linktools-ai/src/linktools/ai/task/_local.py \
                  tests/ai/test_asset_repository.py \
                  tests/ai/test_closure_fix.py \
                  tests/ai/test_error_contract.py
          git diff --cached --check
          git commit -m 'fix(ai): close remaining error propagation gaps'
          git push origin HEAD:fix/ai-error-contract-closure
