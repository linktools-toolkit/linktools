name: TaskGraph CAS tests patch

on:
  push:
    branches:
      - feat/ai-taskgraph-reliable-mixed-nodes
    paths:
      - .github/workflows/taskgraph-cas-tests-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-taskgraph-reliable-mixed-nodes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Update CAS tests to bounded readback contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/ai/test_task_sqlite_cas_convergence.py')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new)

          replace_once(
              'from linktools.ai.spec import AgentSpec, AgentSpecCodec\n',
              'from linktools.ai.spec import AgentSpec, AgentSpecCodec\nfrom linktools.ai.storage import StoredPayload\n',
          )
          replace_once(
              '    TaskGraphRequest,\n    TaskGraphView,\n    TaskLease,\n    TaskNode,\n    TaskNodeRunResult,\n',
              '    TaskGraphRequest,\n    TaskGraphSnapshot,\n    TaskGraphView,\n    TaskLease,\n    TaskNode,\n    TaskNodeRunControl,\n    TaskNodeRunResult,\n',
          )

          replace_once(
              '''async def _digest_run(\n    self: RuntimeTaskNodeRunner,\n    node: TaskNode,\n    *,\n    graph_id: str,\n    principal: Principal,\n    dependency_results: Mapping[str, TaskDependencyResult],\n) -> TaskNodeRunResult:\n    del self, principal, dependency_results\n    await asyncio.sleep(0)\n    return TaskNodeRunResult(\n        canonical_sha256({"graph_id": graph_id, "node_id": node.node_id})\n    )\n''',
              '''async def _digest_run(\n    self: RuntimeTaskNodeRunner,\n    node: TaskNode,\n    *,\n    graph_id: str,\n    principal: Principal,\n    dependency_results: Mapping[str, TaskDependencyResult],\n    control: TaskNodeRunControl,\n) -> TaskNodeRunResult:\n    del self, principal, dependency_results, control\n    await asyncio.sleep(0)\n    payload = StoredPayload.inline_json({"graph_id": graph_id, "node_id": node.node_id})\n    return TaskNodeRunResult(payload.digest, result_payload=payload)\n''',
          )

          old_run = '''        dependency_results: Mapping[str, TaskDependencyResult],\n    ) -> TaskNodeRunResult:\n        del self, principal, dependency_results\n        if node.node_id == "fail":\n'''
          new_run = '''        dependency_results: Mapping[str, TaskDependencyResult],\n        control: TaskNodeRunControl,\n    ) -> TaskNodeRunResult:\n        del self, principal, dependency_results, control\n        if node.node_id == "fail":\n'''
          replace_once(old_run, new_run)
          replace_once(
              '''        return TaskNodeRunResult(\n            canonical_sha256({"graph_id": graph_id, "node_id": node.node_id})\n        )\n\n    monkeypatch.setattr(RuntimeTaskNodeRunner, "run", run)\n''',
              '''        payload = StoredPayload.inline_json(\n            {"graph_id": graph_id, "node_id": node.node_id}\n        )\n        return TaskNodeRunResult(payload.digest, result_payload=payload)\n\n    monkeypatch.setattr(RuntimeTaskNodeRunner, "run", run)\n''',
          )
          replace_once(
              '''        dependency_results: Mapping[str, TaskDependencyResult],\n    ) -> TaskNodeRunResult:\n        del self, node, graph_id, principal, dependency_results\n        started.set()\n''',
              '''        dependency_results: Mapping[str, TaskDependencyResult],\n        control: TaskNodeRunControl,\n    ) -> TaskNodeRunResult:\n        del self, node, graph_id, principal, dependency_results, control\n        started.set()\n''',
          )

          replace_once(
              '''    async def reconcile_graph(\n        self,\n        graph_id: str,\n        *,\n        tenant_id: str,\n    ) -> TaskGraphView:\n        del graph_id, tenant_id\n        self.reconcile_calls += 1\n        raise AssertionError("observer must not reconcile Task state")\n\n    async def list_nodes(\n''',
              '''    async def snapshot_graph(\n        self,\n        graph_id: str,\n        *,\n        tenant_id: str,\n    ) -> TaskGraphSnapshot:\n        del graph_id, tenant_id\n        return TaskGraphSnapshot(\n            self.view.graph_id,\n            self.view.status,\n            self.view.nodes,\n            (),\n        )\n\n    async def reconcile_graph(\n        self,\n        graph_id: str,\n        *,\n        tenant_id: str,\n    ) -> TaskGraphView:\n        del graph_id, tenant_id\n        self.reconcile_calls += 1\n        raise AssertionError("observer must not reconcile Task state")\n\n    async def list_nodes(\n''',
          )

          replace_once(
              '        assert attempts == 2\n        nodes = await repository.list_nodes(request.graph.graph_id, tenant_id="tenant")\n        assert nodes[0].owner == "winner"\n',
              '        assert attempts == 1\n        nodes = await repository.list_nodes(request.graph.graph_id, tenant_id="tenant")\n        assert nodes[0].owner == "winner"\n',
          )

          replace_once(
              'async def test_task_complete_retries_after_same_fence_heartbeat(\n',
              'async def test_task_complete_conflict_reads_back_without_retry(\n',
          )
          replace_once(
              '''    original_complete = TaskRepositoryImpl.complete\n    original_renew = TaskRepositoryImpl.renew\n    attempts = 0\n\n    async def complete(\n        self: TaskRepositoryImpl,\n        lease: TaskLease,\n        *,\n        tenant_id: str,\n        execution_id: str | None,\n        result_digest: str,\n    ) -> TaskTerminalRecord:\n        nonlocal attempts\n        attempts += 1\n        if attempts == 1:\n            await original_renew(\n                self,\n                lease,\n                tenant_id=tenant_id,\n                lease_seconds=60,\n            )\n            raise AIError(ErrorCode.STORAGE_CONFLICT)\n        return await original_complete(\n            self,\n            lease,\n            tenant_id=tenant_id,\n            execution_id=execution_id,\n            result_digest=result_digest,\n        )\n''',
              '''    original_renew = TaskRepositoryImpl.renew\n    attempts = 0\n\n    async def complete(\n        self: TaskRepositoryImpl,\n        lease: TaskLease,\n        *,\n        tenant_id: str,\n        execution_id: str | None,\n        result_digest: str,\n        result_payload: StoredPayload | None = None,\n    ) -> TaskTerminalRecord:\n        del execution_id, result_digest, result_payload\n        nonlocal attempts\n        attempts += 1\n        if attempts != 1:\n            raise AssertionError("durable complete must not retry internally")\n        await original_renew(\n            self,\n            lease,\n            tenant_id=tenant_id,\n            lease_seconds=60,\n        )\n        raise AIError(ErrorCode.STORAGE_CONFLICT)\n''',
          )
          replace_once(
              '''        terminal = await repository.complete(\n            lease,\n            tenant_id="tenant",\n            execution_id=None,\n            result_digest=canonical_sha256({"result": True}),\n        )\n        assert terminal.status is TaskStatus.SUCCEEDED\n        assert attempts == 2\n        nodes = await repository.list_nodes(request.graph.graph_id, tenant_id="tenant")\n        assert nodes[0].status is TaskStatus.SUCCEEDED\n''',
              '''        with pytest.raises(AIError) as raised:\n            await repository.complete(\n                lease,\n                tenant_id="tenant",\n                execution_id=None,\n                result_digest=canonical_sha256({"result": True}),\n            )\n        assert raised.value.code is ErrorCode.STORAGE_CONFLICT\n        assert attempts == 1\n        nodes = await repository.list_nodes(request.graph.graph_id, tenant_id="tenant")\n        assert nodes[0].status is TaskStatus.RUNNING\n        assert nodes[0].owner == "runner"\n        assert nodes[0].fence == lease.fence\n''',
          )

          replace_once(
              'async def test_task_fail_retries_after_same_fence_heartbeat(\n',
              'async def test_task_fail_conflict_reads_back_without_retry(\n',
          )
          replace_once(
              '''    original_fail = TaskRepositoryImpl.fail\n    original_renew = TaskRepositoryImpl.renew\n    attempts = 0\n\n    async def fail(\n        self: TaskRepositoryImpl,\n        lease: TaskLease,\n        *,\n        tenant_id: str,\n        error_code: str,\n        error_digest: str,\n    ) -> TaskTerminalRecord:\n        nonlocal attempts\n        attempts += 1\n        if attempts == 1:\n            await original_renew(\n                self,\n                lease,\n                tenant_id=tenant_id,\n                lease_seconds=60,\n            )\n            raise AIError(ErrorCode.STORAGE_CONFLICT)\n        return await original_fail(\n            self,\n            lease,\n            tenant_id=tenant_id,\n            error_code=error_code,\n            error_digest=error_digest,\n        )\n''',
              '''    original_renew = TaskRepositoryImpl.renew\n    attempts = 0\n\n    async def fail(\n        self: TaskRepositoryImpl,\n        lease: TaskLease,\n        *,\n        tenant_id: str,\n        error_code: str,\n        error_digest: str,\n        execution_id: str | None = None,\n    ) -> TaskTerminalRecord:\n        del error_code, error_digest, execution_id\n        nonlocal attempts\n        attempts += 1\n        if attempts != 1:\n            raise AssertionError("durable fail must not retry internally")\n        await original_renew(\n            self,\n            lease,\n            tenant_id=tenant_id,\n            lease_seconds=60,\n        )\n        raise AIError(ErrorCode.STORAGE_CONFLICT)\n''',
          )
          replace_once(
              '''        terminal = await repository.fail(\n            lease,\n            tenant_id="tenant",\n            error_code=ErrorCode.TASK_NODE_FAILED.value,\n            error_digest=canonical_sha256({"failure": True}),\n        )\n        assert terminal.status is TaskStatus.FAILED\n        assert attempts == 2\n        nodes = await repository.list_nodes(request.graph.graph_id, tenant_id="tenant")\n        assert nodes[0].status is TaskStatus.FAILED\n''',
              '''        with pytest.raises(AIError) as raised:\n            await repository.fail(\n                lease,\n                tenant_id="tenant",\n                error_code=ErrorCode.TASK_NODE_FAILED.value,\n                error_digest=canonical_sha256({"failure": True}),\n            )\n        assert raised.value.code is ErrorCode.STORAGE_CONFLICT\n        assert attempts == 1\n        nodes = await repository.list_nodes(request.graph.graph_id, tenant_id="tenant")\n        assert nodes[0].status is TaskStatus.RUNNING\n        assert nodes[0].owner == "runner"\n        assert nodes[0].fence == lease.fence\n''',
          )

          replace_once(
              'async def test_task_terminal_retry_preserves_cancelled_state(\n',
              'async def test_task_terminal_conflict_preserves_cancelled_state(\n',
          )
          replace_once(
              '''    original_complete = TaskRepositoryImpl.complete\n    attempts = 0\n\n    async def complete(\n        self: TaskRepositoryImpl,\n        lease: TaskLease,\n        *,\n        tenant_id: str,\n        execution_id: str | None,\n        result_digest: str,\n    ) -> TaskTerminalRecord:\n        nonlocal attempts\n        attempts += 1\n        if attempts == 1:\n            await self.cancel_graph(lease.graph_id, tenant_id=tenant_id)\n            raise AIError(ErrorCode.STORAGE_CONFLICT)\n        return await original_complete(\n            self,\n            lease,\n            tenant_id=tenant_id,\n            execution_id=execution_id,\n            result_digest=result_digest,\n        )\n''',
              '''    attempts = 0\n\n    async def complete(\n        self: TaskRepositoryImpl,\n        lease: TaskLease,\n        *,\n        tenant_id: str,\n        execution_id: str | None,\n        result_digest: str,\n        result_payload: StoredPayload | None = None,\n    ) -> TaskTerminalRecord:\n        del execution_id, result_digest, result_payload\n        nonlocal attempts\n        attempts += 1\n        if attempts != 1:\n            raise AssertionError("durable complete must not retry internally")\n        await self.cancel_graph(lease.graph_id, tenant_id=tenant_id)\n        raise AIError(ErrorCode.STORAGE_CONFLICT)\n''',
          )
          replace_once(
              '''        assert raised.value.code is ErrorCode.TASK_FENCE_STALE\n        assert attempts == 2\n''',
              '''        assert raised.value.code is ErrorCode.TASK_TERMINAL_CONFLICT\n        assert attempts == 1\n''',
          )

          replace_once(
              'async def test_task_reconcile_retries_whole_projection_transaction(\n',
              'async def test_task_reconcile_conflict_uses_readback_without_retry(\n',
          )
          replace_once(
              '''        view = await repository.reconcile_graph(\n            request.graph.graph_id,\n            tenant_id="tenant",\n        )\n        assert attempts == 2\n        assert view.status is TaskStatus.PENDING\n        nodes = {\n            node.node_id: node\n            for node in await repository.list_nodes(\n                request.graph.graph_id,\n                tenant_id="tenant",\n            )\n        }\n        assert nodes["a"].status is TaskStatus.SUCCEEDED\n        assert nodes["b"].status is TaskStatus.READY\n''',
              '''        view = await repository.reconcile_graph(\n            request.graph.graph_id,\n            tenant_id="tenant",\n        )\n        assert attempts == 1\n        assert view.status is TaskStatus.PENDING\n        nodes = {\n            node.node_id: node\n            for node in await repository.list_nodes(\n                request.graph.graph_id,\n                tenant_id="tenant",\n            )\n        }\n        assert nodes["a"].status is TaskStatus.SUCCEEDED\n        assert nodes["b"].status is TaskStatus.PENDING\n\n        view = await repository.reconcile_graph(\n            request.graph.graph_id,\n            tenant_id="tenant",\n        )\n        assert attempts == 2\n        assert view.status is TaskStatus.PENDING\n        nodes = {\n            node.node_id: node\n            for node in await repository.list_nodes(\n                request.graph.graph_id,\n                tenant_id="tenant",\n            )\n        }\n        assert nodes["b"].status is TaskStatus.READY\n''',
          )

          replace_once(
              'async def test_task_cancel_retries_whole_projection_transaction(\n',
              'async def test_task_cancel_conflict_requires_explicit_retry(\n',
          )
          replace_once(
              '''        view = await repository.cancel_graph(\n            request.graph.graph_id,\n            tenant_id="tenant",\n        )\n        assert attempts == 2\n        assert view.status is TaskStatus.CANCELLED\n        nodes = await repository.list_nodes(\n            request.graph.graph_id,\n            tenant_id="tenant",\n        )\n        assert {node.status for node in nodes} == {TaskStatus.CANCELLED}\n        page = await state.task.admissions.list_recoverable_page(\n            cursor=None,\n            limit=128,\n        )\n        assert page.items == ()\n''',
              '''        with pytest.raises(AIError) as raised:\n            await repository.cancel_graph(\n                request.graph.graph_id,\n                tenant_id="tenant",\n            )\n        assert raised.value.code is ErrorCode.STORAGE_CONFLICT\n        assert attempts == 1\n        nodes = await repository.list_nodes(\n            request.graph.graph_id,\n            tenant_id="tenant",\n        )\n        assert {node.status for node in nodes} == {TaskStatus.READY}\n\n        view = await repository.cancel_graph(\n            request.graph.graph_id,\n            tenant_id="tenant",\n        )\n        assert attempts == 2\n        assert view.status is TaskStatus.CANCELLED\n        nodes = await repository.list_nodes(\n            request.graph.graph_id,\n            tenant_id="tenant",\n        )\n        assert {node.status for node in nodes} == {TaskStatus.CANCELLED}\n        page = await state.task.admissions.list_recoverable_page(\n            cursor=None,\n            limit=128,\n        )\n        assert page.items == ()\n''',
          )

          path.write_text(text)
          PY
          python -m py_compile tests/ai/test_task_sqlite_cas_convergence.py
          git diff --check
      - name: Commit tests and remove patch workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/taskgraph-cas-tests-patch.yml
          git add tests/ai/test_task_sqlite_cas_convergence.py
          git commit -m 'test(ai-task): align CAS convergence with readback contract'
          git push origin HEAD:feat/ai-taskgraph-reliable-mixed-nodes
