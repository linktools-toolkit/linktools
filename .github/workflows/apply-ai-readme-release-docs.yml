name: Apply AI README release docs

on:
  push:
    branches:
      - refactor/unified-release-gates

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-release-gates
          fetch-depth: 0
      - name: Update only development checks
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout origin/master -- linktools-ai/README.md
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("linktools-ai/README.md")
          text = path.read_text(encoding="utf-8")
          replacement = """## 13. Development checks

Install the editable development environment once, then use the repository gate from the repository root:

```bash
python manage.py install --editable
python manage.py check linktools-ai
```

The repository gate owns the AI-specific release checks; package-local release scripts are not a supported development entry point.
"""
          updated, count = re.subn(r"## 13\. Development checks\n.*\Z", replacement, text, flags=re.DOTALL)
          if count != 1:
              raise SystemExit("unexpected linktools-ai README development-checks section")
          path.write_text(updated, encoding="utf-8")
          Path(".github/workflows/apply-ai-readme-release-docs.yml").unlink()
          trigger = Path(".github/.ai-readme-release-docs-trigger")
          if trigger.exists():
              trigger.unlink()
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs(ai): point development checks at root gate"
          git push origin HEAD:refactor/unified-release-gates
