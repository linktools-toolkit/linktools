name: Apply subagent observability implementation v3

on:
  push:
    branches:
      - feat/ai-subagent-observability
    paths:
      - .github/workflows/ai-subagent-observability-apply-v3.yml

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ai-subagent-observability
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Apply implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path(".github/workflows/ai-subagent-observability-apply-v2.yml").read_text()
          block = source.split("          python - <<'PY'\n", 1)[1].split("\n          PY\n", 1)[0]
          exec(compile(textwrap.dedent(block), "subagent-observability-apply-v2", "exec"))

          path = Path("tests/ai/test_skill_subagent_final_refactor.py")
          value = path.read_text()
          old_fixture = '''        parent_execution_id="parent-execution",
          root_execution_id="root-execution",
          planning=True,
          thinking="high",
          correlation={},
          )'''
          new_fixture = '''        parent_execution_id="parent-execution",
          root_execution_id="root-execution",
          parent_invocation_id="delegate-call",
          planning=True,
          thinking="high",
          correlation={},
          )'''
          old_fixture = textwrap.dedent(old_fixture).strip("\n")
          new_fixture = textwrap.dedent(new_fixture).strip("\n")
          if value.count(old_fixture) != 1:
              raise RuntimeError(f"expected one persisted child fixture, got {value.count(old_fixture)}")
          value = value.replace(old_fixture, new_fixture, 1)

          old_call = '''        mode="run",
          parent_execution_id="parent-execution",
          root_execution_id="root-execution",
          )'''
          new_call = '''        mode="run",
          parent_execution_id="parent-execution",
          root_execution_id="root-execution",
          parent_invocation_id="delegate-call",
          )'''
          old_call = textwrap.dedent(old_call).strip("\n")
          new_call = textwrap.dedent(new_call).strip("\n")
          if value.count(old_call) != 1:
              raise RuntimeError(f"expected one direct replay call, got {value.count(old_call)}")
          value = value.replace(old_call, new_call, 1)

          assertion = '    assert start_subagent.await_args.args[0] == "a" * 64\n'
          if value.count(assertion) != 1:
              raise RuntimeError("expected one persisted child replay assertion")
          value = value.replace(
              assertion,
              assertion
              + '    assert start_subagent.await_args.kwargs["parent_invocation_id"] == "delegate-call"\n',
              1,
          )
          path.write_text(value)
          PY
      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Run targeted tests
        run: |
          python -m pytest -q \
            tests/ai/test_subagent_execution_tree.py \
            tests/ai/test_skill_subagent_final_refactor.py \
            tests/ai/test_execution_context_durability.py \
            tests/ai/test_local_execution_recovery.py \
            tests/ai/test_runtime_metrics.py
      - name: Run linktools-ai gate
        run: python manage.py check linktools-ai
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/ai-subagent-observability-apply.yml
          rm .github/workflows/ai-subagent-observability-apply-v2.yml
          rm .github/workflows/ai-subagent-observability-apply-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ai): track subagent execution lineage"
          git push origin HEAD:feat/ai-subagent-observability
