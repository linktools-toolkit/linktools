name: TaskGraph final contract alignment

on:
  push:
    branches:
      - feat/ai-taskgraph-reliable-mixed-nodes

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply final contract fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          task_local = Path("linktools-ai/src/linktools/ai/task/_local.py")
          replace_once(
              task_local,
              '''    return AIError(\n        ErrorCode.STORAGE_RECOVERY_REQUIRED,\n        safe_details={"graph_id": graph_id, "phase": "task_scheduler"},\n    )\n''',
              '''    return AIError(\n        ErrorCode.INTERNAL_ERROR,\n        safe_details={"graph_id": graph_id, "phase": "task_scheduler"},\n    )\n''',
          )

          cancellation = Path("tests/ai/test_cancellation_quiescence.py")
          text = cancellation.read_text(encoding="utf-8")
          count = text.count("    launcher._runs = {}\n")
          if count != 2:
              raise SystemExit(f"unexpected launcher _runs fixture count: {count}")
          cancellation.write_text(
              text.replace("    launcher._runs = {}\n", "    launcher._graphs = {}\n"),
              encoding="utf-8",
          )

          durable = Path("tests/ai/test_durable_contract_repairs.py")
          text = durable.read_text(encoding="utf-8")
          import_anchor = "from linktools.ai.task._api import open_local_task_api\n"
          if import_anchor not in text:
              raise SystemExit("durable task import anchor missing")
          text = text.replace(
              import_anchor,
              "from linktools.ai.task import TaskGraphSnapshot, TaskNode, TaskNodeView\n" + import_anchor,
              1,
          )
          start = text.index("class _RunningTaskRepository:")
          end = text.index(
              "@pytest.mark.asyncio\nasync def test_task_service_preflight_blocks_pending_detached_finalizer()",
              start,
          )
          replacement = '''def _running_task_snapshot() -> TaskGraphSnapshot:\n    node = TaskNode("node")\n    state = TaskNodeView(\n        "graph",\n        "node",\n        (),\n        TaskStatus.RUNNING,\n        "worker",\n        1,\n        None,\n        None,\n        None,\n        None,\n    )\n    return TaskGraphSnapshot(\n        "graph",\n        TaskStatus.RUNNING,\n        (node,),\n        (state,),\n    )\n\n\ndef _terminal_task_snapshot() -> TaskGraphSnapshot:\n    return TaskGraphSnapshot("graph", TaskStatus.SUCCEEDED, (), ())\n\n\nclass _RunningTaskRepository:\n    async def get_header(\n        self,\n        graph_id: str,\n        *,\n        tenant_id: str,\n    ) -> ResourceRef:\n        return ResourceRef(ResourceKind.TASK_GRAPH, graph_id, tenant_id)\n\n    async def get_graph(\n        self,\n        graph_id: str,\n        *,\n        tenant_id: str,\n    ) -> object:\n        del graph_id, tenant_id\n        return SimpleNamespace(status=TaskStatus.RUNNING)\n\n    async def snapshot_graph(\n        self,\n        graph_id: str,\n        *,\n        tenant_id: str,\n    ) -> TaskGraphSnapshot:\n        del graph_id, tenant_id\n        return _running_task_snapshot()\n\n\nclass _AllowAuthorization:\n    async def authorize(self, *args: object, **kwargs: object) -> None:\n        del args, kwargs\n\n\nclass _LostTaskWaiter:\n    def owns_graph(self, graph_id: str, *, tenant_id: str) -> bool:\n        del graph_id, tenant_id\n        return False\n\n    async def wait_graph_activity(self, graph_id: str, *, tenant_id: str) -> None:\n        del graph_id, tenant_id\n        raise AssertionError("lost owner must not wait for local activity")\n\n\nclass _TerminalTaskRepository:\n    async def get_header(\n        self,\n        graph_id: str,\n        *,\n        tenant_id: str,\n    ) -> ResourceRef:\n        return ResourceRef(ResourceKind.TASK_GRAPH, graph_id, tenant_id)\n\n    async def get_graph(\n        self,\n        graph_id: str,\n        *,\n        tenant_id: str,\n    ) -> object:\n        return SimpleNamespace(\n            graph_id=graph_id,\n            tenant_id=tenant_id,\n            status=TaskStatus.SUCCEEDED,\n        )\n\n    async def snapshot_graph(\n        self,\n        graph_id: str,\n        *,\n        tenant_id: str,\n    ) -> TaskGraphSnapshot:\n        del graph_id, tenant_id\n        return _terminal_task_snapshot()\n\n\nclass _TransitionTaskRepository(_TerminalTaskRepository):\n    def __init__(self) -> None:\n        self.snapshot_reads = 0\n\n    async def snapshot_graph(\n        self,\n        graph_id: str,\n        *,\n        tenant_id: str,\n    ) -> TaskGraphSnapshot:\n        del graph_id, tenant_id\n        self.snapshot_reads += 1\n        if self.snapshot_reads == 1:\n            return _running_task_snapshot()\n        return _terminal_task_snapshot()\n\n\nclass _TerminalTaskWaiter:\n    def __init__(self, error: "AIError | None" = None) -> None:\n        self.error = error\n        self.started = asyncio.Event()\n        self.release = asyncio.Event()\n        self.owned = True\n\n    def owns_graph(self, graph_id: str, *, tenant_id: str) -> bool:\n        del graph_id, tenant_id\n        return self.owned\n\n    async def wait_graph_activity(self, graph_id: str, *, tenant_id: str) -> None:\n        del graph_id, tenant_id\n        self.started.set()\n        if self.error is not None:\n            raise self.error\n        await self.release.wait()\n        self.owned = False\n\n\ndef _terminal_task_service(\n    waiter: _TerminalTaskWaiter,\n    *,\n    tasks: "object | None" = None,\n) -> DefaultTaskService:\n    return DefaultTaskService(\n        SimpleNamespace(tasks=_TerminalTaskRepository() if tasks is None else tasks),\n        _AllowAuthorization(),\n        local_waiter=waiter,\n    )\n\n\n@pytest.mark.asyncio\nasync def test_task_wait_returns_current_terminal_snapshot_without_local_wait() -> None:\n    waiter = _TerminalTaskWaiter()\n    service = _terminal_task_service(waiter)\n\n    result = await service.wait_graph(\n        "graph",\n        principal=Principal("principal", "tenant", "service"),\n        timeout_seconds=1,\n    )\n\n    assert result.status is TaskStatus.SUCCEEDED\n    assert not waiter.started.is_set()\n\n\n@pytest.mark.asyncio\nasync def test_task_wait_prefers_terminal_truth_after_scheduler_failure() -> None:\n    waiter = _TerminalTaskWaiter(AIError(ErrorCode.STORAGE_RECOVERY_REQUIRED))\n    repository = _TransitionTaskRepository()\n    service = _terminal_task_service(waiter, tasks=repository)\n\n    result = await service.wait_graph(\n        "graph",\n        principal=Principal("principal", "tenant", "service"),\n        timeout_seconds=1,\n    )\n\n    assert waiter.started.is_set()\n    assert repository.snapshot_reads >= 2\n    assert result.status is TaskStatus.SUCCEEDED\n\n\n@pytest.mark.asyncio\nasync def test_task_wait_uses_durable_recheck_after_local_owner_is_lost() -> None:\n    persistence = SimpleNamespace(tasks=_RunningTaskRepository())\n    service = DefaultTaskService(\n        persistence,\n        _AllowAuthorization(),\n        local_waiter=_LostTaskWaiter(),\n    )\n\n    with pytest.raises(AIError) as error:\n        await service.wait_graph(\n            "graph",\n            principal=Principal("principal", "tenant", "service"),\n            timeout_seconds=0.05,\n        )\n\n    assert error.value.code is ErrorCode.TASK_WAIT_TIMEOUT\n\n\n'''
          durable.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
          python -m compileall -q linktools-ai/src tests/ai
          git diff --check
      - name: Commit final contract fixes
        shell: bash
        run: |
          rm .github/workflows/taskgraph-final-contract-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linktools-ai/src/linktools/ai/task/_local.py \
                  tests/ai/test_cancellation_quiescence.py \
                  tests/ai/test_durable_contract_repairs.py \
                  .github/workflows/taskgraph-final-contract-fix.yml
          git diff --cached --check
          git commit -m "fix(ai-task): align observation and scheduler contracts"
          git push origin HEAD:${{ github.ref_name }}
