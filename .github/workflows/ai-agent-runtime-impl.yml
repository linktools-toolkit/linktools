name: AI Agent Runtime Isolated Implementation Gate

on:
  push:
    branches:
      - refactor/ai-agent-runtime-asset-composition-impl

permissions:
  contents: write

concurrency:
  group: ai-agent-runtime-asset-composition-impl
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/ai-agent-runtime-asset-composition-impl
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply and validate
        shell: bash
        run: |
          set -uo pipefail
          if [[ ! -f .bootstrap/ready ]]; then
            echo 'implementation trigger not present; nothing to run'
            exit 0
          fi
          RESULT=/tmp/agent-runtime-result.txt
          : > "$RESULT"
          status=0
          export PYTHONPATH="linktools-ai:linktools-ai/src:linktools/src"
          run_check() {
            echo "===== $* =====" | tee -a "$RESULT"
            "$@" >>"$RESULT" 2>&1 || status=1
            return 0
          }
          if [[ -f .bootstrap/patch.py ]]; then
            run_check python .bootstrap/patch.py
            rm -f .bootstrap/patch.py
          fi
          if [[ $status -eq 0 ]]; then run_check python -m compileall -q linktools-ai/src/linktools/ai; fi
          if [[ $status -eq 0 ]]; then run_check python -m pip install -q --upgrade pip; fi
          if [[ $status -eq 0 ]]; then run_check python -m pip install -q -e ./linktools -e './linktools-ai[sqlite,evaluation,temporal]' pytest pytest-asyncio ruff; fi
          if [[ $status -eq 0 ]]; then
            mapfile -t changed_python < <(
              git diff --name-only a4ded79a152ccfbc635503ee7b7bd394bd50970e -- \
                linktools-ai/src/linktools/ai linktools-ai/src/linktools/commands/ai tests/ai \
                | grep '\.py$' || true
            )
            if [[ ${#changed_python[@]} -gt 0 ]]; then
              run_check ruff check --select E4,E7,E9,F "${changed_python[@]}"
            fi
          fi
          if [[ $status -eq 0 ]]; then run_check python -m scripts.build.architecture; fi
          if [[ $status -eq 0 ]]; then run_check pytest -q tests/ai --maxfail=30; fi
          mkdir -p .bootstrap
          rm -f .bootstrap/ready
          cp "$RESULT" .bootstrap/result.txt
          tail -n 250 "$RESULT" > .bootstrap/tail.txt
          printf '%s\n' "$status" > .bootstrap/status
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            if [[ $status -eq 0 ]]; then
              git commit -m 'refactor(ai): implement agent runtime asset composition'
            else
              git commit -m 'ci: record isolated agent runtime validation'
            fi
            git push origin HEAD:refactor/ai-agent-runtime-asset-composition-impl
          fi
          exit 0
