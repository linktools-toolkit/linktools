name: Apply release scope cleanup

on:
  push:
    branches:
      - refactor/unified-release-gates

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-release-gates
          fetch-depth: 0
      - name: Restore unrelated branch drift
        run: |
          git fetch origin master
          git checkout origin/master -- \
            linktools-ai/README.md \
            linktools-cntr/src/linktools/cntr/_operations.py \
            linktools-cntr/src/linktools/cntr/runtime/compose.py \
            tests/cntr/_harness.py \
            tests/cntr/conftest.py \
            tests/cntr/snapshots/builtin/nginx.compose.json \
            tests/cntr/test_cli_routing.py \
            tests/cntr/test_compose_runner.py \
            tests/cntr/test_exec_routing.py \
            tests/cntr/test_execution_report.py \
            tests/cntr/test_lifecycle_state_ordering.py \
            tests/cntr/test_plan.py \
            tests/cntr/test_running_state.py

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("linktools-ai/README.md")
          text = path.read_text(encoding="utf-8")
          pattern = r"## 13\. Development checks\n.*\Z"
          replacement = """## 13. Development checks

Install the editable development environment once, then use the repository gate:

```bash
python manage.py install --editable
python manage.py check linktools-ai
```

AI-specific release checks and evidence live under root `scripts/check/ai`; `linktools-ai` does not maintain a package-local release-script tree.
"""
          updated, count = re.subn(pattern, replacement, text, flags=re.DOTALL)
          if count != 1:
              raise SystemExit("unexpected linktools-ai README development-checks shape")
          path.write_text(updated, encoding="utf-8")

          Path(".github/workflows/apply-release-scope-cleanup.yml").unlink()
          PY

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(release): remove unrelated branch drift"
          git push origin HEAD:refactor/unified-release-gates
