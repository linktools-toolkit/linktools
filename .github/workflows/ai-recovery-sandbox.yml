name: Verify session recovery candidate
on:
  push:
    branches: [fix/ai-stability-hardening]
    paths:
      - .github/workflows/ai-recovery-sandbox.yml
      - .github/ai-recovery-patch/**
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.x']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply fixed candidate
        run: |
          cat .github/ai-recovery-patch/part-* | gzip -dc > "$RUNNER_TEMP/recovery.patch"
          echo "07b4340d575277514069348a80bc820d6ece530930ede84757262b859ff03363  $RUNNER_TEMP/recovery.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/recovery.patch"
          git apply "$RUNNER_TEMP/recovery.patch"
          rm -r .github/ai-recovery-patch .github/workflows/ai-recovery-sandbox.yml
          git diff --check
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install project
        run: |
          python -m pip install --quiet -r requirements.txt
          python manage.py install --editable --quiet
      - name: Verify project
        run: python manage.py check --skip-compatibility
  prepare-commit:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply verified candidate
        run: |
          cat .github/ai-recovery-patch/part-* | gzip -dc > "$RUNNER_TEMP/recovery.patch"
          echo "07b4340d575277514069348a80bc820d6ece530930ede84757262b859ff03363  $RUNNER_TEMP/recovery.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/recovery.patch"
          git apply "$RUNNER_TEMP/recovery.patch"
          rm -r .github/ai-recovery-patch .github/workflows/ai-recovery-sandbox.yml
          git diff --check
      - name: Create verified Git objects without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args])
          entries = []
          for raw in git('diff', '--name-only', '-z', 'HEAD').split(b'\0'):
              if not raw:
                  continue
              path = os.fsdecode(raw)
              mode = git('ls-files', '-s', '--', path).decode().split()[0]
              item = {'path': path, 'mode': mode, 'type': 'blob'}
              target = pathlib.Path(path)
              if target.exists():
                  item['content'] = target.read_text(encoding='utf-8')
              else:
                  item['sha'] = None
              entries.append(item)
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          (temp / 'tree-request.json').write_text(json.dumps({'base_tree': git('rev-parse', 'HEAD^{tree}').decode().strip(), 'tree': entries}))
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input "$RUNNER_TEMP/tree-request.json" > "$RUNNER_TEMP/tree.json"
          python - <<'PY'
          import json, os, pathlib
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          tree = json.loads((temp / 'tree.json').read_text())['sha']
          (temp / 'commit-request.json').write_text(json.dumps({'message': 'fix(ai): make session tool recovery checkpoints complete', 'tree': tree, 'parents': [os.environ['GITHUB_SHA']]}))
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input "$RUNNER_TEMP/commit-request.json" > "$RUNNER_TEMP/commit.json"
          python - <<'PY'
          import json, os, pathlib
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          commit = json.loads((temp / 'commit.json').read_text())
          manifest = {'base': os.environ['GITHUB_SHA'], 'commit': commit['sha'], 'tree': commit['tree']['sha'], 'patch_sha256': '07b4340d575277514069348a80bc820d6ece530930ede84757262b859ff03363', 'branch_updated': False}
          (temp / 'candidate.json').write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-session-recovery-commit
          path: ${{ runner.temp }}/candidate.json
          retention-days: 1
