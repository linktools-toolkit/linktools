                    error_digest=canonical_sha256(
                        {"type": "ExecutionResult", "code": result.status}
                    ),
                )
''',
              '''        elif result.status in {"FAILED", "CANCELLED"}:
            terminal = await self._runner.terminal_result(
                result.execution_id,
                principal=stored.principal,
            )
            if (
                terminal.execution_id != result.execution_id
                or terminal.status.value != result.status
                or terminal.error_code is None
            ):
                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)
            try:
                ErrorCode(terminal.error_code)
            except ValueError as error:
                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR) from error
            try:
                await self._repository.fail(
                    lease,
                    tenant_id=request.tenant_id,
                    error_code=terminal.error_code,
                    error_digest=canonical_sha256(
                        {
                            "type": "ExecutionResult",
                            "code": terminal.error_code,
                            "safe_error_details": terminal.safe_error_details,
                        }
                    ),
                )
''',
          )

          path = "linktools-ai/src/linktools/commands/ai/run.py"
          replace_once(
              path,
              '''from linktools.core import ConfigField, environ
from pydantic_ai.exceptions import ModelAPIError, UserError

''',
              '''from linktools.core import ConfigField, environ

''',
          )
          replace_once(
              path,
              '''    @property
    def known_errors(self) -> "list[type[BaseException]]":
        return super().known_errors + [ModelAPIError, UserError]

''',
              '''''',
          )
          replace_once(
              path,
              '''        payload = _result_payload(result)
        if result.status is not ExecutionStatus.SUCCEEDED:
            error_code, safe_details = await _terminal_failure_details(runtime, result.execution_id)
            payload["error_code"] = error_code
            payload["safe_error_details"] = safe_details
        print(json.dumps(payload, ensure_ascii=False, sort_keys=True))
''',
              '''        payload = _result_payload(result)
        print(json.dumps(payload, ensure_ascii=False, sort_keys=True))
''',
          )
          replace_once(
              path,
              '''async def _terminal_failure_details(
    runtime: Runtime,
    execution_id: str,
) -> tuple[object, object]:
    after_sequence = 0
    while True:
        page = await runtime.event.list(
            execution_id,
            principal=runtime.default_principal,
            after_sequence=after_sequence,
            limit=100,
        )
        for event in reversed(page.items):
            if event.event_type not in {
                ExecutionEventType.EXECUTION_FAILED,
                ExecutionEventType.EXECUTION_CANCELLED,
            }:
                continue
            if not isinstance(event.payload, dict):
                return None, {}
            return event.payload.get("error_code"), event.payload.get("safe_error_details", {})
        if page.next_cursor is None:
            return None, {}
        try:
            next_sequence = int(page.next_cursor)
        except (TypeError, ValueError) as error:
            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR) from error
        if next_sequence <= after_sequence:
            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)
        after_sequence = next_sequence


''',
              '''''',
          )
          replace_once(
              path,
              '''        "output_schema_fingerprint": result.output_schema_fingerprint,
    }
''',
              '''        "output_schema_fingerprint": result.output_schema_fingerprint,
        "error_code": result.error_code,
        "safe_error_details": dict(result.safe_error_details),
    }
''',
          )
          PY

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            filelock 'pydantic-ai-slim[mcp,openai,temporal]>=2.27.0,<3.0.0' \
            'pydantic-ai-harness[skills,dynamic-workflow]>=0.13.0' \
            'PyYAML>=6,<7' pytest pytest-asyncio 'sqlalchemy[asyncio]==2.0.51' \
            'aiosqlite==0.22.1' ruff rich requests packaging

      - name: Compile
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m compileall -q linktools-ai/src/linktools/ai linktools-ai/src/linktools/commands/ai

      - name: Ruff
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m ruff check linktools-ai/src/linktools/ai linktools-ai/src/linktools/commands/ai tests/ai

      - name: AI tests
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m pytest -q tests/ai

      - name: Commit verified patches
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add linktools-ai/src/linktools/ai/runtime/_local.py \
                  linktools-ai/src/linktools/ai/runtime/_tool.py \
                  linktools-ai/src/linktools/ai/temporal/_task_operation.py \
                  linktools-ai/src/linktools/commands/ai/run.py
          git diff --cached --check
          git commit -m 'fix(ai): close remaining error propagation gaps'
          git push origin HEAD:fix/ai-error-contract-closure
