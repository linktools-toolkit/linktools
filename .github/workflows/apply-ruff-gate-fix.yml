name: Apply Ruff gate fix

on:
  push:
    branches:
      - refactor/unified-release-gates

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-release-gates
          fetch-depth: 0
      - name: Apply deterministic fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("manage.py")
          text = path.read_text(encoding="utf-8")
          old = '            "--no-cache",\n            "scripts/check/ai",'
          new = '            "--no-cache",\n            "--select",\n            "E4,E7,E9,F",\n            "scripts/check/ai",'
          if text.count(old) != 1:
              raise SystemExit("unexpected Ruff gate shape")
          path.write_text(text.replace(old, new), encoding="utf-8")

          if Path("ruff.toml").exists():
              raise SystemExit("ruff.toml must not exist")

          Path(".github/workflows/apply-ruff-gate-fix.yml").unlink()
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manage.py .github/workflows/apply-ruff-gate-fix.yml
          git commit -m "fix(release): stabilize Ruff gate rules"
          git push origin HEAD:refactor/unified-release-gates
