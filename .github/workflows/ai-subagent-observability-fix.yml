name: Fix subagent execution tree lineage

on:
  push:
    branches:
      - feat/ai-subagent-observability
    paths:
      - .github/workflows/ai-subagent-observability-fix.yml

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ai-subagent-observability
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Apply lineage fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              value = file.read_text()
              count = value.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, got {count}")
              file.write_text(value.replace(old, new, 1))

          def replace_exact(path: str, old: str, new: str, count: int) -> None:
              file = Path(path)
              value = file.read_text()
              actual = value.count(old)
              if actual != count:
                  raise RuntimeError(
                      f"{path}: expected {count} matches, got {actual}"
                  )
              file.write_text(value.replace(old, new))

          contracts = "linktools-ai/src/linktools/ai/runtime/state/_contracts.py"
          replace_once(
              contracts,
              '''        elif self.parent_invocation_id is not None:\n            raise ValueError("non-subagent execution cannot carry parent invocation")\n''',
              '''        elif (\n            self.parent_execution_id is not None\n            or self.parent_invocation_id is not None\n        ):\n            raise ValueError("non-subagent execution cannot carry parent lineage")\n''',
          )
          replace_once(
              contracts,
              '''        elif self.parent_invocation_id is not None:\n            raise ValueError("non-subagent recovery cannot carry parent invocation")\n''',
              '''        elif (\n            self.parent_execution_id is not None\n            or self.parent_invocation_id is not None\n        ):\n            raise ValueError("non-subagent recovery cannot carry parent lineage")\n''',
          )

          execution = "linktools-ai/src/linktools/ai/runtime/_execution.py"
          replace_exact(
              execution,
              '''        previous = await self._load_authorized(execution_id, request.principal, AuthorizationAction.EXECUTION_READ)\n        if previous.binding_digest != binding_digest:\n''',
              '''        previous = await self._load_authorized(execution_id, request.principal, AuthorizationAction.EXECUTION_READ)\n        if previous.parent_execution_id is not None:\n            raise AIError(ErrorCode.REQUEST_FIELD_INVALID)\n        if previous.binding_digest != binding_digest:\n''',
              2,
          )

          subagent = "linktools-ai/src/linktools/ai/runtime/_subagent.py"
          replace_once(
              subagent,
              '''class _ChildExecutionObserver(Protocol):\n    def publish(self, root_execution_id: str, child_execution_id: str) -> None: ...\n''',
              '''class _ChildExecutionObserver(Protocol):\n    def publish(self, parent_execution_id: str, child_execution_id: str) -> None: ...\n''',
          )
          replace_once(
              subagent,
              '''            self._child_observer.publish(root_execution_id, child.execution_id)\n''',
              '''            self._child_observer.publish(parent_execution_id, child.execution_id)\n''',
          )

          tree = "linktools-ai/src/linktools/ai/runtime/_execution_tree.py"
          replace_once(
              tree,
              '''class _ExecutionTreeSubscription:\n    def __init__(\n        self,\n        owner: "ExecutionTreeBroker",\n        root_execution_id: str,\n    ) -> None:\n        self._owner = owner\n        self._root_execution_id = root_execution_id\n        self._pending: set[str] = set()\n        self._event = asyncio.Event()\n        self._closed = False\n\n    def publish(self, child_execution_id: str) -> None:\n        if self._closed:\n            return\n        self._pending.add(child_execution_id)\n        self._event.set()\n\n    def drain(self) -> tuple[str, ...]:\n        values = tuple(sorted(self._pending))\n        self._pending.clear()\n        self._event.clear()\n        if self._pending:\n            self._event.set()\n        return values\n\n    async def wait(self) -> tuple[str, ...]:\n        while not self._pending:\n            if self._closed:\n                return ()\n            self._event.clear()\n            if self._pending:\n                break\n            await self._event.wait()\n        return self.drain()\n\n    async def close(self) -> None:\n        if self._closed:\n            return\n        self._closed = True\n        self._owner._remove(self._root_execution_id, self)\n        self._event.set()\n\n\nclass ExecutionTreeBroker:\n    """Notify active tree readers about newly established children."""\n\n    def __init__(self) -> None:\n        self._subscriptions: dict[str, set[_ExecutionTreeSubscription]] = {}\n\n    def subscribe(self, root_execution_id: str) -> _ExecutionTreeSubscription:\n        subscription = _ExecutionTreeSubscription(self, root_execution_id)\n        self._subscriptions.setdefault(root_execution_id, set()).add(subscription)\n        return subscription\n\n    def publish(self, root_execution_id: str, child_execution_id: str) -> None:\n        for subscription in tuple(\n            self._subscriptions.get(root_execution_id, ())\n        ):\n            subscription.publish(child_execution_id)\n\n    def _remove(\n        self,\n        root_execution_id: str,\n        subscription: _ExecutionTreeSubscription,\n    ) -> None:\n        values = self._subscriptions.get(root_execution_id)\n        if values is None:\n            return\n        values.discard(subscription)\n        if not values:\n            self._subscriptions.pop(root_execution_id, None)\n''',
              '''class _ExecutionTreeSubscription:\n    def __init__(\n        self,\n        owner: "ExecutionTreeBroker",\n        parent_execution_id: str,\n    ) -> None:\n        self._owner = owner\n        self._parent_execution_id = parent_execution_id\n        self._pending: set[str] = set()\n        self._event = asyncio.Event()\n        self._closed = False\n\n    def publish(self, child_execution_id: str) -> None:\n        if self._closed:\n            return\n        self._pending.add(child_execution_id)\n        self._event.set()\n\n    def drain(self) -> tuple[str, ...]:\n        values = tuple(sorted(self._pending))\n        self._pending.clear()\n        self._event.clear()\n        if self._pending:\n            self._event.set()\n        return values\n\n    async def wait(self) -> tuple[str, ...]:\n        while not self._pending:\n            if self._closed:\n                return ()\n            self._event.clear()\n            if self._pending:\n                break\n            await self._event.wait()\n        return self.drain()\n\n    async def close(self) -> None:\n        if self._closed:\n            return\n        self._closed = True\n        self._owner._remove(self._parent_execution_id, self)\n        self._event.set()\n\n\nclass ExecutionTreeBroker:\n    """Notify active tree readers about newly established direct children."""\n\n    def __init__(self) -> None:\n        self._subscriptions: dict[str, set[_ExecutionTreeSubscription]] = {}\n\n    def subscribe(self, parent_execution_id: str) -> _ExecutionTreeSubscription:\n        subscription = _ExecutionTreeSubscription(self, parent_execution_id)\n        self._subscriptions.setdefault(parent_execution_id, set()).add(subscription)\n        return subscription\n\n    def publish(self, parent_execution_id: str, child_execution_id: str) -> None:\n        for subscription in tuple(\n            self._subscriptions.get(parent_execution_id, ())\n        ):\n            subscription.publish(child_execution_id)\n\n    def _remove(\n        self,\n        parent_execution_id: str,\n        subscription: _ExecutionTreeSubscription,\n    ) -> None:\n        values = self._subscriptions.get(parent_execution_id)\n        if values is None:\n            return\n        values.discard(subscription)\n        if not values:\n            self._subscriptions.pop(parent_execution_id, None)\n''',
          )
          replace_once(
              tree,
              '''        subscription = self._broker.subscribe(execution_id)\n        queue: asyncio.Queue[_TreeItem] = asyncio.Queue()\n        views: dict[str, ExecutionView] = {}\n        depths: dict[str, int] = {}\n        pumps: dict[str, asyncio.Task[None]] = {}\n        completed: set[str] = set()\n''',
              '''        queue: asyncio.Queue[_TreeItem] = asyncio.Queue()\n        views: dict[str, ExecutionView] = {}\n        depths: dict[str, int] = {}\n        pumps: dict[str, asyncio.Task[None]] = {}\n        child_pumps: dict[str, asyncio.Task[None]] = {}\n        subscriptions: dict[str, _ExecutionTreeSubscription] = {}\n        completed: set[str] = set()\n''',
          )
          replace_once(
              tree,
              '''        async def pump_children() -> None:\n            while True:\n                child_ids = await subscription.wait()\n                if not child_ids:\n                    return\n                for child_id in child_ids:\n                    await queue.put(_ChildItem(child_id))\n''',
              '''        async def pump_children(\n            subscription: _ExecutionTreeSubscription,\n        ) -> None:\n            while True:\n                child_ids = await subscription.wait()\n                if not child_ids:\n                    return\n                for child_id in child_ids:\n                    await queue.put(_ChildItem(child_id))\n''',
          )
          replace_once(
              tree,
              '''            views[view.execution_id] = view\n            depths[view.execution_id] = depth\n            pumps[view.execution_id] = asyncio.create_task(\n                pump(view),\n                name=f"execution-tree-stream-{view.execution_id}",\n            )\n''',
              '''            views[view.execution_id] = view\n            depths[view.execution_id] = depth\n            subscription = self._broker.subscribe(view.execution_id)\n            subscriptions[view.execution_id] = subscription\n            child_pumps[view.execution_id] = asyncio.create_task(\n                pump_children(subscription),\n                name=f"execution-tree-children-{view.execution_id}",\n            )\n            pumps[view.execution_id] = asyncio.create_task(\n                pump(view),\n                name=f"execution-tree-stream-{view.execution_id}",\n            )\n''',
          )
          replace_once(
              tree,
              '''                    or view.parent_invocation_id is not None\n                    or view.root_execution_id != execution_id\n                    or view.lineage_kind is ExecutionLineageKind.SUBAGENT\n''',
              '''                    or view.parent_invocation_id is not None\n                    or view.lineage_kind is ExecutionLineageKind.SUBAGENT\n''',
          )
          replace_once(
              tree,
              '''                view.lineage_kind is not ExecutionLineageKind.SUBAGENT\n                or view.root_execution_id != execution_id\n                or not view.parent_execution_id\n''',
              '''                view.lineage_kind is not ExecutionLineageKind.SUBAGENT\n                or view.root_execution_id != views[execution_id].root_execution_id\n                or not view.parent_execution_id\n''',
          )
          replace_once(
              tree,
              '''        child_pump: asyncio.Task[None] | None = None\n        try:\n''',
              '''        try:\n''',
          )
          replace_once(
              tree,
              '''            child_pump = asyncio.create_task(\n                pump_children(),\n                name=f"execution-tree-children-{execution_id}",\n            )\n\n            while True:\n''',
              '''            while True:\n''',
          )
          replace_once(
              tree,
              '''                    for child_id in subscription.drain():\n                        added = await discover_child(child_id) or added\n                    if not added and queue.empty():\n                        return\n        finally:\n            if child_pump is not None and not child_pump.done():\n                child_pump.cancel()\n            for task in pumps.values():\n                if not task.done():\n                    task.cancel()\n            await asyncio.gather(\n                *(\n                    task\n                    for task in (child_pump, *pumps.values())\n                    if task is not None\n                ),\n                return_exceptions=True,\n            )\n            await subscription.close()\n''',
              '''                    for subscription in tuple(subscriptions.values()):\n                        for child_id in subscription.drain():\n                            added = await discover_child(child_id) or added\n                    if not added and queue.empty():\n                        return\n        finally:\n            for task in (*child_pumps.values(), *pumps.values()):\n                if not task.done():\n                    task.cancel()\n            await asyncio.gather(\n                *child_pumps.values(),\n                *pumps.values(),\n                return_exceptions=True,\n            )\n            for subscription in tuple(subscriptions.values()):\n                await subscription.close()\n''',
          )

          test = Path("tests/ai/test_subagent_execution_tree.py")
          value = test.read_text()
          value = value.replace(
              "from datetime import datetime, timezone\n",
              "from dataclasses import replace\nfrom datetime import datetime, timezone\nfrom unittest.mock import AsyncMock\n",
              1,
          )
          value = value.replace(
              "from linktools.ai.runtime._execution_tree import (\n",
              "from linktools.ai.errors import AIError, ErrorCode\nfrom linktools.ai.runtime._execution import DefaultExecutionService\nfrom linktools.ai.runtime._execution_tree import (\n",
              1,
          )
          value = value.replace(
              "    ExecutionStreamEvent,\n    ExecutionView,\n",
              "    ExecutionStreamEvent,\n    ExecutionView,\n    ForkExecutionRequest,\n    RetryExecutionRequest,\n",
              1,
          )
          value += '''\n\ndef test_non_subagent_lineage_rejects_parent_execution() -> None:\n    with pytest.raises(ValueError):\n        replace(\n            _record(subagent=False, parent_invocation_id=None),\n            parent_execution_id="parent",\n        )\n\n\nclass _RetryExecutionReader:\n    def __init__(self) -> None:\n        self.root = ExecutionView(\n            "retry",\n            "root-agent",\n            ExecutionStatus.STARTED,\n            ExecutionLineageKind.RETRY,\n            None,\n            "original-root",\n            None,\n        )\n        self.child = ExecutionView(\n            "retry-child",\n            "child-agent",\n            ExecutionStatus.SUCCEEDED,\n            ExecutionLineageKind.SUBAGENT,\n            "retry",\n            "original-root",\n            "retry-delegate",\n        )\n\n    async def inspect(\n        self,\n        execution_id: str,\n        *,\n        principal: Principal,\n    ) -> ExecutionView:\n        del principal\n        return self.root if execution_id == "retry" else self.child\n\n    async def list_children(\n        self,\n        execution_id: str,\n        *,\n        principal: Principal,\n    ) -> tuple[ExecutionView, ...]:\n        del principal\n        return (self.child,) if execution_id == "retry" else ()\n\n\n@pytest.mark.asyncio\nasync def test_tree_stream_accepts_retry_lineage_root() -> None:\n    streamer = ExecutionTreeStreamer(\n        _RetryExecutionReader(),\n        _EventStreamer(),\n        ExecutionTreeBroker(),\n    )\n    values = [\n        item\n        async for item in streamer.stream(\n            "retry",\n            principal=Principal("owner", "tenant", "service"),\n        )\n    ]\n    assert {(item.execution_id, item.root_execution_id) for item in values} == {\n        ("retry", "original-root"),\n        ("retry-child", "original-root"),\n    }\n\n\n@pytest.mark.asyncio\nasync def test_tree_broker_keys_notifications_by_direct_parent() -> None:\n    broker = ExecutionTreeBroker()\n    parent = broker.subscribe("retry")\n    historical_root = broker.subscribe("original-root")\n    broker.publish("retry", "child")\n    assert parent.drain() == ("child",)\n    assert historical_root.drain() == ()\n    await parent.close()\n    await historical_root.close()\n\n\n@pytest.mark.asyncio\nasync def test_subagent_execution_cannot_be_retried_or_forked(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    service = object.__new__(DefaultExecutionService)\n    child = _record(subagent=True, parent_invocation_id="delegate-call")\n    monkeypatch.setattr(\n        service,\n        "_load_authorized",\n        AsyncMock(return_value=child),\n    )\n    principal = Principal("owner", "tenant", "service")\n\n    with pytest.raises(AIError) as retry_error:\n        await service.retry(\n            "a" * 64,\n            "child",\n            RetryExecutionRequest("retry", principal, "retry-key"),\n        )\n    assert retry_error.value.code is ErrorCode.REQUEST_FIELD_INVALID\n\n    with pytest.raises(AIError) as fork_error:\n        await service.fork(\n            "a" * 64,\n            "child",\n            ForkExecutionRequest("fork", principal, "fork-key"),\n        )\n    assert fork_error.value.code is ErrorCode.REQUEST_FIELD_INVALID\n'''
          test.write_text(value)
          PY
      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Run targeted tests
        run: |
          python -m pytest -q \
            tests/ai/test_subagent_execution_tree.py \
            tests/ai/test_skill_subagent_final_refactor.py \
            tests/ai/test_execution_context_durability.py \
            tests/ai/test_local_execution_recovery.py \
            tests/ai/test_runtime_boundary_contract.py
      - name: Run linktools-ai gate
        run: python manage.py check linktools-ai
      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/ai-subagent-observability-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ai): preserve execution tree lineage semantics"
          git push origin HEAD:feat/ai-subagent-observability
