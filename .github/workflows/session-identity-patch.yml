name: Session identity patch

on:
  push:
    branches:
      - refactor/ai-durable-contract-convergence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/ai-durable-contract-convergence
      - name: Apply patch
        run: python .github/session_identity_patch.py
      - name: Validate patch
        run: |
          python -m py_compile linktools-ai/src/linktools/ai/runtime/state/_repositories.py tests/ai/test_session_admission.py
          git diff --check
      - name: Commit patch
        run: |
          rm -f .github/session_identity_patch.py .github/workflows/session-identity-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(ai): keep session durable identity immutable'
          git push origin HEAD:refactor/ai-durable-contract-convergence
