name: Temporary unified release gates test patch

on:
  push:
    branches:
      - refactor/unified-release-gates

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[temporal-test-isolation]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore optional Temporal test isolation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/ai/test_temporal_taskgraph_conformance.py")
          text = path.read_text(encoding="utf-8")
          old = '''    monkeypatch.setattr(\n        temporal_activity._temporal_activity,\n        "info",\n        lambda: SimpleNamespace(workflow_run_id="test-workflow-run"),\n    )\n'''
          new = '''    monkeypatch.setattr(\n        temporal_activity,\n        "_temporal_activity",\n        SimpleNamespace(info=lambda: SimpleNamespace(workflow_run_id="test-workflow-run")),\n    )\n'''
          if old not in text:
              raise SystemExit("expected Temporal fixture pattern not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ai/test_temporal_taskgraph_conformance.py
          git commit -m "test(ai): isolate optional Temporal activity [temporal-test-isolation]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
