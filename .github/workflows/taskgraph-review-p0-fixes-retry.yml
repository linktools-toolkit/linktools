name: TaskGraph semantic review fixes retry

on:
  push:
    branches:
      - feat/ai-taskgraph-reliable-mixed-nodes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-taskgraph-reliable-mixed-nodes
          fetch-depth: 2
      - name: Apply reviewed semantic fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/taskgraph-review-p0-fixes.yml').read_text()
          start = source.index('          from pathlib import Path\n')
          end = source.index('          PY\n      - name: Commit reviewed fixes', start)
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in source[start:end].splitlines()
          ) + '\n'

          repo_start = script.index('path = "linktools-ai/src/linktools/ai/runtime/state/_repositories.py"\n')
          repo_end = script.index('# Explicit graph cancellation', repo_start)
          repo_patch = '''path = "linktools-ai/src/linktools/ai/runtime/state/_repositories.py"\nreplace_range(\n    path,\n    'def _graph_status(nodes: "tuple[TaskNodeView, ...]") -> TaskStatus:\\n',\n    '\\ndef _record_cursor',\n    ''' + repr('''def _graph_status(nodes: "tuple[TaskNodeView, ...]") -> TaskStatus:\n    statuses = {node.status for node in nodes}\n    if not statuses or statuses <= {TaskStatus.SUCCEEDED}:\n        return TaskStatus.SUCCEEDED\n    if TaskStatus.FAILED in statuses:\n        return TaskStatus.FAILED\n    if TaskStatus.BLOCKED in statuses:\n        return TaskStatus.BLOCKED\n    if statuses <= {TaskStatus.CANCELLED, TaskStatus.SUCCEEDED}:\n        return TaskStatus.CANCELLED\n    if TaskStatus.RUNNING in statuses:\n        return TaskStatus.RUNNING\n    return TaskStatus.PENDING\n''') + ''',\n)\n\n'''
          script = script[:repo_start] + repo_patch + script[repo_end:]
          exec(compile(script, '<taskgraph-reviewed-fixes>', 'exec'))
          PY
      - name: Commit reviewed fixes
        run: |
          rm .github/workflows/taskgraph-review-p0-fixes.yml
          rm .github/workflows/taskgraph-review-p0-fixes-retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add linktools-ai/src/linktools/ai .github/workflows
          git diff --check
          git commit -m 'fix(ai-task): restore lease and cancellation invariants'
          git push origin HEAD:feat/ai-taskgraph-reliable-mixed-nodes
