name: _tmp apply ai remaining owners v4

on:
  push:
    branches:
      - tmp/ai-runtime-capabilitygroup-agent-newfiles-v4

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/_transport/ai-runtime-capabilitygroup-agent-newfiles-v4/part-* | base64 -d | gzip -d > /tmp/ai-newfiles.patch
          echo '767420f45dd27ceb1ebbc3035a8da56061c1df7685ea5213564e27d66bb9061a  /tmp/ai-newfiles.patch' | sha256sum -c -

      - name: Apply remaining owners and squash
        shell: bash
        run: |
          set -euo pipefail
          baseline='77ce66cc3a68938181ec752cd30d9be5ab24d63b'
          target='refactor/ai-runtime-capabilitygroup-agent'
          current="$(git ls-remote origin "refs/heads/${target}" | cut -f1)"
          git checkout -B "${target}" "${current}"
          rm -f \
            linktools-ai/src/linktools/ai/runtime/_agent_executor.py \
            linktools-ai/src/linktools/ai/runtime/_capabilities.py \
            linktools-ai/src/linktools/ai/runtime/_history.py
          args=(
            --include=linktools-ai/src/linktools/ai/runtime/_agent_executor.py
            --include=linktools-ai/src/linktools/ai/runtime/_capabilities.py
            --include=linktools-ai/src/linktools/ai/runtime/_history.py
          )
          git apply --check "${args[@]}" /tmp/ai-newfiles.patch
          git apply "${args[@]}" /tmp/ai-newfiles.patch
          rm -f .github/workflows/_tmp-finalize-ai-runtime-refactor.yml
          git diff --check
          python -m compileall -q linktools-ai/src scripts/check/ai
          git add -A
          git reset --soft "${baseline}"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(ai): unify runtime capability composition'
          git push --force-with-lease="refs/heads/${target}:${current}" origin "HEAD:refs/heads/${target}"
