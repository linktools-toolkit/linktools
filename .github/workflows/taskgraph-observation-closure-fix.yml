name: TaskGraph observation closure fix

on:
  push:
    branches:
      - feat/ai-taskgraph-reliable-mixed-nodes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Patch verify and commit
        run: python .github/taskgraph_observation_closure_fix.py
