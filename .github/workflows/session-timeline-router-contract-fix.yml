name: Session Timeline Router Contract Fix

on:
  push:
    branches:
      - feat/ai-session-timeline
    paths:
      - .github/workflows/session-timeline-router-contract-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ai-session-timeline
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Apply reviewed cleanup
        run: |
          git checkout 34e22edca21beeacd519e058b5eb5f3075d1e513 -- \
            linktools-ai/src/linktools/ai/runtime/state/_retention.py
          git rm tests/ai/test_session_retention.py
          cat > /tmp/session-router.patch <<'PATCH'
          diff --git a/linktools-ai/src/linktools/ai/runtime/_session.py b/linktools-ai/src/linktools/ai/runtime/_session.py
          --- a/linktools-ai/src/linktools/ai/runtime/_session.py
          +++ b/linktools-ai/src/linktools/ai/runtime/_session.py
          @@ -192,6 +192,14 @@ class _SessionTranscriptStore(Protocol):
          +    def iter_conversation_messages(
          +        self,
          +        *,
          +        history_id: str | None,
          +        step_run_id: str,
          +        tenant_id: str,
          +    ) -> AsyncIterator[object]: ...
          +
               def iter_conversation_message_range(
                   self,
                   *,
          @@ -677,18 +685,11 @@ class DefaultSessionService:
                       return
                   history_id = record.continuation.history_id or record.history_id
          -        if history_id is not None:
          -            async for message in self._transcript_store.iter_session_messages(
          -                history_id,
          -                tenant_id=record.tenant_id,
          -            ):
          -                yield message
          -            return
          -        async for message in self._transcript_store.iter_messages(
          -            run_id=record.continuation.step_run_id,
          +        async for message in self._transcript_store.iter_conversation_messages(
          +            history_id=history_id,
          +            step_run_id=record.continuation.step_run_id,
          +            tenant_id=record.tenant_id,
                   ):
                       yield message
          
               def iter_session_messages(
          diff --git a/linktools-ai/src/linktools/ai/runtime/state/_steps.py b/linktools-ai/src/linktools/ai/runtime/state/_steps.py
          --- a/linktools-ai/src/linktools/ai/runtime/state/_steps.py
          +++ b/linktools-ai/src/linktools/ai/runtime/state/_steps.py
          @@ -2188,6 +2188,42 @@ class RuntimeStepStore(StepStore):
                   ):
                       yield message
          
          +    def iter_conversation_messages(
          +        self,
          +        *,
          +        history_id: str | None,
          +        step_run_id: str,
          +        tenant_id: str,
          +    ) -> AsyncIterator[object]:
          +        return self._iter_conversation_messages(
          +            history_id=history_id,
          +            step_run_id=step_run_id,
          +            tenant_id=tenant_id,
          +        )
          +
          +    async def _iter_conversation_messages(
          +        self,
          +        *,
          +        history_id: str | None,
          +        step_run_id: str,
          +        tenant_id: str,
          +    ) -> AsyncIterator[object]:
          +        archive = self._archives.get(RuntimeDomain.CONVERSATION)
          +        if isinstance(archive, StateStepArchive):
          +            if history_id is None:
          +                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)
          +            async for message in archive.iter_session_messages(
          +                history_id,
          +                tenant_id=tenant_id,
          +            ):
          +                yield message
          +            return
          +        if isinstance(archive, InMemoryStepArchive):
          +            async for message in archive.iter_messages(run_id=step_run_id):
          +                yield message
          +            return
          +        raise AIError(ErrorCode.STORAGE_DEPENDENCY_NOT_READY)
          +
               async def conversation_message_count(
                   self,
                   *,
          diff --git a/tests/ai/test_session_timeline.py b/tests/ai/test_session_timeline.py
          --- a/tests/ai/test_session_timeline.py
          +++ b/tests/ai/test_session_timeline.py
          @@ -366,6 +366,16 @@ async def test_session_timeline_restores_original_prompt_without_runtime_instruct
                   assert "stale answer" not in rendered
                   assert older.next_cursor is None
                   assert executions.get_many_calls == 2
          +
          +        restored = [
          +            message
          +            async for message in service.iter_session_messages(
          +                "session", principal=principal
          +            )
          +        ]
          +        restored_text = repr(restored)
          +        assert "visible answer" in restored_text
          +        assert "stale answer" not in restored_text
               finally:
                   await state.close()
          
          PATCH
          sed -i 's/^          //' /tmp/session-router.patch
          git apply --check /tmp/session-router.patch
          git apply /tmp/session-router.patch
          git diff --check
      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt
          python manage.py install --editable --quiet
      - name: Validate focused behavior
        run: |
          python -m compileall -q \
            linktools-ai/src/linktools/ai/runtime/_session.py \
            linktools-ai/src/linktools/ai/runtime/state/_steps.py \
            linktools-ai/src/linktools/ai/runtime/state/_retention.py
          python -m pytest -q \
            tests/ai/test_session_timeline.py \
            tests/ai/test_session_timeline_fork.py \
            tests/ai/test_session_timeline_recovery.py \
            tests/ai/test_session_timeline_runtime.py \
            tests/ai/test_session_timeline_storage.py
          python manage.py check linktools-ai
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            linktools-ai/src/linktools/ai/runtime/_session.py \
            linktools-ai/src/linktools/ai/runtime/state/_steps.py \
            linktools-ai/src/linktools/ai/runtime/state/_retention.py \
            tests/ai/test_session_timeline.py
          git rm .github/workflows/session-timeline-router-contract-fix.yml
          git diff --cached --check
          git commit -m "refactor(ai): simplify session conversation routing"
          git push origin HEAD:feat/ai-session-timeline
