name: Session Timeline Router Contract Fix

on:
  push:
    branches:
      - feat/ai-session-timeline
    paths:
      - .github/workflows/session-timeline-router-contract-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ai-session-timeline
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Apply reviewed cleanup
        run: |
          git checkout 34e22edca21beeacd519e058b5eb5f3075d1e513 -- \
            linktools-ai/src/linktools/ai/runtime/state/_retention.py
          git rm tests/ai/test_session_retention.py
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          session_path = 'linktools-ai/src/linktools/ai/runtime/_session.py'
          replace_once(
              session_path,
              'class _SessionTranscriptStore(Protocol):\n'
              '    def iter_conversation_message_range(\n',
              'class _SessionTranscriptStore(Protocol):\n'
              '    def iter_conversation_messages(\n'
              '        self,\n'
              '        *,\n'
              '        history_id: str | None,\n'
              '        step_run_id: str,\n'
              '        tenant_id: str,\n'
              '    ) -> AsyncIterator[object]: ...\n\n'
              '    def iter_conversation_message_range(\n',
          )
          replace_once(
              session_path,
              '            history_id = record.continuation.history_id or record.history_id\n'
              '            if history_id is not None:\n'
              '                async for message in self._transcript_store.iter_session_messages(\n'
              '                    history_id,\n'
              '                    tenant_id=record.tenant_id,\n'
              '                ):\n'
              '                    yield message\n'
              '                return\n'
              '            async for message in self._transcript_store.iter_messages(\n'
              '                run_id=record.continuation.step_run_id,\n'
              '            ):\n'
              '                yield message\n',
              '            history_id = record.continuation.history_id or record.history_id\n'
              '            async for message in self._transcript_store.iter_conversation_messages(\n'
              '                history_id=history_id,\n'
              '                step_run_id=record.continuation.step_run_id,\n'
              '                tenant_id=record.tenant_id,\n'
              '            ):\n'
              '                yield message\n',
          )

          steps_path = 'linktools-ai/src/linktools/ai/runtime/state/_steps.py'
          marker = '    async def conversation_message_count(\n'
          router = (
              '    def iter_conversation_messages(\n'
              '        self,\n'
              '        *,\n'
              '        history_id: str | None,\n'
              '        step_run_id: str,\n'
              '        tenant_id: str,\n'
              '    ) -> AsyncIterator[object]:\n'
              '        return self._iter_conversation_messages(\n'
              '            history_id=history_id,\n'
              '            step_run_id=step_run_id,\n'
              '            tenant_id=tenant_id,\n'
              '        )\n\n'
              '    async def _iter_conversation_messages(\n'
              '        self,\n'
              '        *,\n'
              '        history_id: str | None,\n'
              '        step_run_id: str,\n'
              '        tenant_id: str,\n'
              '    ) -> AsyncIterator[object]:\n'
              '        archive = self._archives.get(RuntimeDomain.CONVERSATION)\n'
              '        if isinstance(archive, StateStepArchive):\n'
              '            if history_id is None:\n'
              '                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n'
              '            async for message in archive.iter_session_messages(\n'
              '                history_id,\n'
              '                tenant_id=tenant_id,\n'
              '            ):\n'
              '                yield message\n'
              '            return\n'
              '        if isinstance(archive, InMemoryStepArchive):\n'
              '            async for message in archive.iter_messages(run_id=step_run_id):\n'
              '                yield message\n'
              '            return\n'
              '        raise AIError(ErrorCode.STORAGE_DEPENDENCY_NOT_READY)\n\n'
          )
          replace_once(steps_path, marker, router + marker)

          test_path = 'tests/ai/test_session_timeline.py'
          replace_once(
              test_path,
              '        assert older.next_cursor is None\n'
              '        assert executions.get_many_calls == 2\n',
              '        assert older.next_cursor is None\n'
              '        assert executions.get_many_calls == 2\n\n'
              '        restored = [\n'
              '            message\n'
              '            async for message in service.iter_session_messages(\n'
              '                "session", principal=principal\n'
              '            )\n'
              '        ]\n'
              '        restored_text = repr(restored)\n'
              '        assert "visible answer" in restored_text\n'
              '        assert "stale answer" not in restored_text\n',
          )
          PY
          git diff --check
      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt
          python manage.py install --editable --quiet
      - name: Validate focused behavior
        run: |
          python -m compileall -q \
            linktools-ai/src/linktools/ai/runtime/_session.py \
            linktools-ai/src/linktools/ai/runtime/state/_steps.py \
            linktools-ai/src/linktools/ai/runtime/state/_retention.py
          python -m pytest -q \
            tests/ai/test_session_timeline.py \
            tests/ai/test_session_timeline_fork.py \
            tests/ai/test_session_timeline_recovery.py \
            tests/ai/test_session_timeline_runtime.py \
            tests/ai/test_session_timeline_storage.py
          python manage.py check linktools-ai
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            linktools-ai/src/linktools/ai/runtime/_session.py \
            linktools-ai/src/linktools/ai/runtime/state/_steps.py \
            linktools-ai/src/linktools/ai/runtime/state/_retention.py \
            tests/ai/test_session_timeline.py
          git rm .github/workflows/session-timeline-router-contract-fix.yml
          git diff --cached --check
          git commit -m "refactor(ai): simplify session conversation routing"
          git push origin HEAD:feat/ai-session-timeline
