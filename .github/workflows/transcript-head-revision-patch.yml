name: Transcript head revision patch

on:
  push:
    branches:
      - refactor/ai-durable-contract-convergence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/ai-durable-contract-convergence
      - name: Apply patch
        run: python .github/transcript_head_revision_patch.py
      - name: Validate patch
        run: |
          python -m py_compile \
            linktools-ai/src/linktools/ai/runtime/state/_contracts.py \
            linktools-ai/src/linktools/ai/runtime/state/_history.py \
            linktools-ai/src/linktools/ai/runtime/state/_repositories.py \
            tests/ai/test_durable_model_convergence.py
          git diff --check
      - name: Commit patch
        run: |
          rm -f \
            .github/transcript_head_revision_patch.py \
            .github/workflows/transcript-head-revision-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor(ai): derive transcript head revision from storage'
          git push origin HEAD:refactor/ai-durable-contract-convergence
