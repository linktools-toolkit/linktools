name: AI Persistence Compatibility Validation

on:
  push:
    branches:
      - refactor/ai-agent-runtime-asset-composition-impl

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -e ./linktools -e './linktools-ai[sqlite,evaluation,temporal]' pytest pytest-asyncio ruff
      - name: Apply implementation
        run: python .bootstrap/apply_runtime_persistence_compat.py
      - name: Compile
        run: python -m compileall -q linktools-ai/src/linktools/ai
      - name: Ruff E/F
        run: ruff check --select E4,E7,E9,F linktools-ai/src/linktools/ai tests/ai
      - name: Persistence contract
        working-directory: linktools-ai
        run: python -m scripts.build.persistence
      - name: Architecture gate
        working-directory: linktools-ai
        run: python -m scripts.build.architecture
      - name: Tests
        run: pytest -q tests/ai
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add linktools-ai/src/linktools/ai/runtime/state/_codec.py \
                  linktools-ai/src/linktools/ai/runtime/state/_migration.py \
                  linktools-ai/src/linktools/ai/agent/_binding.py \
                  linktools-ai/scripts/build/persistence.py \
                  linktools-ai/scripts/build/matrix/runtime-persistence-v1.json \
                  tests/ai/test_runtime_persistence_compatibility.py
          git diff --cached --quiet && exit 0
          git commit -m 'refactor(ai): version runtime persistence schemas'
          git push origin HEAD:refactor/ai-agent-runtime-asset-composition-impl
