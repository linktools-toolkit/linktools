          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          """Derived live event projection over one durable execution tree."""

          import asyncio
          from collections.abc import AsyncIterator, Mapping
          from typing import Protocol

          from ..core import ExecutionLineageKind, Principal
          from ..errors import AIError, ErrorCode
          from .service_api import ExecutionStreamEvent, ExecutionTreeEvent, ExecutionView


          class _ExecutionTreeReader(Protocol):
              async def inspect(
                  self,
                  execution_id: str,
                  *,
                  principal: Principal,
              ) -> ExecutionView: ...

              async def list_children(
                  self,
                  execution_id: str,
                  *,
                  principal: Principal,
              ) -> tuple[ExecutionView, ...]: ...


          class _ExecutionEventStreamer(Protocol):
              def stream(
                  self,
                  execution_id: str,
                  *,
                  principal: Principal,
                  after_sequence: int = 0,
              ) -> AsyncIterator[ExecutionStreamEvent]: ...


          class _ExecutionTreeSubscription:
              def __init__(self, owner: "ExecutionTreeBroker", root_execution_id: str) -> None:
                  self._owner = owner
                  self._root_execution_id = root_execution_id
                  self._pending: set[str] = set()
                  self._event = asyncio.Event()
                  self._closed = False

              def publish(self, child_execution_id: str) -> None:
                  if self._closed:
                      return
                  self._pending.add(child_execution_id)
                  self._event.set()

              def drain(self) -> tuple[str, ...]:
                  values = tuple(sorted(self._pending))
                  self._pending.clear()
                  self._event.clear()
                  if self._pending:
                      self._event.set()
                  return values

              async def wait(self) -> tuple[str, ...]:
                  while not self._pending:
                      self._event.clear()
                      if self._pending:
                          break
                      await self._event.wait()
                  return self.drain()

              async def close(self) -> None:
                  if self._closed:
                      return
                  self._closed = True
                  self._owner._remove(self._root_execution_id, self)
                  self._event.set()


          class ExecutionTreeBroker:
              """Notify active tree readers about newly established child executions."""

              def __init__(self) -> None:
                  self._subscriptions: dict[str, set[_ExecutionTreeSubscription]] = {}

              def subscribe(self, root_execution_id: str) -> _ExecutionTreeSubscription:
                  subscription = _ExecutionTreeSubscription(self, root_execution_id)
                  self._subscriptions.setdefault(root_execution_id, set()).add(subscription)
                  return subscription

              def publish(self, root_execution_id: str, child_execution_id: str) -> None:
                  for subscription in tuple(
                      self._subscriptions.get(root_execution_id, ())
                  ):
                      subscription.publish(child_execution_id)

              def _remove(
                  self,
                  root_execution_id: str,
                  subscription: _ExecutionTreeSubscription,
              ) -> None:
                  values = self._subscriptions.get(root_execution_id)
                  if values is None:
                      return
                  values.discard(subscription)
                  if not values:
                      self._subscriptions.pop(root_execution_id, None)


          class ExecutionTreeStreamer:
              """Merge per-execution streams without creating a second durable event log."""

              def __init__(
                  self,
                  executions: _ExecutionTreeReader,
                  events: _ExecutionEventStreamer,
                  broker: ExecutionTreeBroker,
              ) -> None:
                  self._executions = executions
                  self._events = events
                  self._broker = broker

              def stream(
                  self,
                  execution_id: str,
                  *,
                  principal: Principal,
                  after_sequences: Mapping[str, int] | None = None,
              ) -> AsyncIterator[ExecutionTreeEvent]:
                  cursors = _normalize_after_sequences(after_sequences)
                  return self._stream(
                      execution_id,
                      principal=principal,
                      after_sequences=cursors,
                  )

              async def _stream(
                  self,
                  execution_id: str,
                  *,
                  principal: Principal,
                  after_sequences: Mapping[str, int],
              ) -> AsyncIterator[ExecutionTreeEvent]:
                  subscription = self._broker.subscribe(execution_id)
                  queue: asyncio.Queue[
                      tuple[ExecutionView, ExecutionStreamEvent | None, BaseException | None]
                  ] = asyncio.Queue()
                  views: dict[str, ExecutionView] = {}
                  depths: dict[str, int] = {}
                  tasks: dict[str, asyncio.Task[None]] = {}
                  completed: set[str] = set()

                  async def consume(view: ExecutionView) -> None:
                      try:
                          async for event in self._events.stream(
                              view.execution_id,
                              principal=principal,
                              after_sequence=after_sequences.get(view.execution_id, 0),
                          ):
                              await queue.put((view, event, None))
                      except BaseException as error:  # noqa: BLE001
                          await queue.put((view, None, error))
                      finally:
                          await queue.put((view, None, None))

                  def start(view: ExecutionView, depth: int) -> bool:
                      existing = views.get(view.execution_id)
                      if existing is not None:
                          if existing != view or depths[view.execution_id] != depth:
                              raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)
                          return False
                      views[view.execution_id] = view
                      depths[view.execution_id] = depth
                      tasks[view.execution_id] = asyncio.create_task(
                          consume(view),
                          name=f"execution-tree-stream-{view.execution_id}",
                      )
                      return True

                  async def discover(view: ExecutionView, depth: int) -> None:
                      if depth == 0:
                          if (
                              view.execution_id != execution_id
                              or view.parent_execution_id is not None
                              or view.root_execution_id != execution_id
                          ):
                              raise AIError(ErrorCode.REQUEST_FIELD_INVALID)
                      elif (
                          view.lineage_kind is not ExecutionLineageKind.SUBAGENT
                          or view.root_execution_id != execution_id
                          or view.parent_execution_id is None
                          or not view.parent_invocation_id
                      ):
                          raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)
                      start(view, depth)
                      children = await self._executions.list_children(
                          view.execution_id,
                          principal=principal,
                      )
                      for child in children:
                          if child.parent_execution_id != view.execution_id:
                              raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)
                          await discover(child, depth + 1)

                  broker_wait: asyncio.Task[tuple[str, ...]] | None = None
                  queue_wait: asyncio.Task[
                      tuple[ExecutionView, ExecutionStreamEvent | None, BaseException | None]
                  ] | None = None
                  try:
                      root = await self._executions.inspect(
                          execution_id,
                          principal=principal,
                      )
                      await discover(root, 0)
                      broker_wait = asyncio.create_task(
                          subscription.wait(),
                          name=f"execution-tree-children-{execution_id}",
                      )
                      queue_wait = asyncio.create_task(
                          queue.get(),
                          name=f"execution-tree-events-{execution_id}",
                      )
                      while True:
                          done, _pending = await asyncio.wait(
                              {broker_wait, queue_wait},
                              return_when=asyncio.FIRST_COMPLETED,
                          )
                          if broker_wait in done:
                              child_ids = broker_wait.result()
                              broker_wait = asyncio.create_task(
                                  subscription.wait(),
                                  name=f"execution-tree-children-{execution_id}",
                              )
                              for child_id in child_ids:
                                  child = await self._executions.inspect(
                                      child_id,
                                      principal=principal,
                                  )
                                  parent_id = child.parent_execution_id
                                  parent = views.get(parent_id) if parent_id is not None else None
                                  if parent is None:
                                      await discover(root, 0)
                                      parent = views.get(parent_id) if parent_id is not None else None
                                  if parent is None:
                                      raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)
                                  await discover(child, depths[parent.execution_id] + 1)
                          if queue_wait in done:
                              view, event, error = queue_wait.result()
                              queue.task_done()
                              queue_wait = asyncio.create_task(
                                  queue.get(),
                                  name=f"execution-tree-events-{execution_id}",
                              )
                              if error is not None:
                                  raise error
                              if event is None:
                                  completed.add(view.execution_id)
                              else:
                                  yield ExecutionTreeEvent(
                                      view,
                                      depths[view.execution_id],
                                      event,
                                  )
                          if (
                              execution_id in completed
                              and all(task.done() for task in tasks.values())
                              and queue.empty()
                          ):
                              for child_id in subscription.drain():
                                  child = await self._executions.inspect(
                                      child_id,
                                      principal=principal,
                                  )
                                  parent_id = child.parent_execution_id
                                  parent = views.get(parent_id) if parent_id is not None else None
                                  if parent is None:
                                      raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)
                                  await discover(child, depths[parent.execution_id] + 1)
                              before = len(tasks)
                              await discover(root, 0)
                              if len(tasks) == before and queue.empty():
                                  return
                  finally:
                      if broker_wait is not None:
                          broker_wait.cancel()
                      if queue_wait is not None:
                          queue_wait.cancel()
                      for task in tasks.values():
                          if not task.done():
                              task.cancel()
                      await asyncio.gather(
                          *(task for task in (broker_wait, queue_wait) if task is not None),
                          *tasks.values(),
                          return_exceptions=True,
                      )
                      await subscription.close()


          def _normalize_after_sequences(
              value: Mapping[str, int] | None,
          ) -> Mapping[str, int]:
              if value is None:
                  return {}
              if not isinstance(value, Mapping):
                  raise AIError(ErrorCode.REQUEST_FIELD_INVALID)
              result: dict[str, int] = {}
              for execution_id, sequence in value.items():
                  if (
                      not isinstance(execution_id, str)
                      or not execution_id
                      or isinstance(sequence, bool)
                      or not isinstance(sequence, int)
                      or sequence < 0
                  ):
                      raise AIError(ErrorCode.REQUEST_FIELD_INVALID)
                  result[execution_id] = sequence
              return result


          __all__ = ["ExecutionTreeBroker", "ExecutionTreeStreamer"]
          '''))

          test_file = Path("tests/ai/test_subagent_execution_tree.py")
          test_file.write_text(textwrap.dedent('''\
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-

          from datetime import datetime, timezone

          import pytest
          from linktools.ai.agent import AgentBindingSnapshot
          from linktools.ai.core import (
              ExecutionEventType,
              ExecutionLineageKind,
              ExecutionStatus,
              Principal,
          )
          from linktools.ai.runtime._execution_tree import (
              ExecutionTreeBroker,
              ExecutionTreeStreamer,
          )
          from linktools.ai.runtime.service_api import (
              ExecutionStreamEvent,
              ExecutionView,
          )
          from linktools.ai.runtime.state import ExecutionRecord
          from linktools.ai.spec import AgentSpec


          def _binding(agent_id: str = "agent") -> AgentBindingSnapshot:
              spec = AgentSpec(agent_id)
              return AgentBindingSnapshot(
                  version=1,
                  agent_spec=spec,
                  model={},
                  selected=(),
                  subagents=(),
                  output_mode="text",
                  output_schema={},
                  binding_digest="a" * 64,
              )


          def _record(*, subagent: bool, parent_invocation_id: str | None) -> ExecutionRecord:
              now = datetime.now(timezone.utc)
              return ExecutionRecord(
                  execution_id="child" if subagent else "root",
                  tenant_id="tenant",
                  session_id=None,
                  binding_digest="a" * 64,
                  parent_execution_id="root" if subagent else None,
                  root_execution_id="root",
                  source_execution_id=None,
                  base_execution_id=None,
                  lineage_kind=(
                      ExecutionLineageKind.SUBAGENT
                      if subagent
                      else ExecutionLineageKind.RUN
                  ),
                  status=ExecutionStatus.STARTED,
                  revision=0,
                  event_sequence=0,
                  agent_run_sequence=0,
                  error_code=None,
                  safe_error_details={},
                  created_at=now,
                  updated_at=now,
                  mode="run",
                  planning=False,
                  thinking=False,
                  binding=_binding(),
                  parent_invocation_id=parent_invocation_id,
              )


          def test_subagent_lineage_requires_parent_invocation() -> None:
              with pytest.raises(ValueError):
                  _record(subagent=True, parent_invocation_id=None)
              child = _record(subagent=True, parent_invocation_id="tool-call")
              assert child.parent_invocation_id == "tool-call"
              with pytest.raises(ValueError):
                  _record(subagent=False, parent_invocation_id="tool-call")


          class _ExecutionReader:
              def __init__(self) -> None:
                  self.root = ExecutionView(
                      "root",
                      "root-agent",
                      ExecutionStatus.STARTED,
                      ExecutionLineageKind.RUN,
                      None,
                      "root",
                      None,
                  )
                  self.child = ExecutionView(
                      "child",
                      "child-agent",
                      ExecutionStatus.SUCCEEDED,
                      ExecutionLineageKind.SUBAGENT,
                      "root",
                      "root",
                      "delegate-call",
                  )

              async def inspect(
                  self,
                  execution_id: str,
                  *,
                  principal: Principal,
              ) -> ExecutionView:
                  del principal
                  return self.root if execution_id == "root" else self.child

              async def list_children(
                  self,
                  execution_id: str,
                  *,
                  principal: Principal,
              ) -> tuple[ExecutionView, ...]:
                  del principal
                  return (self.child,) if execution_id == "root" else ()


          class _EventStreamer:
              def stream(
                  self,
                  execution_id: str,
                  *,
                  principal: Principal,
                  after_sequence: int = 0,
              ):
                  del principal

                  async def events():
                      sequence = after_sequence + 1
                      yield ExecutionStreamEvent(
                          execution_id,
                          sequence,
                          ExecutionEventType.EXECUTION_SUCCEEDED,
                          {},
                      )

                  return events()


          @pytest.mark.asyncio
          async def test_tree_stream_projects_root_and_child_without_global_sequence() -> None:
              broker = ExecutionTreeBroker()
              streamer = ExecutionTreeStreamer(
                  _ExecutionReader(),
                  _EventStreamer(),
                  broker,
              )
              values = [
                  item
                  async for item in streamer.stream(
                      "root",
                      principal=Principal("owner", "tenant", "service"),
                      after_sequences={"child": 4},
                  )
              ]
              assert {(item.execution.execution_id, item.depth) for item in values} == {
                  ("root", 0),
                  ("child", 1),
              }
              child = next(
                  item for item in values if item.execution.execution_id == "child"
              )
              assert child.execution.parent_invocation_id == "delegate-call"
              assert child.event.durable_sequence == 5
          '''))
