name: Apply subagent observability implementation

on:
  push:
    branches:
      - feat/ai-subagent-observability
    paths:
      - .github/workflows/ai-subagent-observability-apply.yml

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ai-subagent-observability
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Apply implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def read(path: str) -> str:
              return Path(path).read_text()

          def write(path: str, value: str) -> None:
              Path(path).write_text(value)

          def replace_one(path: str, old: str, new: str) -> None:
              value = read(path)
              count = value.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, got {count}: {old[:120]!r}")
              write(path, value.replace(old, new, 1))

          def replace_all(path: str, old: str, new: str, *, minimum: int = 1) -> None:
              value = read(path)
              count = value.count(old)
              if count < minimum:
                  raise RuntimeError(f"{path}: expected at least {minimum} matches, got {count}: {old[:120]!r}")
              write(path, value.replace(old, new))

