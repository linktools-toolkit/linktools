name: AI core patch temp

on:
  push:
    branches:
      - refactor/ai-harness-capabilities
    paths:
      - .github/workflows/ai-core-patch-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/ai-harness-capabilities
      - name: Apply core attachment patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/patch.py
          python /tmp/patch.py
          python -m compileall -q linktools-ai/src/linktools/ai/runtime/_capabilities.py linktools-ai/src/linktools/ai/runtime/_capabilities_native.py linktools-ai/src/linktools/ai/capability/_workspace.py linktools-ai/src/linktools/ai/workspace/_sandbox.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(ai): restore portable workspace contracts'
          git push origin HEAD:refactor/ai-harness-capabilities
