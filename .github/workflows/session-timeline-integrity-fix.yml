name: Session Timeline Integrity Fix

on:
  push:
    branches:
      - feat/ai-session-timeline
    paths:
      - .github/workflows/session-timeline-integrity-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ai-session-timeline
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Apply integrity check
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('linktools-ai/src/linktools/ai/runtime/_session.py')
          text = path.read_text(encoding='utf-8')
          old = '''                if commit is not None:
                      base = message_bases[ref.session_id]
          '''
          new = '''                if commit is not None:
                      if commit.execution_id != ref.execution_id:
                          raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)
                      base = message_bases[ref.session_id]
          '''
          # YAML removes the common block indentation; use the source indentation.
          old = old.replace('                      ', '                    ')
          new = new.replace('                      ', '                    ')
          if text.count(old) != 1:
              raise SystemExit(f'expected one timeline commit projection site, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt
          python manage.py install --editable --quiet
      - name: Validate
        run: |
          python -m compileall -q linktools-ai/src/linktools/ai/runtime/_session.py
          python -m pytest -q tests/ai/test_session_timeline.py tests/ai/test_session_timeline_runtime.py tests/ai/test_session_timeline_fork.py tests/ai/test_session_timeline_recovery.py tests/ai/test_session_timeline_storage.py
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add linktools-ai/src/linktools/ai/runtime/_session.py
          git rm .github/workflows/session-timeline-integrity-fix.yml
          git diff --cached --check
          git commit -m "fix(ai): validate timeline commit ownership"
          git push origin HEAD:feat/ai-session-timeline
