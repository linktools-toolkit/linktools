name: TaskGraph final validation

on:
  push:
    branches:
      - feat/ai-taskgraph-reliable-mixed-nodes

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-taskgraph-reliable-mixed-nodes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install project
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U -r requirements.txt
          python manage.py install --editable
      - name: Run TaskGraph reliability tests
        shell: bash
        run: |
          python -m pytest -q \
            tests/ai/test_task_mixed_node_reliability.py \
            tests/ai/test_task_durable_recovery.py \
            tests/ai/test_task_runtime_recovery.py \
            tests/ai/test_task_sqlite_cas_convergence.py \
            tests/ai/test_cancellation_quiescence.py \
            tests/ai/test_error_cancellation_contract.py
      - name: Run linktools-ai release gates
        shell: bash
        run: |
          python manage.py check linktools-ai
          python manage.py build linktools-ai
          python manage.py verify linktools-ai
