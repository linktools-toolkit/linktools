name: TaskGraph final validation

on:
  push:
    branches:
      - feat/ai-taskgraph-reliable-mixed-nodes

permissions:
  contents: read

concurrency:
  group: taskgraph-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-taskgraph-reliable-mixed-nodes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install project
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U -r requirements.txt
          python manage.py install --editable
      - name: Diagnose Task scheduler bootstrap
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          import traceback
          import linktools.ai.task._local as task_local
          from linktools.ai.runtime import RuntimeState
          from linktools.ai.storage import StoredPayload
          from linktools.ai.task import (
              LocalTaskGraphLauncher,
              TaskGraph,
              TaskGraphAdmission,
              TaskGraphLaunch,
              TaskGraphLimits,
              TaskGraphRequest,
              TaskNode,
              TaskNodeRunResult,
          )
          from linktools.ai.workspace import trusted_workspace_principal

          original_scheduler_failure = task_local._scheduler_failure

          def diagnostic_scheduler_failure(error, graph_id):
              print("scheduler-original-error", type(error).__name__, repr(error))
              traceback.print_exception(type(error), error, error.__traceback__)
              return original_scheduler_failure(error, graph_id)

          task_local._scheduler_failure = diagnostic_scheduler_failure

          class Runner:
              def __init__(self) -> None:
                  self.entered = asyncio.Event()

              async def run(self, node, *, graph_id, principal, dependency_results, control):
                  del node, graph_id, principal, dependency_results, control
                  print("runner-entered")
                  self.entered.set()
                  payload = StoredPayload.inline_json({"ok": True})
                  return TaskNodeRunResult(payload.digest, result_payload=payload)

              async def cancel(self, node, *, graph_id, principal, dependency_results):
                  del node, graph_id, principal, dependency_results

          async def main() -> None:
              state = RuntimeState.in_memory()
              await state.initialize(namespace="task-bootstrap-diagnostic", tenant_id="tenant")
              launcher = None
              try:
                  principal = trusted_workspace_principal("tenant")
                  launch_graph = TaskGraph("launcher-graph", (TaskNode("node"),))
                  launch_request = TaskGraphRequest(
                      launch_graph,
                      principal,
                      idempotency_key="launcher-graph-run-0001",
                  )
                  launch_admission = TaskGraphAdmission.from_request(launch_request)
                  await state.task.admissions.admit(launch_admission, launch_graph)
                  print("before-launch", await state.task.tasks.list_nodes("launcher-graph", tenant_id="tenant"))
                  runner = Runner()
                  launcher = LocalTaskGraphLauncher(state.task.tasks, runner, owner="worker")
                  await launcher.start(TaskGraphLaunch(launch_graph, principal, TaskGraphLimits()))
                  try:
                      await asyncio.wait_for(runner.entered.wait(), 1)
                  except asyncio.TimeoutError:
                      print("after-timeout", await state.task.tasks.list_nodes("launcher-graph", tenant_id="tenant"))
                      generation = launcher.graph_activity_generation("launcher-graph", tenant_id="tenant")
                      print("launcher-generation", generation)
                      if generation is not None:
                          try:
                              await asyncio.wait_for(
                                  launcher.wait_graph_activity(
                                      "launcher-graph",
                                      tenant_id="tenant",
                                      after_generation=generation,
                                  ),
                                  0.1,
                              )
                          except BaseException as error:
                              print("launcher-wait-error", type(error).__name__, repr(error), getattr(error, "safe_details", None))
                      raise
              finally:
                  if launcher is not None:
                      await launcher.shutdown()
                  await state.close()

          asyncio.run(main())
          PY
      - name: Run new mixed-node reliability tests
        shell: bash
        run: timeout 180s python -m pytest -vv -q tests/ai/test_task_mixed_node_reliability.py
      - name: Run durable Task recovery tests
        shell: bash
        run: timeout 240s python -m pytest -vv -q tests/ai/test_task_durable_recovery.py tests/ai/test_task_runtime_recovery.py
      - name: Run Task CAS convergence tests
        shell: bash
        run: timeout 240s python -m pytest -vv -q tests/ai/test_task_sqlite_cas_convergence.py
      - name: Run cancellation regression tests
        shell: bash
        run: timeout 240s python -m pytest -vv -q tests/ai/test_cancellation_quiescence.py tests/ai/test_error_cancellation_contract.py
      - name: Check linktools-ai
        shell: bash
        run: timeout 300s python manage.py check linktools-ai
      - name: Build linktools-ai
        shell: bash
        run: timeout 300s python manage.py build linktools-ai
      - name: Verify linktools-ai
        shell: bash
        run: timeout 300s python manage.py verify linktools-ai
