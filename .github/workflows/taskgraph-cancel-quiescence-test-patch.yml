name: TaskGraph cancellation quiescence test patch

on:
  push:
    branches:
      - feat/ai-taskgraph-reliable-mixed-nodes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-taskgraph-reliable-mixed-nodes
      - name: Update cancelled cleanup shutdown contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/ai/test_cancellation_quiescence.py')
          text = path.read_text()
          old = '''@pytest.mark.asyncio\nasync def test_task_launcher_shutdown_rejects_runner_cancelled_leftover() -> None:\n    started = asyncio.Event()\n    release = asyncio.Event()\n\n    async def cleanup() -> None:\n        started.set()\n        try:\n            await asyncio.Event().wait()\n        except asyncio.CancelledError:\n            await release.wait()\n\n    task = asyncio.create_task(cleanup())\n    await started.wait()\n    task.cancel()\n    await asyncio.sleep(0)\n\n    class Runner:\n        @property\n        def pending_background_tasks(self) -> tuple[asyncio.Task[object], ...]:\n            return ()\n\n        @property\n        def pending_cancelled_tasks(self) -> tuple[asyncio.Task[object], ...]:\n            return () if task.done() else (task,)\n\n        @property\n        def background_failure(self) -> None:\n            return None\n\n    launcher = object.__new__(LocalTaskGraphLauncher)\n    launcher._accepting = True\n    launcher._runs = {}\n    launcher._lock = asyncio.Lock()\n    launcher._runner = Runner()\n\n    try:\n        with pytest.raises(AIError) as error:\n            await launcher.shutdown()\n        assert error.value.code is ErrorCode.STORAGE_RECOVERY_REQUIRED\n        assert error.value.safe_details["phase"] == "task_graph_shutdown"\n    finally:\n        release.set()\n        await task\n'''
          new = '''@pytest.mark.asyncio\nasync def test_task_launcher_shutdown_drains_runner_cancelled_leftover() -> None:\n    started = asyncio.Event()\n    release = asyncio.Event()\n\n    async def cleanup() -> None:\n        started.set()\n        try:\n            await asyncio.Event().wait()\n        except asyncio.CancelledError:\n            await release.wait()\n\n    task = asyncio.create_task(cleanup())\n    await started.wait()\n    task.cancel()\n    await asyncio.sleep(0)\n\n    class Runner:\n        @property\n        def pending_background_tasks(self) -> tuple[asyncio.Task[object], ...]:\n            return ()\n\n        @property\n        def pending_cancelled_tasks(self) -> tuple[asyncio.Task[object], ...]:\n            return () if task.done() else (task,)\n\n        @property\n        def background_failure(self) -> None:\n            return None\n\n    launcher = object.__new__(LocalTaskGraphLauncher)\n    launcher._accepting = True\n    launcher._runs = {}\n    launcher._lock = asyncio.Lock()\n    launcher._runner = Runner()\n\n    shutdown = asyncio.create_task(launcher.shutdown())\n    await asyncio.sleep(0)\n    assert not shutdown.done()\n\n    release.set()\n    await shutdown\n    assert task.done()\n'''
          if old not in text:
              raise SystemExit('cancelled leftover test block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit test and remove patch workflow
        run: |
          rm .github/workflows/taskgraph-cancel-quiescence-test-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/ai/test_cancellation_quiescence.py .github/workflows/taskgraph-cancel-quiescence-test-patch.yml
          git commit -m 'test(ai): verify cancelled task cleanup is drained'
          git push origin HEAD:feat/ai-taskgraph-reliable-mixed-nodes
