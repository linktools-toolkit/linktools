name: Temporary unified release gate diagnostics

on:
  push:
    branches:
      - refactor/unified-release-gates

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U -r requirements.txt
          python manage.py install --editable
      - name: Check linktools
        run: python manage.py check linktools
      - name: Check linktools-common
        run: python manage.py check linktools-common
      - name: Check linktools-mobile
        run: python manage.py check linktools-mobile
      - name: Check linktools-cntr
        run: python manage.py check linktools-cntr
      - name: Check linktools-ai
        run: python manage.py check linktools-ai
      - name: Check default package set
        run: python manage.py check
