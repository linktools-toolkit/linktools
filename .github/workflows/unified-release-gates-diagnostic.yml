name: Temporary unified release gate diagnostics

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate:
          - cntr-tests
          - ai-ruff-gates
          - ai-ruff-runtime
          - ai-ruff-commands
          - ai-ruff-tests
          - ai-tests-root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U -r requirements.txt
          python manage.py install --editable
      - name: Run diagnostic gate
        shell: bash
        run: |
          case "${{ matrix.gate }}" in
            cntr-tests)
              python -m pytest -q -p no:cacheprovider tests/cntr
              ;;
            ai-ruff-gates)
              ruff check --no-cache scripts/check/ai
              ;;
            ai-ruff-runtime)
              ruff check --no-cache linktools-ai/src/linktools/ai
              ;;
            ai-ruff-commands)
              ruff check --no-cache linktools-ai/src/linktools/commands/ai
              ;;
            ai-ruff-tests)
              ruff check --no-cache tests/ai
              ;;
            ai-tests-root)
              python -m pytest -q -p no:cacheprovider tests/ai
              ;;
          esac
