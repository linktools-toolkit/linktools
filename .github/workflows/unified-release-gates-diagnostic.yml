name: Temporary unified release gate diagnostics

on:
  push:
    branches:
      - refactor/unified-release-gates
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate:
          - cntr-python36
          - cntr-tests
          - ai-ruff
          - ai-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U -r requirements.txt
          python manage.py install --editable
      - name: Run diagnostic gate
        shell: bash
        run: |
          case "${{ matrix.gate }}" in
            cntr-python36)
              python scripts/check/python36.py manage.py scripts/check/python36.py linktools-cntr/src
              ;;
            cntr-tests)
              python -m pytest -q -p no:cacheprovider tests/cntr
              ;;
            ai-ruff)
              ruff check --no-cache scripts/check/ai linktools-ai/src/linktools/ai linktools-ai/src/linktools/commands/ai tests/ai
              ;;
            ai-tests)
              python -m pytest -q -p no:cacheprovider linktools-ai/tests tests/ai tests/test_import_surface.py
              ;;
          esac
