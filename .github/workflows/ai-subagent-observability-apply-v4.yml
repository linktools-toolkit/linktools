name: Apply subagent observability implementation v4

on:
  push:
    branches:
      - feat/ai-subagent-observability
    paths:
      - .github/workflows/ai-subagent-observability-apply-v4.yml

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ai-subagent-observability
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Apply implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path(".github/workflows/ai-subagent-observability-apply-v2.yml").read_text()
          block = source.split("          python - <<'PY'\n", 1)[1].split("\n          PY\n", 1)[0]
          exec(compile(textwrap.dedent(block), "subagent-observability-apply-v2", "exec"))

          path = Path("tests/ai/test_skill_subagent_final_refactor.py")
          value = path.read_text()
          name = "async def test_execution_service_replays_subagent_from_persisted_child_binding() -> None:"
          start = value.index(name)
          end = value.index("\n\n@pytest.mark.asyncio", start + len(name))
          segment = value[start:end]

          fixture_old = '        root_execution_id="root-execution",\n        planning=True,\n'
          fixture_new = (
              '        root_execution_id="root-execution",\n'
              '        parent_invocation_id="delegate-call",\n'
              '        planning=True,\n'
          )
          if segment.count(fixture_old) != 1:
              raise RuntimeError(f"expected one persisted child fixture, got {segment.count(fixture_old)}")
          segment = segment.replace(fixture_old, fixture_new, 1)

          call_old = '        root_execution_id="root-execution",\n    )\n\n    assert handle'
          call_new = (
              '        root_execution_id="root-execution",\n'
              '        parent_invocation_id="delegate-call",\n'
              '    )\n\n    assert handle'
          )
          if segment.count(call_old) != 1:
              raise RuntimeError(f"expected one direct replay call, got {segment.count(call_old)}")
          segment = segment.replace(call_old, call_new, 1)

          assertion = '    assert start_subagent.await_args.args[0] == "a" * 64\n'
          if segment.count(assertion) != 1:
              raise RuntimeError("expected one persisted child replay assertion")
          segment = segment.replace(
              assertion,
              assertion
              + '    assert start_subagent.await_args.kwargs["parent_invocation_id"] == "delegate-call"\n',
              1,
          )
          path.write_text(value[:start] + segment + value[end:])
          PY
      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Run targeted tests
        run: |
          python -m pytest -q \
            tests/ai/test_subagent_execution_tree.py \
            tests/ai/test_skill_subagent_final_refactor.py \
            tests/ai/test_execution_context_durability.py \
            tests/ai/test_local_execution_recovery.py \
            tests/ai/test_runtime_metrics.py
      - name: Run linktools-ai gate
        run: python manage.py check linktools-ai
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/ai-subagent-observability-apply.yml
          rm .github/workflows/ai-subagent-observability-apply-v2.yml
          rm .github/workflows/ai-subagent-observability-apply-v3.yml
          rm .github/workflows/ai-subagent-observability-apply-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ai): track subagent execution lineage"
          git push origin HEAD:feat/ai-subagent-observability
