name: Apply session timeline memory fix

on:
  push:
    branches:
      - feat/ai-session-timeline

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Apply reviewed in-memory fix
        run: |
          set -euo pipefail
          python .github/session_timeline_memory_patch.py
          python -m py_compile \
            linktools-ai/src/linktools/ai/runtime/state/_steps.py \
            linktools-ai/src/linktools/ai/runtime/_local.py \
            tests/ai/test_session_timeline.py \
            tests/ai/test_session_timeline_recovery.py
          git diff --check
      - name: Commit source changes
        run: |
          set -euo pipefail
          rm -f \
            .github/session_timeline_memory_patch.py \
            .github/workflows/apply-session-timeline-memory.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(ai): support in-memory session timeline history'
          git push origin HEAD:${GITHUB_REF_NAME}
