name: AI Persistence Final Validation

on:
  push:
    branches:
      - refactor/ai-agent-runtime-asset-composition-impl

concurrency:
  group: ai-persistence-final-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -e ./linktools -e './linktools-ai[sqlite,evaluation,temporal]' pytest pytest-asyncio ruff
      - name: Apply and validate
        shell: bash
        run: |
          set +e
          RESULT=.bootstrap/result-final.txt
          STATUS=.bootstrap/status-final
          rm -f "$STATUS"
          : > "$RESULT"
          run_check() {
            echo "===== $* =====" | tee -a "$RESULT"
            "$@" >> "$RESULT" 2>&1
            rc=$?
            echo "exit=$rc" >> "$RESULT"
            if [ "$rc" -ne 0 ]; then
              echo "$rc" > "$STATUS"
              return "$rc"
            fi
          }
          if ! grep -q 'class _DataclassPersistenceContract' linktools-ai/src/linktools/ai/runtime/state/_codec.py; then
            run_check python .bootstrap/apply_runtime_persistence_compat.py || true
          fi
          if [ ! -f "$STATUS" ] && ! grep -q 'def _decode_current_record' linktools-ai/src/linktools/ai/runtime/state/_migration.py; then
            run_check python .bootstrap/close_migration_schema_boundary.py || true
          fi
          if [ ! -f "$STATUS" ] && grep -q 'def _encode_persisted_value' linktools-ai/src/linktools/ai/runtime/state/_codec.py; then
            run_check python .bootstrap/repair_refine_bootstrap.py || true
            if [ ! -f "$STATUS" ]; then run_check python .bootstrap/refine_typed_persistence_codec.py || true; fi
          fi
          if [ ! -f "$STATUS" ]; then run_check python .bootstrap/fix_legacy_identity_fixtures.py || true; fi
          if [ ! -f "$STATUS" ] && grep -q '"execution_record": _encode_v1_execution_record' linktools-ai/src/linktools/ai/runtime/state/_codec.py; then
            run_check python .bootstrap/simplify_binding_persistence_codec.py || true
          fi
          if [ ! -f "$STATUS" ] && ! grep -q '_POST_COMPOSITION_EXECUTION_V1_FIELDS' linktools-ai/src/linktools/ai/runtime/state/_migration.py; then
            run_check python .bootstrap/fix_freeze_stale_check.py || true
            if [ ! -f "$STATUS" ]; then run_check python .bootstrap/freeze_identity_migration_schema1.py || true; fi
          fi
          if [ ! -f "$STATUS" ] && ! grep -q 'current dataclass fingerprint changed without a schema revision' linktools-ai/src/linktools/ai/runtime/state/_codec.py; then
            run_check python .bootstrap/complete_binding_codec_simplification.py || true
          fi
          if [ ! -f "$STATUS" ] && { [ ! -f linktools-ai/scripts/build/matrix/runtime_model_messages_v1.json ] || ! grep -q 'def validate_external_fixtures' linktools-ai/scripts/build/persistence.py; }; then
            run_check python .bootstrap/add_external_persistence_fixture.py || true
          fi
          if [ ! -f "$STATUS" ] && { [ ! -f linktools-ai/scripts/build/matrix/runtime_agent_binding_snapshot_v1.json ] || ! grep -q 'runtime_agent_binding_snapshot_v1.json' linktools-ai/src/linktools/ai/runtime/state/_codec.py; }; then
            run_check python .bootstrap/add_binding_snapshot_fixture.py || true
          fi
          if [ ! -f "$STATUS" ]; then run_check python .bootstrap/preserve_history_schema_errors.py || true; fi
          if [ ! -f "$STATUS" ]; then run_check python -m compileall -q linktools-ai/src/linktools/ai || true; fi
          if [ ! -f "$STATUS" ]; then run_check ruff check --select E4,E7,E9,F linktools-ai/src/linktools/ai tests/ai || true; fi
          if [ ! -f "$STATUS" ]; then (cd linktools-ai && python -m scripts.build.persistence) >> "$RESULT" 2>&1; rc=$?; echo "===== persistence exit=$rc =====" >> "$RESULT"; if [ "$rc" -ne 0 ]; then echo "$rc" > "$STATUS"; fi; fi
          if [ ! -f "$STATUS" ]; then (cd linktools-ai && python -m scripts.build.architecture) >> "$RESULT" 2>&1; rc=$?; echo "===== architecture exit=$rc =====" >> "$RESULT"; if [ "$rc" -ne 0 ]; then echo "$rc" > "$STATUS"; fi; fi
          if [ ! -f "$STATUS" ]; then PYTHONPATH=linktools-ai run_check pytest -q tests/ai || true; fi
          if [ ! -f "$STATUS" ]; then echo 0 > "$STATUS"; fi
          cat "$RESULT"
      - name: Commit implementation and validation evidence
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'refactor(ai): close runtime persistence compatibility'
          git push origin HEAD:refactor/ai-agent-runtime-asset-composition-impl
