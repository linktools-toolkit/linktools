name: AI attachment core temp

on:
  push:
    branches:
      - refactor/ai-harness-capabilities
    paths:
      - .github/workflows/ai-attachment-core-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/ai-harness-capabilities
      - name: Apply core merge fixes
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(ai): restore portable workspace contracts'
          git push origin HEAD:refactor/ai-harness-capabilities
