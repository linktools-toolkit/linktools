name: Apply AI native memory fix

on:
  push:
    branches:
      - fix/ai-native-capabilities-v4-review

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ai-native-capabilities-v4-review
      - name: Apply exact Memory sequence invariant fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("linktools-ai/src/linktools/ai/runtime/state/_repositories.py")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  "if operation_record.sequence != current.storage_version + 1:\n"
                  "                    raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)",
                  "if operation_record.sequence <= current.storage_version:\n"
                  "                    raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)",
              ),
              (
                  "or operation_record.sequence != current.storage_version + 1\n"
                  "                ):",
                  "or operation_record.sequence <= current.storage_version\n"
                  "                ):",
              ),
              (
                  "if operation_record.sequence != current.storage_version + 1:\n"
                  "                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)",
                  "if operation_record.sequence <= current.storage_version:\n"
                  "                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)",
              ),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"expected one Memory invariant occurrence: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit Memory fix and remove this workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-ai-native-memory-fix.yml
          git add linktools-ai/src/linktools/ai/runtime/state/_repositories.py
          git diff --cached --check
          git commit -m 'fix(ai): repair memory sequence gaps'
          git push origin HEAD:fix/ai-native-capabilities-v4-review
