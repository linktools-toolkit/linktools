name: Apply Bubblewrap startup diagnostics

on:
  push:
    branches:
      - fix/ai-native-capabilities-v4-review

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ai-native-capabilities-v4-review
      - name: Apply bounded startup diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          worker = Path("linktools-ai/src/linktools/ai/workspace/sandbox_worker.py")
          text = worker.read_text(encoding="utf-8")
          old = (
              "    try:\n"
              "        return asyncio.run(main_async(arguments))\n"
              "    except BaseException:\n"
              "        return WORKER_EXIT_SESSION_FAILED\n"
          )
          new = (
              "    try:\n"
              "        return asyncio.run(main_async(arguments))\n"
              "    except BaseException as error:\n"
              "        print(\n"
              "            f\"sandbox worker failed: {type(error).__name__}: {error}\",\n"
              "            file=sys.stderr,\n"
              "            flush=True,\n"
              "        )\n"
              "        return WORKER_EXIT_SESSION_FAILED\n"
          )
          if text.count(old) != 1:
              raise SystemExit("worker startup catch shape changed")
          worker.write_text(text.replace(old, new, 1), encoding="utf-8")

          host = Path("linktools-ai/src/linktools/ai/workspace/_bubblewrap.py")
          text = host.read_text(encoding="utf-8")
          old = (
              "            _logger.debug(\n"
              "                \"bubblewrap guardian stderr: %s\",\n"
          )
          new = (
              "            _logger.warning(\n"
              "                \"bubblewrap guardian stderr: %s\",\n"
          )
          if text.count(old) != 1:
              raise SystemExit("guardian stderr logger shape changed")
          host.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit diagnostics and remove this workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-bwrap-diagnostics.yml
          git add \
            linktools-ai/src/linktools/ai/workspace/_bubblewrap.py \
            linktools-ai/src/linktools/ai/workspace/sandbox_worker.py
          git diff --cached --check
          git commit -m 'chore(ai): expose sandbox startup failure'
          git push origin HEAD:fix/ai-native-capabilities-v4-review
