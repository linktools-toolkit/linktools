name: Temporary AI review repair

on:
  push:
    branches:
      - refactor/ai-harness-capabilities

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/ai-harness-capabilities
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Apply review repairs
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import subprocess
          from pathlib import Path

          ROOT = Path('.')

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def replace_exact(path: str, old: str, new: str, *, expected: int = 1) -> None:
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old!r}')
              write(path, text.replace(old, new))

          def remove_block(path: str, start_marker: str, end_marker: str) -> None:
              text = read(path)
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              write(path, text[:start] + text[end:])

          def line_offsets(text: str) -> list[int]:
              offsets = [0]
              for index, char in enumerate(text):
                  if char == '\n':
                      offsets.append(index + 1)
              return offsets

          def absolute(offsets: list[int], line: int, column: int) -> int:
              return offsets[line - 1] + column

          def call_name(node: ast.expr) -> str | None:
              if isinstance(node, ast.Name):
                  return node.id
              if isinstance(node, ast.Attribute):
                  return node.attr
              return None

          def transform_runtime_persistence_calls(path: Path) -> None:
              text = path.read_text(encoding='utf-8')
              if '_RuntimeStepPersistence(' not in text:
                  return
              tree = ast.parse(text)
              offsets = line_offsets(text)
              edits: list[tuple[int, int, str]] = []
              changed = False
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call) or call_name(node.func) != '_RuntimeStepPersistence':
                      continue
                  store_kw = next((item for item in node.keywords if item.arg == 'store'), None)
                  if store_kw is None:
                      continue
                  execution_kw = next((item for item in node.keywords if item.arg == 'execution_id'), None)
                  value = store_kw.value
                  start = absolute(offsets, value.lineno, value.col_offset)
                  end = absolute(offsets, value.end_lineno, value.end_col_offset)
                  source = text[start:end]
                  if source.lstrip().startswith('HarnessStepStoreAdapter('):
                      continue
                  execution_source = 'None'
                  if execution_kw is not None:
                      execution_source = ast.get_source_segment(text, execution_kw.value) or 'None'
                      line_start = offsets[execution_kw.lineno - 1]
                      line_end = text.find('\n', line_start)
                      if line_end == -1:
                          line_end = len(text)
                      prefix = text[line_start:absolute(offsets, execution_kw.lineno, execution_kw.col_offset)]
                      suffix = text[absolute(offsets, execution_kw.end_lineno, execution_kw.end_col_offset):line_end]
                      if prefix.strip() == '' and suffix.strip() in {',', ''}:
                          edits.append((line_start, min(line_end + 1, len(text)), ''))
                      else:
                          kw_start = absolute(offsets, execution_kw.lineno, execution_kw.col_offset)
                          kw_end = absolute(offsets, execution_kw.end_lineno, execution_kw.end_col_offset)
                          while kw_end < len(text) and text[kw_end] in ' \t':
                              kw_end += 1
                          if kw_end < len(text) and text[kw_end] == ',':
                              kw_end += 1
                          edits.append((kw_start, kw_end, ''))
                  edits.append(
                      (
                          start,
                          end,
                          f'HarnessStepStoreAdapter({source}, execution_id={execution_source})',
                      )
                  )
                  changed = True
              if not changed:
                  return
              for start, end, replacement in sorted(edits, reverse=True):
                  text = text[:start] + replacement + text[end:]
              import_line = 'from linktools.ai.runtime._harness import HarnessStepStoreAdapter\n'
              if import_line not in text:
                  marker = 'from linktools.ai.runtime._capabilities import '
                  index = text.find(marker)
                  if index == -1:
                      marker = 'from linktools.ai.runtime import '
                      index = text.find(marker)
                  if index == -1:
                      raise SystemExit(f'{path}: unable to place HarnessStepStoreAdapter import')
                  text = text[:index] + import_line + text[index:]
              path.write_text(text, encoding='utf-8')

          def remove_call_keyword(path: Path, function_name: str, keyword_name: str) -> None:
              text = path.read_text(encoding='utf-8')
              if function_name not in text or f'{keyword_name}=' not in text:
                  return
              tree = ast.parse(text)
              offsets = line_offsets(text)
              edits: list[tuple[int, int]] = []
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call) or call_name(node.func) != function_name:
                      continue
                  for keyword in node.keywords:
                      if keyword.arg != keyword_name:
                          continue
                      start = absolute(offsets, keyword.lineno, keyword.col_offset)
                      end = absolute(offsets, keyword.end_lineno, keyword.end_col_offset)
                      line_start = offsets[keyword.lineno - 1]
                      line_end = text.find('\n', line_start)
                      if line_end == -1:
                          line_end = len(text)
                      if text[line_start:start].strip() == '' and text[end:line_end].strip() in {',', ''}:
                          edits.append((line_start, min(line_end + 1, len(text))))
                          continue
                      while end < len(text) and text[end] in ' \t':
                          end += 1
                      if end < len(text) and text[end] == ',':
                          end += 1
                      edits.append((start, end))
              for start, end in sorted(edits, reverse=True):
                  text = text[:start] + text[end:]
              path.write_text(text, encoding='utf-8')

          # F6: split the migration aggregation module by real owner.
          platform_path = Path('linktools-ai/src/linktools/ai/runtime/_platform_capabilities.py')
          platform = platform_path.read_text(encoding='utf-8')
          gate_constants_start = platform.index('_REPOSITORY_MARKER_HEADER =')
          trusted_constants_start = platform.index('_TRUSTED_TOOL_CLASSES =', gate_constants_start)
          gate_start = platform.index('class _WorkspaceToolGate')
          compaction_start = platform.index('class _CompactionCapability', gate_start)
          model_usage_start = platform.index('def _model_usage_metadata', compaction_start)
          validate_compaction_start = platform.index('def _validate_compaction_target', model_usage_start)
          validate_trusted_start = platform.index('def _validate_trusted_tool_classes', validate_compaction_start)

          gate_constants = platform[gate_constants_start:trusted_constants_start]
          gate_block = platform[gate_start:compaction_start]
          gate_block = gate_block.replace(
              '''        _validate_trusted_tool_classes(trusted_tool_classes)\n        trusted = dict(trusted_tool_classes)\n        if len(trusted) != len(trusted_tool_classes):\n            raise AIError(ErrorCode.CAPABILITY_RESOLUTION_INVALID)\n''',
              '''        trusted = dict(trusted_tool_classes)\n''',
          )
          workspace_gate = '''#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\n"""Runtime workspace authorization and repository-instruction gate."""\n\nfrom __future__ import annotations\n\nimport json\nimport os\nfrom collections.abc import Callable, Mapping\nfrom pathlib import Path\nfrom typing import Any\n\nfrom pydantic_ai.capabilities import AbstractCapability\nfrom pydantic_ai.exceptions import ApprovalRequired, ModelRetry, ToolFailed\nfrom pydantic_ai.messages import (\n    ModelMessage,\n    ModelRequest,\n    ModelResponse,\n    ToolCallPart,\n    ToolReturnPart,\n)\nfrom pydantic_ai.models import ModelRequestContext\nfrom pydantic_ai.tools import RunContext, ToolDefinition\n\nfrom ..core import canonical_json_bytes, normalize_json_value\nfrom ..errors import AIError, ErrorCode\nfrom ..workspace import (\n    RepositoryInstructionDocument,\n    RepositoryInstructionResolver,\n    RepositoryInstructions,\n    WorkspacePolicy,\n    normalize_workspace_input_path,\n)\nfrom ._tool_policy import _MODEL_RETRY_PREFIX, _format_model_tool_error\n\n''' + gate_constants + gate_block + '\n__all__ = []\n'
          write('linktools-ai/src/linktools/ai/runtime/_workspace_gate.py', workspace_gate)

          tool_policy = platform
          tool_policy = tool_policy[:gate_constants_start] + tool_policy[trusted_constants_start:]
          gate_start = tool_policy.index('class _WorkspaceToolGate')
          compaction_start = tool_policy.index('class _CompactionCapability', gate_start)
          tool_policy = tool_policy[:gate_start] + tool_policy[compaction_start:]
          compaction_start = tool_policy.index('class _CompactionCapability')
          model_usage_start = tool_policy.index('def _model_usage_metadata', compaction_start)
          tool_policy = tool_policy[:compaction_start] + tool_policy[model_usage_start:]
          validate_compaction_start = tool_policy.index('def _validate_compaction_target')
          validate_trusted_start = tool_policy.index('def _validate_trusted_tool_classes', validate_compaction_start)
          tool_policy = tool_policy[:validate_compaction_start] + tool_policy[validate_trusted_start:]
          tool_policy = tool_policy.replace(
              '"""LinkTools-owned platform capability semantics not provided by Harness."""',
              '"""Runtime tool selection, provenance, replay, and failure policy."""',
          )
          tool_policy = tool_policy.replace(
              '    _validate_trusted_tool_classes(trusted_tool_classes)\n',
              '',
          )
          tool_policy = tool_policy.replace(
              '    _validate_trusted_mcp_selectors(trusted_mcp_selectors)\n',
              '',
          )
          write('linktools-ai/src/linktools/ai/runtime/_tool_policy.py', tool_policy)
          platform_path.unlink()

          # Compaction is itself the capability owner; remove the pass-through wrapper.
          compaction = read('linktools-ai/src/linktools/ai/runtime/_compaction.py')
          compaction = compaction.replace(
              'from pydantic_ai.messages import ModelMessage, ModelResponse, ToolCallPart\n',
              'from pydantic_ai.capabilities import AbstractCapability\nfrom pydantic_ai.messages import ModelMessage, ModelResponse, ToolCallPart\n',
          )
          compaction = compaction.replace(
              'class RuntimeCompaction:\n',
              'class RuntimeCompaction(AbstractCapability[None]):\n',
          )
          write('linktools-ai/src/linktools/ai/runtime/_compaction.py', compaction)

          capabilities_path = 'linktools-ai/src/linktools/ai/runtime/_capabilities.py'
          capabilities = read(capabilities_path)
          import_start = capabilities.index('from ._platform_capabilities import (')
          import_end = capabilities.index(')\nfrom ._metric_id', import_start) + 2
          new_imports = '''from ._tool_policy import (\n    MEMORY_READ_TOOL_NAMES,\n    MEMORY_TOOL_NAMES,\n    PLANNING_TOOL_NAMES,\n    PLAN_SAFE_METADATA_KEY,\n    SUBAGENT_TOOL_NAMES,\n    WORKSPACE_FILESYSTEM_READ_TOOL_NAMES,\n    WORKSPACE_FILESYSTEM_TOOL_NAMES,\n    WORKSPACE_SHELL_TOOL_NAMES,\n    ToolOperationBridge,\n    ToolOperationDecision,\n    _DURATION_NS_METADATA_KEY,\n    _MEMORY_CAPABILITY_ID,\n    _MODEL_EFFECT_UNKNOWN_MESSAGE,\n    _MissingToolOperationBridge,\n    _OBSERVATION_ID_METADATA_KEY,\n    _PLANNING_CAPABILITY_ID,\n    _ToolCallState,\n    _bypasses_tool_error_hook,\n    _durable_failure_error,\n    _model_tool_error,\n    _model_usage_metadata,\n    _tool_execution_policy,\n    _validate_trusted_mcp_selectors,\n    _validate_trusted_tool_classes,\n    select_runtime_tool_names,\n    tool_allowed_in_planning,\n    tool_is_control,\n    tool_name_allowed,\n)\nfrom ._workspace_gate import _WorkspaceToolGate\n'''
          capabilities = capabilities[:import_start] + new_imports + capabilities[import_end:]
          capabilities = capabilities.replace(
              'from ._compaction import ExternalModelRequestObserver\n',
              'from ._compaction import ExternalModelRequestObserver, RuntimeCompaction\n',
          )
          capabilities = capabilities.replace(
              '    execution_id: str | None = field(default=None, repr=False, compare=False)\n',
              '',
          )
          capabilities = capabilities.replace(
              '''        _validate_trusted_tool_classes(self.trusted_tool_classes)\n        _validate_trusted_mcp_selectors(self.trusted_mcp_selectors)\n        if not isinstance(self.store, HarnessStepStoreAdapter):\n            self.store = HarnessStepStoreAdapter(\n                cast(StepStore, self.store),\n                execution_id=self.execution_id,\n            )\n''',
              '''        if not isinstance(self.store, HarnessStepStoreAdapter):\n            raise TypeError("store must be HarnessStepStoreAdapter")\n''',
          )
          capabilities = capabilities.replace(
              '''        _tool_execution_policy(\n            tool_def,\n            trusted_tool_classes=self.trusted_tool_classes,\n        )\n''',
              '',
              1,
          )
          capabilities = capabilities.replace(
              '''        effective_args_method = getattr(self.tool_operations, "effective_args", None)\n        effective_args = (\n            args\n            if effective_args_method is None\n            else await effective_args_method(ctx, call, tool_def, args)\n        )\n''',
              '''        effective_args = await self.tool_operations.effective_args(\n            ctx, call, tool_def, args\n        )\n''',
          )
          capabilities = capabilities.replace('    conversation_id: str | None,\n', '')
          capabilities = capabilities.replace('    _validate_compaction_target(context_target_tokens)\n', '')
          capabilities = capabilities.replace(
              '''    persistence = _RuntimeStepPersistence(\n        store=cast(Any, step_store),\n        execution_id=execution_id,\n''',
              '''    persistence = _RuntimeStepPersistence(\n        store=HarnessStepStoreAdapter(step_store, execution_id=execution_id),\n''',
          )
          capabilities = capabilities.replace(
              '''        _CompactionCapability(\n            context_target_tokens,\n''',
              '''        RuntimeCompaction(\n            context_target_tokens,\n''',
          )
          write(capabilities_path, capabilities)

          agent_executor_path = Path('linktools-ai/src/linktools/ai/runtime/_agent_executor.py')
          agent_executor = agent_executor_path.read_text(encoding='utf-8')
          agent_executor = agent_executor.replace('    _WorkspaceToolGate,\n', '')
          agent_executor = agent_executor.replace('    _tool_execution_policy,\n', '')
          capability_import_end = agent_executor.index(')\nfrom ._input', agent_executor.index('from ._capabilities import (')) + 2
          agent_executor = (
              agent_executor[:capability_import_end]
              + 'from ._tool_policy import _tool_execution_policy\nfrom ._workspace_gate import _WorkspaceToolGate\n'
              + agent_executor[capability_import_end:]
          )
          agent_executor_path.write_text(agent_executor, encoding='utf-8')

          for path in [
              *Path('linktools-ai/src').rglob('*.py'),
              *Path('tests/ai').rglob('*.py'),
          ]:
              remove_call_keyword(path, 'compose_platform_capabilities', 'conversation_id')

          # Explicitly adapt Runtime-owned StepStore at the Harness boundary in tests.
          for path in Path('tests/ai').rglob('*.py'):
              transform_runtime_persistence_calls(path)

          # Memory adapter must use the stable outer durable-operation identity.
          harness_memory_path = 'linktools-ai/src/linktools/ai/runtime/_harness_memory.py'
          harness_memory = read(harness_memory_path)
          harness_memory = harness_memory.replace(
              'from ._harness import current_tool_operation_id\n',
              'from ..errors import AIError, ErrorCode\nfrom ._harness import current_tool_operation_id\n',
          )
          harness_memory = harness_memory.replace(
              '''        stable_id = current_tool_operation_id()\n        if stable_id is None:\n            return operation\n        return MemoryOperation(id=stable_id, fingerprint=operation.fingerprint)\n''',
              '''        stable_id = current_tool_operation_id()\n        if stable_id is None:\n            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n        return MemoryOperation(id=stable_id, fingerprint=operation.fingerprint)\n''',
          )
          write(harness_memory_path, harness_memory)

          # Remove dead Runtime Memory compatibility surface and dead instance state.
          memory_path = 'linktools-ai/src/linktools/ai/runtime/_memory.py'
          memory = read(memory_path)
          memory = memory.replace('    MemorySearchMatch,\n', '')
          memory = memory.replace('    MemorySearchResult,\n', '')
          memory = memory.replace('        self._execution_id = execution_id\n', '')
          start = memory.index('def normalize_memory_file(')
          end = memory.index('def _validate_content(', start)
          memory = memory[:start] + memory[end:]
          start = memory.index('def memory_operation_fingerprint(')
          end = memory.index('def _record_version(', start)
          memory = memory[:start] + memory[end:]
          memory = memory.replace('    "MemorySearchMatch",\n', '')
          memory = memory.replace('    "MemorySearchResult",\n', '')
          memory = memory.replace('    "memory_operation_fingerprint",\n', '')
          memory = memory.replace('    "normalize_memory_file",\n', '')
          write(memory_path, memory)

          # Keep state package bindings available to the same Runtime owner, but restore the
          # public surface exactly to master.
          state_init_path = 'linktools-ai/src/linktools/ai/runtime/state/__init__.py'
          state_init = read(state_init_path)
          master_state_init = subprocess.check_output(
              ['git', 'show', f'origin/master:{state_init_path}'],
              text=True,
          )
          current_all = state_init.index('__all__ = [')
          master_all = master_state_init.index('__all__ = [')
          write(state_init_path, state_init[:current_all] + master_state_init[master_all:])

          # F7: physical bounded record reads for indexed range queries on new stores.
          filesystem_path = 'linktools-ai/src/linktools/ai/runtime/state/_filesystem.py'
          filesystem = read(filesystem_path)
          filesystem = filesystem.replace('from bisect import bisect_right\n', '')
          start = filesystem.index('@dataclass(frozen=True, slots=True)\nclass _RecordQueryIndexKey:')
          end = filesystem.index('class _FilesystemCache:', start)
          filesystem = filesystem[:start] + filesystem[end:]
          filesystem = filesystem.replace(
              '''        self._record_kind_scans = 0\n        self._business_files_read = 0\n        self._record_cache_generation = 0\n        self._record_query_indexes: dict[\n            _RecordQueryIndexKey,\n            tuple[int, tuple[tuple[str, bytes], ...]],\n        ] = {}\n''',
              '''        self._record_kind_scans = 0\n        self._business_files_read = 0\n        self._record_index_complete = _record_index_marker_valid(root)\n''',
          )
          start = filesystem.index('    def list_records(self, query: RecordQuery) -> tuple[StoredRecord, ...]:\n')
          end = filesystem.index('    def get_alias(', start)
          filesystem_list = '''    def list_records(self, query: RecordQuery) -> tuple[StoredRecord, ...]:\n        indexed = self._list_indexed_records(query)\n        if indexed is not None:\n            return indexed\n        kinds = (query.kind,) if query.kind is not None else self._record_kind_names()\n        for kind in kinds:\n            self._load_record_kind(kind)\n        values = sorted(\n            (\n                value\n                for value in self._records.values()\n                if isinstance(value, StoredRecord)\n                and value.kind in kinds\n                and _matches_record(value, query)\n            ),\n            key=lambda record: (record.sort_key, record.key_digest),\n        )\n        if query.after_sort_key is not None and query.after_key_digest is not None:\n            values = [\n                value\n                for value in values\n                if (value.sort_key, value.key_digest)\n                > (query.after_sort_key, query.after_key_digest)\n            ]\n        if query.limit is not None:\n            values = values[: query.limit]\n        return tuple(values)\n\n    def _list_indexed_records(\n        self,\n        query: RecordQuery,\n    ) -> tuple[StoredRecord, ...] | None:\n        if not self._record_index_complete or not _record_query_indexable(query):\n            return None\n        root = self._root / _record_index_directory(query)\n        if not root.is_dir():\n            return ()\n        prefix_token = _record_sort_token(query.sort_key_prefix)\n        if prefix_token is None or query.limit is None:\n            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n        after_token = (\n            None\n            if query.after_sort_key is None\n            else _record_sort_token(query.after_sort_key)\n        )\n        if query.after_sort_key is not None and after_token is None:\n            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n        selected: list[tuple[str, bytes, Path]] = []\n        for path in sorted(root.iterdir(), key=lambda value: value.name):\n            if not path.is_file() or path.suffix != ".ref":\n                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n            token, separator, key_hex = path.name[:-4].rpartition("!")\n            if separator != "!" or not token.startswith(prefix_token):\n                continue\n            key = _layout_digest(key_hex)\n            if (\n                after_token is not None\n                and query.after_key_digest is not None\n                and (token, key) <= (after_token, query.after_key_digest)\n            ):\n                continue\n            selected.append((token, key, path))\n            if len(selected) == query.limit:\n                break\n        values: list[StoredRecord] = []\n        for token, key, path in selected:\n            value = self.get_record(key)\n            if (\n                value is None\n                or _record_sort_token(value.sort_key) != token\n                or _record_index_path(value)\n                != path.relative_to(self._root).as_posix()\n                or not _matches_record(value, query)\n            ):\n                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n            values.append(value)\n        return tuple(values)\n\n'''
          filesystem = filesystem[:start] + filesystem_list + filesystem[end:]
          start = filesystem.index('    def set_record(\n')
          end = filesystem.index('    def set_alias(', start)
          filesystem = filesystem[:start] + '''    @property\n    def record_index_complete(self) -> bool:\n        return self._record_index_complete\n\n    def disable_record_index(self) -> None:\n        self._record_index_complete = False\n\n    def set_record(\n        self,\n        key: bytes,\n        value: StoredRecord | None,\n        *,\n        old_kind: str | None = None,\n    ) -> None:\n        self._records[key] = value\n        if isinstance(value, StoredRecord) and self._record_kinds is not None:\n            self._record_kinds = tuple(sorted(set(self._record_kinds) | {value.kind}))\n\n''' + filesystem[end:]
          filesystem = filesystem.replace(
              '''        if manifest.exists():\n            self._validate_existing_root()\n            return\n''',
              '''        if manifest.exists():\n            self._validate_existing_root()\n            marker = self._root / _RECORD_INDEX_MARKER\n            if not marker.exists() and not any(\n                (self._root / "records").glob("*/*/*.json")\n            ):\n                _write_text(marker, "1")\n                sync_directory(marker.parent)\n            return\n''',
              1,
          )
          filesystem = filesystem.replace(
              '''        _write_json(manifest, self._expected_manifest())\n        _write_text(self._root / "generation", "0")\n        sync_directory(self._root)\n''',
              '''        _write_json(manifest, self._expected_manifest())\n        _write_text(self._root / "generation", "0")\n        marker = self._root / _RECORD_INDEX_MARKER\n        _write_text(marker, "1")\n        sync_directory(marker.parent)\n        sync_directory(self._root)\n''',
              1,
          )
          validation_anchor = '    def _validate_index(self, index: _FilesystemIndex, *, decode_items: bool) -> None:\n'
          validation = '''    def _validate_index(self, index: _FilesystemIndex, *, decode_items: bool) -> None:\n        if decode_items and _record_index_marker_valid(self._root):\n            expected_record_index = {_RECORD_INDEX_MARKER}\n            for record in index.records.values():\n                path = _record_index_path(record)\n                if path is None:\n                    raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n                expected_record_index.add(path)\n            actual_record_index = {\n                path.relative_to(self._root).as_posix()\n                for path in (self._root / "record-index").rglob("*")\n                if path.is_file()\n            }\n            if actual_record_index != expected_record_index:\n                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n'''
          filesystem = filesystem.replace(validation_anchor, validation, 1)
          filesystem = filesystem.replace(
              '''        for key, value in transaction.operations.changes().items():\n            index.cache.set_operation(key, value)\n        if generation is not None:\n''',
              '''        for key, value in transaction.operations.changes().items():\n            index.cache.set_operation(key, value)\n        if _RECORD_INDEX_MARKER in transaction.deletes:\n            index.cache.disable_record_index()\n        if generation is not None:\n''',
              1,
          )
          filesystem = filesystem.replace(
              '''            self.records[record.key_digest] = record\n            self.guarded_record_keys.add(record.key_digest)\n            self._write(_record_path(record), encode_record(record))\n''',
              '''            self.records[record.key_digest] = record\n            self.guarded_record_keys.add(record.key_digest)\n            self._write(_record_path(record), encode_record(record))\n            self._sync_record_index(None, record)\n''',
              1,
          )
          filesystem = filesystem.replace(
              '''        candidates: list[StoredRecord] = []\n''',
              '''        candidates: list[tuple[StoredRecord, StoredRecord]] = []\n''',
              1,
          )
          filesystem = filesystem.replace(
              '''            candidates.append(replacement.record)\n        for record in candidates:\n            self.records[record.key_digest] = record\n            self.guarded_record_keys.add(record.key_digest)\n            self._write(_record_path(record), encode_record(record))\n''',
              '''            candidates.append((current, replacement.record))\n        for current, record in candidates:\n            self.records[record.key_digest] = record\n            self.guarded_record_keys.add(record.key_digest)\n            self._write(_record_path(record), encode_record(record))\n            self._sync_record_index(current, record)\n''',
              1,
          )
          filesystem = filesystem.replace(
              '''        self._delete(_record_path(current))\n        return True\n''',
              '''        self._delete(_record_path(current))\n        self._sync_record_index(current, None)\n        return True\n''',
              1,
          )
          write_anchor = '    def _write(self, relative: str | Path, value: Mapping[str, object] | bytes) -> None:\n'
          sync_method = '''    def _sync_record_index(\n        self,\n        previous: StoredRecord | None,\n        current: StoredRecord | None,\n    ) -> None:\n        if (\n            not self._cache.record_index_complete\n            or _RECORD_INDEX_MARKER in self.deletes\n        ):\n            return\n        previous_path = None if previous is None else _record_index_path(previous)\n        current_path = None if current is None else _record_index_path(current)\n        if current is not None and current_path is None:\n            if previous_path is not None:\n                self._delete(previous_path)\n            self._delete(_RECORD_INDEX_MARKER)\n            return\n        if previous_path is not None and previous_path != current_path:\n            self._delete(previous_path)\n        if current_path is not None and previous_path != current_path:\n            self._write(current_path, b"")\n\n'''
          filesystem = filesystem.replace(write_anchor, sync_method + write_anchor, 1)
          helper_anchor = 'def _record_path(record: StoredRecord) -> str:\n'
          helpers = '''_RECORD_INDEX_MARKER = "record-index/complete"\n_RECORD_SORT_SOURCE = "-./0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz"\n_RECORD_SORT_TARGET = "#$%&'()+,-.0123456789;=@ABCDEFGHIJKLMNOPQRSTUVWXYZ[]^_`abcdefghijk"\n_RECORD_SORT_TRANSLATION = str.maketrans(_RECORD_SORT_SOURCE, _RECORD_SORT_TARGET)\n\n\ndef _record_sort_token(value: str | None) -> str | None:\n    if value is None or any(character not in _RECORD_SORT_SOURCE for character in value):\n        return None\n    return value.translate(_RECORD_SORT_TRANSLATION)\n\n\ndef _record_index_marker_valid(root: Path) -> bool:\n    marker = root / _RECORD_INDEX_MARKER\n    if not marker.exists():\n        return False\n    try:\n        value = marker.read_text(encoding="utf-8")\n    except OSError as error:\n        raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR) from error\n    if value != "1":\n        raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n    return True\n\n\ndef _record_query_indexable(query: RecordQuery) -> bool:\n    return (\n        query.kind is not None\n        and query.partition_digest is not None\n        and query.scope_digest is not None\n        and query.parent_digest is None\n        and query.states is None\n        and query.sort_key_prefix is not None\n        and query.limit is not None\n        and _record_sort_token(query.sort_key_prefix) is not None\n        and (\n            query.after_sort_key is None\n            or _record_sort_token(query.after_sort_key) is not None\n        )\n    )\n\n\ndef _record_index_directory(query: RecordQuery) -> str:\n    if (\n        query.kind is None\n        or query.partition_digest is None\n        or query.scope_digest is None\n    ):\n        raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n    return (\n        f"record-index/{query.kind}/{query.partition_digest.hex()}/"\n        f"{query.scope_digest.hex()}"\n    )\n\n\ndef _record_index_path(record: StoredRecord) -> str | None:\n    if record.partition_digest is None or record.scope_digest is None:\n        return None\n    token = _record_sort_token(record.sort_key)\n    if token is None:\n        return None\n    return (\n        f"record-index/{record.kind}/{record.partition_digest.hex()}/"\n        f"{record.scope_digest.hex()}/{token}!{record.key_digest.hex()}.ref"\n    )\n\n\n'''
          filesystem = filesystem.replace(helper_anchor, helpers + helper_anchor, 1)
          write(filesystem_path, filesystem)

          # Focused regressions for physical FS read bound and explicit internal contracts.
          bounded_test = Path('tests/ai/test_memory_bounded_listing.py')
          bounded = bounded_test.read_text(encoding='utf-8')
          if 'test_filesystem_memory_listing_reads_only_requested_record_page' not in bounded:
              bounded += '''\n\nasync def test_filesystem_memory_listing_reads_only_requested_record_page(\n    tmp_path: Path,\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    from linktools.ai.runtime.state import _filesystem as filesystem\n    from linktools.ai.runtime.state._filesystem import FilesystemStateStore\n    from linktools.ai.runtime.state._plan import RuntimeDomain\n\n    root = tmp_path / "memory-state"\n    state = FilesystemStateStore(\n        root,\n        namespace="memory-bounded-fs",\n        tenant_id="tenant",\n        runtime_domain=RuntimeDomain.MEMORY.value,\n    )\n    await state.initialize()\n    repository = MemoryRepositoryImpl(\n        state,\n        namespace="memory-bounded-fs",\n        tenant_id="tenant",\n    )\n    now = datetime.now(timezone.utc)\n    values = tuple(\n        MemoryRecord(\n            f"memory-{index}",\n            "tenant",\n            "scope-digest",\n            StoredPayload.inline_text("content"),\n            {"path": f"memory/{index:03d}.md"},\n            1,\n            now,\n            now,\n        )\n        for index in range(40)\n    )\n    await state.mutate(\n        lambda transaction: transaction.insert_records(\n            tuple(\n                repository._stored("memory", value.memory_id, value)\n                for value in values\n            )\n        )\n    )\n    await state.close()\n\n    reopened = FilesystemStateStore(\n        root,\n        namespace="memory-bounded-fs",\n        tenant_id="tenant",\n        runtime_domain=RuntimeDomain.MEMORY.value,\n    )\n    await reopened.initialize()\n    repository = MemoryRepositoryImpl(\n        reopened,\n        namespace="memory-bounded-fs",\n        tenant_id="tenant",\n    )\n    original_read_json = filesystem._read_json\n    record_reads = 0\n\n    def counting_read_json(path: Path):\n        nonlocal record_reads\n        if "records" in path.parts:\n            record_reads += 1\n        return original_read_json(path)\n\n    monkeypatch.setattr(filesystem, "_read_json", counting_read_json)\n    page = await repository.list(\n        tenant_id="tenant",\n        memory_scope_digest="scope-digest",\n        prefix="memory/",\n        cursor=None,\n        limit=1,\n    )\n    assert [value.metadata["path"] for value in page.items] == ["memory/000.md"]\n    assert page.next_cursor is not None\n    assert record_reads == 2\n    await reopened.close()\n'''
              bounded = bounded.replace(
                  'from datetime import datetime, timezone\n',
                  'from datetime import datetime, timezone\nfrom pathlib import Path\n',
              )
              bounded_test.write_text(bounded, encoding='utf-8')

          cleanup_test = Path('tests/ai/test_review_contract_cleanup.py')
          cleanup_test.write_text('''#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\n"""Regression contracts for review-driven boundary cleanup."""\n\nimport inspect\n\nimport pytest\nfrom pydantic_ai_harness.memory import MemoryOperation\n\nfrom linktools.ai.errors import AIError, ErrorCode\nfrom linktools.ai.runtime import _memory as runtime_memory\nfrom linktools.ai.runtime._capabilities import (\n    _RuntimeStepPersistence,\n    compose_platform_capabilities,\n)\nfrom linktools.ai.runtime._harness_memory import HarnessMemoryStoreAdapter\nfrom linktools.ai.runtime.state import StagingStepStore\nimport linktools.ai.runtime.state as runtime_state\n\n\ndef test_platform_composition_has_no_dead_conversation_id() -> None:\n    assert "conversation_id" not in inspect.signature(compose_platform_capabilities).parameters\n\n\ndef test_runtime_step_persistence_requires_explicit_harness_adapter() -> None:\n    with pytest.raises(TypeError):\n        _RuntimeStepPersistence(store=StagingStepStore(), tool_operations=object())\n\n\ndef test_harness_memory_mutation_requires_outer_operation_identity() -> None:\n    adapter = object.__new__(HarnessMemoryStoreAdapter)\n    with pytest.raises(AIError) as raised:\n        adapter._operation(MemoryOperation(id="operation", fingerprint="0" * 64))\n    assert raised.value.code is ErrorCode.STORAGE_INTEGRITY_ERROR\n\n\ndef test_runtime_memory_has_no_legacy_compatibility_helpers() -> None:\n    assert not hasattr(runtime_memory, "normalize_memory_file")\n    assert not hasattr(runtime_memory, "memory_operation_fingerprint")\n\n\ndef test_state_public_surface_does_not_expose_new_internal_step_contracts() -> None:\n    assert "StagingStepStore" not in runtime_state.__all__\n    assert "StepStore" not in runtime_state.__all__\n    assert "ToolRepositoryImpl" not in runtime_state.__all__\n''', encoding='utf-8')

          # No production source may retain the removed aggregation module.
          remaining = [
              str(path)
              for path in Path('linktools-ai/src').rglob('*.py')
              if '_platform_capabilities' in path.read_text(encoding='utf-8')
          ]
          if remaining:
              raise SystemExit(f'removed platform capability module still referenced: {remaining}')

          # Ensure the transformed source is syntactically valid before dependency install.
          for path in [*Path('linktools-ai/src').rglob('*.py'), *Path('tests/ai').rglob('*.py')]:
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY
      - name: Install tooling
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Normalize touched Python
        shell: bash
        run: |
          python -m ruff check --fix \
            linktools-ai/src/linktools/ai/runtime/_capabilities.py \
            linktools-ai/src/linktools/ai/runtime/_tool_policy.py \
            linktools-ai/src/linktools/ai/runtime/_workspace_gate.py \
            linktools-ai/src/linktools/ai/runtime/_compaction.py \
            linktools-ai/src/linktools/ai/runtime/_harness_memory.py \
            linktools-ai/src/linktools/ai/runtime/_memory.py \
            linktools-ai/src/linktools/ai/runtime/_agent_executor.py \
            linktools-ai/src/linktools/ai/runtime/state/_filesystem.py \
            linktools-ai/src/linktools/ai/runtime/state/__init__.py \
            tests/ai/test_memory_bounded_listing.py \
            tests/ai/test_review_contract_cleanup.py || true
          python -m ruff format \
            linktools-ai/src/linktools/ai/runtime/_capabilities.py \
            linktools-ai/src/linktools/ai/runtime/_tool_policy.py \
            linktools-ai/src/linktools/ai/runtime/_workspace_gate.py \
            linktools-ai/src/linktools/ai/runtime/_compaction.py \
            linktools-ai/src/linktools/ai/runtime/_harness_memory.py \
            linktools-ai/src/linktools/ai/runtime/_memory.py \
            linktools-ai/src/linktools/ai/runtime/_agent_executor.py \
            linktools-ai/src/linktools/ai/runtime/state/_filesystem.py \
            linktools-ai/src/linktools/ai/runtime/state/__init__.py \
            tests/ai/test_memory_bounded_listing.py \
            tests/ai/test_review_contract_cleanup.py
      - name: Validate review repairs
        shell: bash
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/ai/test_memory_bounded_listing.py \
            tests/ai/test_review_contract_cleanup.py \
            tests/ai/test_architecture_gate.py \
            tests/ai/test_harness_capability_migration.py \
            tests/ai/test_compaction_policy.py
          python manage.py check linktools-ai
          git diff --check
      - name: Commit review repairs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ai-review-repair.yml
          git add -A
          git commit -m 'fix(ai): close harness review gaps'
          git push origin HEAD:refactor/ai-harness-capabilities
