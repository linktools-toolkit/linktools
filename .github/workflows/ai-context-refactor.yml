name: AI observability refactor one-shot

on:
  push:
    branches:
      - feat/ai-metrics-observability
    paths:
      - .github/workflows/ai-context-refactor.yml

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-metrics-observability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Apply boundary refactor
        shell: bash
        run: |
          cat > /tmp/refactor.py <<'PY'
          from pathlib import Path
          import re
          import textwrap

          root = Path("linktools-ai/src/linktools/ai")

          def read(rel: str) -> str:
              return (root / rel).read_text()

          def write(rel: str, text: str) -> None:
              (root / rel).write_text(text)

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              return text.replace(old, new, 1)

          def regex_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              return updated

          # TaskNodeRunner owns one invocation envelope instead of an expanding scalar signature.
          text = read("task/_local.py")
          old = textwrap.dedent('''\
          class TaskNodeRunner(Protocol):
              async def run(
                  self,
                  node: TaskNode,
                  *,
                  graph_id: str,
                  principal: Principal,
                  correlation: CorrelationData,
                  dependency_results: "Mapping[str, TaskDependencyResult]",
                  control: TaskNodeRunControl,
              ) -> TaskNodeRunResult: ...

