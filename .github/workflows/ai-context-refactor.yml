name: AI context refactor one-shot

on:
  push:
    branches:
      - feat/ai-metrics-observability
    paths:
      - .github/workflows/ai-context-refactor.yml

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-metrics-observability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Complete AgentContext rename
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          capability = Path("linktools-ai/src/linktools/ai/capability")
          changed = []
          for path in capability.rglob("*.py"):
              text = path.read_text()
              if re.search(r"\bRunContext\b", text):
                  new = re.sub(r"\bRunContext\b", "AgentContext", text)
                  path.write_text(new)
                  changed.append(str(path))
          print("renamed LinkTools capability context in:")
          print("\n".join(changed) or "<none>")

          # A capability-owned RunContext is no longer a valid symbol. PydanticRunContext
          # remains untouched because only the exact whole word is rejected here.
          bad = []
          for path in capability.rglob("*.py"):
              for lineno, line in enumerate(path.read_text().splitlines(), 1):
                  if re.search(r"\bRunContext\b", line):
                      bad.append(f"{path}:{lineno}:{line.strip()}")
          if bad:
              raise SystemExit("capability RunContext remains:\n" + "\n".join(bad))
          PY
          python -m compileall -q linktools-ai/src tests/ai
          git diff --check

      - name: Commit rename
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linktools-ai tests/ai
          if ! git diff --cached --quiet; then
            git commit -m "refactor(ai): finish agent context rename"
            git push origin HEAD:feat/ai-metrics-observability
          fi

      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet

      - name: Run linktools-ai tests
        run: python -m pytest -q tests/ai

      - name: Run repository checks
        run: python manage.py check --skip-compatibility
