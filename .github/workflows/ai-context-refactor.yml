name: AI context refactor one-shot

on:
  push:
    branches:
      - feat/ai-metrics-observability
    paths:
      - .github/workflows/ai-context-refactor.yml

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-metrics-observability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Repair context boundaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("linktools-ai/src/linktools/ai")

          # Pydantic AI owns its own RunContext API. LinkTools keeps a distinct alias only.
          for path in (root / "capability").rglob("*.py"):
              text = path.read_text()
              text = text.replace(
                  "from pydantic_ai.tools import AgentContext as PydanticRunContext",
                  "from pydantic_ai.tools import RunContext as PydanticRunContext",
              )
              path.write_text(text)

          # Correlation is durable metadata, not execution identity. Replays keep the
          # first durable value and must not conflict only because a caller supplied drift.
          execution = root / "runtime" / "_execution.py"
          text = execution.read_text()
          text, count = re.subn(
              r"\n\s*if dict\(execution\.correlation\) != dict\(request\.correlation\):\n\s*raise AIError\(ErrorCode\.IDEMPOTENCY_CONFLICT\)",
              "",
              text,
          )
          if count != 1:
              raise SystemExit(f"expected one replay correlation check, found {count}")
          execution.write_text(text)

          # Guard the vendor boundary and the new idempotency invariant.
          for path in (root / "capability").rglob("*.py"):
              text = path.read_text()
              if "from pydantic_ai.tools import AgentContext" in text:
                  raise SystemExit(f"invalid pydantic context import remains: {path}")
          text = execution.read_text()
          if "dict(execution.correlation) != dict(request.correlation)" in text:
              raise SystemExit("correlation replay conflict remains")
          PY
          python -m compileall -q linktools-ai/src tests/ai
          git diff --check

      - name: Commit semantic fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linktools-ai tests/ai
          if ! git diff --cached --quiet; then
            git commit -m "fix(ai): preserve correlation replay semantics"
            git push origin HEAD:feat/ai-metrics-observability
          fi

      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet

      - name: Run linktools-ai tests
        run: python -m pytest -q tests/ai

      - name: Run repository checks
        run: python manage.py check --skip-compatibility
