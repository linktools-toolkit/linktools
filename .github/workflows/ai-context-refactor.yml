name: AI context refactor one-shot

on:
  push:
    branches:
      - feat/ai-metrics-observability
    paths:
      - .github/workflows/ai-context-refactor.yml

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-metrics-observability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Restore vendor RunContext imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = [Path("linktools-ai/src"), Path("tests/ai")]
          changed = []
          for root in roots:
              for path in root.rglob("*.py"):
                  text = path.read_text()
                  new = text.replace(
                      "AgentContext as PydanticRunContext",
                      "RunContext as PydanticRunContext",
                  )
                  if new != text:
                      path.write_text(new)
                      changed.append(str(path))
          print("restored vendor RunContext in:")
          print("\n".join(changed) or "<none>")

          bad = []
          for root in roots:
              for path in root.rglob("*.py"):
                  text = path.read_text()
                  if "AgentContext as PydanticRunContext" in text:
                      bad.append(str(path))
          if bad:
              raise SystemExit("invalid PydanticRunContext imports remain:\n" + "\n".join(bad))
          PY
          python -m compileall -q linktools-ai/src tests/ai
          git diff --check

      - name: Commit vendor boundary fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linktools-ai tests/ai
          if ! git diff --cached --quiet; then
            git commit -m "fix(ai): preserve pydantic run context boundary"
            git push origin HEAD:feat/ai-metrics-observability
          fi

      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet

      - name: Run linktools-ai tests
        run: python -m pytest -q tests/ai

      - name: Run repository checks
        run: python manage.py check --skip-compatibility
