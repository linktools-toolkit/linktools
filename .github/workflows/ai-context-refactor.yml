name: AI context refactor one-shot

on:
  push:
    branches:
      - feat/ai-metrics-observability
    paths:
      - .github/workflows/ai-context-refactor.yml

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-metrics-observability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Align observability closure tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/ai/test_observability_closure.py")
          text = path.read_text()
          text = text.replace("_overlay_execution_context", "_overlay_execution_correlation")
          text = text.replace("SimpleNamespace(context=", "SimpleNamespace(correlation=")
          text = text.replace(
              'RuntimeContext(\n        object(),\n        {"audit_run_id": "audit-1", "stage": "collect"},\n    )',
              'RuntimeContext(\n        object(),\n        correlation={"audit_run_id": "audit-1", "stage": "collect"},\n    )',
          )
          text = text.replace("root.values", "root.correlation")
          text = text.replace("effective.values", "effective.correlation")
          text = text.replace("context_overlay", "correlation_overlay")
          text = text.replace("context_inherit", "correlation_inherit")
          text = text.replace("context_reject", "correlation_reject")
          text = text.replace("durable_admission_context", "durable_admission_correlation")
          path.write_text(text)

          old = (
              "_overlay_execution_context",
              "root.values",
              "effective.values",
              "SimpleNamespace(context=",
          )
          remaining = [item for item in old if item in text]
          if remaining:
              raise SystemExit(f"stale observability test names remain: {remaining}")
          PY
          python -m compileall -q linktools-ai/src tests/ai
          git diff --check

      - name: Commit test alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ai
          if ! git diff --cached --quiet; then
            git commit -m "test(ai): align correlation context contract"
            git push origin HEAD:feat/ai-metrics-observability
          fi

      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet

      - name: Run linktools-ai tests
        run: python -m pytest -q tests/ai

      - name: Run repository checks
        run: python manage.py check --skip-compatibility
