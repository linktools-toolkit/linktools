              ) -> TaskNodeRunResult: ...

              async def cancel(self, invocation: TaskNodeInvocation) -> None: ...
          ''')
          text = replace_once(text, old, new, "task runner protocol")

          old = textwrap.dedent('''\
                          await self._runner.cancel(
                              node,
                              graph_id=graph_id,
                              principal=launch.principal,
                              context=launch.correlation,
