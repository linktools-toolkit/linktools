              "built-in catalog",
          )
          write("observe/_metrics.py", text)

          # Structural assertions: no old runner keyword or split terminal owner remains.
          task_local = read("task/_local.py")
          if "context=request.correlation" in task_local or "context=launch.correlation" in task_local:
              raise SystemExit("old task runner context keyword remains")
          if "_MetricExecutionTerminalCommitter" in read("runtime/_metrics.py"):
              raise SystemExit("terminal metric wrapper remains")
          if "_MetricExecutionTerminalCommitter" in read("runtime/_factory.py"):
              raise SystemExit("factory terminal metric wrapper remains")
          if read("runtime/_local.py").count("_record_execution_terminal(") != 2:
              # one import symbol occurrence is excluded; there must be exactly one function call plus import text.
              raise SystemExit("unexpected terminal metric producer count")
          PY
          python /tmp/refactor.py
          python -m compileall -q linktools-ai/src tests/ai
          git diff --check

      - name: Commit source refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linktools-ai/src/linktools/ai
          if ! git diff --cached --quiet; then
            git commit -m "refactor(ai): tighten observability boundaries"
            git push origin HEAD:feat/ai-metrics-observability
          fi

      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet

      - name: Run focused tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/ai/test_metrics_sqlite_interop.py \
            tests/ai/test_runtime_metrics.py \
            tests/ai/test_task_metric_projector.py \
            tests/ai/test_task_mixed_node_reliability.py \
            tests/ai/test_task_reliable_review_regressions.py \
            2>&1 | tee /tmp/focused.log

      - name: Run linktools-ai tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q tests/ai 2>&1 | tee /tmp/ai-tests.log

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-observability-refactor-logs
          path: |
            /tmp/focused.log
            /tmp/ai-tests.log
          if-no-files-found: ignore

      - name: Fail if tests failed
        shell: bash
        run: |
          python -m pytest -q \
            tests/ai/test_metrics_sqlite_interop.py \
            tests/ai/test_runtime_metrics.py \
            tests/ai/test_task_metric_projector.py \
            tests/ai/test_task_mixed_node_reliability.py \
            tests/ai/test_task_reliable_review_regressions.py
