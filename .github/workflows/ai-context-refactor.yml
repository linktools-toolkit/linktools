name: AI context refactor one-shot

on:
  push:
    branches:
      - feat/ai-metrics-observability
    paths:
      - .github/workflows/ai-context-refactor.yml

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ai-metrics-observability
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Fix semantic correlation ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("linktools-ai/src/linktools/ai")
          tests = Path("tests/ai")
          paths = list(root.rglob("*.py")) + list(tests.rglob("*.py"))

          # Durable/request values renamed to correlation in the previous pass; remove stale member reads.
          member_owners = (
              "request", "execution", "parent", "previous", "current", "original",
              "recovery_input", "checkpoint_input", "admission", "admitted", "launch",
              "existing", "record",
          )
          for path in paths:
              text = path.read_text()
              for owner in member_owners:
                  text = text.replace(f"{owner}.context", f"{owner}.correlation")
              path.write_text(text)

          # Naming should match the value it validates.
          service_api = root / "runtime" / "service_api.py"
          text = service_api.read_text().replace("_request_context", "_request_correlation")
          service_api.write_text(text)

          execution = root / "runtime" / "_execution.py"
          text = execution.read_text().replace("_overlay_execution_context", "_overlay_execution_correlation")
          execution.write_text(text)

          # AgentContext is the sole in-process owner of execution memory_scope and correlation.
          local = root / "runtime" / "_local.py"
          text = local.read_text()
          old = '''                execution_id=current.execution_id,
                session_metadata=session_metadata,
                correlation=current.correlation,
'''
          new = '''                execution_id=current.execution_id,
                session_metadata=session_metadata,
                memory_scope=current.memory_scope,
                correlation=current.correlation,
'''
          if old not in text:
              raise SystemExit("AgentContext constructor shape not found")
          text = text.replace(old, new, 1)
          local.write_text(text)

          # Public operation metadata is correlation, including direct test call sites.
          public_files = [root / "runtime" / "_agent.py", root / "runtime" / "_runtime_service.py"]
          for path in public_files:
              text = path.read_text()
              text = text.replace(
                  'context: "Mapping[str, object] | None" = None',
                  'correlation: "Mapping[str, object] | None" = None',
              )
              path.write_text(text)

          # Old exported symbols are forbidden after this breaking cleanup.
          forbidden = (
              "RunContextData", "RunContextValue", "normalize_run_context",
              "overlay_run_context", "merge_run_context",
          )
          bad = []
          for path in paths:
              text = path.read_text()
              for symbol in forbidden:
                  if symbol in text:
                      bad.append(f"{path}:{symbol}")
          if bad:
              raise SystemExit("old correlation symbols remain:\n" + "\n".join(bad))

          # These member names refer to durable execution/task values and must not regress.
          suspicious = re.compile(
              r"\b(?:request|execution|parent|previous|current|original|recovery_input|"
              r"checkpoint_input|admission|admitted|launch)\.context\b"
          )
          bad = []
          for path in paths:
              for lineno, line in enumerate(path.read_text().splitlines(), 1):
                  if suspicious.search(line):
                      bad.append(f"{path}:{lineno}:{line.strip()}")
          if bad:
              raise SystemExit("stale .context member reads remain:\n" + "\n".join(bad))
          PY
          python -m compileall -q linktools-ai/src tests/ai
          git diff --check

      - name: Commit semantic fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linktools-ai tests/ai
          if ! git diff --cached --quiet; then
            git commit -m "fix(ai): complete correlation ownership rename"
            git push origin HEAD:feat/ai-metrics-observability
          fi

      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet

      - name: Run linktools-ai tests
        run: python -m pytest -q tests/ai

      - name: Run repository checks
        run: python manage.py check --skip-compatibility
