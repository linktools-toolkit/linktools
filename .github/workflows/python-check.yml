name: Python checks

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

concurrency:
  group: python-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  durable_contract_patch:
    name: Durable contract patch
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'refactor/ai-durable-contract-convergence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/ai-durable-contract-convergence
      - name: Apply exact storage-topology removals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 occurrence, got {count}')
              return text.replace(old, new, 1)

          codec_path = Path('linktools-ai/src/linktools/ai/runtime/state/_codec.py')
          codec = codec_path.read_text(encoding='utf-8')
          codec = replace_once(codec, '    RuntimeStorageContract,\n', '', 'codec RuntimeStorageContract import')
          codec = replace_once(codec, '    RuntimeStorageResource,\n', '', 'codec RuntimeStorageResource import')
          codec = replace_once(codec, '    ("runtime_storage_contract", RuntimeStorageContract),\n', '', 'codec storage contract wire')
          codec = replace_once(codec, '    ("runtime_storage_resource", RuntimeStorageResource),\n', '', 'codec storage resource wire')
          if 'RuntimeStorageContract' in codec or 'RuntimeStorageResource' in codec:
              raise RuntimeError('codec still references removed storage topology types')
          codec_path.write_text(codec, encoding='utf-8')

          local_path = Path('linktools-ai/src/linktools/ai/runtime/_local.py')
          local = local_path.read_text(encoding='utf-8')
          local = replace_once(
              local,
              'from collections.abc import AsyncIterator, Awaitable, Callable, Collection, Mapping, Sequence\n',
              'from collections.abc import AsyncIterator, Awaitable, Callable, Mapping, Sequence\n',
              'local Collection import',
          )
          local = replace_once(local, '    RuntimeStorageContract,\n', '', 'local RuntimeStorageContract import')
          local = replace_once(
              local,
              '        storage_contract: RuntimeStorageContract | None = None,\n'
              '        storage_contract_factory: (\n'
              '            "Callable[[Collection[RuntimeDomain]], RuntimeStorageContract] | None"\n'
              '        ) = None,\n',
              '',
              'local constructor storage contract parameters',
          )
          local = replace_once(
              local,
              '        self._storage_contract = storage_contract\n'
              '        self._storage_contract_factory = storage_contract_factory\n',
              '',
              'local storage contract assignments',
          )
          for name in ('_require_storage_contract', '_validate_recovery_identity'):
              pattern = rf'^    def {name}\(.*?(?=^    (?:async )?def |^    @|^class |\Z)'
              local, count = re.subn(pattern, '', local, count=1, flags=re.MULTILINE | re.DOTALL)
              if count != 1:
                  raise RuntimeError(f'local {name}: expected 1 method, got {count}')
          local = re.sub(
              r'^\s*(?:self\._port\.|self\.)_validate_recovery_identity\(execution\)\n',
              '',
              local,
              flags=re.MULTILINE,
          )
          if 'storage_contract' in local or 'RuntimeStorageContract' in local or '_validate_recovery_identity' in local:
              leftovers = [line for line in local.splitlines() if 'storage_contract' in line or 'RuntimeStorageContract' in line or '_validate_recovery_identity' in line]
              raise RuntimeError(f'local storage topology leftovers: {leftovers[:20]}')
          local_path.write_text(local, encoding='utf-8')
          PY
          git diff --check
      - name: Commit exact patch
        shell: bash
        run: |
          if git diff --quiet -- linktools-ai/src/linktools/ai/runtime/state/_codec.py linktools-ai/src/linktools/ai/runtime/_local.py; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add linktools-ai/src/linktools/ai/runtime/state/_codec.py linktools-ai/src/linktools/ai/runtime/_local.py
          git commit -m 'refactor(ai): remove storage topology residue'
          git push origin HEAD:refactor/ai-durable-contract-convergence

  python36:
    name: Python 3.6 static compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run static compatibility scan
        shell: bash
        run: |
          docker run --rm \
            -e PIP_DISABLE_PIP_VERSION_CHECK \
            -e PYTHONUNBUFFERED \
            -v "$PWD:/workspace" \
            -w /workspace \
            python:3.6.15 \
            bash -lc '
              set -eu
              python -m pip install --quiet "tomlkit==0.11.6" "PyYAML==6.0.1"
              python -m py_compile manage.py scripts/check/python36.py
              python manage.py check --compatibility
            '

  python310:
    name: Python 3.10 checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Run checks
        run: python manage.py check --skip-compatibility

  python_latest:
    name: Python latest checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Run checks
        run: python manage.py check --skip-compatibility
