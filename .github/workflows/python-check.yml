name: Python checks

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

concurrency:
  group: python-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  durable_codec_patch:
    name: Strict durable codec patch
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'refactor/ai-durable-contract-convergence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/ai-durable-contract-convergence
      - name: Enforce one current durable shape
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('linktools-ai/src/linktools/ai/runtime/state/_codec.py')
          text = path.read_text(encoding='utf-8')

          def once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 occurrence, got {count}')
              text = text.replace(old, new, 1)

          once(
              'from dataclasses import MISSING, dataclass, fields, is_dataclass\n',
              'from dataclasses import dataclass, fields, is_dataclass\n',
              'MISSING import',
          )

          text, call_count = re.subn(
              r'(?m)^(\s+)_require_fields\(',
              r'\1_require_exact_keys(',
              text,
          )
          if call_count < 8:
              raise RuntimeError(f'expected strict decoder callsites, got {call_count}')
          once(
              'def _require_fields(\n'
              '    value: Mapping[str, object],\n'
              '    required: frozenset[str],\n'
              ') -> None:\n'
              '    if not required.issubset(value):\n'
              '        raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n\n\n',
              '',
              'subset-key helper',
          )

          pattern = (
              r'\ndef _encode_v1_optional_error_diagnostics\(.*?'
              r'(?=\n_V1_DATACLASS_ENCODERS:)'
          )
          text, removed = re.subn(pattern, '\n', text, count=1, flags=re.DOTALL)
          if removed != 1:
              raise RuntimeError('optional-field encoders block not found')
          for line in (
              '        "execution_record": _encode_v1_execution_record,\n',
              '        "recovery_terminal_outcome": _encode_v1_recovery_terminal_outcome,\n',
              '        "task_graph_admission": _encode_v1_task_graph_admission,\n',
          ):
              once(line, '', f'encoder mapping {line.strip()}')

          once(
              '    keys = frozenset(value)\n'
              '    if persisted:\n'
              '        if keys not in {\n'
              '            frozenset({"$dataclass", "fields"}),\n'
              '            frozenset({"$dataclass", "schema", "fields"}),\n'
              '        }:\n'
              '            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n'
              '    else:\n'
              '        _require_exact_keys(value, frozenset({"$dataclass", "fields"}))\n',
              '    if persisted:\n'
              '        _require_exact_keys(\n'
              '            value, frozenset({"$dataclass", "schema", "fields"})\n'
              '        )\n'
              '    else:\n'
              '        _require_exact_keys(value, frozenset({"$dataclass", "fields"}))\n',
              'persisted dataclass framing',
          )
          once(
              '        schema = value.get("schema", CURRENT_DATA_VERSION)\n',
              '        schema = value["schema"]\n',
              'persisted schema default',
          )

          generic_pattern = re.compile(
              r'    declared_fields = tuple\(fields\(target\)\)\n'
              r'    declared_names = \{field\.name for field in declared_fields\}\n'
              r'    unknown_fields = tuple\(.*?'
              r'(?=    try:\n        result = target\(\*\*kwargs\))',
              re.DOTALL,
          )
          generic_replacement = '''    declared_fields = tuple(fields(target))
    _require_exact_keys(
        raw_fields,
        frozenset(field.name for field in declared_fields),
    )
    kwargs: dict[str, object] = {}
    post_init_fields: dict[str, object] = {}
    for field in declared_fields:
        try:
            decoded = _decode_domain(
                raw_fields[field.name],
                hints.get(field.name, Any),
                codec,
                persisted=persisted,
            )
        except AIError:
            raise
        except (KeyError, TypeError, ValueError) as error:
            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR) from error
        if field.init:
            kwargs[field.name] = decoded
        else:
            post_init_fields[field.name] = decoded
'''
          text, generic_count = generic_pattern.subn(generic_replacement, text, count=1)
          if generic_count != 1:
              raise RuntimeError('generic dataclass compatibility block not found')

          once(
              '    custom_encoders = {\n'
              '        "execution_record",\n'
              '        "recovery_terminal_outcome",\n'
              '        "task_graph_admission",\n'
              '        "task_node",\n'
              '        "task_result",\n'
              '    }\n',
              '    custom_encoders = {"task_node", "task_result"}\n',
              'codec encoder registry assertion',
          )

          forbidden = (
              '_require_fields(',
              'tolerated shape change',
              'defaulted_fields',
              'unknown_fields',
              '_encode_v1_optional_error_diagnostics',
              '_encode_v1_execution_record',
              '_encode_v1_task_graph_admission',
              '_encode_v1_recovery_terminal_outcome',
          )
          leftovers = [item for item in forbidden if item in text]
          if leftovers:
              raise RuntimeError(f'compatibility codec residue: {leftovers}')
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile linktools-ai/src/linktools/ai/runtime/state/_codec.py
          git diff --check
      - name: Commit strict codec
        shell: bash
        run: |
          if git diff --quiet -- linktools-ai/src/linktools/ai/runtime/state/_codec.py; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add linktools-ai/src/linktools/ai/runtime/state/_codec.py
          git commit -m 'refactor(ai): enforce exact durable codec shapes'
          git push origin HEAD:refactor/ai-durable-contract-convergence

  python36:
    name: Python 3.6 static compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run static compatibility scan
        shell: bash
        run: |
          docker run --rm \
            -e PIP_DISABLE_PIP_VERSION_CHECK \
            -e PYTHONUNBUFFERED \
            -v "$PWD:/workspace" \
            -w /workspace \
            python:3.6.15 \
            bash -lc '
              set -eu
              python -m pip install --quiet "tomlkit==0.11.6" "PyYAML==6.0.1"
              python -m py_compile manage.py scripts/check/python36.py
              python manage.py check --compatibility
            '

  python310:
    name: Python 3.10 checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Run checks
        run: python manage.py check --skip-compatibility

  python_latest:
    name: Python latest checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Run checks
        run: python manage.py check --skip-compatibility
