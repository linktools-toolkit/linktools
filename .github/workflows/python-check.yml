name: Python checks

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_PROGRESS_BAR: "off"
  PIP_QUIET: "1"
  PYTHONUNBUFFERED: "1"

concurrency:
  group: python-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python36:
    name: Python 3.6 static compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run static compatibility scan
        shell: bash
        run: |
          docker run --rm \
            -e PIP_DISABLE_PIP_VERSION_CHECK \
            -e PIP_PROGRESS_BAR \
            -e PIP_QUIET \
            -e PYTHONUNBUFFERED \
            -v "$PWD:/workspace" \
            -w /workspace \
            python:3.6.15 \
            bash -lc '
              set -euo pipefail
              python -m pip install "tomlkit==0.11.6" "PyYAML==6.0.1"
              python -m py_compile manage.py scripts/check/python36.py
              python manage.py check --compatibility
            '

  python310:
    name: Python 3.10 checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U -r requirements.txt
          python manage.py install --editable
      - name: Run checks
        shell: bash
        run: |
          set -o pipefail
          python manage.py check --skip-compatibility \
            | awk '!/^[.[:space:]]+\[[[:space:]]*[0-9]+%\]$/'

  python_latest:
    name: Python latest checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U -r requirements.txt
          python manage.py install --editable
      - name: Run checks
        shell: bash
        run: |
          set -o pipefail
          python manage.py check --skip-compatibility \
            | awk '!/^[.[:space:]]+\[[[:space:]]*[0-9]+%\]$/'
