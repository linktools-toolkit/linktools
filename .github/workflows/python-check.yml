name: Python checks

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: python-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python36:
    name: Python 3.6 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run compatibility gates
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            python:3.6.15 \
            bash -lc '
              set -eu
              python -m pip install "tomlkit==0.11.6" "PyYAML==6.0.1"
              python -m py_compile manage.py scripts/check/python36.py
              python manage.py check --compatibility
            '

  python310:
    name: Python 3.10 checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U -r requirements.txt
          python manage.py install --editable
      - name: Run checks
        run: python manage.py check

  python_latest:
    name: Python latest checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          check-latest: true
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U -r requirements.txt
          python manage.py install --editable
      - name: Run checks
        run: python manage.py check
