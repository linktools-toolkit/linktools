name: Python checks

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

concurrency:
  group: python-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python36:
    name: Python 3.6 static compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run static compatibility scan
        shell: bash
        run: |
          docker run --rm \
            -e PIP_DISABLE_PIP_VERSION_CHECK \
            -e PYTHONUNBUFFERED \
            -v "$PWD:/workspace" \
            -w /workspace \
            python:3.6.15 \
            bash -lc '
              set -eu
              python -m pip install --quiet "tomlkit==0.11.6" "PyYAML==6.0.1"
              python -m py_compile manage.py scripts/check/python36.py
              python manage.py check --compatibility
            '

  discover:
    name: Discover Python packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.modules.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install tooling
        run: python -m pip install --quiet -U -r requirements.txt
      - name: Discover packages
        id: modules
        shell: bash
        run: echo "packages=$(python manage.py modules)" >> "$GITHUB_OUTPUT"

  python:
    name: Python ${{ matrix.python-version }} ${{ matrix.package }} checks
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.x'
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: ${{ matrix.python-version == '3.x' }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            linktools*/linktools.yml
      - name: Install tooling
        run: |
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Run checks
        env:
          PYTEST_ADDOPTS: "-n 4 --dist=loadfile --capture=fd"
        run: python manage.py check ${{ matrix.package }} --skip-compatibility
