name: AI Agent Runtime Implementation Gate

on:
  push:
    branches:
      - refactor/ai-agent-runtime-asset-composition

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/ai-agent-runtime-asset-composition
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate implementation
        shell: bash
        run: |
          set -uo pipefail
          if [[ ! -f .bootstrap/ready ]]; then
            echo 'validation trigger not present; nothing to run'
            exit 0
          fi
          RESULT=/tmp/agent-runtime-result.txt
          : > "$RESULT"
          status=0
          run_check() {
            echo "===== $* =====" | tee -a "$RESULT"
            "$@" >>"$RESULT" 2>&1 || status=1
            return 0
          }
          if [[ -f .bootstrap/patch.py ]]; then
            run_check python .bootstrap/patch.py
            rm -f .bootstrap/patch.py
          fi
          run_check python -m compileall -q linktools-ai/src/linktools/ai
          run_check python -m pip install --upgrade pip
          if [[ $status -eq 0 ]]; then
            run_check python -m pip install -e ./linktools -e './linktools-ai[sqlite,evaluation,temporal]' pytest pytest-asyncio ruff
          fi
          if [[ $status -eq 0 ]]; then
            run_check ruff check --select E4,E7,E9,F linktools-ai/scripts/build linktools-ai/src/linktools/ai linktools-ai/src/linktools/commands/ai tests/ai
            run_check python linktools-ai/scripts/build/architecture.py
            run_check pytest -q tests/ai --maxfail=30
          fi
          mkdir -p .bootstrap
          rm -f .bootstrap/ready
          cp "$RESULT" .bootstrap/result.txt
          printf '%s\n' "$status" > .bootstrap/status
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record agent runtime implementation validation'
            git push origin HEAD:refactor/ai-agent-runtime-asset-composition
          fi
          exit 0
