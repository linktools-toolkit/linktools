name: AI Agent Runtime Implementation Gate

on:
  push:
    branches:
      - refactor/ai-agent-runtime-asset-composition

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/ai-agent-runtime-asset-composition
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply and validate
        shell: bash
        run: |
          set -uo pipefail
          if [[ ! -f .bootstrap/ready ]]; then
            echo 'implementation trigger not present; nothing to run'
            exit 0
          fi
          RESULT=/tmp/agent-runtime-result.txt
          : > "$RESULT"
          status=0
          run_gate() {
            echo "===== $* =====" | tee -a "$RESULT"
            "$@" >>"$RESULT" 2>&1 || status=$?
            return 0
          }
          run_gate python .bootstrap/implement.py
          if [[ $status -eq 0 ]]; then run_gate python -m compileall -q linktools-ai/src/linktools/ai; fi
          if [[ $status -eq 0 ]]; then run_gate python -m pip install --upgrade pip; fi
          if [[ $status -eq 0 ]]; then run_gate python -m pip install -e ./linktools -e './linktools-ai[sqlite,evaluation,temporal]' pytest pytest-asyncio ruff; fi
          if [[ $status -eq 0 ]]; then run_gate ruff check linktools-ai/src/linktools/ai tests/ai; fi
          if [[ $status -eq 0 ]]; then run_gate python linktools-ai/scripts/build/architecture.py; fi
          if [[ $status -eq 0 ]]; then run_gate pytest -q tests/ai --maxfail=30; fi
          cp "$RESULT" /tmp/result.saved
          if [[ $status -ne 0 ]]; then
            git reset --hard HEAD
          fi
          mkdir -p .bootstrap
          rm -f .bootstrap/ready
          cp /tmp/result.saved .bootstrap/result.txt
          printf '%s\n' "$status" > .bootstrap/status
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            if [[ $status -eq 0 ]]; then
              git commit -m 'refactor(ai): implement agent runtime asset composition'
            else
              git commit -m 'ci: record agent runtime implementation gate'
            fi
            git push origin HEAD:refactor/ai-agent-runtime-asset-composition
          fi
          exit 0
