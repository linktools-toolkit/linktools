name: Temporary unified release gates source patch

on:
  push:
    branches:
      - refactor/unified-release-gates

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[source-gates-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source gate fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          architecture = Path("tests/ai/test_architecture.py")
          text = architecture.read_text(encoding="utf-8")
          marker = "\n\ndef test_architecture_gate_normalizes_relative_module_policy_and_rejects_stale_entries"
          helper = '''\n\ndef _temporary_policy_path(package_root: Path) -> Path:\n    return (\n        package_root.parent\n        / "scripts"\n        / "check"\n        / "ai"\n        / "matrix"\n        / "linktools-ai-package-policy.json"\n    )\n'''
          if "def _temporary_policy_path" not in text:
              if marker not in text:
                  raise SystemExit("architecture insertion marker not found")
              text = text.replace(marker, helper + marker, 1)
          old_policy = 'package_root / "scripts" / "build" / "matrix" / "linktools-ai-package-policy.json"'
          count = text.count(old_policy)
          if count < 4:
              raise SystemExit(f"expected at least 4 temporary old policy paths, got {count}")
          text = text.replace(old_policy, "_temporary_policy_path(package_root)")
          architecture.write_text(text, encoding="utf-8")

          lock_path = Path("linktools-ai/src/linktools/ai/storage/_lock.py")
          text = lock_path.read_text(encoding="utf-8")
          old_init = '''        self._locks = KeyedAsyncLock()\n        self._active: dict[str, Lease] = {}\n'''
          new_init = '''        self._locks = KeyedAsyncLock()\n        self._active: dict[str, Lease] = {}\n        self._lock_owners: dict[str, "asyncio.Task[object]"] = {}\n'''
          if old_init not in text:
              raise SystemExit("filesystem lease init pattern not found")
          text = text.replace(old_init, new_init, 1)

          old_success = '''                if lease is not None:\n                    self._active[key] = lease\n                    _logger.debug(\n'''
          new_success = '''                if lease is not None:\n                    self._active[key] = lease\n                    self._lock_owners[key] = owner\n                    _logger.debug(\n'''
          if old_success not in text:
              raise SystemExit("filesystem lease acquisition pattern not found")
          text = text.replace(old_success, new_success, 1)

          old_release = '''    async def release(self, lease: Lease) -> None:\n        if self._active.get(lease.key) != lease:\n            return\n        self._active.pop(lease.key, None)\n        owner = asyncio.current_task()\n        if owner is None:\n            raise RuntimeError("filesystem lease release requires an asyncio task")\n        owner = cast("asyncio.Task[object]", owner)\n        release_task = asyncio.create_task(asyncio.to_thread(self._release, lease))\n'''
          new_release = '''    async def release(self, lease: Lease) -> None:\n        if self._active.get(lease.key) != lease:\n            return\n        self._active.pop(lease.key, None)\n        owner = self._lock_owners.pop(lease.key, None)\n        if owner is None:\n            raise RuntimeError(f"filesystem lease lock owner missing: {lease.key}")\n        release_task = asyncio.create_task(asyncio.to_thread(self._release, lease))\n'''
          if old_release not in text:
              raise SystemExit("filesystem lease release pattern not found")
          text = text.replace(old_release, new_release, 1)
          lock_path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ai/test_architecture.py linktools-ai/src/linktools/ai/storage/_lock.py
          git commit -m "fix(ai): close release-gate cancellation and fixture gaps [source-gates-fixed]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
