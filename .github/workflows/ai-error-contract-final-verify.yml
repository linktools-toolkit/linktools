name: Verify AI error contract final closure

on:
  pull_request:
    branches:
      - fix/ai-error-contract-closure

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            filelock 'pydantic-ai-slim[mcp,openai,temporal]>=2.27.0,<3.0.0' \
            'pydantic-ai-harness[skills,dynamic-workflow]>=0.13.0' \
            'PyYAML>=6,<7' pytest pytest-asyncio 'sqlalchemy[asyncio]==2.0.51' \
            'aiosqlite==0.22.1' ruff rich requests packaging
          python -m pip install -e ./linktools --no-deps

      - name: Check out final work branch snapshot
        run: |
          git fetch --depth=1 origin fix/ai-error-contract-closure
          git worktree add /tmp/final-error-audit FETCH_HEAD
          git -C /tmp/final-error-audit rev-parse HEAD | tee /tmp/final-head.txt

      - name: Compile linktools-ai
        working-directory: /tmp/final-error-audit
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m compileall -q linktools-ai/src/linktools/ai

      - name: Test linktools-ai
        working-directory: /tmp/final-error-audit
        timeout-minutes: 12
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m pytest -q tests/ai

      - name: Ruff exact release command
        working-directory: /tmp/final-error-audit
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m ruff check linktools-ai/scripts/build linktools-ai/src/linktools/ai linktools-ai/src/linktools/commands/ai tests/ai

      - name: Ruff isolated proof
        working-directory: /tmp/final-error-audit
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m ruff check --isolated linktools-ai/scripts/build linktools-ai/src/linktools/ai linktools-ai/src/linktools/commands/ai tests/ai

      - name: Generate semantic audit evidence
        working-directory: /tmp/final-error-audit
        run: |
          python - <<'PY'
          import json
          import re
          from collections import Counter
          from pathlib import Path

          production_roots = (
              Path('linktools-ai/src/linktools/ai'),
              Path('linktools-ai/src/linktools/commands/ai'),
          )
          test_root = Path('tests/ai')

          def py_files(roots):
              for root in roots:
                  yield from sorted(root.rglob('*.py'))

          def matches(roots, pattern):
              regex = re.compile(pattern)
              result = []
              for path in py_files(roots):
                  lines = path.read_text().splitlines()
                  for index, line in enumerate(lines):
                      if regex.search(line):
                          start = max(0, index - 4)
                          end = min(len(lines), index + 5)
                          result.append({
                              'path': path.as_posix(),
                              'line': index + 1,
                              'text': line.strip(),
                              'context': [
                                  {'line': number + 1, 'text': lines[number]}
                                  for number in range(start, end)
                              ],
                          })
              return result

          reports = {
              'storage_integrity': matches(
                  (Path('linktools-ai/src/linktools/ai'),),
                  r'ErrorCode\.STORAGE_INTEGRITY_ERROR',
              ),
              'wide_catches': matches(
                  production_roots,
                  r'except\s+(?:Exception|BaseException)\b',
              ),
              'execution_result': matches(
                  production_roots,
                  r'\bExecutionResult\b',
              ),
              'noqa': matches(
                  production_roots + (test_root,),
                  r'#\s*noqa\b',
              ),
          }
          Path('/tmp/final-semantic-audit.json').write_text(
              json.dumps(reports, ensure_ascii=False, indent=2) + '\n'
          )
          summary = []
          for name, values in reports.items():
              counts = Counter(item['path'] for item in values)
              summary.append(f'[{name}] total={len(values)}')
              summary.extend(f'{count}\t{path}' for path, count in sorted(counts.items(), key=lambda item: (-item[1], item[0])))
              summary.append('')
          Path('/tmp/final-semantic-summary.txt').write_text('\n'.join(summary))

          codes = (
              'INTERNAL_ERROR',
              'MODEL_API_ERROR',
              'MODEL_REQUEST_REJECTED',
              'MODEL_RATE_LIMITED',
              'MODEL_TIMEOUT',
              'MODEL_UNAVAILABLE',
              'MODEL_RESPONSE_INVALID',
              'MODEL_CONTENT_FILTERED',
              'EXECUTION_CONCURRENCY_LIMIT_EXCEEDED',
              'EXECUTION_NOT_READY',
              'EXECUTION_WAIT_TIMEOUT',
              'TASK_WAIT_TIMEOUT',
              'TOOL_RETRY_REQUIRED',
              'TOOL_EXECUTION_FAILED',
              'ASSET_NOT_FOUND',
              'STORAGE_PATH_INVALID',
          )
          production_text = '\n'.join(path.read_text() for path in py_files(production_roots))
          test_text = '\n'.join(path.read_text() for path in py_files((test_root,)))
          matrix = []
          missing = []
          for code in codes:
              token = f'ErrorCode.{code}'
              production = production_text.count(token)
              validation = test_text.count(token)
              matrix.append(f'{code}\tproduction={production}\tvalidation={validation}')
              if production < 1 or validation < 1:
                  missing.append(code)
          Path('/tmp/final-error-code-matrix.txt').write_text('\n'.join(matrix) + '\n')
          if missing:
              raise SystemExit(f'new error codes missing production use or validation: {missing}')

          forbidden = (
              'ruff.toml',
              '.github/workflows/ai-error-contract-closure.yml',
              '.github/workflows/ai-error-contract-pr.yml',
              '.github/workflows/ai-error-contract-pr-verify.yml',
              'linktools-ai/scripts/build/_error_contract_closure.py',
              'linktools-ai/scripts/build/_error_contract_followup.py',
          )
          leftovers = [path for path in forbidden if Path(path).exists()]
          Path('/tmp/final-temp-leftovers.txt').write_text('\n'.join(leftovers) + ('\n' if leftovers else ''))
          if leftovers:
              raise SystemExit(f'forbidden temporary/config assets remain: {leftovers}')
          PY

      - name: Upload final semantic audit
        uses: actions/upload-artifact@v4
        with:
          name: ai-error-contract-final-semantic-audit
          path: |
            /tmp/final-head.txt
            /tmp/final-semantic-audit.json
            /tmp/final-semantic-summary.txt
            /tmp/final-error-code-matrix.txt
            /tmp/final-temp-leftovers.txt
          if-no-files-found: error
