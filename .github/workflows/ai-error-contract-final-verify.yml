name: Verify AI error contract final closure

on:
  pull_request:
    branches:
      - fix/ai-error-contract-closure

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Check out work branch snapshot
        run: |
          git fetch --depth=1 origin fix/ai-error-contract-closure
          git worktree add /tmp/ruff-isolated FETCH_HEAD
          git -C /tmp/ruff-isolated rev-parse HEAD

      - name: Scan Ruff without repository ignores
        id: ruff
        continue-on-error: true
        working-directory: /tmp/ruff-isolated
        run: |
          set +e
          python -m ruff check --isolated \
            linktools-ai/scripts/build linktools-ai/src/linktools/ai \
            linktools-ai/src/linktools/commands/ai tests/ai \
            --output-format=json > /tmp/ruff-isolated.json
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Summarize isolated Ruff diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          path = Path('/tmp/ruff-isolated.json')
          diagnostics = json.loads(path.read_text()) if path.exists() else []
          by_rule = Counter(item['code'] for item in diagnostics)
          by_file = Counter(
              item['filename'].split('/ruff-isolated/', 1)[-1]
              for item in diagnostics
          )
          lines = [
              f'count={len(diagnostics)}',
              f'status=${{{{ steps.ruff.outputs.status }}}}',
              '',
              '[rules]',
          ]
          lines.extend(f'{count}\t{rule}' for rule, count in sorted(by_rule.items(), key=lambda item: (-item[1], item[0])))
          lines.extend(['', '[files]'])
          lines.extend(f'{count}\t{filename}' for filename, count in sorted(by_file.items(), key=lambda item: (-item[1], item[0])))
          Path('/tmp/ruff-isolated-summary.txt').write_text('\n'.join(lines) + '\n')
          print('\n'.join(lines[:120]))
          PY

      - name: Upload isolated Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-error-contract-ruff-isolated
          path: |
            /tmp/ruff-isolated.json
            /tmp/ruff-isolated-summary.txt
          if-no-files-found: error
