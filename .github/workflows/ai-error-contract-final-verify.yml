name: Verify AI error contract final closure

on:
  pull_request:
    branches:
      - fix/ai-error-contract-closure

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            filelock 'pydantic-ai-slim[mcp,openai,temporal]>=2.27.0,<3.0.0' \
            'pydantic-ai-harness[skills,dynamic-workflow]>=0.13.0' \
            'PyYAML>=6,<7' pytest pytest-asyncio 'sqlalchemy[asyncio]==2.0.51' \
            'aiosqlite==0.22.1' ruff rich requests packaging
          python -m pip install -e ./linktools --no-deps

      - name: Apply and verify closure candidates
        run: |
          cp .github/ai-error-cancellation-closure.patch /tmp/error-closure.patch
          cp .github/ai-error-cancellation-contract.py /tmp/test_error_cancellation_contract.py
          cp .github/ai-error-capability-policy-closure.py /tmp/capability-policy-closure.py
          git fetch --depth=1 origin fix/ai-error-contract-closure
          git worktree add /tmp/error-closure FETCH_HEAD
          cd /tmp/error-closure
          git apply --check /tmp/error-closure.patch
          git apply /tmp/error-closure.patch
          python - <<'PY'
          from pathlib import Path

          path = Path('linktools-ai/src/linktools/ai/agent/_capabilities.py')
          text = path.read_text()
          old = 'class _CompactionCapability(PydanticAgentCapability[None]):'
          new = 'class _CompactionCapability(AbstractCapability[None]):'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy compaction base, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          python /tmp/capability-policy-closure.py
          cp /tmp/test_error_cancellation_contract.py tests/ai/test_error_cancellation_contract.py
          python -m ruff check --fix --select I001 \
            tests/ai/test_error_cancellation_contract.py tests/ai/test_spec_capability_refactor.py
          python -m ruff check \
            tests/ai/test_error_cancellation_contract.py tests/ai/test_spec_capability_refactor.py
          git diff --check
          PYTHONPATH=linktools-ai:linktools-ai/src:linktools/src \
            python -m compileall -q linktools-ai/src/linktools/ai
          PYTHONPATH=linktools-ai:linktools-ai/src:linktools/src \
            python -m pytest -q tests/ai

          git fetch --depth=1 origin a4ded79a152ccfbc635503ee7b7bd394bd50970e
          git worktree add /tmp/error-baseline FETCH_HEAD
          set +e
          PYTHONPATH=linktools-ai:linktools-ai/src:linktools/src \
            python -m ruff check linktools-ai/scripts/build linktools-ai/src/linktools/ai \
            linktools-ai/src/linktools/commands/ai tests/ai > /tmp/ruff-current.log 2>&1
          current_status=$?
          cd /tmp/error-baseline
          PYTHONPATH=linktools-ai:linktools-ai/src:linktools/src \
            python -m ruff check linktools-ai/scripts/build linktools-ai/src/linktools/ai \
            linktools-ai/src/linktools/commands/ai tests/ai > /tmp/ruff-baseline.log 2>&1
          baseline_status=$?
          set -e
          cd /tmp/error-closure
          python - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path

          pattern = re.compile(r'^(.+?):\d+:\d+: ([A-Z]+\d+) ')

          def diagnostics(path: str) -> Counter[tuple[str, str]]:
              result: Counter[tuple[str, str]] = Counter()
              for line in Path(path).read_text().splitlines():
                  match = pattern.match(line)
                  if match is not None:
                      result[(match.group(1), match.group(2))] += 1
              return result

          baseline = diagnostics('/tmp/ruff-baseline.log')
          current = diagnostics('/tmp/ruff-current.log')
          if current != baseline:
              raise SystemExit(
                  f'Ruff delta detected: added={dict(current - baseline)} removed={dict(baseline - current)}'
              )
          print(f'Ruff baseline/current diagnostics identical: {sum(current.values())}')
          PY
          test "$current_status" = "$baseline_status"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            linktools-ai/src/linktools/ai/agent/_capabilities.py \
            linktools-ai/src/linktools/ai/capability/_mcp.py \
            linktools-ai/src/linktools/ai/asset/_sql.py \
            linktools-ai/src/linktools/ai/runtime/_execution.py \
            linktools-ai/src/linktools/ai/runtime/_local.py \
            linktools-ai/src/linktools/ai/runtime/_evaluation.py \
            linktools-ai/src/linktools/ai/runtime/_session.py \
            linktools-ai/src/linktools/ai/task/_service_impl.py \
            linktools-ai/src/linktools/ai/runtime/_planner.py \
            linktools-ai/src/linktools/ai/runtime/_subagent.py \
            tests/ai/test_error_cancellation_contract.py \
            tests/ai/test_spec_capability_refactor.py
          git commit -m 'fix(ai): close cancellation and capability policy contracts'
          git push origin HEAD:fix/ai-error-contract-closure
