name: Verify AI error contract final closure

on:
  pull_request:
    branches:
      - fix/ai-error-contract-closure

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Check out work branch snapshot
        run: |
          git fetch --depth=1 origin fix/ai-error-contract-closure
          git worktree add /tmp/try004-audit FETCH_HEAD
          git -C /tmp/try004-audit rev-parse HEAD > /tmp/try004-head.txt

      - name: Export TRY004 diagnostics and contexts
        working-directory: /tmp/try004-audit
        run: |
          set +e
          python -m ruff check --isolated --select TRY004 \
            linktools-ai/scripts/build linktools-ai/src/linktools/ai \
            linktools-ai/src/linktools/commands/ai tests/ai \
            --output-format=json > /tmp/try004.json
          status=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path

          diagnostics = json.loads(Path('/tmp/try004.json').read_text())
          rows = []
          for item in diagnostics:
              path = Path(item['filename'])
              line = item['location']['row']
              lines = path.read_text().splitlines()
              start = max(1, line - 5)
              end = min(len(lines), line + 5)
              rows.append(f"=== {path}:{line} {item['code']} {item['message']} ===")
              rows.extend(f"{number:>5}: {lines[number - 1]}" for number in range(start, end + 1))
              rows.append('')
          Path('/tmp/try004-contexts.txt').write_text('\n'.join(rows) + ('\n' if rows else ''))
          print(f'TRY004 diagnostics: {len(diagnostics)}')
          if len(diagnostics) != 40:
              raise SystemExit(f'expected 40 TRY004 diagnostics, found {len(diagnostics)}')
          PY
          test "$status" -ne 0

      - name: Upload TRY004 audit
        uses: actions/upload-artifact@v4
        with:
          name: ai-error-contract-try004-audit
          path: |
            /tmp/try004-head.txt
            /tmp/try004.json
            /tmp/try004-contexts.txt
          if-no-files-found: error
