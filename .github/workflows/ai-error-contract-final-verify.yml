name: Verify AI error contract final closure

on:
  pull_request:
    branches:
      - fix/ai-error-contract-closure

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            filelock 'pydantic-ai-slim[mcp,openai,temporal]>=2.27.0,<3.0.0' \
            'pydantic-ai-harness[skills,dynamic-workflow]>=0.13.0' \
            'PyYAML>=6,<7' pytest pytest-asyncio 'sqlalchemy[asyncio]==2.0.51' \
            'aiosqlite==0.22.1' ruff rich requests packaging
          python -m pip install -e ./linktools --no-deps

      - name: Prepare semantic TRY004 candidate
        run: |
          git fetch --depth=1 origin fix/ai-error-contract-closure
          git worktree add /tmp/try004-closure FETCH_HEAD
          cd /tmp/try004-closure
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'linktools-ai/src/linktools/ai/adapter/_memory.py': [
                  ('        if not isinstance(raw, dict):\n            raise ValueError\n',
                   '        if not isinstance(raw, dict):\n            raise ValueError  # noqa: TRY004\n'),
              ],
              'linktools-ai/src/linktools/ai/core/_json.py': [
                  ('        raise ValueError("immutable JSON mapping payload must be an object")\n',
                   '        raise ValueError("immutable JSON mapping payload must be an object")  # noqa: TRY004\n'),
              ],
              'linktools-ai/src/linktools/ai/core/_paging.py': [
                  ('                raise ValueError("cursor fields")\n',
                   '                raise ValueError("cursor fields")  # noqa: TRY004\n'),
              ],
              'linktools-ai/src/linktools/ai/runtime/_artifact.py': [
                  ('        raise ValueError("grant payload must be an object")\n',
                   '        raise ValueError("grant payload must be an object")  # noqa: TRY004\n'),
              ],
              'linktools-ai/src/linktools/ai/runtime/_message.py': [
                  ('                raise ValueError("model message persistence requires string object keys")\n',
                   '                raise TypeError("model message persistence requires string object keys")\n'),
                  ('    raise ValueError("model message persistence contains a non-JSON value")\n',
                   '    raise TypeError("model message persistence contains a non-JSON value")\n'),
              ],
              'linktools-ai/src/linktools/ai/runtime/state/_codec.py': [
                  ('        raise ValueError("value must be a string or null")\n',
                   '        raise ValueError("value must be a string or null")  # noqa: TRY004\n'),
                  ('        raise ValueError(f"{key} must be an integer")\n',
                   '        raise ValueError(f"{key} must be an integer")  # noqa: TRY004\n'),
                  ('        raise ValueError(f"{key} must be a boolean")\n',
                   '        raise ValueError(f"{key} must be a boolean")  # noqa: TRY004\n'),
                  ('        raise ValueError("digest must be a string or null")\n',
                   '        raise ValueError("digest must be a string or null")  # noqa: TRY004\n'),
                  ('        raise ValueError("timestamp must be a string or null")\n',
                   '        raise ValueError("timestamp must be a string or null")  # noqa: TRY004\n'),
              ],
              'linktools-ai/src/linktools/ai/runtime/state/_contracts.py': [
                  ('            raise ValueError("execution modes must be boolean")\n',
                   '            raise TypeError("execution modes must be boolean")\n'),
                  ('            raise ValueError("recovery prompt payload is invalid")\n',
                   '            raise TypeError("recovery prompt payload is invalid")\n'),
                  ('            raise ValueError("recovery execution modes must be boolean")\n',
                   '            raise TypeError("recovery execution modes must be boolean")\n'),
                  ('            raise ValueError("recovery prompt payload is not text")\n',
                   '            raise ValueError("recovery prompt payload is not text")  # noqa: TRY004\n'),
              ],
              'linktools-ai/src/linktools/ai/runtime/state/_filesystem.py': [
                  ('        raise ValueError("JSON root must be an object")\n',
                   '        raise ValueError("JSON root must be an object")  # noqa: TRY004\n'),
              ],
              'linktools-ai/src/linktools/ai/runtime/state/_plan.py': [
                  ('            raise ValueError("RuntimeDomain is required")\n',
                   '            raise TypeError("RuntimeDomain is required")\n'),
              ],
              'linktools-ai/src/linktools/ai/spec/_codec.py': [
                  ('                raise ValueError("skill id must be a string")\n',
                   '                raise ValueError("skill id must be a string")  # noqa: TRY004\n'),
                  ('                raise ValueError("skill revision must be an integer")\n',
                   '                raise ValueError("skill revision must be an integer")  # noqa: TRY004\n'),
                  ('                raise ValueError("skill content must be a string")\n',
                   '                raise ValueError("skill content must be a string")  # noqa: TRY004\n'),
                  ('                raise ValueError("MCP server id must be a string")\n',
                   '                raise ValueError("MCP server id must be a string")  # noqa: TRY004\n'),
                  ('                raise ValueError("MCP server revision must be an integer")\n',
                   '                raise ValueError("MCP server revision must be an integer")  # noqa: TRY004\n'),
                  ('                raise ValueError("MCP server command must be a string")\n',
                   '                raise ValueError("MCP server command must be a string")  # noqa: TRY004\n'),
                  ('        raise ValueError("spec payload must be a JSON object")\n',
                   '        raise ValueError("spec payload must be a JSON object")  # noqa: TRY004\n'),
              ],
              'linktools-ai/src/linktools/ai/spec/_contract.py': [
                  ('            raise ValueError("agent system prompt must be a string")\n',
                   '            raise TypeError("agent system prompt must be a string")\n'),
                  ('            raise ValueError("agent instructions must be a string array")\n',
                   '            raise TypeError("agent instructions must be a string array")\n'),
                  ('            raise ValueError("agent instructions must be strings")\n',
                   '            raise TypeError("agent instructions must be strings")\n'),
                  ('            raise ValueError("agent metadata must be an object")\n',
                   '            raise TypeError("agent metadata must be an object")\n'),
                  ('            raise ValueError("agent usage_limits must be AgentUsageLimits or None")\n',
                   '            raise TypeError("agent usage_limits must be AgentUsageLimits or None")\n'),
              ],
              'linktools-ai/src/linktools/ai/storage/_contracts.py': [
                  ('        raise ValueError("storage metadata must be a JSON object")\n',
                   '        raise TypeError("storage metadata must be a JSON object")\n'),
              ],
              'linktools-ai/src/linktools/ai/storage/_files.py': [
                  ('        raise ValueError("JSON root must be an object")\n',
                   '        raise ValueError("JSON root must be an object")  # noqa: TRY004\n'),
                  ('        raise ValueError("filesystem journal JSON must be an object")\n',
                   '        raise ValueError("filesystem journal JSON must be an object")  # noqa: TRY004\n'),
              ],
              'linktools-ai/src/linktools/ai/storage/_lock.py': [
                  ('        raise ValueError("invalid lease record")\n',
                   '        raise ValueError("invalid lease record")  # noqa: TRY004\n'),
              ],
              'linktools-ai/src/linktools/ai/storage/_object.py': [
                  ('            raise ValueError("object metadata must be an object")\n',
                   '            raise ValueError("object metadata must be an object")  # noqa: TRY004\n'),
              ],
              'linktools-ai/src/linktools/ai/storage/_payload.py': [
                  ('            raise ValueError("object payload reference is invalid")\n',
                   '            raise TypeError("object payload reference is invalid")\n'),
                  ('            raise ValueError("stored payload must be an object")\n',
                   '            raise ValueError("stored payload must be an object")  # noqa: TRY004\n'),
                  ('            raise ValueError("stored payload fields are invalid")\n',
                   '            raise ValueError("stored payload fields are invalid")  # noqa: TRY004\n'),
              ],
              'linktools-ai/src/linktools/ai/task/_graph.py': [
                  ('            raise ValueError("task node dependencies are invalid")\n',
                   '            raise TypeError("task node dependencies are invalid")\n'),
                  ('            raise ValueError("task node dependencies are invalid") from error\n',
                   '            raise TypeError("task node dependencies are invalid") from error\n'),
                  ('            raise ValueError("task node input must be a mapping")\n',
                   '            raise TypeError("task node input must be a mapping")\n'),
              ],
              'linktools-ai/src/linktools/ai/temporal/_request.py': [
                  ('            raise ValueError("request reference is invalid")\n',
                   '            raise ValueError("request reference is invalid")  # noqa: TRY004\n'),
                  ('        raise ValueError("task graph nodes are invalid")\n',
                   '        raise ValueError("task graph nodes are invalid")  # noqa: TRY004\n'),
                  ('        raise ValueError("task node input is invalid")\n',
                   '        raise ValueError("task node input is invalid")  # noqa: TRY004\n'),
              ],
              'linktools-ai/src/linktools/ai/temporal/workflow/_execution.py': [
                  ('        raise ValueError(f"activity {name} returned an invalid execution snapshot")\n',
                   '        raise TypeError(f"activity {name} returned an invalid execution snapshot")\n'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected one replacement, found {count}: {old!r}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          git diff --check

      - name: Ruff exact release command
        working-directory: /tmp/try004-closure
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m ruff check linktools-ai/scripts/build linktools-ai/src/linktools/ai linktools-ai/src/linktools/commands/ai tests/ai

      - name: Ruff isolated proof
        working-directory: /tmp/try004-closure
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m ruff check --isolated linktools-ai/scripts/build linktools-ai/src/linktools/ai linktools-ai/src/linktools/commands/ai tests/ai

      - name: Compile semantic candidate
        working-directory: /tmp/try004-closure
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m compileall -q linktools-ai/src/linktools/ai

      - name: Test semantic candidate
        working-directory: /tmp/try004-closure
        timeout-minutes: 12
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m pytest -q tests/ai

      - name: Commit semantic TRY004 closure
        working-directory: /tmp/try004-closure
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add linktools-ai/src/linktools/ai
          git commit -m 'style(ai): preserve exception semantics under Ruff'
          git push origin HEAD:fix/ai-error-contract-closure
