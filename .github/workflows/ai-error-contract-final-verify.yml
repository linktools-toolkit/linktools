name: Verify AI error contract final closure

on:
  pull_request:
    branches:
      - fix/ai-error-contract-closure

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            filelock 'pydantic-ai-slim[mcp,openai,temporal]>=2.27.0,<3.0.0' \
            'pydantic-ai-harness[skills,dynamic-workflow]>=0.13.0' \
            'PyYAML>=6,<7' pytest pytest-asyncio 'sqlalchemy[asyncio]==2.0.51' \
            'aiosqlite==0.22.1' ruff rich requests packaging
          python -m pip install -e ./linktools --no-deps

      - name: Prepare strict Ruff candidate
        run: |
          git fetch --depth=1 origin fix/ai-error-contract-closure
          git worktree add /tmp/ruff-strict FETCH_HEAD
          cd /tmp/ruff-strict
          rm -f ruff.toml
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          roots = (
              Path('linktools-ai/scripts/build'),
              Path('linktools-ai/src/linktools/ai'),
              Path('linktools-ai/src/linktools/commands/ai'),
              Path('tests/ai'),
          )
          modes: dict[str, str] = {}
          raw = subprocess.check_output(('git', 'ls-files', '-s', '-z'))
          for entry in raw.decode().split('\0'):
              if not entry:
                  continue
              metadata, path = entry.split('\t', 1)
              mode = metadata.split(' ', 1)[0]
              modes[path] = mode

          coding = re.compile(r'^#.*coding[:=]\s*[-\w.]+')
          for root in roots:
              for path in root.rglob('*.py'):
                  relative = path.as_posix()
                  executable = modes.get(relative) == '100755'
                  lines = path.read_text().splitlines(keepends=True)
                  changed = False
                  if not executable and lines and lines[0].startswith('#!'):
                      lines.pop(0)
                      changed = True
                  coding_index = 1 if executable and lines and lines[0].startswith('#!') else 0
                  if len(lines) > coding_index and coding.match(lines[coding_index]):
                      lines.pop(coding_index)
                      changed = True
                  if changed:
                      path.write_text(''.join(lines))
          PY
          git diff --check

      - name: Verify only audited TRY004 remains
        working-directory: /tmp/ruff-strict
        run: |
          set +e
          python -m ruff check --isolated \
            linktools-ai/scripts/build linktools-ai/src/linktools/ai \
            linktools-ai/src/linktools/commands/ai tests/ai \
            --output-format=json > /tmp/ruff-strict.json
          status=$?
          set -e
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          diagnostics = json.loads(Path('/tmp/ruff-strict.json').read_text())
          rules = Counter(item['code'] for item in diagnostics)
          print(f'remaining={len(diagnostics)} rules={dict(rules)}')
          if not diagnostics:
              raise SystemExit('expected audited TRY004 diagnostics before semantic cleanup')
          if set(rules) != {'TRY004'}:
              raise SystemExit(f'unexpected strict Ruff diagnostics remain: {dict(rules)}')
          PY
          test "$status" -ne 0

      - name: Compile strict candidate
        working-directory: /tmp/ruff-strict
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m compileall -q linktools-ai/src/linktools/ai

      - name: Test strict candidate
        working-directory: /tmp/ruff-strict
        timeout-minutes: 12
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m pytest -q tests/ai

      - name: Commit strict Ruff cleanup
        working-directory: /tmp/ruff-strict
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A ruff.toml linktools-ai/scripts/build linktools-ai/src/linktools/ai \
            linktools-ai/src/linktools/commands/ai tests/ai
          git commit -m 'style(ai): remove Ruff blanket ignores'
          git push origin HEAD:fix/ai-error-contract-closure
