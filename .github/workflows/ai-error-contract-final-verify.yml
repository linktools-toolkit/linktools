name: Verify AI error contract final closure

on:
  pull_request:
    branches:
      - fix/ai-error-contract-closure

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            filelock 'pydantic-ai-slim[mcp,openai,temporal]>=2.27.0,<3.0.0' \
            'pydantic-ai-harness[skills,dynamic-workflow]>=0.13.0' \
            'PyYAML>=6,<7' pytest pytest-asyncio 'sqlalchemy[asyncio]==2.0.51' \
            'aiosqlite==0.22.1' ruff rich requests packaging
          python -m pip install -e ./linktools --no-deps

      - name: Prepare corrected final Ruff candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 32628953978 \
            --repo linktools-toolkit/linktools \
            --name ai-error-contract-ruff-final-candidate \
            --dir /tmp/ruff-artifact
          git fetch --depth=1 origin fix/ai-error-contract-closure
          git worktree add /tmp/ruff-final FETCH_HEAD
          cd /tmp/ruff-final
          git apply --check /tmp/ruff-artifact/ruff-final.patch
          git apply /tmp/ruff-artifact/ruff-final.patch
          python - <<'PY'
          from pathlib import Path

          path = Path('linktools-ai/src/linktools/ai/capability/__init__.py')
          text = path.read_text()
          export = '    "mcp_server_selector",\n'
          if text.count(export) != 1:
              raise SystemExit(f'expected one temporary mcp_server_selector export, found {text.count(export)}')
          text = text.replace(export, '')
          old = 'from ._mcp import MCPCapabilityProvider, MCPRuntime, mcp_server_selector\n'
          new = 'from ._mcp import MCPCapabilityProvider, MCPRuntime, mcp_server_selector as mcp_server_selector\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one mcp_server_selector import, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          python -m ruff check --fix \
            linktools-ai/scripts/build linktools-ai/src/linktools/ai \
            linktools-ai/src/linktools/commands/ai tests/ai
          git diff --check

      - name: Ruff corrected candidate
        working-directory: /tmp/ruff-final
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m ruff check linktools-ai/scripts/build linktools-ai/src/linktools/ai linktools-ai/src/linktools/commands/ai tests/ai

      - name: Compile corrected candidate
        working-directory: /tmp/ruff-final
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m compileall -q linktools-ai/src/linktools/ai

      - name: Test corrected candidate
        working-directory: /tmp/ruff-final
        timeout-minutes: 12
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m pytest -q tests/ai

      - name: Capture corrected candidate patch
        working-directory: /tmp/ruff-final
        if: always()
        run: |
          git diff --check
          git diff > /tmp/ruff-final-corrected.patch

      - name: Upload corrected final candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-error-contract-ruff-final-corrected
          path: /tmp/ruff-final-corrected.patch
          if-no-files-found: error
