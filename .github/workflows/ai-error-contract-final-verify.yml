name: Verify AI error contract final closure

on:
  pull_request:
    branches:
      - fix/ai-error-contract-closure

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            filelock 'pydantic-ai-slim[mcp,openai,temporal]>=2.27.0,<3.0.0' \
            'pydantic-ai-harness[skills,dynamic-workflow]>=0.13.0' \
            'PyYAML>=6,<7' pytest pytest-asyncio 'sqlalchemy[asyncio]==2.0.51' \
            'aiosqlite==0.22.1' ruff rich requests packaging
          python -m pip install -e ./linktools --no-deps

      - name: Compile
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m compileall -q linktools-ai/src/linktools/ai

      - name: AI tests
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m pytest -q tests/ai

      - name: Check out fixed baseline
        uses: actions/checkout@v4
        with:
          ref: a4ded79a152ccfbc635503ee7b7bd394bd50970e
          path: baseline

      - name: Baseline Ruff diagnostics
        continue-on-error: true
        run: |
          set +e
          cd baseline
          PYTHONPATH=linktools-ai:linktools-ai/src:linktools/src python -m ruff check \
            linktools-ai/scripts/build linktools-ai/src/linktools/ai \
            linktools-ai/src/linktools/commands/ai tests/ai > ../ruff-baseline.log 2>&1
          exit $?

      - name: Current Ruff diagnostics
        continue-on-error: true
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: |
          python -m ruff check \
            linktools-ai/scripts/build linktools-ai/src/linktools/ai \
            linktools-ai/src/linktools/commands/ai tests/ai > ruff.log 2>&1

      - name: Enforce zero Ruff delta
        run: |
          python - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path

          pattern = re.compile(r'^(.+?):\d+:\d+: ([A-Z]+\d+) ')

          def diagnostics(path: str) -> Counter[tuple[str, str]]:
              result: Counter[tuple[str, str]] = Counter()
              for line in Path(path).read_text().splitlines():
                  match = pattern.match(line)
                  if match is not None:
                      result[(match.group(1), match.group(2))] += 1
              return result

          baseline = diagnostics('ruff-baseline.log')
          current = diagnostics('ruff.log')
          if current != baseline:
              raise SystemExit(
                  f'Ruff delta detected: added={dict(current - baseline)} removed={dict(baseline - current)}'
              )
          print(f'Ruff baseline/current diagnostics identical: {sum(current.values())}')
          PY

      - name: Generate final semantic audit
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path('linktools-ai/src/linktools/ai')
          command_root = Path('linktools-ai/src/linktools/commands/ai')
          tests = Path('tests/ai')

          def scan(roots, pattern):
              regex = re.compile(pattern)
              rows = []
              for scan_root in roots:
                  for path in sorted(scan_root.rglob('*.py')):
                      for number, line in enumerate(path.read_text().splitlines(), 1):
                          if regex.search(line):
                              rows.append(f'{path}:{number}:{line.strip()}')
              return rows

          reports = {
              'audit-storage-integrity.txt': scan([root], r'ErrorCode\.STORAGE_INTEGRITY_ERROR'),
              'audit-wide-catches.txt': scan([root, command_root], r'except\s+(?:Exception|BaseException)\b'),
              'audit-execution-result.txt': scan([root, command_root], r'\bExecutionResult\b'),
          }
          for name, rows in reports.items():
              Path(name).write_text('\n'.join(rows) + ('\n' if rows else ''))

          codes = (
              'INTERNAL_ERROR',
              'MODEL_API_ERROR',
              'MODEL_REQUEST_REJECTED',
              'MODEL_RATE_LIMITED',
              'MODEL_TIMEOUT',
              'MODEL_UNAVAILABLE',
              'MODEL_RESPONSE_INVALID',
              'MODEL_CONTENT_FILTERED',
              'EXECUTION_CONCURRENCY_LIMIT_EXCEEDED',
              'EXECUTION_NOT_READY',
              'EXECUTION_WAIT_TIMEOUT',
              'TASK_WAIT_TIMEOUT',
              'TOOL_RETRY_REQUIRED',
              'TOOL_EXECUTION_FAILED',
              'ASSET_NOT_FOUND',
              'STORAGE_PATH_INVALID',
          )
          production_text = '\n'.join(path.read_text() for path in root.rglob('*.py'))
          production_text += '\n' + '\n'.join(path.read_text() for path in command_root.rglob('*.py'))
          test_text = '\n'.join(path.read_text() for path in tests.rglob('*.py'))
          matrix = []
          missing = []
          for code in codes:
              token = f'ErrorCode.{code}'
              production = production_text.count(token)
              validation = test_text.count(token)
              matrix.append(f'{code}\tproduction={production}\tvalidation={validation}')
              if production < 1 or validation < 1:
                  missing.append(code)
          Path('audit-error-code-matrix.txt').write_text('\n'.join(matrix) + '\n')
          if missing:
              raise SystemExit(f'new error codes missing production use or validation: {missing}')
          PY

      - name: Upload final audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-error-contract-final-audit
          path: |
            ruff.log
            ruff-baseline.log
            audit-storage-integrity.txt
            audit-wide-catches.txt
            audit-execution-result.txt
            audit-error-code-matrix.txt
            linktools-ai/src/linktools/ai
            linktools-ai/src/linktools/commands/ai
          if-no-files-found: error
