name: Verify AI error contract final closure

on:
  pull_request:
    branches:
      - fix/ai-error-contract-closure

permissions:
  contents: write
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            filelock 'pydantic-ai-slim[mcp,openai,temporal]>=2.27.0,<3.0.0' \
            'pydantic-ai-harness[skills,dynamic-workflow]>=0.13.0' \
            'PyYAML>=6,<7' pytest pytest-asyncio 'sqlalchemy[asyncio]==2.0.51' \
            'aiosqlite==0.22.1' ruff rich requests packaging
          python -m pip install -e ./linktools --no-deps

      - name: Apply verified final Ruff closure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 32629192010 \
            --repo linktools-toolkit/linktools \
            --name ai-error-contract-ruff-final-corrected \
            --dir /tmp/ruff-artifact
          git fetch --depth=1 origin fix/ai-error-contract-closure
          git worktree add /tmp/ruff-final FETCH_HEAD
          cd /tmp/ruff-final
          git apply --check /tmp/ruff-artifact/ruff-final-corrected.patch
          git apply /tmp/ruff-artifact/ruff-final-corrected.patch
          git diff --check

      - name: Ruff verified closure
        working-directory: /tmp/ruff-final
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m ruff check linktools-ai/scripts/build linktools-ai/src/linktools/ai linktools-ai/src/linktools/commands/ai tests/ai

      - name: Compile verified closure
        working-directory: /tmp/ruff-final
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m compileall -q linktools-ai/src/linktools/ai

      - name: Test verified closure
        working-directory: /tmp/ruff-final
        timeout-minutes: 12
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m pytest -q tests/ai

      - name: Commit verified final Ruff closure
        working-directory: /tmp/ruff-final
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ruff.toml linktools-ai/scripts/build linktools-ai/src/linktools/ai \
            linktools-ai/src/linktools/commands/ai tests/ai
          git commit -m 'style(ai): close Ruff release gate'
          git push origin HEAD:fix/ai-error-contract-closure
