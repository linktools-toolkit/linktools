name: Verify AI error contract final closure

on:
  pull_request:
    branches:
      - fix/ai-error-contract-closure

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            filelock 'pydantic-ai-slim[mcp,openai,temporal]>=2.27.0,<3.0.0' \
            'pydantic-ai-harness[skills,dynamic-workflow]>=0.13.0' \
            'PyYAML>=6,<7' pytest pytest-asyncio 'sqlalchemy[asyncio]==2.0.51' \
            'aiosqlite==0.22.1' ruff rich requests packaging
          python -m pip install -e ./linktools --no-deps

      - name: Prepare semantic TRY004 candidate
        run: |
          cp .github/ai-error-spec-constructor-contract.py /tmp/spec-constructor-contract.py
          cp .github/ai-error-spec-test-contract.py /tmp/spec-test-contract.py
          git fetch --depth=1 origin fix/ai-error-contract-closure
          git worktree add /tmp/try004-closure FETCH_HEAD
          cd /tmp/try004-closure
          set +e
          python -m ruff check --isolated --select TRY004 \
            linktools-ai/scripts/build linktools-ai/src/linktools/ai \
            linktools-ai/src/linktools/commands/ai tests/ai \
            --output-format=json > /tmp/try004-before.json
          status=$?
          set -e
          test "$status" -ne 0
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path.cwd().resolve()
          diagnostics = json.loads(Path('/tmp/try004-before.json').read_text())
          if len(diagnostics) != 40:
              raise SystemExit(f'expected 40 TRY004 diagnostics, found {len(diagnostics)}')

          type_markers = {
              'linktools-ai/src/linktools/ai/runtime/_message.py': (
                  'model message persistence requires string object keys',
              ),
              'linktools-ai/src/linktools/ai/runtime/state/_contracts.py': (
                  'execution modes must be boolean',
                  'recovery prompt payload is invalid',
                  'recovery execution modes must be boolean',
              ),
              'linktools-ai/src/linktools/ai/runtime/state/_plan.py': (
                  'RuntimeDomain is required',
              ),
              'linktools-ai/src/linktools/ai/spec/_contract.py': (
                  'agent system prompt must be a string',
                  'agent instructions must be a string array',
                  'agent metadata must be an object',
              ),
              'linktools-ai/src/linktools/ai/storage/_contracts.py': (
                  'storage metadata must be a JSON object',
              ),
              'linktools-ai/src/linktools/ai/storage/_payload.py': (
                  'object payload reference is invalid',
              ),
              'linktools-ai/src/linktools/ai/task/_graph.py': (
                  'task node dependencies are invalid',
                  'task node input must be a mapping',
              ),
              'linktools-ai/src/linktools/ai/temporal/workflow/_execution.py': (
                  'returned an invalid execution snapshot',
              ),
          }

          type_changes = 0
          semantic_value_ignores = 0
          by_file: dict[str, list[dict[str, object]]] = {}
          for item in diagnostics:
              path = Path(item['filename']).resolve()
              relative = path.relative_to(root).as_posix()
              by_file.setdefault(relative, []).append(item)

          for relative, items in by_file.items():
              path = Path(relative)
              lines = path.read_text().splitlines(keepends=True)
              for item in sorted(items, key=lambda value: value['location']['row'], reverse=True):
                  row = item['location']['row']
                  index = row - 1
                  line = lines[index]
                  if 'raise ValueError' not in line:
                      raise SystemExit(f'{relative}:{row}: expected ValueError raise, found {line!r}')
                  markers = type_markers.get(relative, ())
                  if any(marker in line for marker in markers):
                      lines[index] = line.replace('raise ValueError', 'raise TypeError', 1)
                      type_changes += 1
                  else:
                      newline = '\n' if line.endswith('\n') else ''
                      body = line[:-1] if newline else line
                      lines[index] = f'{body}  # noqa: TRY004{newline}'
                      semantic_value_ignores += 1
              path.write_text(''.join(lines))

          if type_changes != 13 or semantic_value_ignores != 27:
              raise SystemExit(
                  f'unexpected TRY004 classification: type={type_changes} value={semantic_value_ignores}'
              )

          extras = {
              'linktools-ai/src/linktools/ai/runtime/_message.py': (
                  ('    raise ValueError("model message persistence contains a non-JSON value")\n',
                   '    raise TypeError("model message persistence contains a non-JSON value")\n'),
              ),
              'linktools-ai/src/linktools/ai/spec/_contract.py': (
                  ('            raise ValueError("agent instructions must be strings")\n',
                   '            raise TypeError("agent instructions must be strings")\n'),
                  ('            raise ValueError("agent usage_limits must be AgentUsageLimits or None")\n',
                   '            raise TypeError("agent usage_limits must be AgentUsageLimits or None")\n'),
              ),
              'linktools-ai/src/linktools/ai/storage/_payload.py': (
                  ('                raise ValueError("object payload reference is invalid")\n',
                   '                raise TypeError("object payload reference is invalid")\n'),
              ),
              'linktools-ai/src/linktools/ai/task/_graph.py': (
                  ('            raise ValueError("task node dependencies are invalid") from error\n',
                   '            raise TypeError("task node dependencies are invalid") from error\n'),
              ),
          }
          for relative, pairs in extras.items():
              path = Path(relative)
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{relative}: expected one extra replacement, found {count}: {old!r}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          python /tmp/spec-constructor-contract.py
          python /tmp/spec-test-contract.py
          git diff --check

      - name: Ruff exact release command
        working-directory: /tmp/try004-closure
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m ruff check linktools-ai/scripts/build linktools-ai/src/linktools/ai linktools-ai/src/linktools/commands/ai tests/ai

      - name: Ruff isolated proof
        working-directory: /tmp/try004-closure
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m ruff check --isolated linktools-ai/scripts/build linktools-ai/src/linktools/ai linktools-ai/src/linktools/commands/ai tests/ai

      - name: Compile semantic candidate
        working-directory: /tmp/try004-closure
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m compileall -q linktools-ai/src/linktools/ai

      - name: Test semantic candidate
        working-directory: /tmp/try004-closure
        timeout-minutes: 12
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m pytest -q tests/ai

      - name: Commit semantic TRY004 closure
        working-directory: /tmp/try004-closure
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add linktools-ai/src/linktools/ai tests/ai/test_spec_capability_refactor.py tests/ai/test_asset_repository.py
          git commit -m 'style(ai): preserve exception semantics under Ruff'
          git push origin HEAD:fix/ai-error-contract-closure
