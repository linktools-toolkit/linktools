name: Verify AI error contract final closure

on:
  pull_request:
    branches:
      - fix/ai-error-contract-closure

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Generate remaining Ruff audit
        run: |
          git fetch --depth=1 origin fix/ai-error-contract-closure
          git worktree add /tmp/ruff-audit FETCH_HEAD
          cd /tmp/ruff-audit
          python -m ruff check \
            linktools-ai/scripts/build linktools-ai/src/linktools/ai \
            linktools-ai/src/linktools/commands/ai tests/ai \
            --output-format=json > /tmp/ruff-remaining.json || true
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          data = json.loads(Path('/tmp/ruff-remaining.json').read_text())
          rows = [f'remaining={len(data)}', '']
          by_rule = Counter(item['code'] for item in data)
          rows.append('[rules]')
          rows.extend(f'{count}\t{rule}' for rule, count in sorted(by_rule.items()))
          rows.append('')
          rows.append('[contexts]')
          for item in sorted(data, key=lambda value: (value['code'], value['filename'], value['location']['row'])):
              filename = item['filename'].removeprefix('/tmp/ruff-audit/')
              path = Path(filename)
              source = path.read_text().splitlines()
              line = item['location']['row']
              start = max(1, line - 3)
              end = min(len(source), line + 3)
              rows.append(f'=== {item["code"]} {filename}:{line}:{item["location"]["column"]} ===')
              rows.append(item['message'])
              for number in range(start, end + 1):
                  marker = '>' if number == line else ' '
                  rows.append(f'{marker}{number:5}: {source[number - 1]}')
              rows.append('')
          Path('/tmp/ruff-remaining-contexts.txt').write_text('\n'.join(rows) + '\n')
          print('\n'.join(rows[:120]))
          PY

      - name: Upload remaining Ruff audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-error-contract-ruff-remaining
          path: |
            /tmp/ruff-remaining.json
            /tmp/ruff-remaining-contexts.txt
          if-no-files-found: error
