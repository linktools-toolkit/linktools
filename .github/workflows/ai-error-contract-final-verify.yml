name: Verify AI error contract final closure

on:
  pull_request:
    branches:
      - fix/ai-error-contract-closure

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Compare Ruff diagnostics with fixed baseline
        run: |
          git fetch --depth=1 origin fix/ai-error-contract-closure
          git worktree add /tmp/ruff-current FETCH_HEAD
          git fetch --depth=1 origin a4ded79a152ccfbc635503ee7b7bd394bd50970e
          git worktree add /tmp/ruff-baseline FETCH_HEAD

          set +e
          cd /tmp/ruff-current
          python -m ruff check \
            linktools-ai/scripts/build linktools-ai/src/linktools/ai \
            linktools-ai/src/linktools/commands/ai tests/ai \
            --output-format=json > /tmp/ruff-current.json
          current_status=$?
          cd /tmp/ruff-baseline
          python -m ruff check \
            linktools-ai/scripts/build linktools-ai/src/linktools/ai \
            linktools-ai/src/linktools/commands/ai tests/ai \
            --output-format=json > /tmp/ruff-baseline.json
          baseline_status=$?
          set -e

          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          current = json.loads(Path('/tmp/ruff-current.json').read_text())
          baseline = json.loads(Path('/tmp/ruff-baseline.json').read_text())

          def key(item):
              filename = item['filename']
              marker = '/linktools/'
              if marker in filename:
                  filename = filename.split(marker, 1)[1]
              return filename, item['code'], item['message']

          current_counter = Counter(map(key, current))
          baseline_counter = Counter(map(key, baseline))
          added = current_counter - baseline_counter
          removed = baseline_counter - current_counter

          report = [
              f'current_status={int(bool(current))}',
              f'baseline_status={int(bool(baseline))}',
              f'current_count={len(current)}',
              f'baseline_count={len(baseline)}',
              f'added_count={sum(added.values())}',
              f'removed_count={sum(removed.values())}',
              '',
              '[added]',
          ]
          for (filename, code, message), count in sorted(added.items()):
              report.append(f'{count}\t{code}\t{filename}\t{message}')
          report.extend(['', '[removed]'])
          for (filename, code, message), count in sorted(removed.items()):
              report.append(f'{count}\t{code}\t{filename}\t{message}')
          Path('/tmp/ruff-diff.txt').write_text('\n'.join(report) + '\n')
          print('\n'.join(report[:80]))
          PY

          printf '%s\n' "$current_status" > /tmp/ruff-current.status
          printf '%s\n' "$baseline_status" > /tmp/ruff-baseline.status

      - name: Upload Ruff comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-error-contract-ruff-comparison
          path: |
            /tmp/ruff-current.json
            /tmp/ruff-baseline.json
            /tmp/ruff-current.status
            /tmp/ruff-baseline.status
            /tmp/ruff-diff.txt
          if-no-files-found: error
