name: Verify AI error contract final closure

on:
  pull_request:
    branches:
      - fix/ai-error-contract-closure

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            filelock 'pydantic-ai-slim[mcp,openai,temporal]>=2.27.0,<3.0.0' \
            'pydantic-ai-harness[skills,dynamic-workflow]>=0.13.0' \
            'PyYAML>=6,<7' pytest pytest-asyncio 'sqlalchemy[asyncio]==2.0.51' \
            'aiosqlite==0.22.1' ruff rich requests packaging
          python -m pip install -e ./linktools --no-deps

      - name: Compile
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m compileall -q linktools-ai/src/linktools/ai

      - name: AI tests
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m pytest -q tests/ai

      - name: Check out fixed baseline
        uses: actions/checkout@v4
        with:
          ref: a4ded79a152ccfbc635503ee7b7bd394bd50970e
          path: baseline

      - name: Baseline Ruff diagnostics
        continue-on-error: true
        run: |
          set +e
          cd baseline
          PYTHONPATH=linktools-ai:linktools-ai/src:linktools/src python -m ruff check \
            linktools-ai/scripts/build linktools-ai/src/linktools/ai \
            linktools-ai/src/linktools/commands/ai tests/ai > ../ruff-baseline.log 2>&1
          exit $?

      - name: Ruff diagnostics
        id: ruff
        continue-on-error: true
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: |
          set +e
          python -m ruff check linktools-ai/scripts/build linktools-ai/src/linktools/ai linktools-ai/src/linktools/commands/ai tests/ai > ruff.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Validate branch-only Ruff fixes
        if: always()
        run: |
          git fetch --depth=1 origin fix/ai-error-contract-closure
          git worktree add /tmp/lintfix FETCH_HEAD
          cd /tmp/lintfix
          sed -i '1,2d' tests/ai/test_error_contract.py
          sed -i '1,2d' tests/ai/test_error_contract_matrix.py
          python -m ruff check --fix --select I001 \
            tests/ai/test_error_contract.py \
            tests/ai/test_error_contract_matrix.py \
            tests/ai/test_temporal_taskgraph_conformance.py
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/ai/test_error_contract.py')
          text = path.read_text()
          old = '        safe_error_details: dict[str, object] = {}\n'
          new = '        safe_error_details: tuple[tuple[str, object], ...] = ()\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected test_error_contract safe_error_details shape')
          path.write_text(text.replace(old, new, 1))

          path = Path('linktools-ai/src/linktools/ai/runtime/_local.py')
          text = path.read_text()
          old = '                        except Exception as readback_error:\n'
          new = '                        except Exception as readback_error:  # noqa: BLE001\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected readback exception boundary shape')
          text = text.replace(old, new, 1)
          old = '''                            _logger.error(\n                                "terminal finalization failed after durable execution terminal: execution=%s",\n                                execution_id,\n                                exc_info=True,\n                            )\n'''
          new = '''                            _logger.exception(\n                                "terminal finalization failed after durable execution terminal: execution=%s",\n                                execution_id,\n                            )\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected terminal finalization logging shape')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          PYTHONPATH=linktools-ai:linktools-ai/src:linktools/src python -m pytest -q \
            tests/ai/test_error_contract.py \
            tests/ai/test_error_contract_matrix.py \
            tests/ai/test_temporal_taskgraph_conformance.py \
            tests/ai/test_local_execution_recovery.py
          set +e
          PYTHONPATH=linktools-ai:linktools-ai/src:linktools/src python -m ruff check \
            linktools-ai/scripts/build linktools-ai/src/linktools/ai \
            linktools-ai/src/linktools/commands/ai tests/ai > /tmp/ruff-fixed.log 2>&1
          set -e
          git diff -- \
            linktools-ai/src/linktools/ai/runtime/_local.py \
            tests/ai/test_error_contract.py \
            tests/ai/test_error_contract_matrix.py \
            tests/ai/test_temporal_taskgraph_conformance.py > /tmp/branch-ruff-fix.patch

      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-error-contract-ruff-compare
          path: |
            ruff.log
            ruff-baseline.log
            /tmp/ruff-fixed.log
            /tmp/branch-ruff-fix.patch
          if-no-files-found: error

      - name: Enforce Ruff result
        if: always()
        run: test "${{ steps.ruff.outputs.status }}" = "0"
