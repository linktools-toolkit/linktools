          import re
          from collections import Counter
          from pathlib import Path

          pattern = re.compile(r'^(.+?):\d+:\d+: ([A-Z]+\d+) ')

          def diagnostics(path: str) -> Counter[tuple[str, str]]:
              result: Counter[tuple[str, str]] = Counter()
              for line in Path(path).read_text().splitlines():
                  match = pattern.match(line)
                  if match is not None:
                      result[(match.group(1), match.group(2))] += 1
              return result

          baseline = diagnostics('/tmp/ruff-baseline.log')
          current = diagnostics('/tmp/ruff-current.log')
          if current != baseline:
              raise SystemExit(
                  f'Ruff delta detected: added={dict(current - baseline)} removed={dict(baseline - current)}'
              )
          print(f'Ruff baseline/current diagnostics identical: {sum(current.values())}')
