name: AI Runtime Repair Verify

on:
  push:
    branches:
      - refactor/ai-runtime-agent-composition
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            filelock psutil \
            'pydantic-ai-slim[mcp,openai,temporal]>=2.27.0,<3.0.0' \
            'pydantic-ai-harness[skills,dynamic-workflow]>=0.13.0' \
            'pydantic-evals>=0.1.0' \
            'jsonschema>=4.23.0' 'PyYAML>=6.0,<7.0' \
            pytest pytest-asyncio \
            'sqlalchemy[asyncio]==2.0.51' 'aiosqlite==0.22.1' \
            ruff
          python -m pip install --no-deps -e ./linktools -e ./linktools-ai

      - name: Apply verified recovery contract test update
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/ai/test_contracts.py')
          text = path.read_text()
          old = '''    recovery_input = RecoveryExecutionInput(\n        user_prompt="prompt",\n        principal_id="principal",\n        principal_kind="user",\n        session_id=None,\n        memory_scope=None,\n        agent_id="default",\n        binding_digest="binding",\n        lineage_kind="RUN",\n        parent_execution_id=None,\n        root_execution_id="execution",\n        source_execution_id=None,\n        base_execution_id=None,\n        conversation_step_run_id=None,\n        idempotency=RecoveryIdempotencyInput("scope", "key", "request"),\n    )\n'''
          new = '''    binding = _binding_snapshot(agent_id="default", digest="a" * 64)\n    recovery_input = RecoveryExecutionInput(\n        user_prompt="prompt",\n        principal_id="principal",\n        principal_kind="user",\n        session_id=None,\n        memory_scope=None,\n        agent_id="default",\n        binding_digest="a" * 64,\n        lineage_kind="RUN",\n        parent_execution_id=None,\n        root_execution_id="execution",\n        source_execution_id=None,\n        base_execution_id=None,\n        conversation_step_run_id=None,\n        idempotency=RecoveryIdempotencyInput("scope", "key", "request"),\n        planning=False,\n        thinking=False,\n        binding=binding,\n    )\n'''
          if old not in text:
              raise SystemExit('expected recovery test block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/ai/test_contracts.py
          git commit -m 'test(ai): align recovery contract fixture'
          git push origin HEAD:refactor/ai-runtime-agent-composition

      - name: Compile
        env:
          PYTHONPATH: linktools-ai/src:linktools/src:linktools-ai:linktools
        run: python -m compileall -q linktools-ai/src/linktools/ai

      - name: Architecture gates
        env:
          PYTHONPATH: linktools-ai/src:linktools/src:linktools-ai:linktools
        run: python -m pytest -q tests/ai/test_architecture.py

      - name: Ruff
        env:
          PYTHONPATH: linktools-ai/src:linktools/src:linktools-ai:linktools
        run: |
          python -m ruff format --check --diff linktools-ai/scripts/build linktools-ai/src/linktools/ai linktools-ai/src/linktools/commands/ai tests/ai
          python -m ruff check linktools-ai/scripts/build linktools-ai/src/linktools/ai linktools-ai/src/linktools/commands/ai tests/ai

      - name: AI tests
        env:
          PYTHONPATH: linktools-ai/src:linktools/src:linktools-ai:linktools
        run: python -m pytest -q tests/ai
