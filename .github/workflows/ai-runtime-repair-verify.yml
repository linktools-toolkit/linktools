name: AI Runtime Repair Verify

on:
  push:
    branches:
      - refactor/ai-runtime-agent-composition
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            filelock psutil \
            'pydantic-ai-slim[mcp,openai,temporal]>=2.27.0,<3.0.0' \
            'pydantic-ai-harness[skills,dynamic-workflow]>=0.13.0' \
            'pydantic-evals>=0.1.0' \
            'jsonschema>=4.23.0' 'PyYAML>=6.0,<7.0' \
            'nats-py>=2.9.0,<3.0.0' 'redis>=5.2.0,<6.0.0' \
            'asyncpg>=0.29.0,<1.0.0' 'PyMySQL>=1.1.0,<2.0.0' \
            'cryptography>=43.0.0,<47.0.0' \
            pytest pytest-asyncio \
            'sqlalchemy[asyncio]==2.0.51' 'aiosqlite==0.22.1' \
            ruff
          python -m pip install --no-deps -e ./linktools

      - name: Compile
        env:
          PYTHONPATH: linktools-ai/src:linktools/src:linktools-ai:linktools
        run: python -m compileall -q linktools-ai/src/linktools/ai

      - name: Architecture gates
        env:
          PYTHONPATH: linktools-ai/src:linktools/src:linktools-ai:linktools
        run: python -m pytest -q tests/ai/test_architecture.py

      - name: Ruff
        env:
          PYTHONPATH: linktools-ai/src:linktools/src:linktools-ai:linktools
        run: python -m ruff check linktools-ai/scripts/build linktools-ai/src/linktools/ai linktools-ai/src/linktools/commands/ai tests/ai

      - name: AI tests
        env:
          PYTHONPATH: linktools-ai/src:linktools/src:linktools-ai:linktools
        run: python -m pytest -q tests/ai
