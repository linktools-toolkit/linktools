name: Apply AI tool error fix

on:
  push:
    branches:
      - fix/ai-tool-error-feedback

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-tool-error-feedback
          fetch-depth: 0
      - name: Apply verified transforms
        run: |
          python .github/ai-tool-error-fix/apply_source.py
          python .github/ai-tool-error-fix/apply_tests.py
          python -m py_compile \
            linktools-ai/src/linktools/ai/runtime/_capabilities.py \
            tests/ai/test_tool_effect_semantics.py
          test "$(git hash-object linktools-ai/src/linktools/ai/runtime/_capabilities.py)" = "9cafdb578fac0869e8ddac12d2d1b201d7f95a4d"
          test "$(git hash-object tests/ai/test_tool_effect_semantics.py)" = "be57597751d935796c78ee4001770d81c102d3eb"
      - name: Commit final fix
        run: |
          rm -rf .github/ai-tool-error-fix
          rm -f .github/workflows/ai-tool-error-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ai): surface actionable tool failures"
          git push origin HEAD:fix/ai-tool-error-feedback
