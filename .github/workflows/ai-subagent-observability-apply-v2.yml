name: Apply subagent observability implementation v2

on:
  push:
    branches:
      - feat/ai-subagent-observability
    paths:
      - .github/workflows/ai-subagent-observability-apply-v2.yml

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ai-subagent-observability
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Apply implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path(".github/workflows/ai-subagent-observability-apply.yml").read_text()
          block = source.split("          python - <<'PY'\n", 1)[1].split("\n          PY\n", 1)[0]
          script = textwrap.dedent(block)
          helper = '''\
          def replace_first(path: str, old: str, new: str) -> None:
              value = read(path)
              count = value.count(old)
              if count < 1:
                  raise RuntimeError(f"{path}: expected a match, got {count}: {old[:120]!r}")
              write(path, value.replace(old, new, 1))

          '''
          script = script.replace(
              "def replace_all(path: str, old: str, new: str, *, minimum: int = 1) -> None:\n",
              textwrap.dedent(helper) + "def replace_all(path: str, old: str, new: str, *, minimum: int = 1) -> None:\n",
              1,
          )
          needle = '''replace_one(
              contracts,
              "        object.__setattr__(self, \\"correlation\\", normalize_correlation(self.correlation))\\n        if (\\n            not isinstance(self.binding, AgentBindingSnapshot)\\n",
          '''
          replacement = needle.replace("replace_one(", "replace_first(", 1)
          if needle not in script:
              raise RuntimeError("unable to locate the ExecutionRecord correlation patch")
          script = script.replace(needle, replacement, 1)
          exec(compile(script, "subagent-observability-apply", "exec"))
          PY
      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Run targeted tests
        run: |
          python -m pytest -q tests/ai/test_subagent_execution_tree.py tests/ai/test_skill_subagent_final_refactor.py tests/ai/test_execution_context_durability.py
      - name: Run linktools-ai gate
        run: python manage.py check linktools-ai
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/ai-subagent-observability-apply.yml
          rm .github/workflows/ai-subagent-observability-apply-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ai): track subagent execution lineage"
          git push origin HEAD:feat/ai-subagent-observability
