name: AI observability refactor runner

on:
  push:
    branches:
      - feat/ai-metrics-observability
    paths:
      - .github/workflows/ai-observability-refactor-run.yml

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-metrics-observability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Apply correlation residual fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          fixes = (
              (
                  Path("linktools-ai/src/linktools/ai/runtime/state/_codec.py"),
                  "if not value.context:",
                  "if not value.correlation:",
                  3,
              ),
              (
                  Path("linktools-ai/src/linktools/ai/runtime/_runtime_service.py"),
                  "self._tenant_id",
                  "self.tenant_id",
                  2,
              ),
          )
          for path, old, new, expected in fixes:
              text = path.read_text()
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} matches for {old!r}, got {actual}"
                  )
              path.write_text(text.replace(old, new))
          PY
          python -m compileall -q linktools-ai/src
          git diff --check

      - name: Commit production fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linktools-ai/src/linktools/ai
          git commit -m "fix(ai): complete correlation refactor"
          git push origin HEAD:feat/ai-metrics-observability

      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet

      - name: Run linktools-ai tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/ai 2>&1 | tee /tmp/ai-tests.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-observability-residual-logs
          path: /tmp/ai-tests.log
          if-no-files-found: ignore

      - name: Verify production slices
        run: |
          python -m pytest -q \
            tests/ai/persistence/test_execution_start_service.py \
            tests/ai/test_runtime_persistence_evidence.py
