name: AI observability refactor validation

on:
  push:
    branches:
      - feat/ai-metrics-observability
    paths:
      - .github/workflows/ai-observability-refactor-run.yml

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-metrics-observability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Static sanity
        run: |
          python -m compileall -q linktools-ai/src tests/ai
          git diff --check
      - name: Focused observability contracts
        run: |
          python -m pytest -q \
            tests/ai/test_agent_composition.py \
            tests/ai/test_architecture_gate.py \
            tests/ai/test_execution_context_durability.py \
            tests/ai/test_task_context_durability.py \
            tests/ai/test_task_mixed_node_reliability.py \
            tests/ai/test_runtime_metric_usage.py \
            tests/ai/test_task_metric_projector.py \
            tests/ai/test_runtime_metrics.py \
            tests/ai/test_runtime_metrics_multi.py
      - name: All linktools-ai tests
        run: python -m pytest -q tests/ai
      - name: Repository check
        run: python manage.py check
