name: AI observability refactor validation

on:
  push:
    branches:
      - feat/ai-metrics-observability
    paths:
      - .github/workflows/ai-observability-refactor-run.yml

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-metrics-observability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Apply correlation contract cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          local = Path("linktools-ai/src/linktools/ai/runtime/_local.py")
          text = local.read_text()
          old = '''            or request.thinking != execution.thinking\n            or request.correlation != execution.correlation\n            or execution.binding != binding.snapshot\n'''
          new = '''            or request.thinking != execution.thinking\n            or execution.binding != binding.snapshot\n'''
          assert text.count(old) == 1, text.count(old)
          local.write_text(text.replace(old, new, 1))

          execution = Path("linktools-ai/src/linktools/ai/runtime/_execution.py")
          text = execution.read_text()
          old = '''            if request.correlation and dict(request.correlation) != dict(parent.correlation):\n                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n            request = replace(request, correlation=parent.correlation)\n'''
          new = '''            request = replace(request, correlation=parent.correlation)\n'''
          assert text.count(old) == 1, text.count(old)
          execution.write_text(text.replace(old, new, 1))

          test = Path("tests/ai/test_execution_context_durability.py")
          text = test.read_text()
          old = '''@pytest.mark.asyncio\nasync def test_local_start_rejects_correlation_drift_from_durable_execution() -> None:\n    execution = _execution(correlation={"trace_id": "durable", "attempt": 1})\n    backend = _backend(execution)\n    request = ExecutionRequest(\n        user_prompt="hello",\n        user_prompt_codec="text",\n        principal=Principal("user", "tenant"),\n        idempotency_key="execution-correlation-start-0001",\n        memory_scope=None,\n        mode="run",\n        planning=False,\n        thinking=False,\n        correlation={"trace_id": "request", "attempt": 1},\n    )\n\n    with pytest.raises(AIError) as raised:\n        await backend._validate_start(request, execution)\n\n    assert raised.value.code is ErrorCode.STORAGE_INTEGRITY_ERROR\n'''
          new = '''@pytest.mark.asyncio\nasync def test_local_start_accepts_correlation_drift_from_durable_execution() -> None:\n    execution = _execution(correlation={"trace_id": "durable", "attempt": 1})\n    backend = _backend(execution)\n    request = ExecutionRequest(\n        user_prompt="hello",\n        user_prompt_codec="text",\n        principal=Principal("user", "tenant"),\n        idempotency_key="execution-correlation-start-0001",\n        memory_scope=None,\n        mode="run",\n        planning=False,\n        thinking=False,\n        correlation={"trace_id": "request", "attempt": 1},\n    )\n\n    await backend._validate_start(request, execution)\n    assert dict(execution.correlation) == {"attempt": 1, "trace_id": "durable"}\n'''
          assert text.count(old) == 1, text.count(old)
          test.write_text(text.replace(old, new, 1))

          subagent_test = Path("tests/ai/test_skill_subagent_final_refactor.py")
          text = subagent_test.read_text()
          old = '''        thinking="high",\n        context={},\n'''
          new = '''        thinking="high",\n        correlation={},\n'''
          assert text.count(old) == 1, text.count(old)
          subagent_test.write_text(text.replace(old, new, 1))

          core = Path("linktools-ai/src/linktools/ai/core")
          old_module = core / "_context.py"
          new_module = core / "_correlation.py"
          assert old_module.exists() and not new_module.exists()
          old_module.rename(new_module)
          init = core / "__init__.py"
          text = init.read_text()
          assert text.count("from ._context import (") == 1
          init.write_text(text.replace("from ._context import (", "from ._correlation import (", 1))
          PY
      - name: Validate correlation contract
        run: |
          python -m pytest -q \
            tests/ai/test_execution_context_durability.py \
            tests/ai/test_task_context_durability.py \
            tests/ai/test_skill_subagent_final_refactor.py
          python manage.py check linktools-ai
          git diff --check
          ! git grep -n "core\._context\|merge_run_context\|RunContextData\|RunContextValue" -- linktools-ai/src tests/ai
      - name: Commit validated correlation cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            linktools-ai/src/linktools/ai/core \
            linktools-ai/src/linktools/ai/runtime/_execution.py \
            linktools-ai/src/linktools/ai/runtime/_local.py \
            tests/ai/test_execution_context_durability.py \
            tests/ai/test_skill_subagent_final_refactor.py
          git commit -m "refactor(ai): make correlation replay nonsemantic"
          git push origin HEAD:feat/ai-metrics-observability
