name: AI observability refactor validation

on:
  push:
    branches:
      - feat/ai-metrics-observability
    paths:
      - .github/workflows/ai-observability-refactor-run.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-metrics-observability
      - name: Inspect terminal checkpoint ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("linktools-ai/src/linktools/ai/runtime/_local.py")
          lines = path.read_text().splitlines()
          needles = (
              "async def _commit_execution_terminal_checkpoint(",
              "async def _commit_execution_terminal_checkpoint_locked_body(",
              "async def _commit_terminal(",
          )
          for needle in needles:
              index = next(i for i, line in enumerate(lines) if needle in line)
              print(f"===== {needle} line {index + 1} =====")
              start = max(0, index - 5)
              end = min(len(lines), index + 150)
              for line_number in range(start, end):
                  print(f"{line_number + 1:05d}: {lines[line_number]}")
          PY
