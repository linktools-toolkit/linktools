name: AI observability refactor validation

on:
  push:
    branches:
      - feat/ai-metrics-observability
    paths:
      - .github/workflows/ai-observability-refactor-run.yml

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-metrics-observability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Apply runtime metric context fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("linktools-ai/src/linktools/ai/runtime/_metric_capability.py")
          text = path.read_text()
          old = "None if run_context is None else run_context.context"
          new = "None if run_context is None else run_context.correlation"
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new))
          PY
      - name: Validate targeted runtime metrics
        run: |
          python -m pytest -q \
            tests/ai/test_runtime_metrics.py::test_runtime_projects_model_agent_and_execution_metrics \
            tests/ai/test_runtime_metrics_multi.py::test_runtime_states_share_metrics_without_lifecycle_coupling
          git diff --check
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linktools-ai/src/linktools/ai/runtime/_metric_capability.py
          git commit -m "fix(ai): preserve model metric correlation"
          git push origin HEAD:feat/ai-metrics-observability
