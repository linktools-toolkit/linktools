name: AI observability refactor validation

on:
  push:
    branches:
      - feat/ai-metrics-observability
    paths:
      - .github/workflows/ai-observability-refactor-run.yml

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-metrics-observability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Apply production fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          model = Path("linktools-ai/src/linktools/ai/runtime/_metric_capability.py")
          text = model.read_text()
          old = "None if run_context is None else run_context.context"
          new = "None if run_context is None else run_context.correlation"
          assert text.count(old) == 1, text.count(old)
          model.write_text(text.replace(old, new))

          local = Path("linktools-ai/src/linktools/ai/runtime/_local.py")
          text = local.read_text()
          marker = '''    async def _commit_terminal_checkpoint_owned(\n'''
          helper = '''    def _record_committed_terminal(\n        self,\n        committed: ExecutionTerminalCommitResult,\n        *,\n        session_id: str | None,\n    ) -> None:\n        _record_execution_terminal(\n            self._metric_recorder,\n            source_namespace=self._namespace,\n            result=committed,\n            session_id=session_id,\n        )\n        _release_metric_execution_context(\n            self._metric_recorder,\n            committed.execution.execution_id,\n        )\n\n'''
          assert text.count(marker) == 1, text.count(marker)
          text = text.replace(marker, helper + marker, 1)

          old = '''        self._live_broker.complete(execution_id)\n        _record_execution_terminal(\n            self._metric_recorder,\n            source_namespace=self._namespace,\n            result=committed,\n            session_id=session_id,\n        )\n        _release_metric_execution_context(self._metric_recorder, execution_id)\n        return committed\n'''
          new = '''        self._live_broker.complete(execution_id)\n        self._record_committed_terminal(committed, session_id=session_id)\n        return committed\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''        committed = await self._runtime_commands.commit_terminal_checkpoint(\n            commit,\n            session_id=current.session_id,\n            expected_cursor=expected_cursor,\n            next_cursor=next_cursor,\n            conversation_run=conversation_run,\n            conversation_snapshot=conversation_snapshot,\n            recovery_checkpoint=recovery_checkpoint,\n            recovery_run=recovery_run,\n            recovery_snapshot=recovery_snapshot,\n            execution_run=step_run,\n            execution_events=step_events,\n            execution_snapshots=snapshots,\n            execution_projections=execution_projections,\n            audit_events=pending_audit,\n            background_tasks=self._execution_task_set(current.execution_id),\n        )\n        self._pending_audit_events.pop(current.execution_id, None)\n        return committed\n'''
          new = '''        committed = await self._runtime_commands.commit_terminal_checkpoint(\n            commit,\n            session_id=current.session_id,\n            expected_cursor=expected_cursor,\n            next_cursor=next_cursor,\n            conversation_run=conversation_run,\n            conversation_snapshot=conversation_snapshot,\n            recovery_checkpoint=recovery_checkpoint,\n            recovery_run=recovery_run,\n            recovery_snapshot=recovery_snapshot,\n            execution_run=step_run,\n            execution_events=step_events,\n            execution_snapshots=snapshots,\n            execution_projections=execution_projections,\n            audit_events=pending_audit,\n            background_tasks=self._execution_task_set(current.execution_id),\n        )\n        self._record_committed_terminal(committed, session_id=current.session_id)\n        self._pending_audit_events.pop(current.execution_id, None)\n        return committed\n'''
          assert text.count(old) == 1, text.count(old)
          local.write_text(text.replace(old, new, 1))
          PY
      - name: Validate targeted runtime metrics
        run: |
          python -m pytest -q \
            tests/ai/test_runtime_metrics.py::test_runtime_projects_model_agent_and_execution_metrics \
            tests/ai/test_runtime_metrics_multi.py::test_runtime_states_share_metrics_without_lifecycle_coupling
          python -m pytest -q tests/ai/test_task_metric_projector.py
          git diff --check
          ! grep -R "run_context\.context" -n linktools-ai/src tests/ai
      - name: Commit validated production fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            linktools-ai/src/linktools/ai/runtime/_metric_capability.py \
            linktools-ai/src/linktools/ai/runtime/_local.py
          git commit -m "fix(ai): project durable terminal metrics"
          git push origin HEAD:feat/ai-metrics-observability
