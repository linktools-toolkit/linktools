name: AI observability refactor runner

on:
  push:
    branches:
      - feat/ai-metrics-observability
    paths:
      - .github/workflows/ai-observability-refactor-run.yml

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-metrics-observability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Fix runtime residuals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path("linktools-ai/src/linktools/ai/runtime/_runtime_service.py")
          text = runtime.read_text()
          old = "            context=context,\n"
          if text.count(old) != 2:
              raise SystemExit(f"graph correlation forwarding: expected 2 matches, got {text.count(old)}")
          runtime.write_text(text.replace(old, "            correlation=correlation,\n"))

          local = Path("linktools-ai/src/linktools/ai/runtime/_local.py")
          text = local.read_text()
          old = "                        memory_scope=current.memory_scope,\n"
          if text.count(old) != 1:
              raise SystemExit(f"run scope memory ownership: expected 1 match, got {text.count(old)}")
          local.write_text(text.replace(old, "", 1))
          PY
          python -m compileall -q linktools-ai/src
          git diff --check

      - name: Scan source residuals
        shell: bash
        run: |
          python - <<'PY' | tee /tmp/runtime-residual-scan.log
          from pathlib import Path
          import re

          root = Path("linktools-ai/src/linktools/ai")
          patterns = (
              re.compile(r"\b(?:request|execution|admission|launch|recovery_input)\.context\b"),
              re.compile(r"replace\(request,\s*context="),
              re.compile(r"\bcontext=(?:request|launch|execution|admission)\.correlation\b"),
              re.compile(r"\bcontext=context\b"),
          )
          found = []
          for path in root.rglob("*.py"):
              for lineno, line in enumerate(path.read_text().splitlines(), 1):
                  if any(pattern.search(line) for pattern in patterns):
                      found.append(f"{path}:{lineno}:{line.strip()}")
          print("\n".join(found))
          if found:
              raise SystemExit("stale runtime context access remains")
          PY

      - name: Commit runtime fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linktools-ai/src/linktools/ai
          git commit -m "fix(ai): complete runtime context ownership"
          git push origin HEAD:feat/ai-metrics-observability

      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet

      - name: Run production smoke tests
        shell: bash
        run: |
          python -m pytest -q \
            tests/ai/test_runtime_metrics_multi.py \
            tests/ai/test_runtime_approval_composition.py

      - name: Upload scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-runtime-residual-scan
          path: /tmp/runtime-residual-scan.log
          if-no-files-found: ignore
