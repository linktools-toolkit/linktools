name: AI observability refactor validation

on:
  push:
    branches:
      - feat/ai-metrics-observability
    paths:
      - .github/workflows/ai-observability-refactor-run.yml

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-metrics-observability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Apply final contract cleanup
        run: |
          python - <<'EXTRACT'
          import subprocess
          from pathlib import Path

          source = subprocess.check_output(
              [
                  "git",
                  "show",
                  "d87b6b95fa9bbf21f455abe4368a127cb614fe8e:.github/workflows/ai-observability-refactor-run.yml",
              ],
              text=True,
          )
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("          PY\n", start)
          body = source[start:end]
          script = "".join(
              line[10:] if line.startswith("          ") else line
              for line in body.splitlines(keepends=True)
          )
          Path("/tmp/apply_observability_cleanup.py").write_text(script)
          EXTRACT
          python /tmp/apply_observability_cleanup.py
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/ai/test_task_sqlite_cas_convergence.py")
          text = path.read_text()
          if "    TaskNodeInvocation,\n" not in text:
              import_old = "    TaskNode,\n    TaskNodeView,\n"
              import_new = "    TaskNode,\n    TaskNodeInvocation,\n    TaskNodeView,\n"
              assert text.count(import_old) == 1
              text = text.replace(import_old, import_new, 1)

          run_old = '''async def _digest_run(\n    self: RuntimeTaskNodeRunner,\n    node: TaskNode,\n    *,\n    graph_id: str,\n    principal: Principal,\n    context: Mapping[str, str | int],\n    dependency_results: Mapping[str, TaskDependencyResult],\n    control: TaskNodeRunControl,\n) -> TaskNodeRunResult:\n    del self, principal, context, dependency_results, control\n    await asyncio.sleep(0)\n    payload = StoredPayload.inline_json({"graph_id": graph_id, "node_id": node.node_id})\n    return TaskNodeRunResult(payload.digest, result_payload=payload)\n'''
          run_new = '''async def _digest_run(\n    self: RuntimeTaskNodeRunner,\n    invocation: TaskNodeInvocation,\n    *,\n    control: TaskNodeRunControl,\n) -> TaskNodeRunResult:\n    del self, control\n    await asyncio.sleep(0)\n    payload = StoredPayload.inline_json(\n        {"graph_id": invocation.graph_id, "node_id": invocation.node.node_id}\n    )\n    return TaskNodeRunResult(payload.digest, result_payload=payload)\n'''
          assert text.count(run_old) == 1
          text = text.replace(run_old, run_new, 1)

          cancel_old = '''async def _noop_cancel(\n    self: RuntimeTaskNodeRunner,\n    node: TaskNode,\n    *,\n    graph_id: str,\n    principal: Principal,\n    context: Mapping[str, str | int],\n    dependency_results: Mapping[str, TaskDependencyResult],\n) -> None:\n    del self, node, graph_id, principal, context, dependency_results\n'''
          cancel_new = '''async def _noop_cancel(\n    self: RuntimeTaskNodeRunner,\n    invocation: TaskNodeInvocation,\n) -> None:\n    del self, invocation\n'''
          assert text.count(cancel_old) == 1
          path.write_text(text.replace(cancel_old, cancel_new, 1))
          PY
      - name: Validate focused regressions
        run: |
          python -m pytest -q \
            tests/ai/test_execution_context_durability.py \
            tests/ai/test_task_context_durability.py \
            tests/ai/test_skill_subagent_final_refactor.py \
            tests/ai/test_runtime_metrics.py \
            tests/ai/test_runtime_stream_order.py \
            tests/ai/test_task_liveness_notifications.py \
            tests/ai/test_task_reliable_review_regressions.py \
            tests/ai/test_task_sqlite_cas_convergence.py \
            tests/ai/test_workspace_runtime_regressions.py
      - name: Validate full linktools-ai gate
        run: |
          python manage.py check linktools-ai
          git diff --check
          ! git grep -n "core\._context\|merge_run_context\|RunContextData\|RunContextValue" -- linktools-ai/src tests/ai
          ! git grep -n "request.correlation != execution.correlation" -- linktools-ai/src tests/ai
          ! git grep -n "linktools.task.graph.latency\|linktools.task.node.latency" -- linktools-ai/src tests/ai
      - name: Commit validated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A linktools-ai/src tests/ai
          git commit -m "refactor(ai): finish observability contract cleanup"
          git push origin HEAD:feat/ai-metrics-observability
