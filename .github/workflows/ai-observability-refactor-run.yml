name: AI observability refactor validation

on:
  push:
    branches:
      - feat/ai-metrics-observability
    paths:
      - .github/workflows/ai-observability-refactor-run.yml

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-metrics-observability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Apply diagnostic patches
        run: |
          python - <<'PY'
          from pathlib import Path

          model = Path("linktools-ai/src/linktools/ai/runtime/_metric_capability.py")
          text = model.read_text()
          old = "None if run_context is None else run_context.context"
          new = "None if run_context is None else run_context.correlation"
          assert text.count(old) == 1, text.count(old)
          model.write_text(text.replace(old, new))

          local = Path("linktools-ai/src/linktools/ai/runtime/_local.py")
          text = local.read_text()
          old = '''        self._live_broker.complete(execution_id)\n        _record_execution_terminal(\n'''
          new = '''        self._live_broker.complete(execution_id)\n        print("EXEC_METRIC_BEFORE", self._metric_recorder is not None, committed.execution.status, committed.execution.created_at, committed.result.created_at, getattr(self._metric_recorder, "status", lambda: None)())\n        _record_execution_terminal(\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)
          old = '''            session_id=session_id,\n        )\n        _release_metric_execution_context(self._metric_recorder, execution_id)\n'''
          new = '''            session_id=session_id,\n        )\n        print("EXEC_METRIC_AFTER", getattr(self._metric_recorder, "status", lambda: None)())\n        _release_metric_execution_context(self._metric_recorder, execution_id)\n'''
          assert text.count(old) == 1, text.count(old)
          local.write_text(text.replace(old, new))
          PY
      - name: Trace execution metric producer
        run: |
          python -m pytest -q -s \
            tests/ai/test_runtime_metrics.py::test_runtime_projects_model_agent_and_execution_metrics
