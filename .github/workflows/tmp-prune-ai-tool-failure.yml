name: Temporary prune AI tool failure changes

on:
  push:
    branches:
      - fix/ai-tool-failure-semantics

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ai-tool-failure-semantics
      - name: Correct effect-free test identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/ai/test_tool_effect_semantics.py')
          text = path.read_text(encoding='utf-8')
          old = (
              '    trusted_tool_classes = (("tool", "filesystem.read"),) if effect_free else ()\n'
              '    capability = _RuntimeStepPersistence(\n'
              '        tool_operations=bridge,\n'
              '        store=store,\n'
              '        agent_name="agent",\n'
              '        run_id="run",\n'
              '        trusted_tool_classes=trusted_tool_classes,\n'
              '    )\n'
              '    context = _context()\n'
              '    call = ToolCallPart("tool", {}, tool_call_id="call")\n'
              '    definition = ToolDefinition(\n'
              '        name="tool",\n'
              '        capability_id="workspace-filesystem" if effect_free else None,\n'
              '        metadata={"linktools.ai.replay_safe": replay_safe},\n'
              '    )\n'
          )
          new = (
              '    tool_name = "read_file" if effect_free else "tool"\n'
              '    trusted_tool_classes = ((tool_name, "filesystem.read"),) if effect_free else ()\n'
              '    capability = _RuntimeStepPersistence(\n'
              '        tool_operations=bridge,\n'
              '        store=store,\n'
              '        agent_name="agent",\n'
              '        run_id="run",\n'
              '        trusted_tool_classes=trusted_tool_classes,\n'
              '    )\n'
              '    context = _context()\n'
              '    call = ToolCallPart(tool_name, {}, tool_call_id="call")\n'
              '    definition = ToolDefinition(\n'
              '        name=tool_name,\n'
              '        capability_id="workspace-filesystem" if effect_free else None,\n'
              '        metadata={"linktools.ai.replay_safe": replay_safe},\n'
              '    )\n'
          )
          if text.count(old) != 1:
              raise SystemExit('expected test helper block not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile tests/ai/test_tool_effect_semantics.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ai/test_tool_effect_semantics.py
          git commit -m "test(ai): use trusted effect-free tool identity"
          git push origin HEAD:fix/ai-tool-failure-semantics
