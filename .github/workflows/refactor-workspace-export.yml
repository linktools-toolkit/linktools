name: Apply verified refactor batch

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: apply-refactor-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.number == 104 && github.event.pull_request.head.ref == 'refactor/ai-split-large-modules'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/ai-split-large-modules
          fetch-depth: 0
      - name: Apply verified refactor patch
        shell: bash
        run: |
          set -euo pipefail

          cat \
            .github/refactor-patch/c00 \
            .github/refactor-patch/c01 \
            .github/refactor-patch/c02 \
            .github/refactor-patch/c03 \
            .github/refactor-patch/c04 \
            .github/refactor-patch/c05 \
            .github/refactor-patch/c06_00 \
            .github/refactor-patch/c06_01 \
            .github/refactor-patch/c06_02 \
            .github/refactor-patch/c06_03 \
            .github/refactor-patch/c06_04_00 \
            .github/refactor-patch/c06_04_01 \
            .github/refactor-patch/c06_04_02 \
            .github/refactor-patch/c06_04_03 \
            .github/refactor-patch/c06_04_04 \
            .github/refactor-patch/c07 \
            .github/refactor-patch/c08 \
            .github/refactor-patch/c09_00 \
            .github/refactor-patch/c09_01 \
            .github/refactor-patch/c09_02 \
            .github/refactor-patch/c09_03 \
            > /tmp/refactor_payload.b64

          echo 'fe586f6dc33a9842d8753d215cab0f140936a6e46c4df00d4753d391d1624fc5  /tmp/refactor_payload.b64' | sha256sum -c -
          base64 -d /tmp/refactor_payload.b64 | gunzip > /tmp/refactor_batch.patch
          echo '6c731dfbeb1f10ccbc073f6a22b9147a2c482a815b997a824b9f568c200b501a  /tmp/refactor_batch.patch' | sha256sum -c -

          git apply --check /tmp/refactor_batch.patch
          git apply /tmp/refactor_batch.patch

          rm -rf .github/refactor-patch
          rm -f .github/workflows/refactor-workspace-export.yml

          python -m compileall -q linktools-ai/src/linktools/ai tests/ai
          git diff --check

          git config user.name 'ice-black-tea'
          git config user.email '30665081+ice-black-tea@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'expected refactor diff is empty' >&2
            exit 1
          fi
          git commit -m 'refactor(ai): split runtime support owners'
          git push origin HEAD:refactor/ai-split-large-modules
