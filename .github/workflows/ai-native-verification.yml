name: Native capability verification

on:
  push:
    branches:
      - feat/ai-native-capabilities-v4

permissions:
  contents: read

jobs:
  source:
    name: Capture verification source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Archive tracked verification inputs
        run: git archive --format=tar.gz --output=native-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: native-source-${{ github.sha }}
          path: native-source.tar.gz
          retention-days: 1
