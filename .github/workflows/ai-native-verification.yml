name: Native capability verification

on:
  push:
    branches:
      - feat/ai-native-capabilities-v4
      - fix/ai-native-capabilities-v4-review

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  source:
    name: Capture verification inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Archive tracked verification inputs
        run: git archive --format=tar.gz --output=native-source.tar.gz HEAD
      - name: Resolve offline verification dependencies
        run: |
          python -m pip download --dest wheelhouse --only-binary=:all: \
            'linktools-setup==0.0.3' \
            'pydantic-ai-slim[mcp,openai]==2.40.0' \
            'sqlalchemy[asyncio]==2.0.51' 'aiosqlite==0.22.1' \
            asyncpg asyncmy pytest pytest-asyncio httpx psutil filelock jsonschema \
            rich argcomplete 'requests[socks]' setuptools wheel jinja2 \
            -r requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-inputs-${{ github.sha }}
          path: |
            native-source.tar.gz
            wheelhouse
          retention-days: 1

  clean-gates:
    name: Clean native gates
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install clean native environment
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python -m pip install --quiet \
            'pydantic-ai-slim[mcp,openai]==2.40.0'
          python manage.py install --editable --quiet
      - name: Record clean environment
        run: |
          git rev-parse HEAD
          python -V
          python -c 'import importlib.metadata as m; print(m.version("pydantic-ai-slim"))'
          if python -m pip show pydantic-ai-harness; then
            echo "pydantic-ai-harness must not be installed" >&2
            exit 1
          fi
          if git grep -n -i -E 'pydantic-ai-harness|harness' -- \
            linktools-ai/src tests/ai scripts/check/ai linktools-ai/linktools.yml; then
            echo "Harness references remain in the native verification surface" >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "Harness reference scan failed with status $status" >&2
              exit "$status"
            fi
          fi
      - name: Run source checks
        run: python manage.py check linktools-ai
      - name: Build native package
        run: python manage.py build linktools-ai
      - name: Verify native package
        run: python manage.py verify linktools-ai

  python310:
    name: Python 3.10 with Pydantic AI 2.40.0
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install pinned SDK environment
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python -m pip install --quiet \
            'pydantic-ai-slim[mcp,openai]==2.40.0'
          python manage.py install --editable --quiet
      - name: Record Python 3.10 environment
        run: |
          git rev-parse HEAD
          python -V
          python - <<'PY'
          import pydantic_ai

          print(pydantic_ai.__version__)
          assert pydantic_ai.__version__ == "2.40.0"
          PY
      - name: Run Python 3.10 native checks
        run: python manage.py check linktools-ai

  python-current:
    name: Current Python native suite
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - name: Install current SDK environment
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Record current environment
        run: |
          git rev-parse HEAD
          python -V
          python -c 'import pydantic_ai; print(pydantic_ai.__version__)'
      - name: Run current native checks
        run: python manage.py check linktools-ai
      - name: Run complete AI test suite
        id: ai-tests
        run: |
          python -m pytest -q tests/ai \
            --junitxml="$RUNNER_TEMP/linktools-ai-current.xml"
      - name: Publish complete AI test summary
        if: always()
        run: |
          test -f "$RUNNER_TEMP/linktools-ai-current.xml"
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("${{ runner.temp }}/linktools-ai-current.xml")
          suite = ET.parse(path).getroot()
          summary = (
              f"tests={suite.attrib.get('tests', '0')} "
              f"failures={suite.attrib.get('failures', '0')} "
              f"errors={suite.attrib.get('errors', '0')} "
              f"skipped={suite.attrib.get('skipped', '0')}"
          )
          with Path("${{ github.step_summary }}").open("a", encoding="utf-8") as file:
              file.write("## Native AI test suite\n\n" + summary + "\n")
          PY

  local-platform:
    name: LocalSandbox on ${{ matrix.os }}
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install LocalSandbox verification environment
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install linktools linktools-ai --editable --quiet
      - name: Run cross-platform LocalSandbox acceptance
        run: python -m pytest -q tests/ai/test_local_sandbox_platform.py

  bubblewrap:
    name: Real non-root Bubblewrap task
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install build and sandbox prerequisites
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential curl debootstrap libcap-dev meson ninja-build pkg-config xz-utils
      - name: Build Bubblewrap 0.12.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bubblewrap-0.12.0.tar.xz"
          source_root="$RUNNER_TEMP/bubblewrap-0.12.0"
          install_root="$RUNNER_TEMP/bubblewrap-install"
          curl --fail --location --silent --show-error \
            https://github.com/containers/bubblewrap/releases/download/v0.12.0/bubblewrap-0.12.0.tar.xz \
            --output "$archive"
          echo "9760d007363e3abba7c747489910f9f82d9fca53ba3bd3282e396fa3c97a3314  $archive" | \
            sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          meson setup "$source_root/_build" "$source_root" \
            --prefix="$install_root" -Dman=disabled -Dselinux=disabled
          meson compile -C "$source_root/_build"
          meson install -C "$source_root/_build"
          "$install_root/bin/bwrap" --version
          echo "LINKTOOLS_BWRAP_EXECUTABLE=$install_root/bin/bwrap" >> "$GITHUB_ENV"
      - name: Build the runtime rootfs from the release artifacts
        shell: bash
        run: |
          set -euo pipefail
          python manage.py build linktools linktools-ai
          wheelhouse="$RUNNER_TEMP/bubblewrap-wheelhouse"
          runtime_root="$RUNNER_TEMP/bubblewrap-runtime-root"
          mkdir -p "$wheelhouse"
          python -m pip download --dest "$wheelhouse" --only-binary=:all: \
            dist/linktools-*.whl dist/linktools_ai-*.whl
          sudo debootstrap --variant=minbase \
            --include=python3,python3-pip,ca-certificates \
            bookworm "$runtime_root" http://deb.debian.org/debian
          sudo mkdir -p \
            "$runtime_root/workspace" \
            "$runtime_root/skills" \
            "$runtime_root/__linktools_locks" \
            "$runtime_root/home/sandbox"
          sudo mkdir -p "$runtime_root/tmp/linktools-wheelhouse"
          sudo cp "$wheelhouse"/*.whl "$runtime_root/tmp/linktools-wheelhouse/"
          sudo chroot "$runtime_root" /usr/bin/python3 -m pip install \
            --break-system-packages --no-index \
            --find-links=/tmp/linktools-wheelhouse linktools linktools-ai
          sudo chroot "$runtime_root" /usr/bin/python3 -I -c \
            'import linktools.ai.workspace.sandbox_worker'
          sudo chmod a-w "$runtime_root"
          echo "LINKTOOLS_BWRAP_RUNTIME_ROOT=$runtime_root" >> "$GITHUB_ENV"
      - name: Run one real non-root Bubblewrap session
        id: bubblewrap-test
        run: |
          test "$(id -u)" -ne 0
          LINKTOOLS_REQUIRE_BUBBLEWRAP=1 \
            python -m pytest -q tests/ai/test_bubblewrap_integration.py \
            --junitxml="$RUNNER_TEMP/linktools-bubblewrap.xml"
      - name: Publish Bubblewrap acceptance summary
        if: always()
        run: |
          test -f "$RUNNER_TEMP/linktools-bubblewrap.xml"
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("${{ runner.temp }}/linktools-bubblewrap.xml")
          suite = ET.parse(path).getroot()
          summary = (
              f"tests={suite.attrib.get('tests', '0')} "
              f"failures={suite.attrib.get('failures', '0')} "
              f"errors={suite.attrib.get('errors', '0')} "
              f"skipped={suite.attrib.get('skipped', '0')}"
          )
          if int(suite.attrib.get("skipped", "0")) != 0:
              raise SystemExit("Bubblewrap acceptance cannot pass with skipped tests")
          with Path("${{ github.step_summary }}").open("a", encoding="utf-8") as file:
              file.write("## Bubblewrap acceptance\n\n" + summary + "\n")
          PY
