name: Temporary align Pydantic tool errors
on:
  push:
    branches:
      - fix/ai-tool-failure-semantics
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ai-tool-failure-semantics
      - name: Align tool error semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          capabilities = Path('linktools-ai/src/linktools/ai/runtime/_capabilities.py')
          text = capabilities.read_text()
          old = (
              '    if isinstance(error, AIError) and error.code is not ErrorCode.TOOL_EXECUTION_FAILED:\n'
              '        return error\n'
              '    if isinstance(error, Exception):\n'
              '        return ToolFailed(\n'
              '            _format_model_tool_error(\n'
              '                _MODEL_FAILED_PREFIX,\n'
              '                "tool execution failed; adapt and continue",\n'
              '            )\n'
              '        )\n'
          )
          if text.count(old) != 1:
              raise SystemExit('unexpected _model_tool_error block')
          capabilities.write_text(text.replace(old, ''))

          tests = Path('tests/ai/test_tool_effect_semantics.py')
          text = tests.read_text()
          text = text.replace('    effect_free: bool = False,\n', '')
          text = text.replace(
              '    tool_name = "read_file" if effect_free else "tool"\n'
              '    trusted_tool_classes = ((tool_name, "filesystem.read"),) if effect_free else ()\n',
              '',
          )
          text = text.replace('        trusted_tool_classes=trusted_tool_classes,\n', '')
          text = text.replace(
              '    call = ToolCallPart(tool_name, {}, tool_call_id="call")\n'
              '    definition = ToolDefinition(\n'
              '        name=tool_name,\n'
              '        capability_id="workspace-filesystem" if effect_free else None,\n'
              '        metadata={"linktools.ai.replay_safe": replay_safe},\n'
              '    )\n',
              '    call = ToolCallPart("tool", {}, tool_call_id="call")\n'
              '    definition = ToolDefinition(name="tool", metadata={"linktools.ai.replay_safe": replay_safe})\n',
          )
          start = text.index('async def test_effect_free_handler_failure_is_model_visible() -> None:\n')
          end = text.index('@pytest.mark.parametrize("replay_safe", (True, False))\n', start)
          text = text[:start] + text[end:]
          if 'effect_free' in text:
              raise SystemExit('effect_free test scaffolding remains')
          tests.write_text(text)
          PY
      - name: Commit focused changes
        shell: bash
        run: |
          git config user.name "ice-black-tea"
          git config user.email "30665081+ice-black-tea@users.noreply.github.com"
          git add linktools-ai/src/linktools/ai/runtime/_capabilities.py tests/ai/test_tool_effect_semantics.py
          git diff --cached --check
          git commit -m "refactor(ai): preserve unknown tool exceptions"
          git push origin HEAD:fix/ai-tool-failure-semantics
