name: Apply subagent observability implementation v5

on:
  push:
    branches:
      - feat/ai-subagent-observability
    paths:
      - .github/workflows/ai-subagent-observability-apply-v5.yml

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ai-subagent-observability
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Apply implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path(".github/workflows/ai-subagent-observability-apply-v4.yml").read_text()
          block = source.split("          python - <<'PY'\n", 1)[1].split("\n          PY\n", 1)[0]
          exec(compile(textwrap.dedent(block), "subagent-observability-apply-v4", "exec"))

          execution_path = Path("linktools-ai/src/linktools/ai/runtime/_execution.py")
          execution = execution_path.read_text()
          old = "            view = ExecutionView(execution.execution_id, execution.status)\n"
          if execution.count(old) != 1:
              raise RuntimeError(f"expected one legacy wait ExecutionView projection, got {execution.count(old)}")
          execution_path.write_text(execution.replace(old, "            view = _execution_view(execution)\n", 1))

          api_path = Path("linktools-ai/src/linktools/ai/runtime/service_api.py")
          api = api_path.read_text()
          old_tree = '''@dataclass(frozen=True, slots=True)
          class ExecutionTreeEvent:
              execution: ExecutionView
              depth: int
              event: ExecutionStreamEvent

              def __post_init__(self) -> None:
                  if not isinstance(self.execution, ExecutionView):
                      raise TypeError("execution tree event requires an execution view")
                  if isinstance(self.depth, bool) or not isinstance(self.depth, int) or self.depth < 0:
                      raise ValueError("execution tree event depth must be non-negative")
                  if not isinstance(self.event, ExecutionStreamEvent):
                      raise TypeError("execution tree event requires an execution event")
                  if self.execution.execution_id != self.event.execution_id:
                      raise ValueError("execution tree event identity does not match execution")
          '''
          new_tree = '''@dataclass(frozen=True, slots=True)
          class ExecutionTreeEvent:
              execution_id: str
              agent_id: str
              lineage_kind: ExecutionLineageKind
              parent_execution_id: str | None
              root_execution_id: str
              parent_invocation_id: str | None
              depth: int
              event: ExecutionStreamEvent

              def __post_init__(self) -> None:
                  if not all(
                      isinstance(value, str) and value
                      for value in (self.execution_id, self.agent_id, self.root_execution_id)
                  ):
                      raise ValueError("execution tree event identity is invalid")
                  if not isinstance(self.lineage_kind, ExecutionLineageKind):
                      raise TypeError("execution tree event lineage kind is invalid")
                  if isinstance(self.depth, bool) or not isinstance(self.depth, int) or self.depth < 0:
                      raise ValueError("execution tree event depth must be non-negative")
                  if not isinstance(self.event, ExecutionStreamEvent):
                      raise TypeError("execution tree event requires an execution event")
                  if self.execution_id != self.event.execution_id:
                      raise ValueError("execution tree event identity does not match execution")
                  if self.depth == 0:
                      if (
                          self.parent_execution_id is not None
                          or self.parent_invocation_id is not None
                          or self.root_execution_id != self.execution_id
                      ):
                          raise ValueError("root execution tree event lineage is invalid")
                  elif (
                      self.lineage_kind is not ExecutionLineageKind.SUBAGENT
                      or not self.parent_execution_id
                      or not self.parent_invocation_id
                  ):
                      raise ValueError("child execution tree event lineage is invalid")
          '''
          old_tree = textwrap.dedent(old_tree).strip("\n")
          new_tree = textwrap.dedent(new_tree).strip("\n")
          if api.count(old_tree) != 1:
              raise RuntimeError(f"expected one ExecutionTreeEvent contract, got {api.count(old_tree)}")
          api_path.write_text(api.replace(old_tree, new_tree, 1))

          tree_path = Path("linktools-ai/src/linktools/ai/runtime/_execution_tree.py")
          tree = tree_path.read_text()
          old_cursor = '''            await discover(root, 0)
                      broker_wait = asyncio.create_task(
          '''
          new_cursor = '''            await discover(root, 0)
                      unknown_cursors = set(after_sequences) - set(views)
                      if unknown_cursors:
                          raise AIError(ErrorCode.REQUEST_FIELD_INVALID)
                      broker_wait = asyncio.create_task(
          '''
          old_cursor = textwrap.dedent(old_cursor).strip("\n")
          new_cursor = textwrap.dedent(new_cursor).strip("\n")
          if tree.count(old_cursor) != 1:
              raise RuntimeError(f"expected one initial tree discovery, got {tree.count(old_cursor)}")
          tree = tree.replace(old_cursor, new_cursor, 1)

          old_yield = '''                            yield ExecutionTreeEvent(
                                          view,
                                          depths[view.execution_id],
                                          event,
                                      )
          '''
          new_yield = '''                            yield ExecutionTreeEvent(
                                          view.execution_id,
                                          view.agent_id,
                                          view.lineage_kind,
                                          view.parent_execution_id,
                                          view.root_execution_id,
                                          view.parent_invocation_id,
                                          depths[view.execution_id],
                                          event,
                                      )
          '''
          old_yield = textwrap.dedent(old_yield).strip("\n")
          new_yield = textwrap.dedent(new_yield).strip("\n")
          if tree.count(old_yield) != 1:
              raise RuntimeError(f"expected one tree event projection, got {tree.count(old_yield)}")
          tree = tree.replace(old_yield, new_yield, 1)

          terminal_old = '''                        if (
                                  execution_id in completed
                                  and all(task.done() for task in tasks.values())
                                  and queue.empty()
                              ):
          '''
          terminal_new = '''                        if (
                                  execution_id in completed
                                  and all(task.done() for task in tasks.values())
                                  and queue.empty()
                                  and not queue_wait.done()
                              ):
          '''
          terminal_old = textwrap.dedent(terminal_old).strip("\n")
          terminal_new = textwrap.dedent(terminal_new).strip("\n")
          if tree.count(terminal_old) != 1:
              raise RuntimeError(f"expected one tree terminal condition, got {tree.count(terminal_old)}")
          tree = tree.replace(terminal_old, terminal_new, 1)
          old_return = "                            if len(tasks) == before and queue.empty():\n                                return\n"
          new_return = "                            if len(tasks) == before and queue.empty() and not queue_wait.done():\n                                return\n"
          if tree.count(old_return) != 1:
              raise RuntimeError(f"expected one tree final return, got {tree.count(old_return)}")
          tree_path.write_text(tree.replace(old_return, new_return, 1))

          test_path = Path("tests/ai/test_subagent_execution_tree.py")
          test = test_path.read_text()
          test = test.replace(
              "(item.execution.execution_id, item.depth)",
              "(item.execution_id, item.depth)",
          ).replace(
              'item for item in values if item.execution.execution_id == "child"',
              'item for item in values if item.execution_id == "child"',
          ).replace(
              "child.execution.parent_invocation_id",
              "child.parent_invocation_id",
          )
          test_path.write_text(test)
          PY
      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Run targeted tests
        run: |
          python -m pytest -q \
            tests/ai/test_subagent_execution_tree.py \
            tests/ai/test_skill_subagent_final_refactor.py \
            tests/ai/test_execution_context_durability.py \
            tests/ai/test_local_execution_recovery.py \
            tests/ai/test_runtime_metrics.py
      - name: Run linktools-ai gate
        run: python manage.py check linktools-ai
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/ai-subagent-observability-apply.yml
          rm .github/workflows/ai-subagent-observability-apply-v2.yml
          rm .github/workflows/ai-subagent-observability-apply-v3.yml
          rm .github/workflows/ai-subagent-observability-apply-v4.yml
          rm .github/workflows/ai-subagent-observability-apply-v5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ai): track subagent execution lineage"
          git push origin HEAD:feat/ai-subagent-observability
