name: Finalize session timeline simplification v2

on:
  push:
    branches:
      - feat/ai-session-timeline

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Reuse exact focused patch
        shell: bash
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          data = yaml.safe_load(Path('.github/workflows/ai-session-timeline-finalize.yml').read_text())
          steps = data['jobs']['finalize']['steps']
          script = next(step['run'] for step in steps if step.get('name') == 'Apply simplification and test cleanup')
          Path('/tmp/apply-timeline.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply-timeline.sh
      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Run focused validation
        run: |
          python -m py_compile \
            linktools-ai/src/linktools/ai/runtime/_local.py \
            linktools-ai/src/linktools/ai/runtime/_session.py \
            linktools-ai/src/linktools/ai/runtime/_factory.py \
            linktools-ai/src/linktools/ai/runtime/state/_steps.py
          python -m pytest -q \
            tests/ai/test_session_timeline.py \
            tests/ai/test_session_timeline_fork.py \
            tests/ai/test_session_timeline_recovery.py \
            tests/ai/test_session_timeline_runtime.py \
            tests/ai/test_session_timeline_storage.py
          git diff --check
      - name: Commit focused repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm \
            .github/workflows/ai-session-timeline-simplify.yml \
            .github/workflows/ai-session-timeline-finalize.yml \
            .github/workflows/ai-session-timeline-finalize2.yml
          git add \
            linktools-ai/src/linktools/ai/runtime/_local.py \
            linktools-ai/src/linktools/ai/runtime/_session.py \
            linktools-ai/src/linktools/ai/runtime/_factory.py \
            linktools-ai/src/linktools/ai/runtime/state/_steps.py \
            tests/ai/test_session_timeline.py \
            tests/ai/test_session_timeline_storage.py
          git commit -m "fix(ai): simplify session timeline ownership"
          git push origin HEAD:feat/ai-session-timeline
