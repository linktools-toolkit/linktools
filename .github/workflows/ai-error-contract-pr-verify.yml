name: AI error contract PR verify

on:
  pull_request:
    branches:
      - fix/ai-error-contract-closure

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-error-contract-closure

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply complete error-contract repair
        run: |
          python linktools-ai/scripts/build/_error_contract_closure.py
          python - <<'PY'
          from pathlib import Path

          path = Path('linktools-ai/src/linktools/ai/agent/_executor.py')
          text = path.read_text()

          old = '''from openai import APIError as OpenAIAPIError
from pydantic import ValidationError
'''
          new = '''from openai import APIError as OpenAIAPIError
from openai import APIStatusError as OpenAIAPIStatusError
from pydantic import ValidationError
'''
          if text.count(old) != 1:
              raise SystemExit('executor OpenAI import patch no longer matches exactly')
          text = text.replace(old, new)

          old = '''    if isinstance(error, OpenAIAPIError):
        return AIError(ErrorCode.MODEL_API_ERROR, retryable=False)
    if isinstance(error, UnexpectedModelBehavior):
'''
          new = '''    if isinstance(error, OpenAIAPIStatusError):
        status_code = error.status_code
        details: dict[str, JsonValue] = {"status_code": status_code}
        if status_code == 408:
            code = ErrorCode.MODEL_TIMEOUT
        elif status_code == 429:
            code = ErrorCode.MODEL_RATE_LIMITED
        elif status_code >= 500:
            code = ErrorCode.MODEL_UNAVAILABLE
        elif 400 <= status_code < 500:
            code = ErrorCode.MODEL_REQUEST_REJECTED
        else:
            code = ErrorCode.MODEL_API_ERROR
        return AIError(code, safe_details=details)
    if isinstance(error, OpenAIAPIError):
        return AIError(ErrorCode.MODEL_API_ERROR, retryable=False)
    if isinstance(error, UnexpectedModelBehavior):
'''
          if text.count(old) != 1:
              raise SystemExit('executor OpenAI status patch no longer matches exactly')
          path.write_text(text.replace(old, new))

          path = Path('tests/ai/test_error_contract.py')
          text = path.read_text()
          old = '''from openai import APIError as OpenAIAPIError
from pydantic_ai.exceptions import ModelHTTPError, RunCancelled
'''
          new = '''from openai import APIError as OpenAIAPIError
from openai import APIStatusError as OpenAIAPIStatusError
from pydantic_ai.exceptions import ModelHTTPError, RunCancelled
'''
          if text.count(old) != 1:
              raise SystemExit('test OpenAI import patch no longer matches exactly')
          text = text.replace(old, new)

          marker = '''def test_execution_result_enforces_terminal_error_contract() -> None:
'''
          test = '''def test_raw_openai_status_error_uses_structured_status_without_payload_leak() -> None:
    request = httpx.Request("POST", "https://example.invalid/v1/chat/completions")
    response = httpx.Response(400, request=request)
    mapped = _map(
        OpenAIAPIStatusError(
            "provider secret",
            response=response,
            body={"secret": "provider body must not escape"},
        )
    )
    assert mapped.code is ErrorCode.MODEL_REQUEST_REJECTED
    assert mapped.safe_details == {"status_code": 400}


'''
          if text.count(marker) != 1:
              raise SystemExit('test insertion marker no longer matches exactly')
          path.write_text(text.replace(marker, test + marker))
          PY
          rm linktools-ai/scripts/build/_error_contract_closure.py

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            filelock 'pydantic-ai-slim[mcp,openai,temporal]>=2.27.0,<3.0.0' \
            'pydantic-ai-harness[skills,dynamic-workflow]>=0.13.0' \
            'PyYAML>=6,<7' pytest pytest-asyncio 'sqlalchemy[asyncio]==2.0.51' \
            'aiosqlite==0.22.1' ruff rich requests packaging

      - name: Compile
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m compileall -q linktools-ai/src/linktools/ai linktools-ai/src/linktools/commands/ai

      - name: Ruff
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m ruff check linktools-ai/src/linktools/ai linktools-ai/src/linktools/commands/ai tests/ai

      - name: AI tests
        env:
          PYTHONPATH: linktools-ai:linktools-ai/src:linktools/src
        run: python -m pytest -q tests/ai

      - name: Commit verified repair
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add -A -- linktools-ai/src/linktools/ai tests/ai linktools-ai/scripts/build/_error_contract_closure.py
          git diff --cached --check
          git commit -m 'fix(ai): close error contract boundaries'
          git push origin HEAD:fix/ai-error-contract-closure
