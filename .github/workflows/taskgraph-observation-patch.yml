name: TaskGraph observation patch

on:
  push:
    branches:
      - feat/ai-taskgraph-reliable-mixed-nodes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-taskgraph-reliable-mixed-nodes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Apply exact observation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          local_path = Path('linktools-ai/src/linktools/ai/task/_local.py')
          text = local_path.read_text()
          old = 'from collections.abc import Mapping\n'
          new = 'from collections.abc import Awaitable, Callable, Mapping\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''class _TaskNodeRunControlImpl:
              def __init__(
                  self,
                  repository: _TaskRepository,
                  lease_state: _LeaseState,
                  *,
                  tenant_id: str,
              ) -> None:
                  self._repository = repository
                  self._lease_state = lease_state
                  self._tenant_id = tenant_id

              async def bind_execution(self, execution_id: str) -> None:
                  if not isinstance(execution_id, str) or not execution_id.strip():
                      raise ValueError("execution id is required")
                  async with self._lease_state.lock:
                      await self._repository.bind_execution(
                          self._lease_state.lease,
                          tenant_id=self._tenant_id,
                          execution_id=execution_id,
                      )
          '''
          new = '''class _TaskNodeRunControlImpl:
              def __init__(
                  self,
                  repository: _TaskRepository,
                  lease_state: _LeaseState,
                  *,
                  tenant_id: str,
                  on_activity: Callable[[], Awaitable[None]],
              ) -> None:
                  self._repository = repository
                  self._lease_state = lease_state
                  self._tenant_id = tenant_id
                  self._on_activity = on_activity

              async def bind_execution(self, execution_id: str) -> None:
                  if not isinstance(execution_id, str) or not execution_id.strip():
                      raise ValueError("execution id is required")
                  async with self._lease_state.lock:
                      await self._repository.bind_execution(
                          self._lease_state.lease,
                          tenant_id=self._tenant_id,
                          execution_id=execution_id,
                      )
                  await self._on_activity()
          '''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''    def owns_graph(self, graph_id: str, *, tenant_id: str) -> bool:
                  run = self._runs.get((tenant_id, graph_id))
                  return run is not None and (not run.closed or run.failure is not None)

              async def wait_graph_activity(
                  self,
                  graph_id: str,
                  *,
                  tenant_id: str,
              ) -> None:
                  async with self._lock:
                      run = self._runs.get((tenant_id, graph_id))
                  if run is None:
                      return
                  if run.failure is not None:
                      raise AIError(run.failure.code, safe_details=dict(run.failure.safe_details))
                  if run.closed:
                      return
                  async with run.condition:
                      generation = run.generation
                      await run.condition.wait_for(
                          lambda: run.generation != generation
                          or run.closed
                          or run.failure is not None
                      )
                  if run.failure is not None:
                      raise AIError(run.failure.code, safe_details=dict(run.failure.safe_details))
          '''
          new = '''    def owns_graph(self, graph_id: str, *, tenant_id: str) -> bool:
                  run = self._runs.get((tenant_id, graph_id))
                  return run is not None and (not run.closed or run.failure is not None)

              def graph_activity_generation(
                  self,
                  graph_id: str,
                  *,
                  tenant_id: str,
              ) -> int | None:
                  run = self._runs.get((tenant_id, graph_id))
                  if run is None or (run.closed and run.failure is None):
                      return None
                  return run.generation

              async def wait_graph_activity(
                  self,
                  graph_id: str,
                  *,
                  tenant_id: str,
                  after_generation: int,
              ) -> None:
                  if after_generation < 0:
                      raise ValueError("activity generation must be non-negative")
                  async with self._lock:
                      run = self._runs.get((tenant_id, graph_id))
                  if run is None:
                      return
                  if run.failure is not None:
                      raise AIError(run.failure.code, safe_details=dict(run.failure.safe_details))
                  if run.closed:
                      return
                  async with run.condition:
                      await run.condition.wait_for(
                          lambda: run.generation != after_generation
                          or run.closed
                          or run.failure is not None
                      )
                  if run.failure is not None:
                      raise AIError(run.failure.code, safe_details=dict(run.failure.safe_details))
          '''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''                    inflight[node.node_id] = _InflightNode(task, lease_state)
                  if inflight:
          '''
          new = '''                    inflight[node.node_id] = _InflightNode(task, lease_state)
                      await self._notify(run)
                  if inflight:
          '''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        control = _TaskNodeRunControlImpl(
                  self._repository,
                  lease_state,
                  tenant_id=tenant_id,
              )
          '''
          new = '''        control = _TaskNodeRunControlImpl(
                  self._repository,
                  lease_state,
                  tenant_id=tenant_id,
                  on_activity=lambda: self._notify(run),
              )
          '''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          local_path.write_text(text)

          service_path = Path('linktools-ai/src/linktools/ai/task/_service_impl.py')
          text = service_path.read_text()
          old = '''class _LocalTaskWaiter(Protocol):
              def owns_graph(self, graph_id: str, *, tenant_id: str) -> bool: ...

              async def wait_graph_activity(
                  self,
                  graph_id: str,
                  *,
                  tenant_id: str,
              ) -> None: ...
          '''
          new = '''class _LocalTaskWaiter(Protocol):
              def owns_graph(self, graph_id: str, *, tenant_id: str) -> bool: ...

              def graph_activity_generation(
                  self,
                  graph_id: str,
                  *,
                  tenant_id: str,
              ) -> int | None: ...

              async def wait_graph_activity(
                  self,
                  graph_id: str,
                  *,
                  tenant_id: str,
                  after_generation: int,
              ) -> None: ...
          '''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        tenant_id = principal.tenant_id
              async with self._graph_consumer(graph_id, tenant_id):
          '''
          new = '''        tenant_id = principal.tenant_id
              generation = self._local_activity_generation(graph_id, tenant_id=tenant_id)
              async with self._graph_consumer(graph_id, tenant_id):
          '''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''                await self._wait_observation_opportunity(snapshot, tenant_id=tenant_id)
          '''
          new = '''                await self._wait_observation_opportunity(
                      snapshot,
                      tenant_id=tenant_id,
                      after_generation=generation,
                  )
          '''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''            latest = await self._snapshot_with_terminal_release(
                  graph_id,
                  tenant_id=tenant_id,
              )
          '''
          new = '''            generation = self._local_activity_generation(
                  graph_id,
                  tenant_id=tenant_id,
              )
              latest = await self._snapshot_with_terminal_release(
                  graph_id,
                  tenant_id=tenant_id,
              )
          '''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''    async def _wait_observation_opportunity(
              self,
              snapshot: TaskGraphSnapshot,
              *,
              tenant_id: str,
          ) -> None:
              waiter = self._local_waiter
              if waiter is None or not waiter.owns_graph(snapshot.graph_id, tenant_id=tenant_id):
                  await asyncio.sleep(_GRAPH_OBSERVATION_RECHECK_SECONDS)
                  return
              timeout = _nearest_live_lease_delay(snapshot)
              if timeout is None:
                  await waiter.wait_graph_activity(snapshot.graph_id, tenant_id=tenant_id)
                  return
              if timeout <= 0:
                  return
              try:
                  await asyncio.wait_for(
                      waiter.wait_graph_activity(snapshot.graph_id, tenant_id=tenant_id),
                      timeout=timeout,
                  )
              except asyncio.TimeoutError:
                  return
          '''
          new = '''    def _local_activity_generation(
              self,
              graph_id: str,
              *,
              tenant_id: str,
          ) -> int | None:
              waiter = self._local_waiter
              if waiter is None or not waiter.owns_graph(graph_id, tenant_id=tenant_id):
                  return None
              return waiter.graph_activity_generation(graph_id, tenant_id=tenant_id)

              async def _wait_observation_opportunity(
                  self,
                  snapshot: TaskGraphSnapshot,
                  *,
                  tenant_id: str,
                  after_generation: int | None,
              ) -> None:
                  waiter = self._local_waiter
                  if waiter is None or not waiter.owns_graph(snapshot.graph_id, tenant_id=tenant_id):
                      await asyncio.sleep(_GRAPH_OBSERVATION_RECHECK_SECONDS)
                      return
                  if after_generation is None:
                      return
                  timeout = _nearest_live_lease_delay(snapshot)
                  if timeout is None:
                      await waiter.wait_graph_activity(
                          snapshot.graph_id,
                          tenant_id=tenant_id,
                          after_generation=after_generation,
                      )
                      return
                  if timeout <= 0:
                      return
                  try:
                      await asyncio.wait_for(
                          waiter.wait_graph_activity(
                              snapshot.graph_id,
                              tenant_id=tenant_id,
                              after_generation=after_generation,
                          ),
                          timeout=timeout,
                      )
                  except asyncio.TimeoutError:
                      return
          '''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        if state.lease_expires_at is not None and state.lease_expires_at > now
          '''
          new = '''        if state.status is TaskStatus.RUNNING
              and state.lease_expires_at is not None
              and state.lease_expires_at > now
          '''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          service_path.write_text(text)
          PY
          python -m py_compile \
            linktools-ai/src/linktools/ai/task/_local.py \
            linktools-ai/src/linktools/ai/task/_service_impl.py
          git diff --check
      - name: Commit validated patch and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/taskgraph-observation-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/taskgraph-observation-patch.yml \
            linktools-ai/src/linktools/ai/task/_local.py \
            linktools-ai/src/linktools/ai/task/_service_impl.py
          git diff --cached --check
          git commit -m "fix(ai-task): make local observation lossless"
          git push origin HEAD:feat/ai-taskgraph-reliable-mixed-nodes
