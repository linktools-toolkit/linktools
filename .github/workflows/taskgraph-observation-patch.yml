name: TaskGraph observation patch

on:
  push:
    branches:
      - feat/ai-taskgraph-reliable-mixed-nodes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-taskgraph-reliable-mixed-nodes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Apply exact observation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise AssertionError(f"{label}: expected one match, got {count}")
              return text.replace(old, new, 1)

          def replace_region(
              text: str,
              start: str,
              end: str,
              transform,
              label: str,
          ) -> str:
              start_index = text.find(start)
              if start_index < 0 or text.find(start, start_index + 1) >= 0:
                  raise AssertionError(f"{label}: start marker is not unique")
              end_index = text.find(end, start_index + len(start))
              if end_index < 0:
                  raise AssertionError(f"{label}: end marker not found")
              region = text[start_index:end_index]
              updated = transform(region)
              if updated == region:
                  raise AssertionError(f"{label}: transform made no change")
              return text[:start_index] + updated + text[end_index:]

          local_path = Path('linktools-ai/src/linktools/ai/task/_local.py')
          text = local_path.read_text()
          text = replace_once(
              text,
              'from collections.abc import Mapping\n',
              'from collections.abc import Awaitable, Callable, Mapping\n',
              'local imports',
          )

          def patch_control(region: str) -> str:
              region = replace_once(
                  region,
                  '        tenant_id: str,\n    ) -> None:\n',
                  '        tenant_id: str,\n        on_activity: Callable[[], Awaitable[None]],\n    ) -> None:\n',
                  'control callback parameter',
              )
              region = replace_once(
                  region,
                  '        self._tenant_id = tenant_id\n',
                  '        self._tenant_id = tenant_id\n        self._on_activity = on_activity\n',
                  'control callback field',
              )
              region = replace_once(
                  region,
                  '                execution_id=execution_id,\n            )\n',
                  '                execution_id=execution_id,\n            )\n        await self._on_activity()\n',
                  'control bind activity',
              )
              return region

          text = replace_region(
              text,
              'class _TaskNodeRunControlImpl:\n',
              '\n\nclass LocalTaskGraphLauncher:',
              patch_control,
              'run control region',
          )

          def patch_launcher(region: str) -> str:
              wait_start = region.index('    async def wait_graph_activity(\n')
              wait_end = region.index('    async def _run_graph(', wait_start)
              wait_block = (
                  '    def graph_activity_generation(\n'
                  '        self,\n'
                  '        graph_id: str,\n'
                  '        *,\n'
                  '        tenant_id: str,\n'
                  '    ) -> int | None:\n'
                  '        run = self._runs.get((tenant_id, graph_id))\n'
                  '        if run is None or (run.closed and run.failure is None):\n'
                  '            return None\n'
                  '        return run.generation\n'
                  '\n'
                  '    async def wait_graph_activity(\n'
                  '        self,\n'
                  '        graph_id: str,\n'
                  '        *,\n'
                  '        tenant_id: str,\n'
                  '        after_generation: int,\n'
                  '    ) -> None:\n'
                  '        if after_generation < 0:\n'
                  '            raise ValueError("activity generation must be non-negative")\n'
                  '        async with self._lock:\n'
                  '            run = self._runs.get((tenant_id, graph_id))\n'
                  '        if run is None:\n'
                  '            return\n'
                  '        if run.failure is not None:\n'
                  '            raise AIError(run.failure.code, safe_details=dict(run.failure.safe_details))\n'
                  '        if run.closed:\n'
                  '            return\n'
                  '        async with run.condition:\n'
                  '            await run.condition.wait_for(\n'
                  '                lambda: run.generation != after_generation\n'
                  '                or run.closed\n'
                  '                or run.failure is not None\n'
                  '            )\n'
                  '        if run.failure is not None:\n'
                  '            raise AIError(run.failure.code, safe_details=dict(run.failure.safe_details))\n'
                  '\n'
              )
              region = region[:wait_start] + wait_block + region[wait_end:]
              region = replace_once(
                  region,
                  '                    inflight[node.node_id] = _InflightNode(task, lease_state)\n'
                  '                if inflight:\n',
                  '                    inflight[node.node_id] = _InflightNode(task, lease_state)\n'
                  '                    await self._notify(run)\n'
                  '                if inflight:\n',
                  'claim activity signal',
              )
              region = replace_once(
                  region,
                  '        control = _TaskNodeRunControlImpl(\n'
                  '            self._repository,\n'
                  '            lease_state,\n'
                  '            tenant_id=tenant_id,\n'
                  '        )\n',
                  '        control = _TaskNodeRunControlImpl(\n'
                  '            self._repository,\n'
                  '            lease_state,\n'
                  '            tenant_id=tenant_id,\n'
                  '            on_activity=lambda: self._notify(run),\n'
                  '        )\n',
                  'bind activity callback',
              )
              return region

          text = replace_region(
              text,
              'class LocalTaskGraphLauncher:\n',
              '\n\ndef _scheduler_failure(',
              patch_launcher,
              'launcher region',
          )
          local_path.write_text(text)

          service_path = Path('linktools-ai/src/linktools/ai/task/_service_impl.py')
          text = service_path.read_text()

          def patch_waiter(region: str) -> str:
              region = replace_once(
                  region,
                  '    def owns_graph(self, graph_id: str, *, tenant_id: str) -> bool: ...\n\n',
                  '    def owns_graph(self, graph_id: str, *, tenant_id: str) -> bool: ...\n\n'
                  '    def graph_activity_generation(\n'
                  '        self,\n'
                  '        graph_id: str,\n'
                  '        *,\n'
                  '        tenant_id: str,\n'
                  '    ) -> int | None: ...\n\n',
                  'waiter generation protocol',
              )
              region = replace_once(
                  region,
                  '        tenant_id: str,\n    ) -> None: ...\n',
                  '        tenant_id: str,\n        after_generation: int,\n    ) -> None: ...\n',
                  'waiter generation argument',
              )
              return region

          text = replace_region(
              text,
              'class _LocalTaskWaiter(Protocol):\n',
              '\n\nclass _TaskGraphPreflight(Protocol):',
              patch_waiter,
              'waiter protocol region',
          )

          def patch_observer(region: str) -> str:
              region = replace_once(
                  region,
                  '        tenant_id = principal.tenant_id\n'
                  '        async with self._graph_consumer(graph_id, tenant_id):\n',
                  '        tenant_id = principal.tenant_id\n'
                  '        generation = self._local_activity_generation(graph_id, tenant_id=tenant_id)\n'
                  '        async with self._graph_consumer(graph_id, tenant_id):\n',
                  'initial observation generation',
              )
              region = replace_once(
                  region,
                  '                await self._wait_observation_opportunity(snapshot, tenant_id=tenant_id)\n',
                  '                await self._wait_observation_opportunity(\n'
                  '                    snapshot,\n'
                  '                    tenant_id=tenant_id,\n'
                  '                    after_generation=generation,\n'
                  '                )\n',
                  'observation wait generation',
              )
              region = replace_once(
                  region,
                  '                raise\n'
                  '            latest = await self._snapshot_with_terminal_release(\n',
                  '                raise\n'
                  '            generation = self._local_activity_generation(\n'
                  '                graph_id,\n'
                  '                tenant_id=tenant_id,\n'
                  '            )\n'
                  '            latest = await self._snapshot_with_terminal_release(\n',
                  'next observation generation',
              )
              return region

          text = replace_region(
              text,
              '    async def _observe_graph(\n',
              '    async def _snapshot_with_terminal_release(\n',
              patch_observer,
              'observer region',
          )

          wait_start = text.index('    async def _wait_observation_opportunity(\n')
          wait_end = text.index('    async def wait_graph(\n', wait_start)
          wait_block = (
              '    def _local_activity_generation(\n'
              '        self,\n'
              '        graph_id: str,\n'
              '        *,\n'
              '        tenant_id: str,\n'
              '    ) -> int | None:\n'
              '        waiter = self._local_waiter\n'
              '        if waiter is None or not waiter.owns_graph(graph_id, tenant_id=tenant_id):\n'
              '            return None\n'
              '        return waiter.graph_activity_generation(graph_id, tenant_id=tenant_id)\n'
              '\n'
              '    async def _wait_observation_opportunity(\n'
              '        self,\n'
              '        snapshot: TaskGraphSnapshot,\n'
              '        *,\n'
              '        tenant_id: str,\n'
              '        after_generation: int | None,\n'
              '    ) -> None:\n'
              '        waiter = self._local_waiter\n'
              '        if waiter is None or not waiter.owns_graph(snapshot.graph_id, tenant_id=tenant_id):\n'
              '            await asyncio.sleep(_GRAPH_OBSERVATION_RECHECK_SECONDS)\n'
              '            return\n'
              '        if after_generation is None:\n'
              '            return\n'
              '        timeout = _nearest_live_lease_delay(snapshot)\n'
              '        if timeout is None:\n'
              '            await waiter.wait_graph_activity(\n'
              '                snapshot.graph_id,\n'
              '                tenant_id=tenant_id,\n'
              '                after_generation=after_generation,\n'
              '            )\n'
              '            return\n'
              '        if timeout <= 0:\n'
              '            return\n'
              '        try:\n'
              '            await asyncio.wait_for(\n'
              '                waiter.wait_graph_activity(\n'
              '                    snapshot.graph_id,\n'
              '                    tenant_id=tenant_id,\n'
              '                    after_generation=after_generation,\n'
              '                ),\n'
              '                timeout=timeout,\n'
              '            )\n'
              '        except asyncio.TimeoutError:\n'
              '            return\n'
              '\n'
          )
          text = text[:wait_start] + wait_block + text[wait_end:]
          text = replace_once(
              text,
              '        if state.lease_expires_at is not None and state.lease_expires_at > now\n',
              '        if state.status is TaskStatus.RUNNING\n'
              '        and state.lease_expires_at is not None\n'
              '        and state.lease_expires_at > now\n',
              'running lease deadline',
          )
          service_path.write_text(text)
          PY
          python -m py_compile \
            linktools-ai/src/linktools/ai/task/_local.py \
            linktools-ai/src/linktools/ai/task/_service_impl.py
          git diff --check
      - name: Commit validated patch and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/taskgraph-observation-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/taskgraph-observation-patch.yml \
            linktools-ai/src/linktools/ai/task/_local.py \
            linktools-ai/src/linktools/ai/task/_service_impl.py
          git diff --cached --check
          git commit -m "fix(ai-task): make local observation lossless"
          git push origin HEAD:feat/ai-taskgraph-reliable-mixed-nodes
