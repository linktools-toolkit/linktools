name: Complete subagent execution tree lineage fix

on:
  push:
    branches:
      - feat/ai-subagent-observability
    paths:
      - .github/workflows/ai-subagent-observability-fix-v2.yml

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ai-subagent-observability
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Apply complete lineage fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          first = Path(
              ".github/workflows/ai-subagent-observability-fix.yml"
          ).read_text()
          block = first.split("          python - <<'PY'\n", 1)[1].split(
              "\n          PY\n", 1
          )[0]
          exec(compile(textwrap.dedent(block), "execution-tree-lineage-fix", "exec"))

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              value = file.read_text()
              count = value.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, got {count}")
              file.write_text(value.replace(old, new, 1))

          api = "linktools-ai/src/linktools/ai/runtime/service_api.py"
          replace_once(
              api,
              '''            if (\n                self.parent_execution_id is not None\n                or self.parent_invocation_id is not None\n                or self.root_execution_id != self.execution_id\n            ):\n''',
              '''            if (\n                self.parent_execution_id is not None\n                or self.parent_invocation_id is not None\n                or self.lineage_kind is ExecutionLineageKind.SUBAGENT\n            ):\n''',
          )

          factory = "linktools-ai/src/linktools/ai/runtime/_factory.py"
          replace_once(
              factory,
              '''        execution.bind_tree_streamer(\n            ExecutionTreeStreamer(execution, event, execution_tree_broker)\n        )\n''',
              '''''',
          )
          replace_once(
              factory,
              '''        local_coordinator = _LocalRuntimeCoordinator(execution, event)\n''',
              '''        local_coordinator = _LocalRuntimeCoordinator(execution, event)\n        execution.bind_tree_streamer(\n            ExecutionTreeStreamer(\n                execution,\n                local_coordinator,\n                execution_tree_broker,\n            )\n        )\n''',
          )
          PY
      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Run targeted tests
        run: |
          python -m pytest -q \
            tests/ai/test_subagent_execution_tree.py \
            tests/ai/test_skill_subagent_final_refactor.py \
            tests/ai/test_execution_context_durability.py \
            tests/ai/test_local_execution_recovery.py \
            tests/ai/test_runtime_boundary_contract.py \
            tests/ai/test_runtime_composition_regressions.py
      - name: Run linktools-ai gate
        run: python manage.py check linktools-ai
      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/ai-subagent-observability-fix.yml
          rm .github/workflows/ai-subagent-observability-fix-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ai): preserve execution tree lineage semantics"
          git push origin HEAD:feat/ai-subagent-observability
