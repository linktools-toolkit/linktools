name: Final AI review cleanup

on:
  push:
    branches:
      - refactor/ai-harness-capabilities

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/ai-harness-capabilities
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Apply final structural cleanup
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import subprocess
          from collections import defaultdict
          from pathlib import Path

          STATE_PATH = Path('linktools-ai/src/linktools/ai/runtime/state/__init__.py')
          MASTER_STATE = subprocess.check_output(
              ['git', 'show', 'origin/master:linktools-ai/src/linktools/ai/runtime/state/__init__.py'],
              text=True,
          )
          master_tree = ast.parse(MASTER_STATE)
          public_state: set[str] = set()
          for node in master_tree.body:
              if isinstance(node, ast.Assign) and any(
                  isinstance(target, ast.Name) and target.id == '__all__'
                  for target in node.targets
              ):
                  public_state = {
                      item.value
                      for item in node.value.elts
                      if isinstance(item, ast.Constant) and isinstance(item.value, str)
                  }
                  break
          if not public_state:
              raise SystemExit('unable to read master runtime.state public surface')

          hidden = {
              'ApprovalRecord': ('_contracts', 'ApprovalRecord'),
              'ConversationCursor': ('_contracts', 'ConversationCursor'),
              'EvaluationRecord': ('_contracts', 'EvaluationRecord'),
              'ExecutionCancelRequestCommit': ('_contracts', 'ExecutionCancelRequestCommit'),
              'ExecutionStartClaim': ('_contracts', 'ExecutionStartClaim'),
              'ExecutionStartReservation': ('_contracts', 'ExecutionStartReservation'),
              'ExecutionStartUnknownCommit': ('_contracts', 'ExecutionStartUnknownCommit'),
              'ExecutionTerminalCommit': ('_contracts', 'ExecutionTerminalCommit'),
              'ExternalCallRecord': ('_contracts', 'ExternalCallRecord'),
              'IdempotencyRecord': ('_contracts', 'IdempotencyRecord'),
              'IdempotencyTerminalUpdate': ('_contracts', 'IdempotencyTerminalUpdate'),
              'OperationLedgerRepository': ('_contracts', 'OperationLedgerRepository'),
              'OperationTerminalUpdate': ('_contracts', 'OperationTerminalUpdate'),
              'RecoveryCheckpoint': ('_contracts', 'RecoveryCheckpoint'),
              'RecoveryConversationIntent': ('_contracts', 'RecoveryConversationIntent'),
              'RecoveryExecutionInput': ('_contracts', 'RecoveryExecutionInput'),
              'RecoveryIdempotencyInput': ('_contracts', 'RecoveryIdempotencyInput'),
              'RecoveryTerminalHandoff': ('_contracts', 'RecoveryTerminalHandoff'),
              'RecoveryTerminalOutcome': ('_contracts', 'RecoveryTerminalOutcome'),
              'ResultRecord': ('_contracts', 'ResultRecord'),
              'SESSION_AGENT_ID_METADATA_KEY': ('_contracts', 'SESSION_AGENT_ID_METADATA_KEY'),
              'ToolOperationRecord': ('_contracts', 'ToolOperationRecord'),
              'EventRepositoryImpl': ('_repositories', 'EventRepositoryImpl'),
              'OperationLedgerRepositoryImpl': ('_repositories', 'OperationLedgerRepository'),
              'RecoveryCheckpointRepositoryImpl': ('_repositories', 'RecoveryCheckpointRepositoryImpl'),
              'ToolRepositoryImpl': ('_repositories', 'ToolRepositoryImpl'),
              'StagingStepStore': ('_steps', 'StagingStepStore'),
              'ContinuableSnapshot': ('_step_contracts', 'ContinuableSnapshot'),
              'RunRecord': ('_step_contracts', 'RunRecord'),
              'StepEvent': ('_step_contracts', 'StepEvent'),
              'StepStore': ('_step_contracts', 'StepStore'),
          }
          if public_state.intersection(hidden):
              raise SystemExit('hidden state map overlaps master public API')

          def offsets(text: str) -> list[int]:
              result = [0]
              for index, char in enumerate(text):
                  if char == '\n':
                      result.append(index + 1)
              return result

          def render_import(module: str, values: list[tuple[str, str | None]]) -> str:
              if not values:
                  return ''
              lines = [f'from {module} import (']
              for name, alias in values:
                  lines.append(f'    {name}' + (f' as {alias}' if alias else '') + ',')
              lines.append(')')
              return '\n'.join(lines)

          def rewrite_state_facade_imports(path: Path) -> None:
              text = path.read_text(encoding='utf-8')
              try:
                  tree = ast.parse(text)
              except SyntaxError as error:
                  raise SystemExit(f'{path}: parse failed before cleanup: {error}') from error
              line_offsets = offsets(text)
              edits: list[tuple[int, int, str]] = []
              for node in ast.walk(tree):
                  if not isinstance(node, ast.ImportFrom):
                      continue
                  relative_state = node.level > 0 and node.module == 'state'
                  absolute_state = node.level == 0 and node.module == 'linktools.ai.runtime.state'
                  if not relative_state and not absolute_state:
                      continue
                  hidden_names = [alias for alias in node.names if alias.name in hidden]
                  if not hidden_names:
                      continue
                  public_names = [alias for alias in node.names if alias.name not in hidden]
                  unknown = [alias.name for alias in public_names if alias.name not in public_state]
                  if unknown:
                      raise SystemExit(f'{path}: unresolved runtime.state imports: {unknown}')
                  if relative_state:
                      state_module = '.' * node.level + 'state'
                  else:
                      state_module = 'linktools.ai.runtime.state'
                  chunks: list[str] = []
                  if public_names:
                      chunks.append(
                          render_import(
                              state_module,
                              [(alias.name, alias.asname) for alias in public_names],
                          )
                      )
                  groups: dict[str, list[tuple[str, str | None]]] = defaultdict(list)
                  order: list[str] = []
                  for alias in hidden_names:
                      owner, source_name = hidden[alias.name]
                      if owner not in groups:
                          order.append(owner)
                      visible = alias.asname or alias.name
                      alias_name = visible if visible != source_name else None
                      groups[owner].append((source_name, alias_name))
                  for owner in order:
                      module = f'{state_module}.{owner}'
                      chunks.append(render_import(module, groups[owner]))
                  start = line_offsets[node.lineno - 1]
                  end_line = node.end_lineno or node.lineno
                  end = text.find('\n', line_offsets[end_line - 1])
                  if end == -1:
                      end = len(text)
                  else:
                      end += 1
                  edits.append((start, end, '\n'.join(chunks) + '\n'))
              for start, end, replacement in sorted(edits, reverse=True):
                  text = text[:start] + replacement + text[end:]
              path.write_text(text, encoding='utf-8')

          for path in Path('linktools-ai/src').rglob('*.py'):
              if STATE_PATH.parent in path.parents:
                  continue
              rewrite_state_facade_imports(path)
          for path in Path('tests/ai').rglob('*.py'):
              rewrite_state_facade_imports(path)

          STATE_PATH.write_text(MASTER_STATE, encoding='utf-8')

          tool_policy_path = Path('linktools-ai/src/linktools/ai/runtime/_tool_policy.py')
          tool_policy = tool_policy_path.read_text(encoding='utf-8')
          constants = tool_policy.index('MEMORY_TOOL_NAMES =')
          tool_policy_header = '''#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\n"""Runtime tool selection, provenance, replay, and failure policy."""\n\nfrom __future__ import annotations\n\nimport asyncio\nimport json\nfrom collections.abc import Sequence\nfrom dataclasses import dataclass\nfrom typing import Any, Protocol\n\nfrom pydantic import ValidationError\nfrom pydantic_ai.exceptions import (\n    ApprovalRequired,\n    CallDeferred,\n    ModelRetry,\n    SkipToolExecution,\n    ToolFailed,\n    ToolFailedError,\n    ToolRetryError,\n)\nfrom pydantic_ai.messages import (\n    ModelResponse,\n    RetryPromptPart,\n    ToolCallPart,\n    ToolReturnPart,\n)\nfrom pydantic_ai.tools import RunContext, ToolDefinition\n\nfrom ..capability import (\n    SKILL_TOOL_NAMES,\n    SUBAGENT_TOOL_NAMES,\n    WORKSPACE_FILESYSTEM_READ_TOOL_NAMES,\n    WORKSPACE_FILESYSTEM_TOOL_NAMES,\n    WORKSPACE_SHELL_TOOL_NAMES,\n)\nfrom ..errors import AIError, ErrorCode\nfrom ._tool import ToolOperationDecision\nfrom .state._contracts import ToolOperationRecord\n\n'''
          tool_policy_path.write_text(tool_policy_header + tool_policy[constants:], encoding='utf-8')

          capabilities_path = Path('linktools-ai/src/linktools/ai/runtime/_capabilities.py')
          capabilities = capabilities_path.read_text(encoding='utf-8')
          capabilities = capabilities.replace(
              '''    @property\n    def _runtime_store(self) -> HarnessStepStoreAdapter:\n        if not isinstance(self.store, HarnessStepStoreAdapter):\n            raise AIError(ErrorCode.RUNTIME_DEPENDENCY_NOT_READY)\n        return self.store\n''',
              '''    @property\n    def _runtime_store(self) -> HarnessStepStoreAdapter:\n        return cast(HarnessStepStoreAdapter, self.store)\n''',
          )
          capabilities_path.write_text(capabilities, encoding='utf-8')

          gate_path = Path('linktools-ai/src/linktools/ai/runtime/_workspace_gate.py')
          gate = gate_path.read_text(encoding='utf-8')
          gate = gate.replace('    }\n)\nclass _WorkspaceToolGate', '    }\n)\n\n\nclass _WorkspaceToolGate')
          gate = gate.replace('\n\n\n\n__all__ = []\n', '\n\n__all__ = []\n')
          gate_path.write_text(gate, encoding='utf-8')

          # A missing derived index is rebuilt from canonical records only after journal
          # recovery. The marker is written last, so partial rebuilds are never trusted.
          fs_path = Path('linktools-ai/src/linktools/ai/runtime/state/_filesystem.py')
          fs = fs_path.read_text(encoding='utf-8')
          fs = fs.replace('import os\n', 'import os\nimport shutil\n', 1)
          fs = fs.replace(
              '''    def _initialize_sync(self) -> tuple[_FilesystemIndex, int]:\n        self._provision()\n        self._recover_sync()\n        index = self._new_index()\n''',
              '''    def _initialize_sync(self) -> tuple[_FilesystemIndex, int]:\n        self._provision()\n        self._recover_sync()\n        self._ensure_record_index()\n        index = self._new_index()\n''',
              1,
          )
          fs = fs.replace(
              '''        self._recover_sync()\n        for member in self._members:\n            member._index = member._new_index()\n''',
              '''        self._recover_sync()\n        for member in self._members:\n            member._ensure_record_index()\n        for member in self._members:\n            member._index = member._new_index()\n''',
              1,
          )
          fs = fs.replace(
              '''        if manifest.exists():\n            self._validate_existing_root()\n            marker = self._root / _RECORD_INDEX_MARKER\n            if not marker.exists() and not any(\n                (self._root / "records").glob("*/*/*.json")\n            ):\n                _write_text(marker, "1")\n                sync_directory(marker.parent)\n            return\n''',
              '''        if manifest.exists():\n            self._validate_existing_root()\n            return\n''',
              1,
          )
          load_index_marker = '    def _load_index(self) -> _FilesystemIndex:\n'
          ensure_index = '''    def _ensure_record_index(self) -> None:\n        if _record_index_marker_valid(self._root):\n            return\n        index_root = self._root / "record-index"\n        if index_root.exists():\n            shutil.rmtree(index_root)\n            sync_directory(self._root)\n        index_root.mkdir(parents=True, exist_ok=True)\n        for source in (self._root / "records").glob("*/*/*.json"):\n            record = decode_record(_read_json(source))\n            _require_layout_path(\n                source,\n                self._root,\n                _record_path(record),\n            )\n            target_relative = _record_index_path(record)\n            if target_relative is None:\n                if record.scope_digest is not None:\n                    shutil.rmtree(index_root)\n                    sync_directory(self._root)\n                    return\n                continue\n            target = self._root / target_relative\n            target.parent.mkdir(parents=True, exist_ok=True)\n            target.write_bytes(b"")\n            _sync_file(target)\n        marker = self._root / _RECORD_INDEX_MARKER\n        _write_text(marker, "1")\n        sync_directory(index_root)\n        sync_directory(self._root)\n\n'''
          if load_index_marker not in fs:
              raise SystemExit('filesystem load-index insertion point missing')
          fs = fs.replace(load_index_marker, ensure_index + load_index_marker, 1)
          fs_path.write_text(fs, encoding='utf-8')

          test_path = Path('tests/ai/test_memory_bounded_listing.py')
          test = test_path.read_text(encoding='utf-8')
          if 'test_filesystem_rebuilds_missing_record_index_before_bounded_query' not in test:
              test = test.replace('from pathlib import Path\n', 'from pathlib import Path\nimport shutil\n')
              test += '''\n\nasync def test_filesystem_rebuilds_missing_record_index_before_bounded_query(\n    tmp_path: Path,\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    from linktools.ai.runtime.state import _filesystem as filesystem\n    from linktools.ai.runtime.state._filesystem import FilesystemStateStore\n    from linktools.ai.runtime.state._plan import RuntimeDomain\n\n    root = tmp_path / "memory-reindex"\n    state = FilesystemStateStore(\n        root,\n        namespace="memory-reindex",\n        tenant_id="tenant",\n        runtime_domain=RuntimeDomain.MEMORY.value,\n    )\n    await state.initialize()\n    repository = MemoryRepositoryImpl(\n        state,\n        namespace="memory-reindex",\n        tenant_id="tenant",\n    )\n    now = datetime.now(timezone.utc)\n    values = tuple(\n        MemoryRecord(\n            f"memory-{index}",\n            "tenant",\n            "scope-digest",\n            StoredPayload.inline_text("content"),\n            {"path": f"memory/{index:03d}.md"},\n            1,\n            now,\n            now,\n        )\n        for index in range(20)\n    )\n    await state.mutate(\n        lambda transaction: transaction.insert_records(\n            tuple(repository._stored("memory", value.memory_id, value) for value in values)\n        )\n    )\n    await state.close()\n    shutil.rmtree(root / "record-index")\n\n    reopened = FilesystemStateStore(\n        root,\n        namespace="memory-reindex",\n        tenant_id="tenant",\n        runtime_domain=RuntimeDomain.MEMORY.value,\n    )\n    await reopened.initialize()\n    assert (root / "record-index" / "complete").read_text(encoding="utf-8") == "1"\n    repository = MemoryRepositoryImpl(\n        reopened,\n        namespace="memory-reindex",\n        tenant_id="tenant",\n    )\n    original_read_json = filesystem._read_json\n    record_reads = 0\n\n    def counting_read_json(path: Path):\n        nonlocal record_reads\n        if "records" in path.parts:\n            record_reads += 1\n        return original_read_json(path)\n\n    monkeypatch.setattr(filesystem, "_read_json", counting_read_json)\n    page = await repository.list(\n        tenant_id="tenant",\n        memory_scope_digest="scope-digest",\n        prefix="memory/",\n        cursor=None,\n        limit=1,\n    )\n    assert [value.metadata["path"] for value in page.items] == ["memory/000.md"]\n    assert record_reads == 2\n    await reopened.close()\n'''
              test_path.write_text(test, encoding='utf-8')

          # Public facade must now be byte-for-byte the master contract.
          if STATE_PATH.read_text(encoding='utf-8') != MASTER_STATE:
              raise SystemExit('runtime.state facade diverged from master')

          for path in [*Path('linktools-ai/src').rglob('*.py'), *Path('tests/ai').rglob('*.py')]:
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY
      - name: Install project
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Format changed Python
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACM -- '*.py')
          if ((${#files[@]})); then
            python -m ruff format "${files[@]}"
          fi
      - name: Run focused regressions
        shell: bash
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/ai/test_memory_bounded_listing.py \
            tests/ai/test_review_contract_cleanup.py \
            tests/ai/test_architecture_gate.py \
            tests/ai/test_error_review_regressions.py
      - name: Run package gate
        shell: bash
        run: |
          python manage.py check linktools-ai
          git diff --check
      - name: Commit final cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ai-review-cleanup.yml
          git add -A
          git commit -m 'refactor(ai): tighten runtime ownership boundaries'
          git push origin HEAD:refactor/ai-harness-capabilities
