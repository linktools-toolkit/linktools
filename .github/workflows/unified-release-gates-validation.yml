name: Validate unified release gates

on:
  push:
    branches:
      - refactor/unified-release-gates
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-release-gates

      - name: Finalize path migration
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          suffixes = {'.py', '.json', '.md', '.yml', '.yaml', '.toml', '.txt'}
          workflow = Path('.github/workflows/unified-release-gates-validation.yml')
          ai_prefixes = ('scripts/check/ai/', 'tests/ai/')
          ai_files = {'linktools-ai/AGENTS.md', 'linktools-ai/README.md'}

          for path in root.rglob('*'):
              if not path.is_file() or path == workflow or '.git' in path.parts:
                  continue
              if path.suffix.lower() not in suffixes:
                  continue
              relative = path.as_posix()
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text.replace('linktools-ai/scripts/build/', 'scripts/check/ai/')
              updated = updated.replace('linktools-ai/scripts/build', 'scripts/check/ai')
              if relative.startswith(ai_prefixes) or relative in ai_files:
                  updated = updated.replace('scripts/build/', 'scripts/check/ai/')
                  updated = updated.replace('scripts/build', 'scripts/check/ai')
                  updated = updated.replace('scripts.build', 'scripts.check.ai')
              if path == Path('scripts/verify.py'):
                  updated = updated.replace(
                      'version_file.read_text(encoding="utf-8").strip() != version',
                      'version_file.read_text(encoding="utf-8") != version',
                  )
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY
          rm -rf linktools-ai/scripts
          if git grep -n -E 'scripts\.build|linktools-ai/scripts/build' -- ':!:.github/workflows/unified-release-gates-validation.yml'; then
            echo '::error::stale AI build-script reference remains'
            exit 1
          fi
          if git grep -n 'scripts/build' -- scripts/check/ai tests/ai linktools-ai/AGENTS.md linktools-ai/README.md; then
            echo '::error::stale AI gate path remains'
            exit 1
          fi
          test ! -e linktools-ai/scripts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build frida scripts
        run: cd linktools-mobile/agents/frida && npm install && npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build android tools
        run: cd linktools-mobile/agents/android && ./gradlew --no-daemon :tools:buildTools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install root tooling
        run: |
          python -m pip install --upgrade pip
          pip install -U -r requirements.txt
      - name: Install projects
        run: python manage.py install --editable

      - name: Diagnose Python 3.6 source gate
        run: >-
          python scripts/check/python36.py
          manage.py
          scripts/check/python36.py
          linktools/src
          linktools-common/src
          linktools-mobile/src
          linktools-cntr/src

      - name: Capture Ruff and pytest diagnostics
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e
          ruff check --no-cache --select F,E9,I --output-format concise scripts/check/ai > diagnostics/ruff-scripts.txt 2>&1
          echo $? > diagnostics/ruff-scripts.status
          ruff check --no-cache --select F,E9,I --output-format concise linktools-ai/src/linktools/ai > diagnostics/ruff-source.txt 2>&1
          echo $? > diagnostics/ruff-source.status
          ruff check --no-cache --select F,E9,I --output-format concise linktools-ai/src/linktools/commands/ai > diagnostics/ruff-commands.txt 2>&1
          echo $? > diagnostics/ruff-commands.status
          ruff check --no-cache --select F,E9,I --output-format concise tests/ai > diagnostics/ruff-tests.txt 2>&1
          echo $? > diagnostics/ruff-tests.status
          python -m pytest -q -p no:cacheprovider tests > diagnostics/pytest.txt 2>&1
          echo $? > diagnostics/pytest.status
          set -e
          for file in diagnostics/*.status; do printf '%s=' "$file"; cat "$file"; done
          for file in diagnostics/ruff-*.txt; do echo "===== $file ====="; head -200 "$file"; done
          echo '===== pytest tail ====='
          tail -100 diagnostics/pytest.txt

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: unified-release-gates-diagnostics
          path: diagnostics

      - name: Enforce diagnostics
        shell: bash
        run: |
          for file in diagnostics/*.status; do
            if [ "$(cat "$file")" != "0" ]; then
              echo "::error::$file failed"
              exit 1
            fi
          done

      - name: Check source and tests
        run: python manage.py check

      - name: Build release artifacts
        run: |
          rm -rf dist
          VERSION=v0.0.1 RELEASE=true python manage.py build
      - name: Verify release artifacts
        run: VERSION=v0.0.1 python manage.py verify

      - name: Commit validated implementation
        run: |
          git checkout -- linktools*/.version || true
          git checkout -- linktools-mobile/src/linktools/assets/frida.js || true
          git checkout -- 'linktools-mobile/src/linktools/assets/frida-*.js' || true
          git checkout -- 'linktools-mobile/src/linktools/assets/android-tools.*' || true
          rm -f .github/workflows/unified-release-gates-validation.yml
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No validated source changes to commit'
            exit 0
          fi
          git commit -m 'refactor(release): finalize unified gates'
          git push origin HEAD:refactor/unified-release-gates
