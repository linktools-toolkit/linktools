name: Temporary unified release gates validation

on:
  push:
    branches:
      - refactor/unified-release-gates
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: unified-release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python310:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U -r requirements.txt
          python manage.py install --editable
      - name: Clean release artifacts
        run: python manage.py clean
      - name: Run source gates
        run: python manage.py check
      - name: Build release artifacts
        run: VERSION=v0.0.0 RELEASE=true python manage.py build
      - name: Assert exact artifact set
        run: |
          python - <<'PY'
          from pathlib import Path

          files = sorted(path for path in Path("dist").iterdir() if path.is_file())
          wheels = [path for path in files if path.name.endswith(".whl")]
          sdists = [path for path in files if path.name.endswith(".tar.gz")]
          if len(files) != 10 or len(wheels) != 5 or len(sdists) != 5:
              raise SystemExit(
                  "expected exactly 10 artifacts (5 wheels + 5 sdists), got "
                  f"{len(files)} total, {len(wheels)} wheels, {len(sdists)} sdists: "
                  + ", ".join(path.name for path in files)
              )
          PY
      - name: Verify release artifacts
        run: VERSION=v0.0.0 python manage.py verify
      - name: Validate required failure drills
        shell: bash
        env:
          VERSION: v0.0.0
        run: |
          set -euo pipefail
          baseline="$(mktemp -d)"
          cp -a dist "$baseline/dist"
          cp linktools/.version "$baseline/linktools.version"

          restore_dist() {
            rm -rf dist
            cp -a "$baseline/dist" dist
          }

          expect_verify_failure() {
            set +e
            output="$(python manage.py verify 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              echo "expected artifact verification to fail" >&2
              exit 1
            fi
          }

          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' | sort | head -n 1)"
          test -n "$wheel"
          rm "$wheel"
          expect_verify_failure

          restore_dist
          python - <<'PY'
          from pathlib import Path
          import shutil

          wheel = sorted(Path("dist").glob("*.whl"))[0]
          parts = wheel.name[:-4].split("-")
          if len(parts) != 5:
              raise SystemExit(f"unexpected wheel filename for duplicate drill: {wheel.name}")
          duplicate = wheel.with_name("-".join(parts[:2] + ["1"] + parts[2:]) + ".whl")
          shutil.copy2(wheel, duplicate)
          PY
          expect_verify_failure

          restore_dist
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = Path("dist/release_gate_unknown-0.0.0-py3-none-any.whl")
          dist_info = "release_gate_unknown-0.0.0.dist-info"
          with zipfile.ZipFile(str(wheel), "w", compression=zipfile.ZIP_DEFLATED) as archive:
              archive.writestr(
                  f"{dist_info}/METADATA",
                  "Metadata-Version: 2.1\n"
                  "Name: release-gate-unknown\n"
                  "Version: 0.0.0\n"
                  "Requires-Python: >=3.6\n\n",
              )
              archive.writestr(
                  f"{dist_info}/WHEEL",
                  "Wheel-Version: 1.0\n"
                  "Generator: linktools-release-gate-validation\n"
                  "Root-Is-Purelib: true\n"
                  "Tag: py3-none-any\n",
              )
              archive.writestr(f"{dist_info}/RECORD", "")
          PY
          expect_verify_failure

          restore_dist
          printf '%s' 'v9.9.9' > linktools/.version
          expect_verify_failure
          cp "$baseline/linktools.version" linktools/.version

          restore_dist
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = sorted(Path("dist").glob("linktools-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one linktools wheel, got {[path.name for path in wheels]}")
          wheel = wheels[0]
          resource = "linktools/assets/tools/linktools.json"
          temporary = wheel.with_name(wheel.name + ".tmp")
          found = False
          with zipfile.ZipFile(str(wheel), "r") as source, zipfile.ZipFile(
              str(temporary), "w"
          ) as target:
              for info in source.infolist():
                  if info.filename == resource:
                      found = True
                      continue
                  target.writestr(info, source.read(info.filename))
          if not found:
              raise SystemExit(f"required capability resource was absent before drill: {resource}")
          temporary.replace(wheel)
          PY
          expect_verify_failure

          restore_dist
          VERSION=v0.0.0 python manage.py verify
      - name: Verify legacy paths are absent
        shell: bash
        run: |
          p1="scripts""\\.build"
          p2="linktools-ai/scripts/""build"
          p3="scripts/build/""matrix"
          ! git grep -n "$p1" -- .
          ! git grep -n "$p2" -- .
          ! git grep -n "$p3" -- .
      - name: Restore clean source state
        if: always()
        run: |
          python manage.py clean
          git restore linktools*/.version
          git diff --exit-code

  python36:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute gates in CPython 3.6.15
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            python:3.6.15 \
            bash -lc '
              set -eu
              python -m pip install "tomlkit==0.11.6"
              python -m py_compile manage.py
              python -m py_compile scripts/check/python36.py
              python scripts/check/python36.py \
                manage.py \
                scripts/check/python36.py \
                linktools/src \
                linktools-common/src \
                linktools-mobile/src \
                linktools-cntr/src
              set +e
              output="$(python manage.py check linktools-ai 2>&1)"
              status=$?
              set -e
              printf "%s\n" "$output"
              test "$status" -ne 0
              printf "%s\n" "$output" | grep -F "Python 3.10 is required by linktools-ai; current interpreter is 3.6"
            '
