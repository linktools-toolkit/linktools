name: Temporary unified release gates validation

on:
  push:
    branches:
      - refactor/unified-release-gates
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  diagnostic-build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U -r requirements.txt
          python manage.py install --editable
      - name: Build release artifacts without source gates
        run: VERSION=v0.0.0 RELEASE=true python manage.py build
      - name: Verify release artifacts
        run: VERSION=v0.0.0 python manage.py verify
      - name: Verify legacy paths are absent
        run: |
          ! git grep -n 'scripts\.build' -- .
          ! git grep -n 'linktools-ai/scripts/build' -- .
          ! git grep -n 'scripts/build/matrix' -- .

  diagnostic-python36-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute gates in CPython 3.6.15
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            python:3.6.15 \
            bash -lc '
              set -eu
              python -m pip install "tomlkit==0.11.8"
              python -m py_compile manage.py
              python -m py_compile scripts/check/python36.py
              python scripts/check/python36.py \
                manage.py \
                scripts/check/python36.py \
                linktools/src \
                linktools-common/src \
                linktools-mobile/src \
                linktools-cntr/src
              set +e
              output="$(python manage.py check linktools-ai 2>&1)"
              status=$?
              set -e
              printf "%s\n" "$output"
              test "$status" -ne 0
              printf "%s\n" "$output" | grep -F "Python 3.10 is required by linktools-ai; current interpreter is 3.6"
            '
