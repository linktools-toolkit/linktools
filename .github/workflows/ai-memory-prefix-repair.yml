name: AI memory prefix repair

on:
  push:
    branches:
      - refactor/ai-harness-capabilities

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/ai-harness-capabilities
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Apply memory prefix repair
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_between(path: Path, start: str, end: str, replacement: str) -> None:
              text = path.read_text(encoding='utf-8')
              first = text.find(start)
              if first < 0:
                  raise SystemExit(f'{path}: start marker missing: {start!r}')
              second = text.find(end, first)
              if second < 0:
                  raise SystemExit(f'{path}: end marker missing: {end!r}')
              path.write_text(text[:first] + replacement + text[second:], encoding='utf-8')

          memory_path = Path('linktools-ai/src/linktools/ai/runtime/_memory.py')
          replace_once(
              memory_path,
              '''def _normalize_prefix(prefix: str) -> str:\n    if prefix == "":\n        return ""\n    normalized = prefix.removesuffix("/")\n    return f"{_normalize_path(normalized)}/"\n''',
              '''def _normalize_prefix(prefix: str) -> str:\n    if prefix == "":\n        return ""\n    _normalize_path(prefix.removesuffix("/"))\n    return prefix\n''',
          )

          repositories_path = Path('linktools-ai/src/linktools/ai/runtime/state/_repositories.py')
          replace_once(
              repositories_path,
              '            sort_key_prefix=prefix or None,\n',
              '            sort_key_prefix=prefix,\n',
          )

          fs_path = Path('linktools-ai/src/linktools/ai/runtime/state/_filesystem.py')
          fs = fs_path.read_text(encoding='utf-8')
          if 'import heapq\n' not in fs:
              fs = fs.replace('import hashlib\n', 'import hashlib\nimport heapq\n', 1)
          node_marker = '''@dataclass(slots=True)\nclass _FactStreamInfo:\n    stream_digest: bytes\n    owner_key_digest: bytes\n    last_sequence: int\n    subjects: dict[bytes, int]\n    subjects_loaded: bool = True\n\n\n'''
          if node_marker not in fs:
              raise SystemExit('fact stream marker missing')
          fs = fs.replace(
              node_marker,
              node_marker
              + '''@dataclass(frozen=True, slots=True)\nclass _RecordIndexNode:\n    token: str\n    children: tuple[str, ...]\n    key_digest: bytes | None = None\n\n\n''',
              1,
          )
          fs_path.write_text(fs, encoding='utf-8')

          indexed_method = '''    def _list_indexed_records(\n        self,\n        query: RecordQuery,\n    ) -> tuple[StoredRecord, ...] | None:\n        if not self._record_index_complete or not _record_query_indexable(query):\n            return None\n        if query.kind is None or query.limit is None:\n            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n        selected = _record_index_select(self._root, query)\n        values: list[StoredRecord] = []\n        for token, key in selected:\n            value = self._indexed_record(query.kind, key)\n            if _record_sort_token(value.sort_key) != token or not _matches_record(\n                value, query\n            ):\n                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n            values.append(value)\n        return tuple(values)\n\n    def _indexed_record(self, kind: str, key: bytes) -> StoredRecord:\n        if key in self._records:\n            self._cache_hits += 1\n            value = self._records[key]\n            if not isinstance(value, StoredRecord) or value.kind != kind:\n                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n            return value\n        self._cache_misses += 1\n        key_hex = key.hex()\n        path = self._root / "records" / kind / key_hex[:2] / f"{key_hex}.json"\n        if not path.is_file():\n            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n        value = decode_record(_read_json(path))\n        if value.key_digest != key or value.kind != kind:\n            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n        self._business_files_read += 1\n        self._records[key] = value\n        return value\n\n'''
          replace_between(
              fs_path,
              '    def _list_indexed_records(\n',
              '    def get_alias(',
              indexed_method,
          )

          fs = fs_path.read_text(encoding='utf-8')
          old_validate = '''        if decode_items and _record_index_marker_valid(self._root):\n            expected_record_index = {_RECORD_INDEX_MARKER}\n            for record in index.records.values():\n                path = _record_index_path(record)\n                if path is None:\n                    raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n                expected_record_index.add(path)\n            actual_record_index = {\n                path.relative_to(self._root).as_posix()\n                for path in (self._root / "record-index").rglob("*")\n                if path.is_file()\n            }\n            if actual_record_index != expected_record_index:\n                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n'''
          new_validate = '''        if decode_items and _record_index_marker_valid(self._root):\n            expected_nodes = _build_record_index_nodes(tuple(index.records.values()))\n            expected_record_index = {_RECORD_INDEX_MARKER, *expected_nodes}\n            actual_record_index = {\n                path.relative_to(self._root).as_posix()\n                for path in (self._root / "record-index").rglob("*")\n                if path.is_file()\n            }\n            if actual_record_index != expected_record_index:\n                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n            for relative, expected in expected_nodes.items():\n                actual = _read_record_index_node_path(\n                    self._root / relative,\n                    expected_token=expected.token,\n                )\n                if actual != expected:\n                    raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n'''
          if old_validate not in fs:
              raise SystemExit('validate index block missing')
          fs = fs.replace(old_validate, new_validate, 1)
          fs_path.write_text(fs, encoding='utf-8')

          ensure_index = '''    def _ensure_record_index(self) -> None:\n        if _record_index_marker_valid(self._root):\n            return\n        index_root = self._root / "record-index"\n        if index_root.exists():\n            shutil.rmtree(index_root)\n            sync_directory(self._root)\n        index_root.mkdir(parents=True, exist_ok=True)\n        records: list[StoredRecord] = []\n        for source in (self._root / "records").glob("*/*/*.json"):\n            record = decode_record(_read_json(source))\n            _require_layout_path(source, self._root, _record_path(record))\n            records.append(record)\n        nodes = _build_record_index_nodes(tuple(records))\n        for relative, node in nodes.items():\n            _write_json(self._root / relative, _record_index_node_payload(node))\n        _sync_record_index_tree(index_root)\n        marker = self._root / _RECORD_INDEX_MARKER\n        _write_text(marker, _RECORD_INDEX_VERSION)\n        sync_directory(index_root)\n        sync_directory(self._root)\n\n'''
          replace_between(
              fs_path,
              '    def _ensure_record_index(self) -> None:\n',
              '    def _load_index(self) -> _FilesystemIndex:\n',
              ensure_index,
          )

          fs = fs_path.read_text(encoding='utf-8')
          provision_old = '''        marker = self._root / _RECORD_INDEX_MARKER\n        _write_text(marker, "1")\n        sync_directory(marker.parent)\n        sync_directory(self._root)\n'''
          provision_new = '''        marker = self._root / _RECORD_INDEX_MARKER\n        _write_text(marker, _RECORD_INDEX_VERSION)\n        sync_directory(marker.parent)\n        sync_directory(self._root)\n'''
          if provision_old not in fs:
              raise SystemExit('provision marker block missing')
          fs = fs.replace(provision_old, provision_new, 1)
          fs_path.write_text(fs, encoding='utf-8')

          sync_index = '''    def _sync_record_index(\n        self,\n        previous: StoredRecord | None,\n        current: StoredRecord | None,\n    ) -> None:\n        if (\n            not self._cache.record_index_complete\n            or _RECORD_INDEX_MARKER in self.deletes\n        ):\n            return\n        previous_identity = _record_index_identity(previous)\n        current_identity = _record_index_identity(current)\n        if previous_identity == current_identity:\n            return\n        if previous_identity is not None:\n            self._remove_record_index_entry(previous_identity)\n        if current_identity is not None:\n            self._add_record_index_entry(current_identity)\n\n    def _record_index_node(\n        self,\n        scope_digest: bytes,\n        token: str,\n    ) -> _RecordIndexNode | None:\n        relative = _record_index_node_path("memory", scope_digest, token)\n        if relative in self.deletes:\n            return None\n        pending = self.writes.get(relative)\n        if pending is not None:\n            return _decode_record_index_node_bytes(pending, expected_token=token)\n        return _read_record_index_node(\n            self._root,\n            "memory",\n            scope_digest,\n            token,\n        )\n\n    def _store_record_index_node(\n        self,\n        scope_digest: bytes,\n        node: _RecordIndexNode,\n    ) -> None:\n        self._write(\n            _record_index_node_path("memory", scope_digest, node.token),\n            _record_index_node_payload(node),\n        )\n\n    def _add_record_index_entry(\n        self,\n        identity: tuple[bytes, str, bytes],\n    ) -> None:\n        scope_digest, token, key_digest = identity\n        for index in range(len(token) + 1):\n            prefix = token[:index]\n            current = self._record_index_node(scope_digest, prefix)\n            if current is None:\n                current = _RecordIndexNode(prefix, ())\n            children = current.children\n            terminal = current.key_digest\n            if index < len(token):\n                child = token[index]\n                if child not in children:\n                    children = tuple(sorted((*children, child)))\n            else:\n                if terminal is not None and terminal != key_digest:\n                    raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n                terminal = key_digest\n            updated = _RecordIndexNode(prefix, children, terminal)\n            if updated != current:\n                self._store_record_index_node(scope_digest, updated)\n\n    def _remove_record_index_entry(\n        self,\n        identity: tuple[bytes, str, bytes],\n    ) -> None:\n        scope_digest, token, key_digest = identity\n        terminal = self._record_index_node(scope_digest, token)\n        if terminal is None or terminal.key_digest != key_digest:\n            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n        for index in range(len(token), -1, -1):\n            prefix = token[:index]\n            current = self._record_index_node(scope_digest, prefix)\n            if current is None:\n                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n            children = current.children\n            terminal_key = None if index == len(token) else current.key_digest\n            if index < len(token):\n                child = token[index]\n                child_node = self._record_index_node(scope_digest, token[: index + 1])\n                if child_node is None:\n                    if child not in children:\n                        raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n                    children = tuple(value for value in children if value != child)\n                elif child not in children:\n                    raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n            updated = _RecordIndexNode(prefix, children, terminal_key)\n            relative = _record_index_node_path("memory", scope_digest, prefix)\n            if updated.key_digest is None and not updated.children:\n                self._delete(relative)\n            elif updated != current:\n                self._store_record_index_node(scope_digest, updated)\n\n'''
          replace_between(
              fs_path,
              '    def _sync_record_index(\n',
              '    def _write(self, relative: str | Path, value: Mapping[str, object] | bytes) -> None:\n',
              sync_index,
          )

          helper_block = '''_RECORD_INDEX_MARKER = "record-index/complete"\n_RECORD_INDEX_VERSION = "2"\n_RECORD_INDEX_NODE_VERSION = 1\n_RECORD_SORT_SOURCE = "-./0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz"\n\n\ndef _record_sort_token(value: str | None) -> str | None:\n    if value is None or any(character not in _RECORD_SORT_SOURCE for character in value):\n        return None\n    return value\n\n\ndef _record_index_marker_valid(root: Path) -> bool:\n    marker = root / _RECORD_INDEX_MARKER\n    if not marker.exists():\n        return False\n    try:\n        value = marker.read_text(encoding="utf-8")\n    except OSError as error:\n        raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR) from error\n    if value == _RECORD_INDEX_VERSION:\n        return True\n    if value == "1":\n        return False\n    raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n\n\ndef _record_query_indexable(query: RecordQuery) -> bool:\n    after_valid = (\n        query.after_sort_key is None\n        and query.after_key_digest is None\n        or query.after_sort_key is not None\n        and query.after_key_digest is not None\n        and _record_sort_token(query.after_sort_key) is not None\n    )\n    return (\n        query.kind == "memory"\n        and query.scope_digest is not None\n        and query.partition_digest is None\n        and query.parent_digest is None\n        and query.states is None\n        and query.sort_key_prefix is not None\n        and query.limit is not None\n        and _record_sort_token(query.sort_key_prefix) is not None\n        and after_valid\n    )\n\n\ndef _record_index_identity(\n    record: StoredRecord | None,\n) -> tuple[bytes, str, bytes] | None:\n    if record is None or record.kind != "memory":\n        return None\n    token = _record_sort_token(record.sort_key)\n    if record.scope_digest is None or token is None:\n        raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n    return record.scope_digest, token, record.key_digest\n\n\ndef _record_index_node_path(\n    kind: str,\n    scope_digest: bytes,\n    token: str,\n) -> str:\n    digest = hashlib.sha256(token.encode("ascii")).hexdigest()\n    return (\n        f"record-index/{kind}/{scope_digest.hex()}/nodes/"\n        f"{digest[:2]}/{digest}.json"\n    )\n\n\ndef _record_index_node_payload(node: _RecordIndexNode) -> Mapping[str, object]:\n    return {\n        "version": _RECORD_INDEX_NODE_VERSION,\n        "token": node.token,\n        "children": list(node.children),\n        "key": None if node.key_digest is None else node.key_digest.hex(),\n    }\n\n\ndef _decode_record_index_node(\n    raw: Mapping[str, object],\n    *,\n    expected_token: str,\n) -> _RecordIndexNode:\n    _require_layout_keys(raw, frozenset({"version", "token", "children", "key"}))\n    token = raw["token"]\n    children = raw["children"]\n    key = raw["key"]\n    if (\n        raw["version"] != _RECORD_INDEX_NODE_VERSION\n        or token != expected_token\n        or not isinstance(token, str)\n        or _record_sort_token(token) != token\n        or not isinstance(children, list)\n        or any(\n            not isinstance(child, str)\n            or len(child) != 1\n            or child not in _RECORD_SORT_SOURCE\n            for child in children\n        )\n        or children != sorted(set(children))\n    ):\n        raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n    key_digest = None if key is None else _layout_digest(key)\n    return _RecordIndexNode(token, tuple(children), key_digest)\n\n\ndef _decode_record_index_node_bytes(\n    value: bytes,\n    *,\n    expected_token: str,\n) -> _RecordIndexNode:\n    try:\n        raw = json.loads(value.decode("utf-8"))\n    except (UnicodeDecodeError, json.JSONDecodeError) as error:\n        raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR) from error\n    if not isinstance(raw, Mapping):\n        raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n    return _decode_record_index_node(raw, expected_token=expected_token)\n\n\ndef _read_record_index_node_path(\n    path: Path,\n    *,\n    expected_token: str,\n) -> _RecordIndexNode:\n    try:\n        raw = _read_json(path)\n    except (OSError, TypeError, ValueError) as error:\n        raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR) from error\n    return _decode_record_index_node(raw, expected_token=expected_token)\n\n\ndef _read_record_index_node(\n    root: Path,\n    kind: str,\n    scope_digest: bytes,\n    token: str,\n) -> _RecordIndexNode | None:\n    path = root / _record_index_node_path(kind, scope_digest, token)\n    if not path.exists():\n        return None\n    return _read_record_index_node_path(path, expected_token=token)\n\n\ndef _record_index_select(\n    root: Path,\n    query: RecordQuery,\n) -> tuple[tuple[str, bytes], ...]:\n    if (\n        query.kind != "memory"\n        or query.scope_digest is None\n        or query.sort_key_prefix is None\n        or query.limit is None\n    ):\n        raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n    prefix = _record_sort_token(query.sort_key_prefix)\n    after = _record_sort_token(query.after_sort_key)\n    if prefix is None or query.after_sort_key is not None and after is None:\n        raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n    heap = [prefix]\n    selected: list[tuple[str, bytes]] = []\n    while heap and len(selected) < query.limit:\n        token = heapq.heappop(heap)\n        node = _read_record_index_node(\n            root, query.kind, query.scope_digest, token\n        )\n        if node is None:\n            if token == prefix:\n                return ()\n            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n        if node.key_digest is not None and (\n            after is None\n            or query.after_key_digest is not None\n            and (token, node.key_digest) > (after, query.after_key_digest)\n        ):\n            selected.append((token, node.key_digest))\n            if len(selected) == query.limit:\n                break\n        for child in node.children:\n            child_token = token + child\n            if (\n                after is not None\n                and child_token < after\n                and not after.startswith(child_token)\n            ):\n                continue\n            heapq.heappush(heap, child_token)\n    return tuple(selected)\n\n\ndef _build_record_index_nodes(\n    records: Sequence[StoredRecord],\n) -> dict[str, _RecordIndexNode]:\n    nodes: dict[tuple[bytes, str], _RecordIndexNode] = {}\n    for record in records:\n        identity = _record_index_identity(record)\n        if identity is None:\n            continue\n        scope_digest, token, key_digest = identity\n        for index in range(len(token) + 1):\n            prefix = token[:index]\n            identity_key = (scope_digest, prefix)\n            current = nodes.get(identity_key, _RecordIndexNode(prefix, ()))\n            children = current.children\n            terminal = current.key_digest\n            if index < len(token):\n                child = token[index]\n                if child not in children:\n                    children = tuple(sorted((*children, child)))\n            else:\n                if terminal is not None and terminal != key_digest:\n                    raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n                terminal = key_digest\n            nodes[identity_key] = _RecordIndexNode(prefix, children, terminal)\n    result: dict[str, _RecordIndexNode] = {}\n    for (scope_digest, token), node in nodes.items():\n        path = _record_index_node_path("memory", scope_digest, token)\n        if path in result and result[path] != node:\n            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n        result[path] = node\n    return result\n\n\ndef _sync_record_index_tree(root: Path) -> None:\n    if not root.exists():\n        return\n    for directory, _children, _files in os.walk(root, topdown=False):\n        sync_directory(Path(directory))\n\n\n'''
          replace_between(
              fs_path,
              '_RECORD_INDEX_MARKER = "record-index/complete"\n',
              'def _record_path(record: StoredRecord) -> str:\n',
              helper_block,
          )

          test_path = Path('tests/ai/test_memory_bounded_listing.py')
          test = test_path.read_text(encoding='utf-8')
          if 'test_list_paths_preserves_lexical_prefix' not in test:
              test += '''\n\nasync def test_list_paths_preserves_lexical_prefix() -> None:\n    records = _RecordingMemoryRepository(("memory/001.md", "memory/010.md"))\n    store = _runtime_store(records)\n\n    assert await store.list_paths("memory/0", limit=2) == [\n        "memory/001.md",\n        "memory/010.md",\n    ]\n    assert records.calls == [\n        {\n            "tenant_id": "tenant",\n            "memory_scope_digest": "scope-digest",\n            "prefix": "memory/0",\n            "cursor": None,\n            "limit": 2,\n        }\n    ]\n\n\nasync def test_list_paths_preserves_empty_prefix() -> None:\n    records = _RecordingMemoryRepository(("memory/a.md",))\n    store = _runtime_store(records)\n\n    assert await store.list_paths("", limit=1) == ["memory/a.md"]\n    assert records.calls[0]["prefix"] == ""\n\n\nasync def test_filesystem_empty_prefix_query_does_not_enumerate_scope_index(\n    tmp_path: Path,\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    from linktools.ai.runtime.state import _filesystem as filesystem\n    from linktools.ai.runtime.state._filesystem import FilesystemStateStore\n    from linktools.ai.runtime.state._plan import RuntimeDomain\n\n    root = tmp_path / "memory-prefix-trie"\n    state = FilesystemStateStore(\n        root,\n        namespace="memory-prefix-trie",\n        tenant_id="tenant",\n        runtime_domain=RuntimeDomain.MEMORY.value,\n    )\n    await state.initialize()\n    repository = MemoryRepositoryImpl(\n        state,\n        namespace="memory-prefix-trie",\n        tenant_id="tenant",\n    )\n    now = datetime.now(timezone.utc)\n    values = tuple(\n        MemoryRecord(\n            f"memory-{index}",\n            "tenant",\n            "scope-digest",\n            StoredPayload.inline_text("content"),\n            {"path": f"memory/{index:03d}.md"},\n            1,\n            now,\n            now,\n        )\n        for index in range(200)\n    )\n    await state.mutate(\n        lambda transaction: transaction.insert_records(\n            tuple(\n                repository._stored("memory", value.memory_id, value) for value in values\n            )\n        )\n    )\n    await state.close()\n\n    reopened = FilesystemStateStore(\n        root,\n        namespace="memory-prefix-trie",\n        tenant_id="tenant",\n        runtime_domain=RuntimeDomain.MEMORY.value,\n    )\n    await reopened.initialize()\n    repository = MemoryRepositoryImpl(\n        reopened,\n        namespace="memory-prefix-trie",\n        tenant_id="tenant",\n    )\n\n    original_iterdir = Path.iterdir\n\n    def guarded_iterdir(path: Path):\n        if "record-index" in path.parts:\n            raise AssertionError("bounded record-index query must not enumerate directories")\n        return original_iterdir(path)\n\n    monkeypatch.setattr(Path, "iterdir", guarded_iterdir)\n    page = await repository.list(\n        tenant_id="tenant",\n        memory_scope_digest="scope-digest",\n        prefix="",\n        cursor=None,\n        limit=1,\n    )\n    assert [value.metadata["path"] for value in page.items] == ["memory/000.md"]\n    assert page.next_cursor is not None\n\n    second = await repository.list(\n        tenant_id="tenant",\n        memory_scope_digest="scope-digest",\n        prefix="memory/0",\n        cursor=page.next_cursor,\n        limit=1,\n    )\n    assert [value.metadata["path"] for value in second.items] == ["memory/001.md"]\n    await reopened.close()\n'''
          test_path.write_text(test, encoding='utf-8')

          for path in (memory_path, repositories_path, fs_path, test_path):
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY
      - name: Install project
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Format changed Python
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACM -- '*.py')
          if ((${#files[@]})); then
            python -m ruff format "${files[@]}"
          fi
      - name: Run focused regressions
        shell: bash
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/ai/test_memory_bounded_listing.py \
            tests/ai/test_review_contract_cleanup.py \
            tests/ai/test_persistence_compatibility.py \
            tests/ai/test_runtime_storage_contracts.py
      - name: Run package gate
        shell: bash
        run: |
          python manage.py check linktools-ai
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ai-memory-prefix-repair.yml
          git add -A
          git commit -m 'fix(ai): bound memory prefix listing'
          git push origin HEAD:refactor/ai-harness-capabilities
