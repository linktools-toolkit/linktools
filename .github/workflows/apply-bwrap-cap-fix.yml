name: Apply Bubblewrap capability setup fix

on:
  push:
    branches:
      - fix/ai-native-capabilities-v4-review

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ai-native-capabilities-v4-review
      - name: Remove premature capability drop
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("linktools-ai/src/linktools/ai/workspace/_bubblewrap.py")
          text = path.read_text(encoding="utf-8")
          old = (
              '        "--as-pid-1",\n'
              '        "--cap-drop",\n'
              '        "ALL",\n'
              '        "--ro-bind",\n'
          )
          new = (
              '        "--as-pid-1",\n'
              '        "--ro-bind",\n'
          )
          if text.count(old) != 1:
              raise SystemExit("Bubblewrap capability argument shape changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit fix and remove this workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-bwrap-cap-fix.yml
          git add linktools-ai/src/linktools/ai/workspace/_bubblewrap.py
          git diff --cached --check
          git commit -m 'fix(ai): preserve bubblewrap setup capabilities'
          git push origin HEAD:fix/ai-native-capabilities-v4-review
