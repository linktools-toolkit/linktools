name: TaskGraph PR55 final verification

on:
  push:
    branches:
      - feat/ai-taskgraph-reliable-mixed-nodes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install tooling and packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U -r requirements.txt
          python manage.py install --editable
      - name: Patch verify and commit
        run: python .github/taskgraph_pr55_final_patch.py
