name: test

on:
  push:
    branches: [master, master-*]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: linktools
          MYSQL_DATABASE: linktools_ai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plinktools"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: linktools
          POSTGRES_DB: linktools_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      LINKTOOLS_AI_TEST_MYSQL_DSN: mysql+aiomysql://root:linktools@127.0.0.1:3306/linktools_ai
      LINKTOOLS_AI_TEST_POSTGRESQL_DSN: postgresql+asyncpg://postgres:linktools@127.0.0.1:5432/linktools_ai

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The linktools-ai wheel is intentionally driver-neutral (a deployment
          # brings its own DB driver); CI installs the SQLite/MySQL/PostgreSQL
          # drivers directly so the dialect contracts parametrize over all three.
          pip install \
            ./linktools \
            "./linktools-ai[test]" \
            ./linktools-ai-testing \
            -e ./tests/external_adapter \
            aiosqlite aiomysql asyncpg

      - name: Run the suite (all three dialects via the DSN env vars above)
        run: |
          python -m pytest tests/ai tests/external_adapter -q

  tools-and-cntr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install core packages and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest build pyyaml ./linktools ./linktools-common ./linktools-mobile ./linktools-cntr
      - name: Core, CLI, and container tests
        run: |
          python -m pytest tests/core -q
          python -m pytest tests/cli -q
          python -m pytest tests/common -q
          python -m pytest tests/system -q
          python -m pytest \
            tests/cntr/test_plan.py \
            tests/cntr/test_plan_doctor_readonly.py \
            tests/cntr/test_cli_routing.py \
            tests/cntr/test_command_order.py -q
      - name: Real CLI smoke tests
        run: |
          python -m linktools.cli.env alias --reload
          python -m linktools.cli.env java
          python -m linktools.cli.env java 17.0.11
      - name: Build wheels and check resource paths
        run: |
          python -m build linktools linktools-common linktools-mobile --wheel
          python scripts/verify_tools_wheels.py linktools/dist linktools-common/dist linktools-mobile/dist

  tools-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install core package
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml filelock psutil ./linktools
      - name: Benchmark baseline and current CLI
        run: |
          git worktree add --detach /tmp/linktools-baseline HEAD^
          python scripts/benchmark_tools_cli.py --baseline-root /tmp/linktools-baseline --output tools-performance.json | tee tools-performance.log
      - name: Upload performance evidence
        uses: actions/upload-artifact@v4
        with:
          name: tools-performance
          path: |
            tools-performance.json
            tools-performance.log
