name: Temporary AI static repair

on:
  push:
    branches:
      - refactor/ai-harness-capabilities

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/ai-harness-capabilities
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Fetch master reference
        run: git fetch origin master --depth=1
      - name: Apply exact repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'linktools-ai/src/linktools/ai/capability/_workspace.py',
              'WORKSPACE_FILESYSTEM_TOOL_NAMES = (\n    "create_directory",',
              '_BASE_WORKSPACE_FILESYSTEM_TOOL_NAMES = (\n    "create_directory",',
          )
          replace_once(
              'linktools-ai/src/linktools/ai/capability/__init__.py',
              'from ._workspace import (\n    WORKSPACE_SHELL_TOOL_NAMES,\n',
              'from ._workspace import (\n    WORKSPACE_FILESYSTEM_READ_TOOL_NAMES,\n    WORKSPACE_FILESYSTEM_TOOL_NAMES,\n    WORKSPACE_SHELL_TOOL_NAMES,\n',
          )
          replace_once(
              'linktools-ai/src/linktools/ai/capability/__init__.py',
              'from .workspace import (\n    WORKSPACE_FILESYSTEM_READ_TOOL_NAMES,\n    WORKSPACE_FILESYSTEM_TOOL_NAMES,\n)\n\n',
              '',
          )
          Path('linktools-ai/src/linktools/ai/capability/workspace.py').unlink()

          agent_path = 'linktools-ai/src/linktools/ai/runtime/_agent_executor.py'
          replace_once(
              agent_path,
              '    NodeResult,\n    ReinjectSystemPrompt,\n)',
              '    NodeResult,\n    ReinjectSystemPrompt,\n    WrapperCapability,\n)',
          )
          replace_once(
              agent_path,
              'from pydantic_ai.usage import RunUsage, UsageLimitExceeded, UsageLimits\n',
              'from pydantic_ai.usage import RunUsage, UsageLimitExceeded, UsageLimits\nfrom pydantic_ai_harness.step_persistence import StepPersistence\n',
          )
          replace_once(
              agent_path,
              'from ._input import _RuntimeUserPrompt, _restore_user_prompt\n',
              'from ._input import CanonicalUserInput\n',
          )
          replace_once(
              agent_path,
              'from ._plan import RuntimePlanStore\nfrom .state import StepStore\n',
              'from ._plan import RuntimePlanStore\nfrom ._workspace_binding import WorkspaceToolCallBinder\nfrom .state import StepStore\n',
          )
          master_agent = subprocess.check_output(
              ['git', 'show', 'origin/master:linktools-ai/src/linktools/ai/runtime/_agent_executor.py'],
              text=True,
          )
          start = master_agent.index('class _RuntimePersistenceBoundary')
          end = master_agent.index('\n\nclass _ToolPresentation', start)
          boundary = master_agent[start:end]
          agent_file = Path(agent_path)
          agent_text = agent_file.read_text(encoding='utf-8')
          if 'class _RuntimePersistenceBoundary' in agent_text:
              raise SystemExit('runtime persistence boundary unexpectedly already exists')
          marker = 'class _ToolPresentation(AbstractCapability[AgentContext[object]]):'
          if agent_text.count(marker) != 1:
              raise SystemExit('tool presentation marker is not unique')
          agent_file.write_text(
              agent_text.replace(marker, boundary + '\n\n\n' + marker, 1),
              encoding='utf-8',
          )
          replace_once(
              agent_path,
              '            metrics=self._metrics,\n            model_journal=model_journal,\n',
              '            metrics=self._metrics,\n            workspace_binder=self._workspace_binder,\n            workspace_path_fields=workspace_path_fields,\n            model_journal=model_journal,\n',
          )
          replace_once(
              agent_path,
              '    deferred_pause_sink: Callable[[int], None],\n    metrics: MetricRecorder | None,\n    model_journal: ModelRequestJournal,\n',
              '    deferred_pause_sink: Callable[[int], None],\n    metrics: MetricRecorder | None,\n    workspace_binder: WorkspaceToolCallBinder | None,\n    workspace_path_fields: Callable[[], Mapping[str, tuple[str, ...]]],\n    model_journal: ModelRequestJournal,\n',
          )
          replace_once(
              agent_path,
              '    capabilities.extend(cast("tuple[AbstractCapability[AgentContext[object]], ...]", platform))\n',
              '''    platform = tuple(\n        _RuntimePersistenceBoundary(\n            capability,\n            workspace_binder=workspace_binder,\n            execution_id=scope.context.execution_id,\n            step_run_id=scope.step_run_id,\n            path_fields_provider=workspace_path_fields,\n        )\n        if isinstance(capability, StepPersistence)\n        else capability\n        for capability in platform\n    )\n    capabilities.extend(cast("tuple[AbstractCapability[AgentContext[object]], ...]", platform))\n''',
          )

          replace_once(
              'linktools-ai/src/linktools/ai/runtime/_execution.py',
              '    ResultRecord,\n    RuntimeDomain,\n    SessionRepository,\n',
              '    ResultRecord,\n    RuntimeDomain,\n    RuntimeStorageContract,\n    SessionRepository,\n',
          )
          replace_once(
              'linktools-ai/src/linktools/ai/runtime/_local.py',
              '    ResultRecord,\n    RuntimeDomain,\n    RuntimeStateCommands,\n',
              '    ResultRecord,\n    RuntimeDomain,\n    RuntimeStorageContract,\n    RuntimeStateCommands,\n',
          )
          replace_once(
              'linktools-ai/src/linktools/ai/runtime/_local.py',
              '    ToolRepositoryImpl,\n    ToolOperationRecord,\n)\n',
              '    ToolRepositoryImpl,\n    ToolOperationRecord,\n    WorkspaceToolCallBindingStore,\n)\n',
          )
          replace_once(
              'linktools-ai/src/linktools/ai/runtime/_tool.py',
              '    ToolOperationAdmission,\n    ToolOperationRecord,\n    run_durable_commit,\n',
              '    ToolOperationAdmission,\n    ToolOperationRecord,\n    WorkspaceToolCallBinding,\n    WorkspaceToolCallBindingStore,\n    run_durable_commit,\n',
          )

          replace_once(
              'linktools-ai/src/linktools/ai/workspace/__init__.py',
              '    SandboxResource,\n    SandboxSession,\n)\n',
              '    SandboxResource,\n    SandboxSession,\n    normalize_workspace_path as normalize_workspace_input_path,\n)\n',
          )
          replace_once(
              'linktools-ai/src/linktools/ai/workspace/__init__.py',
              '    "normalize_workspace_path",\n    "trusted_workspace_principal",\n',
              '    "normalize_workspace_input_path",\n    "normalize_workspace_path",\n    "trusted_workspace_principal",\n',
          )
          replace_once(
              'linktools-ai/src/linktools/ai/runtime/_capabilities_native.py',
              '    WorkspacePolicy,\n    normalize_workspace_path,\n)',
              '    WorkspacePolicy,\n    normalize_workspace_input_path,\n)',
          )
          replace_once(
              'linktools-ai/src/linktools/ai/runtime/_capabilities_native.py',
              '    normalized = normalize_workspace_path(target)\n',
              '    normalized = normalize_workspace_input_path(target)\n',
          )

          replace_once(
              'linktools-ai/src/linktools/ai/workspace/_local_sandbox.py',
              '        return frozenset(values)\n\n    async def read_file(\n',
              '''        return frozenset(values)\n\n    async def canonicalize_path(self, path: str) -> str:\n        normalized = _normalize_path(path)\n\n        def operation() -> str:\n            target = self._resolve_path(normalized, allow_missing=True)\n            return _relative(self._root, target)\n\n        return await self._run_sync(operation)\n\n    async def read_bytes(\n        self,\n        path: str,\n        *,\n        max_bytes: int | None = None,\n    ) -> bytes:\n        normalized = _normalize_path(path)\n        if max_bytes is not None and (\n            not isinstance(max_bytes, int)\n            or isinstance(max_bytes, bool)\n            or max_bytes < 0\n        ):\n            raise AIError(ErrorCode.REQUEST_FIELD_INVALID)\n\n        def operation() -> bytes:\n            target = self._file_path(normalized, write=False)\n            try:\n                info = target.stat()\n                if not stat.S_ISREG(info.st_mode):\n                    raise AIError(ErrorCode.REQUEST_FIELD_INVALID)\n                if max_bytes is not None and info.st_size > max_bytes:\n                    raise AIError(ErrorCode.REQUEST_FIELD_INVALID)\n                return target.read_bytes()\n            except AIError:\n                raise\n            except FileNotFoundError as error:\n                raise AIError(ErrorCode.STORAGE_NOT_FOUND) from error\n            except OSError as error:\n                raise AIError(ErrorCode.STORAGE_UNAVAILABLE) from error\n\n        return await self._run_sync(operation)\n\n    async def read_file(\n''',
          )

          replace_once(
              'tests/ai/test_runtime_approval_recovery.py',
              'from linktools.ai.spec import AgentSpec\n',
              'from linktools.ai.spec import AgentSpec\nfrom linktools.ai.storage import StoredPayload\n',
          )
          replace_once(
              'tests/ai/test_spec_capability_refactor.py',
              'from linktools.ai.runtime._agent_executor import _ToolPresentation\n',
              'from linktools.ai.runtime._agent_executor import _RuntimePersistenceBoundary, _ToolPresentation\n',
          )
          replace_once(
              'tests/ai/test_spec_capability_refactor.py',
              'from pydantic_ai.toolsets import FunctionToolset, PreparedToolset, RenamedToolset\n',
              'from pydantic_ai.toolsets import FunctionToolset, PreparedToolset, RenamedToolset\nfrom pydantic_ai_harness.step_persistence import StepPersistence\n',
          )
          PY
      - name: Install tooling
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Validate linktools-ai
        run: python manage.py check linktools-ai
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A linktools-ai/src/linktools/ai/capability \
                     linktools-ai/src/linktools/ai/runtime/_agent_executor.py \
                     linktools-ai/src/linktools/ai/runtime/_capabilities_native.py \
                     linktools-ai/src/linktools/ai/runtime/_execution.py \
                     linktools-ai/src/linktools/ai/runtime/_local.py \
                     linktools-ai/src/linktools/ai/runtime/_tool.py \
                     linktools-ai/src/linktools/ai/workspace \
                     tests/ai/test_runtime_approval_recovery.py \
                     tests/ai/test_spec_capability_refactor.py
          git diff --cached --check
          git commit -m 'fix(ai): restore merged runtime contracts'
          git push origin HEAD:refactor/ai-harness-capabilities
