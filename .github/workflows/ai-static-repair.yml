          +        request_sequence = self._model_request_tokens.pop(ctx.run_step, None)
          +        if request_sequence is None:
          +            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)
                   try:
          -            fact = self.model_journal.current(ctx.run_step)
          -        except RuntimeError:
          -            return None
