          -                raise ValueError("a step cannot have two active request purposes")
          -            return current
                   sequence = self._next_sequence
                   self._next_sequence += 1
                   fact = ModelRequestFact(
          @@ -81,17 +75,17 @@ class ModelRequestJournal:
