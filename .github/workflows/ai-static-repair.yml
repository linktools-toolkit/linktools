name: Temporary AI static repair

on:
  push:
    branches:
      - refactor/ai-harness-capabilities

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/ai-harness-capabilities
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Apply F5 request identity repair
        shell: bash
        run: |
          cat > /tmp/f5.patch <<'PATCH'
          diff --git a/linktools-ai/src/linktools/ai/runtime/_journal.py b/linktools-ai/src/linktools/ai/runtime/_journal.py
