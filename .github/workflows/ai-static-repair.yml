          diff --git a/tests/ai/test_compaction_harness_observability.py b/tests/ai/test_compaction_harness_observability.py
          --- a/tests/ai/test_compaction_harness_observability.py
          +++ b/tests/ai/test_compaction_harness_observability.py
          @@ -80,4 +80,24 @@ async def test_harness_summary_request_uses_runtime_journal_and_observer() -> No
                   assert len(request_context.messages) < len(messages)
                   with pytest.raises(RuntimeError, match="missing"):
          -        journal.current(ctx.run_step)
          +        journal.current(observed[-1][1].request_sequence)
          +
          +
          +def test_journal_keeps_agent_and_compaction_requests_distinct_on_same_step() -> None:
          +    journal = ModelRequestJournal(
          +        source_namespace="workspace",
          +        tenant_id="tenant",
          +        execution_id="execution",
          +        step_run_id="run",
          +    )
          +    agent = journal.begin(3, purpose="agent")
          +    compaction = journal.begin(3, purpose="compaction")
          +
          +    assert agent.request_sequence != compaction.request_sequence
          +    assert agent.observation_id != compaction.observation_id
          +    journal.finish(compaction.request_sequence, status="SUCCEEDED")
          +    assert journal.consume(compaction.request_sequence).purpose == "compaction"
          +    assert journal.current(agent.request_sequence) == agent
          +    journal.finish(agent.request_sequence, status="SUCCEEDED")
          +    assert journal.consume(agent.request_sequence).purpose == "agent"
          PATCH
          git apply --check /tmp/f5.patch
          git apply /tmp/f5.patch
      - name: Install tooling
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Validate F5
        shell: bash
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/ai/test_compaction_harness_observability.py \
            tests/ai/test_model_metric_trace_link.py \
            tests/ai/test_model_usage_trace.py
          python manage.py check linktools-ai
      - name: Commit F5
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add linktools-ai/src/linktools/ai/runtime/_journal.py \
                  linktools-ai/src/linktools/ai/runtime/_compaction.py \
                  linktools-ai/src/linktools/ai/runtime/_metric_capability.py \
                  linktools-ai/src/linktools/ai/runtime/_capabilities.py \
                  tests/ai/test_compaction_harness_observability.py
          git diff --cached --check
          git commit -m 'fix(ai): isolate model request journal identities'
          git push origin HEAD:refactor/ai-harness-capabilities
