name: Temporary AI memory repair

on:
  push:
    branches:
      - refactor/ai-harness-capabilities

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/ai-harness-capabilities
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Push memory prefix into StateStore queries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, *, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          memory = Path('linktools-ai/src/linktools/ai/runtime/_memory.py')
          text = memory.read_text(encoding='utf-8')
          text = text.replace('_MAX_LIST_SCAN_RECORDS = 10_000\n', '')
          start = text.index('    async def list_paths(self, prefix: str = "", *, limit: int) -> list[str]:\n')
          end = text.index('    async def _get_receipt(\n', start)
          text = text[:start] + '''    async def list_paths(self, prefix: str = "", *, limit: int) -> list[str]:\n        normalized_prefix = _normalize_prefix(prefix)\n        if not isinstance(limit, int) or isinstance(limit, bool) or limit <= 0:\n            raise ValueError("limit must be positive")\n        page = await self._state.records.list(\n            tenant_id=self._tenant_id,\n            memory_scope_digest=self._memory_scope_digest,\n            prefix=normalized_prefix,\n            cursor=None,\n            limit=limit,\n        )\n        paths = _record_paths(list(page.items))\n        if any(not path.startswith(normalized_prefix) for path in paths):\n            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n        return paths\n\n''' + text[end:]
          start = text.index('    async def _list_records(\n')
          end = text.index('    async def _record(\n', start)
          text = text[:start] + text[end:]
          if '_MAX_LIST_SCAN_RECORDS' in text or '_list_records(' in text:
              raise SystemExit('legacy memory listing scan remains')
          memory.write_text(text, encoding='utf-8')

          replace_exact(
              'linktools-ai/src/linktools/ai/runtime/state/_contracts.py',
              '''        memory_scope_digest: str,\n        cursor: str | None,\n        limit: int,\n    ) -> Page[MemoryRecord]: ...\n''',
              '''        memory_scope_digest: str,\n        prefix: str,\n        cursor: str | None,\n        limit: int,\n    ) -> Page[MemoryRecord]: ...\n''',
          )

          repositories = 'linktools-ai/src/linktools/ai/runtime/state/_repositories.py'
          replace_exact(
              repositories,
              '''        states: frozenset[str] | None = None,\n        cursor: str | None = None,\n''',
              '''        states: frozenset[str] | None = None,\n        sort_key_prefix: str | None = None,\n        cursor: str | None = None,\n''',
          )
          replace_exact(
              repositories,
              '''                    kind=kind,\n                    states=states,\n                    after_sort_key=''',
              '''                    kind=kind,\n                    states=states,\n                    sort_key_prefix=sort_key_prefix,\n                    after_sort_key=''',
              expected=2,
          )
          replace_exact(
              repositories,
              '''        memory_scope_digest: str,\n        cursor: str | None,\n        limit: int,\n    ) -> Page[MemoryRecord]:\n''',
              '''        memory_scope_digest: str,\n        prefix: str,\n        cursor: str | None,\n        limit: int,\n    ) -> Page[MemoryRecord]:\n''',
          )
          replace_exact(
              repositories,
              '''            "memory",\n            scope=self._scope("memory", "memory_scope", memory_scope_digest),\n            cursor=cursor,\n            limit=limit + 1,\n''',
              '''            "memory",\n            scope=self._scope("memory", "memory_scope", memory_scope_digest),\n            sort_key_prefix=prefix or None,\n            cursor=cursor,\n            limit=limit + 1,\n''',
          )

          store = 'linktools-ai/src/linktools/ai/runtime/state/_store.py'
          replace_exact(
              store,
              '''    kind: str | None = None\n    states: frozenset[str] | None = None\n    after_sort_key: str | None = None\n''',
              '''    kind: str | None = None\n    states: frozenset[str] | None = None\n    sort_key_prefix: str | None = None\n    after_sort_key: str | None = None\n''',
          )
          replace_exact(
              store,
              '''            raise ValueError("record kind contains a path separator")\n        if (self.after_sort_key is None) != (self.after_key_digest is None):\n''',
              '''            raise ValueError("record kind contains a path separator")\n        if self.sort_key_prefix is not None and (\n            not isinstance(self.sort_key_prefix, str)\n            or not self.sort_key_prefix\n            or len(self.sort_key_prefix) > 128\n            or not self.sort_key_prefix.isascii()\n        ):\n            raise ValueError("record sort key prefix must contain 1..128 ASCII characters")\n        if (self.after_sort_key is None) != (self.after_key_digest is None):\n''',
          )

          state_memory = 'linktools-ai/src/linktools/ai/runtime/state/_memory.py'
          replace_exact(
              state_memory,
              '''    if query.kind is not None and record.kind != query.kind:\n        return False\n    return query.states is None or record.state in query.states\n''',
              '''    if query.kind is not None and record.kind != query.kind:\n        return False\n    if query.sort_key_prefix is not None and not record.sort_key.startswith(\n        query.sort_key_prefix\n    ):\n        return False\n    return query.states is None or record.state in query.states\n''',
          )

          filesystem = 'linktools-ai/src/linktools/ai/runtime/state/_filesystem.py'
          replace_exact(
              filesystem,
              '''    parent_digest: bytes | None\n    states: frozenset[str] | None\n''',
              '''    parent_digest: bytes | None\n    states: frozenset[str] | None\n    sort_key_prefix: str | None\n''',
          )
          replace_exact(
              filesystem,
              '''            query.parent_digest,\n            query.states,\n        )\n''',
              '''            query.parent_digest,\n            query.states,\n            query.sort_key_prefix,\n        )\n''',
          )
          replace_exact(
              filesystem,
              '''        and (query.kind is None or record.kind == query.kind)\n        and (query.states is None or record.state in query.states)\n''',
              '''        and (query.kind is None or record.kind == query.kind)\n        and (\n            query.sort_key_prefix is None\n            or record.sort_key.startswith(query.sort_key_prefix)\n        )\n        and (query.states is None or record.state in query.states)\n''',
          )

          sql = 'linktools-ai/src/linktools/ai/runtime/state/_sql.py'
          replace_exact(
              sql,
              '''        if query.states is not None:\n            conditions.append(table.c.state.in_(tuple(query.states)))\n        if query.after_sort_key is not None and query.after_key_digest is not None:\n''',
              '''        if query.states is not None:\n            conditions.append(table.c.state.in_(tuple(query.states)))\n        if query.sort_key_prefix is not None:\n            conditions.append(\n                table.c.sort_key.startswith(query.sort_key_prefix, autoescape=True)\n            )\n        if query.after_sort_key is not None and query.after_key_digest is not None:\n''',
          )

          Path('tests/ai/test_memory_bounded_listing.py').write_text('''#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\n"""Runtime memory listing must keep prefix queries bounded at the repository."""\n\nfrom datetime import datetime, timezone\nfrom types import SimpleNamespace\nfrom typing import Any\n\nimport pytest\n\nfrom linktools.ai.errors import AIError, ErrorCode\nfrom linktools.ai.runtime._memory import RuntimeMemoryStore\nfrom linktools.ai.runtime.state._contracts import MemoryRecord\nfrom linktools.ai.runtime.state._memory import MemoryStateStorageGroup, MemoryStateStore\nfrom linktools.ai.runtime.state._repositories import MemoryRepositoryImpl\nfrom linktools.ai.storage import StoredPayload\n\npytestmark = pytest.mark.asyncio\n\n\nclass _RecordingMemoryRepository:\n    def __init__(self, paths: tuple[str, ...]) -> None:\n        self._paths = paths\n        self.calls: list[dict[str, Any]] = []\n\n    async def list(self, **kwargs: Any) -> Any:\n        self.calls.append(dict(kwargs))\n        limit = kwargs["limit"]\n        return SimpleNamespace(\n            items=tuple(\n                SimpleNamespace(metadata={"path": path})\n                for path in self._paths[:limit]\n            ),\n            next_cursor=None,\n        )\n\n\ndef _runtime_store(records: _RecordingMemoryRepository) -> RuntimeMemoryStore:\n    store = object.__new__(RuntimeMemoryStore)\n    store._state = SimpleNamespace(records=records)\n    store._tenant_id = "tenant"\n    store._memory_scope_digest = "scope-digest"\n    return store\n\n\nasync def test_list_paths_pushes_prefix_and_limit_to_repository_once() -> None:\n    records = _RecordingMemoryRepository(("memory/a.md",))\n    store = _runtime_store(records)\n\n    assert await store.list_paths("memory", limit=10) == ["memory/a.md"]\n    assert records.calls == [\n        {\n            "tenant_id": "tenant",\n            "memory_scope_digest": "scope-digest",\n            "prefix": "memory/",\n            "cursor": None,\n            "limit": 10,\n        }\n    ]\n\n\nasync def test_list_paths_fails_closed_if_repository_breaks_prefix_contract() -> None:\n    records = _RecordingMemoryRepository(("archive/a.md",))\n    store = _runtime_store(records)\n\n    with pytest.raises(AIError) as raised:\n        await store.list_paths("memory", limit=10)\n\n    assert raised.value.code is ErrorCode.STORAGE_INTEGRITY_ERROR\n    assert len(records.calls) == 1\n\n\nasync def test_memory_repository_projects_logical_path_as_sort_key() -> None:\n    repository = MemoryRepositoryImpl(\n        MemoryStateStore(MemoryStateStorageGroup()),\n        namespace="memory-ordering",\n        tenant_id="tenant",\n    )\n    now = datetime.now(timezone.utc)\n    value = MemoryRecord(\n        "memory-id",\n        "tenant",\n        "scope-digest",\n        StoredPayload.inline_text("content"),\n        {"path": "memory/z.md"},\n        1,\n        now,\n        now,\n    )\n\n    stored = repository._stored("memory", value.memory_id, value)\n\n    assert stored.sort_key == "memory/z.md"\n\n\nasync def test_memory_repository_applies_prefix_before_limit() -> None:\n    state = MemoryStateStore(MemoryStateStorageGroup())\n    await state.initialize()\n    try:\n        repository = MemoryRepositoryImpl(\n            state,\n            namespace="memory-prefix",\n            tenant_id="tenant",\n        )\n        now = datetime.now(timezone.utc)\n        values = tuple(\n            MemoryRecord(\n                memory_id,\n                "tenant",\n                "scope-digest",\n                StoredPayload.inline_text("content"),\n                {"path": path},\n                1,\n                now,\n                now,\n            )\n            for memory_id, path in (\n                ("archive-a", "archive/a.md"),\n                ("memory-a", "memory/a.md"),\n                ("memory-b", "memory/b.md"),\n            )\n        )\n        stored = tuple(\n            repository._stored("memory", value.memory_id, value)\n            for value in values\n        )\n        await state.mutate(lambda transaction: transaction.insert_records(stored))\n\n        first = await repository.list(\n            tenant_id="tenant",\n            memory_scope_digest="scope-digest",\n            prefix="memory/",\n            cursor=None,\n            limit=1,\n        )\n        assert [value.metadata["path"] for value in first.items] == ["memory/a.md"]\n        assert first.next_cursor is not None\n\n        second = await repository.list(\n            tenant_id="tenant",\n            memory_scope_digest="scope-digest",\n            prefix="memory/",\n            cursor=first.next_cursor,\n            limit=10,\n        )\n        assert [value.metadata["path"] for value in second.items] == ["memory/b.md"]\n    finally:\n        await state.close()\n''', encoding='utf-8')
          PY
      - name: Install tooling
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Validate bounded memory listing
        shell: bash
        run: |
          python -m pytest -q -p no:cacheprovider tests/ai/test_memory_bounded_listing.py
          python manage.py check linktools-ai
      - name: Commit bounded memory listing
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add linktools-ai/src/linktools/ai/runtime/_memory.py \
                  linktools-ai/src/linktools/ai/runtime/state/_contracts.py \
                  linktools-ai/src/linktools/ai/runtime/state/_repositories.py \
                  linktools-ai/src/linktools/ai/runtime/state/_store.py \
                  linktools-ai/src/linktools/ai/runtime/state/_memory.py \
                  linktools-ai/src/linktools/ai/runtime/state/_filesystem.py \
                  linktools-ai/src/linktools/ai/runtime/state/_sql.py \
                  tests/ai/test_memory_bounded_listing.py
          git diff --cached --check
          git commit -m 'fix(ai): bound memory prefix listing'
          git push origin HEAD:refactor/ai-harness-capabilities
