name: Temporary AI static repair

on:
  push:
    branches:
      - refactor/ai-harness-capabilities

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/ai-harness-capabilities
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Apply F5 request identity repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          journal = 'linktools-ai/src/linktools/ai/runtime/_journal.py'
          replace_once(
              journal,
              '''        current = self._facts.get(step_index)\n        if current is not None and current.duration_ns is None:\n            if current.purpose != purpose:\n                raise ValueError("a step cannot have two active request purposes")\n            return current\n        sequence = self._next_sequence\n''',
              '''        sequence = self._next_sequence\n''',
          )
          replace_once(
              journal,
              '        self._facts[step_index] = fact\n        return fact\n\n    def finish(\n        self,\n        step_index: int,\n',
              '        self._facts[sequence] = fact\n        return fact\n\n    def finish(\n        self,\n        request_sequence: int,\n',
          )
          replace_once(
              journal,
              '''        fact = self._facts.get(step_index)\n        if fact is None:\n            raise RuntimeError("model request fact is missing")\n''',
              '''        fact = self._facts.get(request_sequence)\n        if fact is None:\n            raise RuntimeError("model request fact is missing")\n''',
          )
          replace_once(
              journal,
              '''        self._facts[step_index] = return_value\n        return return_value\n\n    def current(self, step_index: int) -> ModelRequestFact:\n        try:\n            return self._facts[step_index]\n        except KeyError as error:\n            raise RuntimeError("model request fact is missing") from error\n\n    def consume(self, step_index: int) -> ModelRequestFact:\n        try:\n            return self._facts.pop(step_index)\n''',
              '''        self._facts[request_sequence] = return_value\n        return return_value\n\n    def current(self, request_sequence: int) -> ModelRequestFact:\n        try:\n            return self._facts[request_sequence]\n        except KeyError as error:\n            raise RuntimeError("model request fact is missing") from error\n\n    def consume(self, request_sequence: int) -> ModelRequestFact:\n        try:\n            return self._facts.pop(request_sequence)\n''',
          )

          compaction = 'linktools-ai/src/linktools/ai/runtime/_compaction.py'
          replace_once(
              compaction,
              '''        step_index = self._ctx.run_step\n        fact = self._journal.begin(step_index, purpose="compaction")\n        await self._observer(self._ctx, fact, "started", None, None)\n''',
              '''        fact = self._journal.begin(self._ctx.run_step, purpose="compaction")\n        request_sequence = fact.request_sequence\n        await self._observer(self._ctx, fact, "started", None, None)\n''',
          )
          for status in ('CANCELLED', 'FAILED', 'SUCCEEDED'):
              replace_once(
                  compaction,
                  f'            fact = self._journal.finish(step_index, status="{status}")\n            self._journal.consume(step_index)\n' if status != 'SUCCEEDED' else f'        fact = self._journal.finish(step_index, status="{status}")\n        self._journal.consume(step_index)\n',
                  f'            fact = self._journal.finish(request_sequence, status="{status}")\n            self._journal.consume(request_sequence)\n' if status != 'SUCCEEDED' else f'        fact = self._journal.finish(request_sequence, status="{status}")\n        self._journal.consume(request_sequence)\n',
              )

          metrics = 'linktools-ai/src/linktools/ai/runtime/_metric_capability.py'
          replace_once(
              metrics,
              '''        fact = self._journal.begin(step_index, purpose="agent")\n        try:\n''',
              '''        fact = self._journal.begin(step_index, purpose="agent")\n        request_sequence = fact.request_sequence\n        try:\n''',
          )
          replace_once(
              metrics,
              '''            fact = self._journal.finish(step_index, status="CANCELLED")\n            self._record_model(\n''',
              '''            fact = self._journal.finish(request_sequence, status="CANCELLED")\n            self._journal.consume(request_sequence)\n            self._record_model(\n''',
          )
          replace_once(
              metrics,
              '''            fact = self._journal.finish(step_index, status="CANCELLED")\n            self._record_model(\n''',
              '''            fact = self._journal.finish(request_sequence, status="CANCELLED")\n            self._journal.consume(request_sequence)\n            self._record_model(\n''',
          )
          replace_once(
              metrics,
              '''            fact = self._journal.finish(step_index, status="FAILED")\n            self._record_model(\n''',
              '''            fact = self._journal.finish(request_sequence, status="FAILED")\n            self._journal.consume(request_sequence)\n            self._record_model(\n''',
          )
          replace_once(
              metrics,
              '''        fact = self._journal.finish(step_index, status="SUCCEEDED")\n        self._record_model(\n''',
              '''        fact = self._journal.finish(request_sequence, status="SUCCEEDED")\n        self._journal.consume(request_sequence)\n        self._record_model(\n''',
          )

          capabilities = 'linktools-ai/src/linktools/ai/runtime/_capabilities.py'
          replace_once(
              capabilities,
              '''    _last_observed_step_index: int | None = field(\n        default=None,\n        init=False,\n        repr=False,\n        compare=False,\n    )\n''',
              '''    _last_observed_step_index: int | None = field(\n        default=None,\n        init=False,\n        repr=False,\n        compare=False,\n    )\n    _model_request_tokens: dict[int, int] = field(\n        default_factory=dict,\n        init=False,\n        repr=False,\n        compare=False,\n    )\n''',
          )
          replace_once(
              capabilities,
              '''        fact = (\n            None\n            if self.model_journal is None\n            else self.model_journal.begin(ctx.run_step, purpose="agent")\n        )\n''',
              '''        fact = None\n        request_sequence: int | None = None\n        if self.model_journal is not None:\n            if ctx.run_step in self._model_request_tokens:\n                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n            fact = self.model_journal.begin(ctx.run_step, purpose="agent")\n            request_sequence = fact.request_sequence\n            self._model_request_tokens[ctx.run_step] = request_sequence\n''',
          )
          replace_once(
              capabilities,
              '''            if self.model_journal is None:\n                raise\n            self.model_journal.finish(ctx.run_step, status="CANCELLED")\n            fact = self.model_journal.consume(ctx.run_step)\n            await self._harness_cancelled_model_request(\n''',
              '''            if self.model_journal is None or request_sequence is None:\n                raise\n            self.model_journal.finish(request_sequence, status="CANCELLED")\n            fact = self.model_journal.consume(request_sequence)\n            if self._model_request_tokens.pop(ctx.run_step, None) != request_sequence:\n                raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR) from error\n            await self._harness_cancelled_model_request(\n''',
          )
          replace_once(
              capabilities,
              '''        except RunCancelled:\n            if self.model_journal is not None:\n                self.model_journal.finish(ctx.run_step, status="CANCELLED")\n            raise\n        except BaseException:\n            if self.model_journal is not None:\n                self.model_journal.finish(ctx.run_step, status="FAILED")\n            raise\n        if self.model_journal is not None:\n            self.model_journal.finish(ctx.run_step, status="SUCCEEDED")\n''',
              '''        except RunCancelled:\n            if self.model_journal is not None and request_sequence is not None:\n                self.model_journal.finish(request_sequence, status="CANCELLED")\n            raise\n        except BaseException:\n            if self.model_journal is not None and request_sequence is not None:\n                self.model_journal.finish(request_sequence, status="FAILED")\n            raise\n        if self.model_journal is not None and request_sequence is not None:\n            self.model_journal.finish(request_sequence, status="SUCCEEDED")\n''',
          )
          replace_once(
              capabilities,
              '''        if self.model_journal is None:\n            return None\n        try:\n            fact = self.model_journal.current(ctx.run_step)\n        except RuntimeError:\n            return None\n        if fact.duration_ns is None:\n            self.model_journal.finish(ctx.run_step, status=status)\n        return self.model_journal.consume(ctx.run_step)\n''',
              '''        if self.model_journal is None:\n            return None\n        request_sequence = self._model_request_tokens.pop(ctx.run_step, None)\n        if request_sequence is None:\n            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n        try:\n            fact = self.model_journal.current(request_sequence)\n        except RuntimeError as error:\n            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR) from error\n        if fact.duration_ns is None:\n            self.model_journal.finish(request_sequence, status=status)\n        return self.model_journal.consume(request_sequence)\n''',
          )

          test = 'tests/ai/test_compaction_harness_observability.py'
          replace_once(
              test,
              '''    with pytest.raises(RuntimeError, match="missing"):\n        journal.current(ctx.run_step)\n''',
              '''    with pytest.raises(RuntimeError, match="missing"):\n        journal.current(observed[-1][1].request_sequence)\n\n\ndef test_journal_keeps_agent_and_compaction_requests_distinct_on_same_step() -> None:\n    journal = ModelRequestJournal(\n        source_namespace="workspace",\n        tenant_id="tenant",\n        execution_id="execution",\n        step_run_id="run",\n    )\n    agent = journal.begin(3, purpose="agent")\n    compaction = journal.begin(3, purpose="compaction")\n\n    assert agent.request_sequence != compaction.request_sequence\n    assert agent.observation_id != compaction.observation_id\n    journal.finish(compaction.request_sequence, status="SUCCEEDED")\n    assert journal.consume(compaction.request_sequence).purpose == "compaction"\n    assert journal.current(agent.request_sequence) == agent\n    journal.finish(agent.request_sequence, status="SUCCEEDED")\n    assert journal.consume(agent.request_sequence).purpose == "agent"\n''',
          )
          PY
      - name: Install tooling
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Validate F5
        shell: bash
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/ai/test_compaction_harness_observability.py \
            tests/ai/test_model_metric_trace_link.py \
            tests/ai/test_model_usage_trace.py
          python manage.py check linktools-ai
      - name: Commit F5
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add linktools-ai/src/linktools/ai/runtime/_journal.py \
                  linktools-ai/src/linktools/ai/runtime/_compaction.py \
                  linktools-ai/src/linktools/ai/runtime/_metric_capability.py \
                  linktools-ai/src/linktools/ai/runtime/_capabilities.py \
                  tests/ai/test_compaction_harness_observability.py
          git diff --cached --check
          git commit -m 'fix(ai): isolate model request journal identities'
          git push origin HEAD:refactor/ai-harness-capabilities
