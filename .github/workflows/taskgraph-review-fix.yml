name: TaskGraph review closure

on:
  push:
    branches:
      - feat/ai-taskgraph-reliable-mixed-nodes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Apply review fixes
        run: |
          python .github/taskgraph_review_fix.py
          python - <<'PY'
          from pathlib import Path

          handler = Path("linktools-ai/src/linktools/ai/task/_handler.py")
          text = handler.read_text()
          old = "@dataclass(frozen=True, slots=True)\nclass TaskFunction(Generic[AppT]):\n"
          new = "@dataclass(frozen=True)\nclass TaskFunction(Generic[AppT]):\n"
          if text.count(old) != 1:
              raise RuntimeError("TaskFunction slots rollback anchor mismatch")
          handler.write_text(text.replace(old, new, 1))

          tests = Path("tests/ai/test_task_review_closure.py")
          text = tests.read_text()
          text = text.replace("    TaskFunction,\n", "", 1)
          block = '''\ndef test_task_function_uses_slots() -> None:\n    async def run(context: TaskNodeContext[None]) -> None:\n        del context\n\n    function = TaskFunction("example.slots", 1, run)\n    assert not hasattr(function, "__dict__")\n\n\n'''
          if text.count(block) != 1:
              raise RuntimeError("TaskFunction slots test anchor mismatch")
          tests.write_text(text.replace(block, "\n", 1))
          PY
          git diff --check
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U -r requirements.txt
          python manage.py install --editable
      - name: Run focused regressions
        run: |
          python -m pytest -q \
            tests/ai/test_task_review_closure.py \
            tests/ai/test_task_reliable_review_regressions.py \
            tests/ai/test_task_sqlite_cas_convergence.py \
            tests/ai/test_task_runtime_recovery.py \
            tests/ai/test_error_cancellation_contract.py
      - name: Run final gates
        run: |
          python manage.py check linktools-ai
          python manage.py build linktools-ai
          python manage.py verify linktools-ai
      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/taskgraph_review_fix.py .github/workflows/taskgraph-review-fix.yml
          git add linktools-ai tests/ai
          git diff --cached --check
          git commit -m "fix(ai-task): close reliable taskgraph review gaps"
          git push
