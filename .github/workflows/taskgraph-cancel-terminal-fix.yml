name: TaskGraph terminal cancel closure

on:
  push:
    branches:
      - feat/ai-taskgraph-reliable-mixed-nodes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Apply closure fix
        run: |
          python .github/taskgraph_cancel_terminal_fix.py
          git diff --check
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U -r requirements.txt
          python manage.py install --editable
      - name: Run focused regressions
        run: |
          python -m pytest -q \
            tests/ai/test_task_review_closure.py \
            tests/ai/test_task_reliable_review_regressions.py \
            tests/ai/test_task_sqlite_cas_convergence.py \
            tests/ai/test_task_runtime_recovery.py \
            tests/ai/test_error_cancellation_contract.py \
            tests/ai/test_durable_contract_repairs.py::test_task_wait_returns_current_terminal_snapshot_without_local_wait \
            tests/ai/test_durable_contract_repairs.py::test_task_wait_prefers_terminal_truth_after_scheduler_failure
      - name: Run final gates
        run: |
          python manage.py check linktools-ai
          python manage.py build linktools-ai
          python manage.py verify linktools-ai
      - name: Commit verified closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/taskgraph_cancel_terminal_fix.py .github/workflows/taskgraph-cancel-terminal-fix.yml
          git add linktools-ai tests/ai
          git diff --cached --check
          git commit -m "fix(ai-task): preserve explicit cancel after failure"
          git push
