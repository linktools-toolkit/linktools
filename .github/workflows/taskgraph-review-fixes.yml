name: TaskGraph review fixes

on:
  push:
    branches:
      - feat/ai-taskgraph-reliable-mixed-nodes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-taskgraph-reliable-mixed-nodes
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Apply reviewed fixes
        run: |
          git show 47126d179d5cece7508a51c0fd9ae693f9b82d1d:.github/workflows/taskgraph-review-fixes.yml \
            | sed -n "/          python - <<'PY'/,/^          PY$/p" \
            | sed '1d;$d;s/^          //' > /tmp/taskgraph_review_patch.py
          test -s /tmp/taskgraph_review_patch.py
          python /tmp/taskgraph_review_patch.py
          rm -f .github/workflows/taskgraph-final-validation.yml
          python -m compileall -q linktools-ai/src/linktools/ai
          git diff --check
      - name: Commit fixes and remove patch workflow
        run: |
          rm .github/workflows/taskgraph-review-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add linktools-ai/src/linktools/ai .github/workflows tests/ai
          git commit -m 'fix(ai-task): align mixed graph architecture contracts'
          git push origin HEAD:feat/ai-taskgraph-reliable-mixed-nodes
