name: TaskGraph cancellation contract alignment

on:
  push:
    branches:
      - feat/ai-taskgraph-reliable-mixed-nodes

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Align cancellation contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          local = Path("linktools-ai/src/linktools/ai/task/_local.py")
          replace_once(
              local,
              '''        async with self._lease_state.lock:\n            await self._repository.bind_execution(\n                self._lease_state.lease,\n                tenant_id=self._tenant_id,\n                execution_id=execution_id,\n            )\n        await self._on_activity()\n''',
              '''        async with self._lease_state.lock:\n            await self._repository.bind_execution(\n                self._lease_state.lease,\n                tenant_id=self._tenant_id,\n                execution_id=execution_id,\n            )\n            lease = self._lease_state.lease\n        _logger.info(\n            "task execution bound: graph=%s node=%s execution=%s fence=%s",\n            lease.graph_id,\n            lease.node_id,\n            execution_id,\n            lease.fence,\n        )\n        await self._on_activity()\n''',
          )

          tests = Path("tests/ai/test_error_cancellation_contract.py")
          text = tests.read_text(encoding="utf-8")
          text = text.replace(
              "from linktools.ai.runtime._planner import RuntimeTaskNodeRunner\n",
              "from linktools.ai.runtime._planner import _AgentTaskNodeHandler\n",
          )

          def replace_test(name: str, next_name: str, body: str) -> None:
              nonlocal_text = None

          start = text.index("@pytest.mark.asyncio\nasync def test_task_runner_preserves_cancellation_when_child_cleanup_fails")
          end = text.index("@pytest.mark.asyncio\nasync def test_task_runner_cancels_execution_that_finishes_launch_after_caller_cancel", start)
          first = '''@pytest.mark.asyncio\nasync def test_task_runner_cancellation_does_not_business_cancel_running_execution() -> None:\n    class Execution:\n        def __init__(self) -> None:\n            self.wait_started = asyncio.Event()\n            self.wait_cancelled = asyncio.Event()\n            self.cancel_called = asyncio.Event()\n\n        async def run(self, *args, **kwargs):\n            del args, kwargs\n            return SimpleNamespace(execution_id="execution")\n\n        async def wait(self, *args, **kwargs):\n            del args, kwargs\n            self.wait_started.set()\n            try:\n                await asyncio.Event().wait()\n            except asyncio.CancelledError:\n                self.wait_cancelled.set()\n                raise\n\n        async def cancel(self, *args, **kwargs):\n            del args, kwargs\n            self.cancel_called.set()\n            return SimpleNamespace(cancelled=True)\n\n    class Control:\n        def __init__(self) -> None:\n            self.bound: list[str] = []\n\n        async def bind_execution(self, execution_id: str) -> None:\n            self.bound.append(execution_id)\n\n    execution = Execution()\n    handler = _AgentTaskNodeHandler(execution, object(), object())\n    handler._prepare_request = lambda *args, **kwargs: ("binding", object())\n    control = Control()\n    task = asyncio.create_task(\n        handler.run_node(\n            SimpleNamespace(node_id="node"),\n            graph_id="graph",\n            principal=trusted_workspace_principal("tenant"),\n            dependencies={},\n            control=control,\n        )\n    )\n    await execution.wait_started.wait()\n    assert control.bound == ["execution"]\n    task.cancel()\n\n    with pytest.raises(asyncio.CancelledError):\n        await task\n\n    await asyncio.wait_for(execution.wait_cancelled.wait(), 1)\n    await asyncio.sleep(0)\n    assert not execution.cancel_called.is_set()\n    assert handler.background_failure is None\n\n\n'''
          text = text[:start] + first + text[end:]

          start = text.index("@pytest.mark.asyncio\nasync def test_task_runner_cancels_execution_that_finishes_launch_after_caller_cancel")
          end = text.index("@pytest.mark.asyncio\nasync def test_task_runner_start_unknown_after_caller_cancel_blocks_shutdown", start)
          second = '''@pytest.mark.asyncio\nasync def test_task_runner_binds_execution_that_finishes_launch_after_caller_cancel() -> None:\n    class Execution:\n        def __init__(self) -> None:\n            self.launch_started = asyncio.Event()\n            self.release_launch = asyncio.Event()\n            self.cancel_called = asyncio.Event()\n\n        async def run(self, *args, **kwargs):\n            del args, kwargs\n            self.launch_started.set()\n            await self.release_launch.wait()\n            return SimpleNamespace(execution_id="execution")\n\n        async def wait(self, *args, **kwargs):\n            del args, kwargs\n            raise AssertionError("wait must not start after caller cancellation")\n\n        async def cancel(self, *args, **kwargs):\n            del args, kwargs\n            self.cancel_called.set()\n            return SimpleNamespace(cancelled=True)\n\n    class Control:\n        def __init__(self) -> None:\n            self.bound = asyncio.Event()\n            self.execution_id: str | None = None\n\n        async def bind_execution(self, execution_id: str) -> None:\n            self.execution_id = execution_id\n            self.bound.set()\n\n    execution = Execution()\n    handler = _AgentTaskNodeHandler(execution, object(), object())\n    handler._prepare_request = lambda *args, **kwargs: ("binding", object())\n    control = Control()\n    task = asyncio.create_task(\n        handler.run_node(\n            SimpleNamespace(node_id="node"),\n            graph_id="graph",\n            principal=trusted_workspace_principal("tenant"),\n            dependencies={},\n            control=control,\n        )\n    )\n    await execution.launch_started.wait()\n    task.cancel()\n\n    with pytest.raises(asyncio.CancelledError):\n        await task\n\n    assert handler.pending_background_tasks\n    execution.release_launch.set()\n    await asyncio.wait_for(control.bound.wait(), 1)\n    pending = handler.pending_background_tasks\n    if pending:\n        await asyncio.gather(*pending, return_exceptions=True)\n    await asyncio.sleep(0)\n    assert control.execution_id == "execution"\n    assert not execution.cancel_called.is_set()\n    assert handler.pending_background_tasks == ()\n    assert handler.background_failure is None\n\n\n'''
          text = text[:start] + second + text[end:]

          start = text.index("@pytest.mark.asyncio\nasync def test_task_runner_start_unknown_after_caller_cancel_blocks_shutdown")
          end = text.index("@pytest.mark.asyncio\nasync def test_task_scheduler_arm_cancellation_detaches_pending_launcher", start)
          third = '''@pytest.mark.asyncio\nasync def test_task_runner_start_unknown_after_caller_cancel_blocks_shutdown() -> None:\n    class Execution:\n        def __init__(self) -> None:\n            self.launch_started = asyncio.Event()\n            self.release_launch = asyncio.Event()\n\n        async def run(self, *args, **kwargs):\n            del args, kwargs\n            self.launch_started.set()\n            await self.release_launch.wait()\n            raise AIError(ErrorCode.EXECUTION_START_UNKNOWN)\n\n        async def wait(self, *args, **kwargs):\n            del args, kwargs\n            raise AssertionError("wait must not start after unknown launch")\n\n    class Control:\n        async def bind_execution(self, execution_id: str) -> None:\n            del execution_id\n            raise AssertionError("unknown launch must not bind execution")\n\n    execution = Execution()\n    handler = _AgentTaskNodeHandler(execution, object(), object())\n    handler._prepare_request = lambda *args, **kwargs: ("binding", object())\n    task = asyncio.create_task(\n        handler.run_node(\n            SimpleNamespace(node_id="node"),\n            graph_id="graph",\n            principal=trusted_workspace_principal("tenant"),\n            dependencies={},\n            control=Control(),\n        )\n    )\n    await execution.launch_started.wait()\n    task.cancel()\n    with pytest.raises(asyncio.CancelledError):\n        await task\n\n    execution.release_launch.set()\n    pending = handler.pending_background_tasks\n    assert pending\n    await asyncio.gather(*pending, return_exceptions=True)\n    await asyncio.sleep(0)\n    assert handler.pending_background_tasks == ()\n    failure = handler.background_failure\n    assert failure is not None\n    assert failure.code is ErrorCode.STORAGE_RECOVERY_REQUIRED\n\n    launcher = object.__new__(LocalTaskGraphLauncher)\n    launcher._accepting = True\n    launcher._graphs = {}\n    launcher._lock = asyncio.Lock()\n    launcher._runner = handler\n    with pytest.raises(AIError) as shutdown_error:\n        await launcher.shutdown()\n    assert shutdown_error.value.code is ErrorCode.STORAGE_RECOVERY_REQUIRED\n\n\n'''
          text = text[:start] + third + text[end:]
          old = '    inflight = {"node": _InflightNode(task)}\n'
          if text.count(old) != 1:
              raise SystemExit("inflight fixture anchor mismatch")
          text = text.replace(
              old,
              '    inflight = {"node": _InflightNode(task, SimpleNamespace())}\n',
              1,
          )
          tests.write_text(text, encoding="utf-8")
          PY
          python -m compileall -q linktools-ai/src tests/ai
          git diff --check
      - name: Commit aligned contract
        shell: bash
        run: |
          rm .github/workflows/taskgraph-cancel-contract-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linktools-ai/src/linktools/ai/task/_local.py \
                  tests/ai/test_error_cancellation_contract.py \
                  .github/workflows/taskgraph-cancel-contract-fix.yml
          git diff --cached --check
          git commit -m "fix(ai-task): align cancellation ownership contract"
          git push origin HEAD:${{ github.ref_name }}
