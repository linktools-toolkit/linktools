name: merge-master-into-ai-composition

on:
  push:
    branches:
      - automation/merge-master-into-ai-composition
  pull_request:
    branches:
      - refactor/ai-agent-runtime-asset-composition-impl

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: refactor/ai-agent-runtime-asset-composition-impl
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./linktools -e ./linktools-ai pytest pytest-asyncio 'sqlalchemy[asyncio]==2.0.51' aiosqlite==0.22.1 ruff

      - name: Merge master
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master automation/merge-master-into-ai-composition
          if git merge-base --is-ancestor origin/master HEAD; then
            echo "already_merged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          git merge --no-ff --no-commit origin/master
          merge_rc=$?
          set -e

          if [ "$merge_rc" -eq 0 ]; then
            git commit -m "Merge master into refactor/ai-agent-runtime-asset-composition-impl"
            git push origin HEAD:refactor/ai-agent-runtime-asset-composition-impl
            echo "merged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p /tmp/merge-conflicts
          git diff --name-only --diff-filter=U > /tmp/merge-conflicts/conflicts.txt

          resolution_parts="$(
            git ls-tree -r --name-only origin/automation/merge-master-into-ai-composition \
              | grep '^\.merge-resolutions\.b64\.part-' \
              | sort
          )"
          if [ -n "$resolution_parts" ]; then
            part_count="$(printf '%s\n' "$resolution_parts" | sed '/^$/d' | wc -l | tr -d ' ')"
            if [ "$part_count" != "7" ]; then
              echo "expected 7 resolution parts, found $part_count" >&2
              exit 2
            fi

            : > /tmp/merge-resolutions.tar.gz.b64
            while IFS= read -r part; do
              [ -n "$part" ] || continue
              git show "origin/automation/merge-master-into-ai-composition:$part" \
                >> /tmp/merge-resolutions.tar.gz.b64
            done <<< "$resolution_parts"

            echo "10325ff5ffbfcf0361174ac3280dde0e51d3b70cc1acd04df5f549ad3a100426  /tmp/merge-resolutions.tar.gz.b64" \
              | sha256sum -c -
            base64 -d /tmp/merge-resolutions.tar.gz.b64 >/tmp/merge-resolutions.tar.gz
            echo "168f299a0389212b2a44a7e71f759c3b3fdc5c705602359674009d39a4506435  /tmp/merge-resolutions.tar.gz" \
              | sha256sum -c -

            tar -xzf /tmp/merge-resolutions.tar.gz -C .
            git add -A
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "resolution bundle did not resolve every conflict" >&2
              exit 2
            fi

            python -m compileall -q linktools-ai/src/linktools/ai
            ruff check --select E4,E7,E9,F linktools-ai/src/linktools/ai tests/ai
            pytest -q \
              tests/ai/test_error_contract.py \
              tests/ai/test_error_cancellation_contract.py \
              tests/ai/test_error_contract_matrix.py \
              tests/ai/test_error_review_regressions.py \
              tests/ai/test_agent_composition.py \
              tests/ai/test_runtime_binding_contract.py \
              tests/ai/test_workspace_runtime_regressions.py \
              tests/ai/test_local_execution_recovery.py \
              tests/ai/test_runtime_persistence_error_contract.py \
              tests/ai/test_runtime_persistence_compatibility.py \
              tests/ai/test_runtime_persistence_evidence.py \
              tests/ai/test_runtime_state_identity_migration_ownership.py \
              tests/ai/test_runtime_composition_regressions.py

            git commit -m "Merge master into refactor/ai-agent-runtime-asset-composition-impl"
            git push origin HEAD:refactor/ai-agent-runtime-asset-composition-impl
            echo "merged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            mkdir -p "/tmp/merge-conflicts/$(dirname "$path")"
            git show ":1:$path" > "/tmp/merge-conflicts/$path.base" 2>/dev/null || true
            git show ":2:$path" > "/tmp/merge-conflicts/$path.ours" 2>/dev/null || true
            git show ":3:$path" > "/tmp/merge-conflicts/$path.theirs" 2>/dev/null || true
            cp "$path" "/tmp/merge-conflicts/$path.conflict" 2>/dev/null || true
          done < /tmp/merge-conflicts/conflicts.txt

          tar -czf /tmp/merge-conflicts.tar.gz -C /tmp/merge-conflicts .
          echo "conflicts=true" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Upload merge conflicts
        if: failure() && steps.merge.outputs.conflicts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: merge-conflicts
          path: /tmp/merge-conflicts.tar.gz
          if-no-files-found: error
