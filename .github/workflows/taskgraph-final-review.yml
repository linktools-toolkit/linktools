name: TaskGraph final semantic review

on:
  push:
    branches:
      - feat/ai-taskgraph-reliable-mixed-nodes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-taskgraph-reliable-mixed-nodes
          fetch-depth: 2
      - name: Apply reviewed fixes
        run: |
          python .github/taskgraph_patch.py
          python -m compileall -q linktools-ai/src
          git diff --check
      - name: Commit reviewed fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(ai-task): preserve taskgraph durable semantics"
          git push origin HEAD:feat/ai-taskgraph-reliable-mixed-nodes
