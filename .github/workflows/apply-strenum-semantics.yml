name: Apply StrEnum semantics fix

on:
  push:
    branches:
      - refactor/unified-release-gates

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-release-gates
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Apply lossless Python 3.10 enum migration
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          python - <<'PY'
          import ast
          import re
          import subprocess
          from pathlib import Path

          paths = (
              "linktools-ai/src/linktools/ai/asset/_logical.py",
              "linktools-ai/src/linktools/ai/core/_principal.py",
              "linktools-ai/src/linktools/ai/core/_redaction.py",
              "linktools-ai/src/linktools/ai/core/_value.py",
              "linktools-ai/src/linktools/ai/errors.py",
              "linktools-ai/src/linktools/ai/runtime/_execution.py",
              "linktools-ai/src/linktools/ai/runtime/_tool.py",
              "linktools-ai/src/linktools/ai/runtime/state/_contracts.py",
              "linktools-ai/src/linktools/ai/runtime/state/_durability.py",
              "linktools-ai/src/linktools/ai/runtime/state/_plan.py",
              "linktools-ai/src/linktools/ai/runtime/state/_readmodel.py",
              "linktools-ai/src/linktools/ai/runtime/state/_root.py",
              "linktools-ai/src/linktools/ai/runtime/state/_steps.py",
              "linktools-ai/src/linktools/ai/storage/_contracts.py",
              "linktools-ai/src/linktools/ai/storage/_dialects.py",
              "linktools-ai/src/linktools/ai/storage/_layer.py",
              "linktools-ai/src/linktools/ai/temporal/workflow/_execution.py",
          )

          total = 0
          for raw_path in paths:
              path = Path(raw_path)
              current = path.read_text(encoding="utf-8")
              master = subprocess.check_output(
                  ["git", "show", f"origin/master:{raw_path}"], text=True
              )
              expected = set(re.findall(r"^class (\w+)\(StrEnum\):", master, re.MULTILINE))
              actual = set(re.findall(r"^class (\w+)\(str, Enum\):", current, re.MULTILINE))
              if not expected or actual != expected:
                  raise SystemExit(
                      f"unexpected StrEnum migration in {raw_path}: expected={sorted(expected)}, actual={sorted(actual)}"
                  )

              tree = ast.parse(current, filename=raw_path)
              nodes = {
                  node.name: node
                  for node in ast.walk(tree)
                  if isinstance(node, ast.ClassDef) and node.name in expected
              }
              if set(nodes) != expected:
                  raise SystemExit(f"could not locate all migrated enums in {raw_path}")

              lines = current.splitlines(keepends=True)
              inserts = []
              for name, node in nodes.items():
                  class_source = "".join(lines[node.lineno - 1 : node.end_lineno])
                  if "__str__ = str.__str__" in class_source or "__format__ = str.__format__" in class_source:
                      raise SystemExit(f"enum semantics already partially patched: {raw_path}:{name}")
                  insert_after = node.lineno
                  if node.body:
                      first = node.body[0]
                      if (
                          isinstance(first, ast.Expr)
                          and isinstance(first.value, ast.Constant)
                          and isinstance(first.value.value, str)
                      ):
                          insert_after = first.end_lineno
                  inserts.append(insert_after)

              for insert_after in sorted(inserts, reverse=True):
                  lines[insert_after:insert_after] = [
                      "    __str__ = str.__str__\n",
                      "    __format__ = str.__format__\n",
                  ]
              path.write_text("".join(lines), encoding="utf-8")
              total += len(expected)

          if total < 10:
              raise SystemExit(f"unexpected migrated enum count: {total}")

          Path(".github/workflows/apply-strenum-semantics.yml").unlink()
          trigger = Path(".github/.strenum-semantics-trigger")
          if trigger.exists():
              trigger.unlink()
          PY

          python -m py_compile \
            linktools-ai/src/linktools/ai/asset/_logical.py \
            linktools-ai/src/linktools/ai/core/_principal.py \
            linktools-ai/src/linktools/ai/core/_redaction.py \
            linktools-ai/src/linktools/ai/core/_value.py \
            linktools-ai/src/linktools/ai/errors.py \
            linktools-ai/src/linktools/ai/runtime/_execution.py \
            linktools-ai/src/linktools/ai/runtime/_tool.py \
            linktools-ai/src/linktools/ai/runtime/state/_contracts.py \
            linktools-ai/src/linktools/ai/runtime/state/_durability.py \
            linktools-ai/src/linktools/ai/runtime/state/_plan.py \
            linktools-ai/src/linktools/ai/runtime/state/_readmodel.py \
            linktools-ai/src/linktools/ai/runtime/state/_root.py \
            linktools-ai/src/linktools/ai/runtime/state/_steps.py \
            linktools-ai/src/linktools/ai/storage/_contracts.py \
            linktools-ai/src/linktools/ai/storage/_dialects.py \
            linktools-ai/src/linktools/ai/storage/_layer.py \
            linktools-ai/src/linktools/ai/temporal/workflow/_execution.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(ai): preserve string enum semantics on Python 3.10"
          git push origin HEAD:refactor/unified-release-gates
