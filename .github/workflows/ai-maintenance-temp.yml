name: AI maintenance temp

on:
  push:
    branches:
      - refactor/ai-harness-capabilities
    paths:
      - .github/workflows/ai-maintenance-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/ai-harness-capabilities
      - name: Apply reviewed source cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"expected one match in {path}, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          repositories = "linktools-ai/src/linktools/ai/runtime/state/_repositories.py"
          replace_once(
              repositories,
              '''_ACTIVE_RECORD_UNSET = object()\n_MAX_RECORD_SORT_KEY_CHARS = 128\n\n\ndef _record_sort_key(identity: object, value: object) -> str:\n    if not isinstance(value, MemoryRecord):\n        return sortable_identity(identity)\n    path = value.metadata.get("path")\n    if (\n        not isinstance(path, str)\n        or not path\n        or not path.isascii()\n        or len(path) > _MAX_RECORD_SORT_KEY_CHARS\n    ):\n        raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n    return path\n\n\nclass _RepositoryBase:\n''',
              '''_ACTIVE_RECORD_UNSET = object()\n\n\nclass _RepositoryBase:\n''',
          )
          replace_once(
              repositories,
              '''            kind,\n            _record_sort_key(identity, value),\n            state,\n''',
              '''            kind,\n            sortable_identity(identity),\n            state,\n''',
          )
          replace_once(
              repositories,
              '''class MemoryRepositoryImpl(_ResourceRepository[MemoryRecord]):\n    def __init__(self, store: StateStore, *, namespace: str, tenant_id: str) -> None:\n        super().__init__(\n            store,\n            namespace=namespace,\n            tenant_id=tenant_id,\n            domain=RuntimeDomain.MEMORY,\n            kind="memory",\n            resource_kind=ResourceKind.MEMORY,\n            value_type=MemoryRecord,\n            identity_field="memory_id",\n        )\n\n    async def apply_write(\n''',
              '''class MemoryRepositoryImpl(_ResourceRepository[MemoryRecord]):\n    def __init__(self, store: StateStore, *, namespace: str, tenant_id: str) -> None:\n        super().__init__(\n            store,\n            namespace=namespace,\n            tenant_id=tenant_id,\n            domain=RuntimeDomain.MEMORY,\n            kind="memory",\n            resource_kind=ResourceKind.MEMORY,\n            value_type=MemoryRecord,\n            identity_field="memory_id",\n        )\n\n    def _stored(\n        self,\n        kind: str,\n        identity: object,\n        value: object,\n        *,\n        scope: bytes | None = None,\n        parent: bytes | None = None,\n        state: str | None = None,\n    ) -> StoredRecord:\n        if kind != "memory" or not isinstance(value, MemoryRecord):\n            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n        path = value.metadata.get("path")\n        if (\n            not isinstance(path, str)\n            or not path\n            or not path.isascii()\n            or len(path) > 128\n        ):\n            raise AIError(ErrorCode.STORAGE_INTEGRITY_ERROR)\n        return replace(\n            super()._stored(\n                kind,\n                identity,\n                value,\n                scope=scope,\n                parent=parent,\n                state=state,\n            ),\n            sort_key=path,\n        )\n\n    async def apply_write(\n''',
          )

          sandbox = "linktools-ai/src/linktools/ai/workspace/_local_sandbox.py"
          text = Path(sandbox).read_text(encoding="utf-8")
          start = text.index("def _command_result(state: _ProcessState, *, status: str | None = None) -> str:\n")
          end = text.index("\n\n__all__ = [\"LocalSandbox\"]", start)
          replacement = '''def _command_result(state: _ProcessState, *, status: str | None = None) -> str:\n    actual_status = status or (\n        state.final_status\n        or ("running" if not state.wait_task.done() else "exited")\n    )\n    code = state.process.returncode\n    header = (\n        f"command_id: {state.command_id}\\n"\n        f"status: {actual_status}\\n"\n        f"exit_code: {'' if code is None else code}"\n    )\n    return _render_command_output(\n        header,\n        "".join(state.stdout),\n        "".join(state.stderr),\n        incomplete=state.output_incomplete,\n    )\n\n\ndef _render_command_output(\n    header: str,\n    stdout: str,\n    stderr: str,\n    *,\n    incomplete: bool,\n) -> str:\n    channels = [\n        ("[stdout]\\n", stdout),\n        ("[stderr]\\n", stderr),\n    ]\n    channels = [(label, value) for label, value in channels if value]\n    body = "\\n\\n".join(label + value for label, value in channels)\n    full = header if not body else f"{header}\\n{body}"\n    truncated = incomplete or len(full) > _MAX_RENDERED_CHARS\n    if not truncated:\n        return full\n\n    suffix = "\\n[output incomplete]"\n    if not channels:\n        return header + suffix\n    fixed = (\n        len(header)\n        + 1\n        + sum(len(label) for label, _value in channels)\n        + 2 * (len(channels) - 1)\n        + len(suffix)\n    )\n    available = max(0, _MAX_RENDERED_CHARS - fixed)\n    if len(channels) == 1:\n        budgets = [min(len(channels[0][1]), available)]\n    else:\n        first = min(len(channels[0][1]), available // 2)\n        second = min(len(channels[1][1]), available - first)\n        remaining = available - first - second\n        if remaining and first < len(channels[0][1]):\n            extra = min(remaining, len(channels[0][1]) - first)\n            first += extra\n            remaining -= extra\n        if remaining and second < len(channels[1][1]):\n            second += min(remaining, len(channels[1][1]) - second)\n        budgets = [first, second]\n    rendered = []\n    for (label, value), budget in zip(channels, budgets, strict=True):\n        visible = value if len(value) <= budget else value[-budget:] if budget else ""\n        rendered.append(label + visible)\n    return header + "\\n" + "\\n\\n".join(rendered) + suffix\n'''
          Path(sandbox).write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          anchor = '''async def test_local_sandbox_preserves_stdout_and_stderr(tmp_path: Path) -> None:\n    session = await LocalSandbox().open(root=tmp_path)\n    command = _python_command(\n        "import sys;print('stdout-value');print('stderr-value',file=sys.stderr)"\n    )\n    try:\n        result = await session.run_command(command, timeout_seconds=5)\n    finally:\n        await session.close()\n\n    assert "[stdout]\\nstdout-value" in result\n    assert "[stderr]\\nstderr-value" in result\n\n\n'''
          addition = anchor + '''async def test_local_sandbox_truncation_preserves_stderr_and_status(\n    tmp_path: Path,\n) -> None:\n    session = await LocalSandbox().open(root=tmp_path)\n    command = _python_command(\n        "import sys;sys.stdout.write('x' * 60000);sys.stderr.write('stderr-tail')"\n    )\n    try:\n        result = await session.run_command(command, timeout_seconds=5)\n    finally:\n        await session.close()\n\n    assert len(result) <= 50_000\n    assert "command_id:" in result\n    assert "status: exited" in result\n    assert "exit_code: 0" in result\n    assert "[stdout]" in result\n    assert "[stderr]\\nstderr-tail" in result\n    assert result.endswith("[output incomplete]")\n\n\n'''
          replace_once("tests/ai/test_local_sandbox.py", anchor, addition)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(ai): tighten memory and shell semantics"
          git push origin HEAD:refactor/ai-harness-capabilities
