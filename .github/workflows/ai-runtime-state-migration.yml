name: AI Runtime Final Validation

on:
  push:
    branches:
      - refactor/ai-agent-runtime-asset-composition-impl

permissions:
  contents: write

concurrency:
  group: ai-runtime-final-validation
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/ai-agent-runtime-asset-composition-impl
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply and validate
        shell: bash
        run: |
          set -uo pipefail
          [[ -f .bootstrap/ready ]] || exit 0
          RESULT=/tmp/ai-runtime-final-validation.txt
          : > "$RESULT"
          status=0
          export PYTHONPATH="linktools-ai:linktools-ai/src:linktools/src"
          run_check() {
            echo "===== $* =====" | tee -a "$RESULT"
            "$@" >>"$RESULT" 2>&1 || status=1
            return 0
          }
          run_check python -m pip install -q --upgrade pip
          if [[ $status -eq 0 ]]; then
            run_check python -m pip install -q -e ./linktools -e './linktools-ai[sqlite,evaluation,temporal]' pytest pytest-asyncio ruff
          fi
          for script in .bootstrap/patch*.py; do
            [[ -f "$script" ]] || continue
            if [[ $status -eq 0 ]]; then run_check python "$script"; fi
            rm -f "$script"
          done
          if [[ $status -eq 0 ]]; then run_check python -m compileall -q linktools-ai/src/linktools/ai; fi
          if [[ $status -eq 0 ]]; then run_check ruff check --select E4,E7,E9,F linktools-ai/src/linktools/ai tests/ai; fi
          if [[ $status -eq 0 ]]; then run_check ruff format --check linktools-ai/src/linktools/ai tests/ai; fi
          if [[ $status -eq 0 ]]; then run_check python .bootstrap/audit.py; fi
          if [[ $status -eq 0 ]]; then run_check python -m scripts.build.architecture; fi
          if [[ $status -eq 0 ]]; then run_check pytest -q tests/ai; fi
          mkdir -p .bootstrap
          rm -f .bootstrap/ready
          cp "$RESULT" .bootstrap/result.txt
          tail -n 400 "$RESULT" > .bootstrap/tail.txt
          printf '%s\n' "$status" > .bootstrap/status
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            if [[ $status -eq 0 ]]; then
              git commit -m 'fix(ai): close runtime identity migration and composition'
            else
              git commit -m 'ci: record final AI runtime validation'
            fi
            git push origin HEAD:refactor/ai-agent-runtime-asset-composition-impl
          fi
          exit 0
