name: Retry AI review contraction

on:
  push:
    branches:
      - refactor/ai-harness-capabilities

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/ai-harness-capabilities
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Apply review contraction
        shell: bash
        run: |
          python - <<'RUNNER'
          from __future__ import annotations

          import subprocess
          import textwrap
          from pathlib import Path

          workflow = Path('.github/workflows/ai-review-contraction.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          repair = Path('/tmp/ai-review-contraction.py')
          repair.write_text(textwrap.dedent(workflow[start:end]), encoding='utf-8')
          subprocess.run(['python', str(repair)], check=True)
          RUNNER
      - name: Install project
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -U -r requirements.txt
          python manage.py install --editable --quiet
      - name: Format changed Python
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACM -- '*.py')
          if ((${#files[@]})); then
            python -m ruff format "${files[@]}"
          fi
      - name: Run focused regressions
        shell: bash
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/ai/test_memory_bounded_listing.py \
            tests/ai/test_state_range_index.py \
            tests/ai/test_compaction_harness_observability.py \
            tests/ai/test_spec_capability_refactor.py \
            tests/ai/test_deferred_frontier_contract.py \
            tests/ai/test_deferred_native_conformance.py \
            tests/ai/test_tool_effect_semantics.py \
            tests/ai/test_review_contract_cleanup.py
      - name: Run package gate
        shell: bash
        run: |
          python manage.py check linktools-ai
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ai-review-contraction.yml .github/workflows/ai-review-contraction-retry.yml
          git add -A
          git commit -m 'fix(ai): tighten review contracts'
          git push origin HEAD:refactor/ai-harness-capabilities
