name: Temporary prompt README sync v2

on:
  push:
    branches:
      - feat/ai-system-prompt-refresh

permissions:
  contents: write

jobs:
  sync:
    if: contains(github.event.head_commit.message, '[sync-prompt-readme-v2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ai-system-prompt-refresh
      - name: Update README
        run: python scripts/tmp_sync_prompt_readme.py
      - name: Commit README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add linktools-ai/README.md
          git commit -m 'docs(ai): describe prompt instruction partitions'
          git push origin HEAD:feat/ai-system-prompt-refresh
