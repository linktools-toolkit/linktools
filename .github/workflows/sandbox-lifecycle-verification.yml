name: Verify sandbox lifecycle candidate
on:
  push:
    branches: [fix/ai-stability-hardening]
    paths:
      - .github/sandbox-lifecycle.patch.gz
      - .github/workflows/sandbox-lifecycle-verification.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.x']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply fixed candidate
        run: |
          gzip -dc .github/sandbox-lifecycle.patch.gz > "$RUNNER_TEMP/sandbox.patch"
          echo "ab2f6bff528600f82e04d18ce8baa088239ccd9939e853404dc222c15f859e71  $RUNNER_TEMP/sandbox.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/sandbox.patch"
          git apply "$RUNNER_TEMP/sandbox.patch"
          rm .github/sandbox-lifecycle.patch.gz .github/workflows/sandbox-lifecycle-verification.yml
          git diff --check
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install project
        run: |
          python -m pip install --quiet -U -r requirements.txt pytest-xdist
          python manage.py install --editable --quiet
      - name: Verify all AI contracts with parallel scheduling
        env:
          PYTEST_ADDOPTS: -n 4 --dist=loadfile --capture=fd
        run: python manage.py check linktools-ai --skip-compatibility
  prepare-commit:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply verified candidate
        run: |
          gzip -dc .github/sandbox-lifecycle.patch.gz > "$RUNNER_TEMP/sandbox.patch"
          echo "ab2f6bff528600f82e04d18ce8baa088239ccd9939e853404dc222c15f859e71  $RUNNER_TEMP/sandbox.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/sandbox.patch"
          git apply "$RUNNER_TEMP/sandbox.patch"
          rm .github/sandbox-lifecycle.patch.gz .github/workflows/sandbox-lifecycle-verification.yml
          git diff --check
      - name: Create verified Git objects without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args])
          entries = []
          for raw in git('diff', '--name-only', '-z', 'HEAD').split(b'\0'):
              if not raw:
                  continue
              path = os.fsdecode(raw)
              mode = git('ls-files', '-s', '--', path).decode().split()[0]
              item = {'path': path, 'mode': mode, 'type': 'blob'}
              target = pathlib.Path(path)
              if target.exists():
                  item['content'] = target.read_text(encoding='utf-8')
              else:
                  item['sha'] = None
              entries.append(item)
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          (temp / 'tree-request.json').write_text(json.dumps({'base_tree': git('rev-parse', 'HEAD^{tree}').decode().strip(), 'tree': entries}))
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input "$RUNNER_TEMP/tree-request.json" > "$RUNNER_TEMP/tree.json"
          python - <<'PY'
          import json, os, pathlib
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          tree = json.loads((temp / 'tree.json').read_text())['sha']
          (temp / 'commit-request.json').write_text(json.dumps({'message': 'fix(ai): retain sandbox process ownership after shell exit', 'tree': tree, 'parents': [os.environ['GITHUB_SHA']]}))
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input "$RUNNER_TEMP/commit-request.json" > "$RUNNER_TEMP/commit.json"
          python - <<'PY'
          import json, os, pathlib
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          commit = json.loads((temp / 'commit.json').read_text())
          result = {'base': os.environ['GITHUB_SHA'], 'commit': commit['sha'], 'tree': commit['tree']['sha'], 'patch_sha256': 'ab2f6bff528600f82e04d18ce8baa088239ccd9939e853404dc222c15f859e71', 'branch_updated': False}
          (temp / 'candidate.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-sandbox-lifecycle-commit
          path: ${{ runner.temp }}/candidate.json
          retention-days: 1
